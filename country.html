<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="description" id="meta-description" content="景色と地図から、次の旅先に出会う。JOURNEY ATLASの国ページ。">
  <title>JOURNEY ATLAS — Country</title>
  <link rel="canonical" id="canonical-link" href="https://yagenji.github.io/Journey-Atlas/country.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JOURNEY ATLAS">
  <meta property="og:title" id="og-title" content="JOURNEY ATLAS — Country">
  <meta property="og:description" id="og-description" content="景色と地図から、次の旅先に出会う。JOURNEY ATLASの国ページ。">
  <meta property="og:url" id="og-url" content="https://yagenji.github.io/Journey-Atlas/country.html">
  <meta property="og:image" id="og-image" content="https://yagenji.github.io/Journey-Atlas/assets/icons/favicon.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:wght@400;500;600&family=Shippori+Mincho:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/country.css?v=20260903-transport-flex-v6">
</head>
<body>
  <main id="app" aria-live="polite">
    <div class="loading">旅のページをひらいています…</div>
  </main>

  <template id="country-template">
    <header class="site-header page-shell">
      <a class="brand country-brand" href="./" aria-label="JOURNEY ATLAS ホーム">
        <span class="country-brand__wordmark">JOURNEY ATLAS</span>
        <small>行きたい場所と出会う、旅の図鑑。</small>
      </a>
      <nav class="utility-nav" aria-label="サイトメニュー">
        <a href="./">トップ</a>
        <a href="https://journey.yagenji.com/" target="_blank" rel="noopener noreferrer">JOURNEY LENS</a>
      </nav>
    </header>

    <article class="country-page">
      <section class="hero">
        <div class="hero-art media-slot" data-image-field="hero.image" role="img" aria-label="国の風景"></div>
        <p class="hero-location"><strong data-field="hero.location"></strong></p>
        <div class="hero-copy page-shell">
          <p class="region" data-field="region"></p>
          <h1 data-field="nameEn"></h1>
          <p class="country-ja" data-field="nameJa"></p>
          <p class="hero-lead" data-field="hero.lead"></p>
          <div class="country-theme-context" id="country-theme-context" hidden>
            <span class="country-theme-context__label">TRAVEL THEMES</span>
            <div class="country-theme-context__list" id="country-theme-list"></div>
          </div>
        </div>
      </section>

      <div class="atlas-body page-shell">
        <section class="country-facts-strip" aria-labelledby="country-facts-title">
          <div class="country-facts-strip__head">
            <span class="section-kicker-en">COUNTRY PROFILE</span>
            <h2 id="country-facts-title">基本情報</h2>
          </div>
          <dl class="fact-list" id="facts"></dl>
        </section>

        <section class="signature-facts" id="signature-facts-section" aria-labelledby="signature-facts-title" hidden>
          <div class="signature-facts__head">
            <span class="section-kicker-en">SIGNATURE FACTS</span>
            <h2 id="signature-facts-title">この国を知る数字</h2>
          </div>
          <div class="signature-facts__grid" id="signature-facts"></div>
        </section>

        <section class="atlas-panel" aria-labelledby="atlas-title">
          <div class="map-column">
            <div class="panel-title-wrap">
              <div class="panel-title-copy">
                <span class="section-kicker-en">TRAVEL MAP</span>
                <h2 class="panel-title" id="atlas-title">旅の地図</h2>
              </div>
            </div>
            <div class="map-frame">
              <div class="map-art" id="country-map-art" role="group" aria-label="旅の地図">
                <div class="map-grid" aria-hidden="true"></div>
                <div class="map-placeholder" aria-hidden="true"></div>
                <div class="map-markers" id="map-markers"></div>
              </div>
            </div>
            <div class="map-legend map-legend--below" aria-label="地図記号の説明">
              <span><i class="map-legend__scene" aria-hidden="true">1</i>景色の番号</span>
              <span><i class="map-legend__hero" aria-hidden="true"></i>上部の代表画像（Hero）の場所</span>
            </div>
            <div class="encounter-strip">
              <span class="section-kicker-en">ENCOUNTERS</span>
              <h3><span data-field="nameJa"></span>で出会えるもの</h3>
              <div class="encounter-list" id="encounters"></div>
            </div>
          </div>

          <div class="scenes-column">
            <div class="scenes-heading">
              <div class="scenes-title-wrap">
                <span class="section-kicker-en">SCENERY</span>
                <h2>この国で見たい景色 <b data-field="sceneCount"></b>選</h2>
              </div>
              <p class="scenes-intro">その国らしさが見えてくる、8つの景色。</p>
            </div>
            <div class="scene-grid" id="scene-cards"></div>
          </div>
        </section>

        <section class="atlas-extras" id="atlas-extras-section" aria-labelledby="atlas-extras-title" hidden>
          <div class="atlas-extras__head">
            <div>
              <p class="atlas-extras__kicker">BEYOND THE SCENERY</p>
              <h2 id="atlas-extras-title">景色の向こうへ</h2>
            </div>
            <p class="atlas-extras__intro">景色だけでは見えない、この国の暮らしや文化、歴史の輪郭をたどる。</p>
          </div>
          <div class="atlas-extras__grid" id="atlas-extras-grid"></div>
        </section>

        <section class="taste-section" id="taste-section" aria-labelledby="taste-title" hidden>
          <div class="taste-section__head">
            <div>
              <span class="section-kicker-en" id="taste-kicker">TASTE</span>
              <h2 id="taste-title"></h2>
            </div>
            <p class="taste-section__intro" id="taste-intro"></p>
          </div>
          <div class="taste-grid" id="taste-grid"></div>
        </section>

        <section class="travel-trivia" id="travel-trivia-section" aria-labelledby="travel-trivia-title" hidden>
          <div class="travel-trivia__head">
            <div>
              <span class="travel-trivia__kicker">TRAVEL TRIVIA</span>
              <h2 id="travel-trivia-title">知っていると旅が少し楽しくなること</h2>
            </div>
            <p class="travel-trivia__intro">現地で見つけたり、試したり、人に話したくなる小さな知識を集めた。</p>
          </div>
          <div class="travel-trivia__grid" id="travel-trivia-grid"></div>
        </section>

        <section class="travel-planning" aria-labelledby="travel-planning-title">
          <div class="travel-planning__head">
            <span class="section-kicker-en">WHEN TO GO</span>
            <h2 id="travel-planning-title">旅するなら</h2>
          </div>
          <div class="travel-planning__content">
            <section class="travel-scale travel-planning__block travel-planning__block--days" id="travel-scale-section" aria-labelledby="travel-scale-title" hidden>
              <div class="travel-scale__head">
                <span class="travel-planning__label" id="travel-scale-kicker">TRAVEL SCALE</span>
                <h3 id="travel-scale-title"></h3>
                <p id="travel-scale-intro"></p>
              </div>
              <div class="travel-scale__grid" id="travel-scale-grid"></div>
            </section>
            <section class="travel-planning__block travel-planning__block--season" aria-labelledby="travel-season-title">
              <span class="travel-planning__label">SEASON</span>
              <h3 id="travel-season-title">季節</h3>
              <div class="season-list" id="seasons"></div>
            </section>
            <section class="travel-planning__block travel-planning__block--transport" aria-labelledby="travel-transport-title">
              <span class="travel-planning__label">TRANSPORT</span>
              <h3 id="travel-transport-title">移動</h3>
              <div class="transport" id="transport"></div>
            </section>
          </div>
        </section>

        <section class="travel-guidance" aria-label="旅のヒント">
          <section class="travel-guidance__block" aria-labelledby="for-whom-title">
            <span class="section-kicker-en">FOR WHOM</span>
            <h2 id="for-whom-title">こんな人に</h2>
            <div class="persona-list" id="personas"></div>
          </section>
          <section class="travel-guidance__block" aria-labelledby="travel-notes-title">
            <span class="section-kicker-en">TRAVEL NOTES</span>
            <h2 id="travel-notes-title">知っておきたいこと</h2>
            <div class="tip-list" id="tips"></div>
          </section>
        </section>

        <section class="journey-footer" aria-labelledby="next-title">
          <div class="related-wrap">
            <span class="section-kicker-en">NEXT DESTINATIONS</span>
            <h2 id="next-title"><span data-field="nameJa"></span>が気になったなら</h2>
            <div class="related-grid" id="related"></div>
          </div>
          <div class="wish-wrap"><button class="wish-button" id="wish-button" type="button"><span class="wish-icon" aria-hidden="true">♡</span><strong>この国に行きたい</strong><small>このブラウザに保存します</small></button><p class="wish-status" id="wish-status" role="status"></p></div>
        </section>

        <details class="photo-credits" id="photo-credits" hidden>
          <summary>PHOTO CREDITS / 写真出典</summary>
          <ul id="photo-credit-list"></ul>
        </details>
      </div>
    </article>
  </template>

  <footer class="atlas-footer" aria-label="サイトフッター">
    <div class="atlas-footer__inner">
      <nav class="atlas-footer__nav" aria-label="フッターメニュー">
        <a href="./#about">このサイトについて</a>
        <a href="faq/">よくある質問</a>
        <a href="privacy/">プライバシーポリシー</a>
        <a href="mailto:journeylensmy@gmail.com?subject=JOURNEY%20ATLAS%20%E3%81%B8%E3%81%AE%E3%81%94%E9%80%A3%E7%B5%A1">お問い合わせ</a>
      </nav>
      <small class="atlas-footer__copyright">© JOURNEY ATLAS</small>
    </div>
  </footer>

  <script src="assets/js/app.js?v=20260903-transport-icon-v5" defer></script>
  <script src="assets/js/country-themes.js?v=20260830-theme-context-v2" defer></script>
  <script src="assets/js/header-scroll.js?v=20260826-2345" defer></script>
</body>
</html>
