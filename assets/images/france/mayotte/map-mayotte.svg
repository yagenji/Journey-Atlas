<title id="mayotte-map-title">マヨットの旅の地図</title>
<desc id="mayotte-map-desc">OpenStreetMapのマヨット海岸線を実際の緯度経度から投影。グランド・テール、プティット・テールなどの島影。Sceneの地点は別の操作可能レイヤーで表示。</desc>
