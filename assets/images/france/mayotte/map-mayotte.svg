<title id="mayotte-map-title">マヨットの旅の地図</title>
<desc id="mayotte-map-desc">OpenStreetMapのマヨット海岸線を実際の緯度経度から投影。グランド・テール、プティット・テールなどの島影。Sceneの地点は別の操作可能レイヤーで表示。</desc>
<metadata>Source: OpenStreetMap contributors, https://www.openstreetmap.org/copyright (ODbL), Mayotte administrative-area coastline OSM relation 1259885, distributed as https://github.com/hyperknot/country-levels-export/blob/master/geojson/medium/iso1/YT.geojson . Local equirectangular WGS84 coordinate projection to 1200x760, extent 44.80–45.50 E; 13.04–12.61 S. All paths are source island polygons. No invented shorelines or islands. Generalized scale. Not for navigation. Verified 2026-11-10.</metadata>
