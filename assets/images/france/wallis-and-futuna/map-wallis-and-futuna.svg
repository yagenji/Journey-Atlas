<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" data-map-style="journey-atlas-map-v3-clean-background" data-map-projection="local-equirectangular-fit-v1" data-map-inset-standard="true" aria-label="ウォリス・フツナ：ウォリス島群とフツナ・アロフィ島群の実際の海岸線と景色">
<title>ウォリスとフツナ・アロフィの実際の島々</title>
<desc>ウォリスとフツナ・アロフィは別の島嶼群。中央の2つの破線枠は、それぞれ同じ海岸線を拡大した別枠表示です。島の輪郭と景色の座標は地理データに基づきます。</desc>
<metadata>Cartography: WGS84. Wallis ʻUvea and three offshore islets use actual GSHHS intermediate-resolution (GSHHG via Basemap 2.0.0, LGPL 3.0), unaltered polygon vertices; Futuna and Alofi use Natural Earth 1:10m v5.1.2 outlines (public domain) via ironlam/poligraph outremer.geojson (geometry sourced from ne_10m_admin_0_countries and ne_10m_minor_islands). True positions and island separation preserved. Two inset views enlarge the same geographic coordinates with uniform scales; small motus absent from the data are intentionally omitted rather than invented. No fictitious coral reef or lagoon outline is drawn.</metadata>
