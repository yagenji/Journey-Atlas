<title id="reunion-map-title">レユニオン島と8つの景色の位置</title>
<desc id="reunion-map-desc">フランスの海外県レユニオン島の実際の島の輪郭を描いた地図。Heroと8景の地点位置はデータの正確な座標から操作可能な地図レイヤーに表示する。</desc>
<metadata>Coastline: French IGN Admin Express COG 2018 (Etalab Licence Ouverte/Open Licence), extracted from gregoiredavid/france-geojson / regions/la-reunion/region-la-reunion.geojson (2018 IGN geometry simplified with Visvalingam 25 percent), accessed 2026-11-10, source https://github.com/gregoiredavid/france-geojson/blob/master/regions/la-reunion/region-la-reunion.geojson . Converted using local WGS84 equirectangular visual projection, simplified at 1.2 px for SVG. All 8 Scene and Hero coordinates preserve verified latitude/longitude anchors. No invented coastlines or terrain. Hero and Scene markers are rendered by the Region page from the exact JSON coordinates; the raster base contains no baked markers or leader lines.</metadata>
