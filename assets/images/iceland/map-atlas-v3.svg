<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 760" role="img" aria-label="Map of Iceland">
  <defs>
    <filter id="atlasTone" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0.82"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.97" intercept="0.018"/>
        <feFuncG type="linear" slope="0.98" intercept="0.014"/>
        <feFuncB type="linear" slope="0.99" intercept="0.010"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="warmVeil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1e4" stop-opacity="0.13"/>
      <stop offset="0.52" stop-color="#efe9dc" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#d9e3df" stop-opacity="0.09"/>
    </linearGradient>
    <radialGradient id="westWash" cx="30%" cy="32%" r="42%">
      <stop offset="0" stop-color="#efe1c5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#efe1c5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eastWash" cx="72%" cy="64%" r="44%">
      <stop offset="0" stop-color="#bfcdbf" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#bfcdbf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <image href="map-atlas-v2.svg" xlink:href="map-atlas-v2.svg" x="0" y="0" width="1200" height="760" preserveAspectRatio="xMidYMid meet" filter="url(#atlasTone)"/>
  <rect width="1200" height="760" fill="url(#warmVeil)" pointer-events="none"/>
  <rect width="1200" height="760" fill="url(#westWash)" pointer-events="none"/>
  <rect width="1200" height="760" fill="url(#eastWash)" pointer-events="none"/>
</svg>
