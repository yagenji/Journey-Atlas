<metadata>Administrative geometry: Natural Earth low-resolution fixture bundled with pyogrio/geopandas test data, WGS84. Surrounding national borders are drawn from the same Natural Earth country boundaries and masked at the Malawi boundary so the target border is not doubled. Inland-water geometry: GSHHS/GSHHG via Basemap resolution=i, WGS84. Malawi–Mozambique lake boundary follows administrative geometry. The Malawi–Tanzania lake boundary remains disputed; the dashed in-lake segment follows the Natural Earth representation only as a disputed cartographic indicator, not as a determination of sovereignty. Likoma and Chizumulu island geometry retained from the previously verified GSHHS selection. Generated 2026-10-03.</metadata>
