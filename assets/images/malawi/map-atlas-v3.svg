<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Map of Malawi" data-map-style="journey-atlas-map-v3-clean-background" data-map-projection="local-equirectangular-fit-v1">
<metadata>Administrative target and lake-boundary geometry: Natural Earth low-resolution fixture bundled with pyogrio/geopandas test data, WGS84; coastlines, surrounding land and inland-water geometry: GSHHS/GSHHG via Basemap resolution=i, WGS84. Malawi–Mozambique lake boundary follows administrative geometry. The Malawi–Tanzania lake boundary remains disputed; the dashed in-lake segment follows the Natural Earth median-line representation only as a disputed cartographic indicator, not as a determination of sovereignty. Likoma and Chizumulu island land geometry from verified GSHHS polygons. The map viewport is wholly inland, so canvas background is surrounding land; inland water is rendered only from verified lake geometry. Generated 2026-10-03.</metadata>
