<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Map of the Cook Islands with detached northern group and enlarged Rarotonga and Aitutaki detail insets" data-map-style="journey-atlas-map-v3-clean-background" data-map-projection="multi-region-local-equirectangular-fit-v1">
<metadata>Cook Islands overview coastlines rendered primarily from GSHHS/GSHHG intermediate-resolution coastline data distributed with Basemap 2.0.0, WGS84. Rarotonga and the Aitutaki main-island detail use higher-density 2021 Cook Islands island polygon geometry derived from geoBoundaries COK ADM0; detail geometry is simplified only for SVG legibility while preserving the source coastline. Akaiami and Tapuaetai retain supplementary surveyed shoreline coordinates published by the Cook Islands Turtle Project 2012–2013 (Pacific Islands Conservation Initiative / SPREP). Northern Cook Islands are shown in a detached inset because of the archipelago's geographic spread. Locator boxes and guide lines identify Rarotonga and Aitutaki source areas for the enlarged detail insets. Updated 2026-10-05.</metadata>
<defs>
<linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf2f4"/><stop offset=".55" stop-color="#dcebf0"/><stop offset="1" stop-color="#d0e3eb"/></linearGradient>
<linearGradient id="land" x1=".12" y1=".08" x2=".88" y2=".92"><stop offset="0" stop-color="#e2dbad"/><stop offset=".52" stop-color="#d4cc9b"/><stop offset="1" stop-color="#c8bf8a"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/><feOffset in="b" dy="3" result="o"/><feColorMatrix in="o" type="matrix" values="0 0 0 0 .12 0 0 0 0 .22 0 0 0 0 .28 0 0 0 .14 0"/><feBlend in="SourceGraphic" mode="normal"/></filter>
</defs>
