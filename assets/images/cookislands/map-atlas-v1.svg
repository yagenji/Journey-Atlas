<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Map of the Cook Islands" data-map-style="journey-atlas-map-v3-clean-background" data-map-projection="multi-region-local-equirectangular-fit-v1">
<metadata>Cook Islands coastlines rendered from GSHHS/GSHHG intermediate-resolution coastline data distributed with Basemap 2.0.0, WGS84. All land polygons within the verified Northern and Southern Cook Islands group bounds are rendered as Cook Islands target land. The two island groups are shown in separate map regions at different scales; geographic coordinates remain authoritative. Generated 2026-10-03. north: 7 GSHHS intermediate-resolution land polygons; south: 8 GSHHS intermediate-resolution land polygons</metadata>
