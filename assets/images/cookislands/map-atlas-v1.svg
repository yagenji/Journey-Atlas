<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Map of the Cook Islands with Rarotonga and Aitutaki locator guides to enlarged detail insets" data-map-style="journey-atlas-map-v3-clean-background" data-map-projection="multi-region-local-equirectangular-fit-v1">
<metadata>Cook Islands coastlines rendered primarily from GSHHS/GSHHG intermediate-resolution coastline data distributed with Basemap 2.0.0, WGS84. Akaiami and Tapuaetai use supplementary surveyed shoreline coordinates published by the Cook Islands Turtle Project 2012–2013 (Pacific Islands Conservation Initiative / SPREP), because those small motu are not represented sufficiently at GSHHS intermediate resolution. Northern Cook Islands are shown in a detached inset because of the archipelago's geographic spread. Rarotonga and Aitutaki are repeated as enlarged detail insets using the same reviewed source geometry so dense Scene markers remain legible without coordinate mutation. Locator boxes and guide lines identify the source area for each enlarged detail inset, following the established Qatar inset presentation. Updated 2026-10-04.</metadata>
<defs>
<linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf2f4"/><stop offset=".55" stop-color="#dcebf0"/><stop offset="1" stop-color="#d0e3eb"/></linearGradient>
<linearGradient id="land" x1=".12" y1=".08" x2=".88" y2=".92"><stop offset="0" stop-color="#e2dbad"/><stop offset=".52" stop-color="#d4cc9b"/><stop offset="1" stop-color="#c8bf8a"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/><feOffset in="b" dy="3" result="o"/><feColorMatrix in="o" type="matrix" values="0 0 0 0 .12 0 0 0 0 .22 0 0 0 0 .28 0 0 0 .14 0"/><feBlend in="SourceGraphic" mode="normal"/></filter>
</defs>
<rect width="1200" height="760" fill="url(#sea)"/>
<g data-map-inset-frame="north"><rect x="30" y="80" width="320" height="280" rx="7" fill="none" stroke="#879b9b" stroke-width="1.5" stroke-dasharray="5 5"/></g>
