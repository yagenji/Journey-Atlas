<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Map of Bahrain" data-map-style="journey-atlas-map-v1" data-map-projection="multi-region-local-equirectangular-v1">
  <metadata>Bahrain illustrated map rebuilt to the JOURNEY ATLAS Iceland/Norway benchmark. Canvas 1200x760. WGS84 Bahrain geometry remains in two non-overlapping atlas regions so marker coordinates stay authoritative: main Bahrain (N26.30 S25.78 W50.37 E50.69) and Hawar (N25.77 S25.565 W50.725 E50.83). Hawar is treated as a quiet atlas inset, not as a scale-comparison panel. Geometry source remains the dissolved Bahrain governorate WGS84 polygons already used by this Country asset; this revision changes visual language and inset treatment only, preserving coordinate alignment.</metadata>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ef"/>
      <stop offset=".55" stop-color="#e4eceb"/>
      <stop offset="1" stop-color="#dce7e7"/>
    </linearGradient>
    <linearGradient id="land" x1=".12" y1=".08" x2=".88" y2=".92">
      <stop offset="0" stop-color="#e2dbad"/>
      <stop offset=".52" stop-color="#d4cc9b"/>
      <stop offset="1" stop-color="#c8bf8a"/>
    </linearGradient>
    <filter id="land-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
      <feOffset in="b" dy="3" result="o"/>
      <feColorMatrix in="o" type="matrix" values="0 0 0 0 .12 0 0 0 0 .22 0 0 0 0 .28 0 0 0 .14 0"/>
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
    <filter id="inset-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/>
      <feOffset in="b" dy="1.5" result="o"/>
      <feColorMatrix in="o" type="matrix" values="0 0 0 0 .12 0 0 0 0 .22 0 0 0 0 .28 0 0 0 .10 0"/>
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#sea)"/>

