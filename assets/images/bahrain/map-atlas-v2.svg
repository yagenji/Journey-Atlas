<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Map of Bahrain" data-map-style="journey-atlas-map-v1" data-map-projection="local-equirectangular-fit-v1">
<metadata>Bahrain-only illustrated map. Canvas 1200x760; bounds W50.30 E50.84 S25.54 N26.33. Main-island coastline uses GSHHS/GSHHG intermediate data supplied with Basemap; Muharraq, western island and Hawar are retained from open WGS84 Bahrain island geometry. Scene markers are rendered by the shared Country template from latitude/longitude. Surrounding countries are intentionally omitted. JOURNEY ATLAS Iceland/Norway map language.</metadata>
