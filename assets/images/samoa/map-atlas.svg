<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Map of Samoa" data-map-style="journey-atlas-map-v3-clean-background" data-map-projection="local-equirectangular-fit-v1">
<metadata>Target shoreline: GSHHS intermediate-resolution polygons via Basemap 2.0.0, WGS84, including Nu'ulopa with area threshold disabled. The north Upolu shoreline at Piula is locally refined to the verified Piula Cave Pool WGS84 coordinate, consistent with the official site description and cross-checked map coordinates. Samoa is a 10-island archipelago per Samoa Tourism Authority; islands below the source resolution are shown as cartographic point symbols at verified WGS84 positions rather than invented coastlines. 1200×760; reviewed 2026-10-04.</metadata>
