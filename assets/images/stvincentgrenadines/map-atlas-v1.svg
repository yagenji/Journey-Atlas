<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Map of Saint Vincent and the Grenadines" data-map-style="journey-atlas-map-v3-clean-background" data-map-projection="local-equirectangular-fit-v1">
<metadata>Natural Earth 1:10m ADM0 VCT, public domain, https://github.com/LonnyGomes/CountryGeoJSONCollection/blob/master/geojson/VCT.geojson, five target administrative polygons. Two additional verified country islets, Mayreau (GeoNames 3577874) and Isle a Quatre (GeoNames 3577804), coastlines GSHHS intermediate via Basemap 2.0.0, LGPL v3+ https://www.ngdc.noaa.gov/mgg/shorelines/shorelines.html. Geographic context includes only Carriacou, Grenada, from GSHHS. Smaller Tobago Cays not resolved at this source resolution; no invented island outlines. Source checked 2026-09-22. 1200x760, WGS84. Canonical unpublished-review map candidate.</metadata>
