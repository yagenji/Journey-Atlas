<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Map of Dominica" data-map-style="journey-atlas-map-v3-clean-background" data-map-projection="local-equirectangular-fit-v1">
<metadata>Dominica national identity checked against Natural Earth 1:10m Admin-0 public-domain DMA (LonnyGomes/CountryGeoJSONCollection); island target shoreline refined with actual GSHHG/GSHHS intermediate-resolution WGS84 coastline, segment 389, source Wessel and Smith via Basemap 2.0.0, LGPL v3 or later, https://www.ngdc.noaa.gov/mgg/shorelines/shorelines.html . GSHHS is used for physical shoreline only, cross-checked against named DMA ADM0 for the single-island nation. Neighboring islands from GSHHS intermediate resolution. Projected against Country JSON bounds, source review 2026-09-22.</metadata>
