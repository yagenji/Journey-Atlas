<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Map of Fiji with Taveuni enlargement locator and Rotuma inset" data-map-style="journey-atlas-map-v3-clean-background" data-map-projection="multi-region-local-equirectangular-fit-v1">
<metadata>Fiji coastlines from GSHHS/GSHHG intermediate-resolution WGS84 coastline data distributed with Basemap; Northern Division / Taveuni antimeridian continuation supplemented from Apache Superset Fiji ADM1 GeoJSON so the primary map does not terminate at 180°; Taveuni locator box and guide identify the enlarged inset source area on the primary map; Sawa-i-Lau micro-island supplemented at map scale from verified island centre (OSM way 22570207 / GeoNames 2198469) and published dimensions (approximately 1.70 km by 1.15 km); Great Astrolabe Reef location outline is a reef symbol centred on GeoNames 2205206 and is not land; Rotuma outline cross-checked against Fiji ADM1 geometry surfaced by Apache Superset country map data. Three-region local-equirectangular layout. Checked 2026-10-06.</metadata>
