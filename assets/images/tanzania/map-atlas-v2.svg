<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Map of Tanzania" data-map-style="journey-atlas-map-v3-clean-background" data-map-projection="local-equirectangular-fit-v1">
<metadata>Administrative mainland target geometry: Natural Earth low-resolution fixture bundled with pyogrio/geopandas test data, WGS84. Visible Tanzanian islands including Unguja, Pemba, Mafia and coastal islands are rendered from the same GSHHS/GSHHG coastline geometry used for surrounding land, with their Tanzania assignment verified against official Government of Tanzania geography. Coastlines, surrounding land and inland-water geometry: GSHHS/GSHHG via Basemap resolution=i, WGS84. Major lakes are verified GSHHS inland-water polygons. Surrounding national borders use Natural Earth 1:10m Admin-0 linework. Surrounding coastline and neighbor-border strokes are masked in a narrow band around the mainland target so the Tanzania land fill and national boundary use the same geometry without double edges. Western continental context continues to the canvas edge so the source bounds do not appear as an artificial interior crop seam. The mainland target boundary is repeated only over inland water; the unresolved Tanzania–Malawi lake boundary is shown as a dashed disputed cartographic indicator, consistent with the current shared map treatment. Generated 2026-10-03.</metadata>
