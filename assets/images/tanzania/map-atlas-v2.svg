<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 760" role="img" aria-label="Map of Tanzania" data-map-style="journey-atlas-map-v3-clean-background" data-map-projection="local-equirectangular-fit-v1">
<metadata>Administrative mainland target geometry reprojected from the reviewed Natural Earth WGS84 Tanzania mainland geometry; visible Tanzanian islands including Unguja, Pemba, Mafia and coastal islands use reviewed GSHHS/GSHHG coastline geometry. Coastlines, surrounding land, neighboring boundaries and inland-water geometry: GSHHS/GSHHG via Basemap resolution=i, WGS84. Map bounds expanded westward to preserve western context and avoid edge clipping. Major lakes rendered from verified GSHHS inland-water polygons. Generated 2026-10-03.</metadata>
