<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Map of Tonga with centered national overview and enlarged island-group details" data-map-style="journey-atlas-map-v3-clean-background" data-map-projection="multi-region-local-equirectangular-fit-v1">
<metadata>Tonga national overview coastline geometry remains rendered primarily from GSHHS/GSHHG intermediate-resolution coastline data distributed with Basemap 2.0.0 (WGS84), with existing overview supplements from the Apache Superset Tonga country-map GeoJSON (WGS84; repository Apache-2.0). Enlarged Tongatapu, Vava'u, Ha'apai and ʻEua detail insets are refined from geoBoundaries gbOpen Tonga ADM1 simplified GeoJSON, boundary year 2017 (source boundary metadata ODbL 1.0; OpenStreetMap/Wambacher source), official source pinned at geoBoundaries commit 9469f09 and retrieved from a redistributed copy pinned at robit-man/tiny-atlas bf892371c17a281d3d6764c61b8e85ce76d0c264. Detail geometry is reprojected into the existing JOURNEY ATLAS region rectangles. National overview, region bounds, Scene coordinates, locator boxes and guide lines are unchanged. Reviewed 2026-10-05.</metadata>
