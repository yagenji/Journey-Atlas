<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Map of Tonga with centered national overview and enlarged island-group details" data-map-style="journey-atlas-map-v3-clean-background" data-map-projection="multi-region-local-equirectangular-fit-v1">
<metadata>Tonga coastline geometry rendered primarily from GSHHS/GSHHG intermediate-resolution coastline data distributed with Basemap 2.0.0 (WGS84), with Eua, Haapai and Niuas supplemented from the Apache Superset Tonga country-map GeoJSON (WGS84; repository Apache-2.0) and rendered with the JOURNEY ATLAS multi-region local equirectangular projection. National overview preserves actual island-group positions and is centered between four enlarged detail insets. Tongatapu, Vava'u, Ha'apai and ʻEua are repeated as enlarged detail insets for Scene-marker legibility. Locator boxes and guide lines connect each overview island group to its enlarged inset, following the Qatar enlargement convention. Reviewed 2026-10-04.</metadata>
