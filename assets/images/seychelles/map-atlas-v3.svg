<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Map of Seychelles: Aldabra is a separate inset, not at the actual relative position or the same scale" data-map-style="journey-atlas-map-v3-clean-background" data-map-projection="multi-region-local-equirectangular-fit-v1">
<metadata>Natural Earth 1:10m Admin-0 Seychelles geometry via CountryGeoJSONCollection for the Inner Islands, with the Aldabra atoll (islands and lagoon) from GSHHS/GSHHG full-resolution shorelines via Basemap 2.0.0 (LGPL-3.0); WGS84. Aldabra redrawn 2026-10-28, replacing the MIT-licensed laravel-countries outline. Mahé, Praslin, La Digue and Curieuse are rendered together in one geographic Inner Islands region; Aldabra is a separate inset following the shared United States multi-region map pattern. Positions and scales between the Inner Islands and Aldabra are not geographic; reviewed 2026-09-30.</metadata>
