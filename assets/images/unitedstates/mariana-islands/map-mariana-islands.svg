<metadata>WGS84; GSHHG intermediate-resolution exact data polygons via Basemap 2.0.0 (Paul Wessel and Walter H. F. Smith, GSHHG source https://www.soest.hawaii.edu/wessel/gshhg/; GSHHG/Basemap license terms apply), area_thresh=0 to retain small polygons. 13 islands represented by actual GSHHG shorelines, from Guam and Rota to Maug. Only the exceptionally small islands Farallon de Pajaros and Farallon de Medinilla use unfilled true-position map symbols, NOT coastline geometry. Enlarged Guam and Saipan–Tinian views are separate detail maps (Natural Earth 1:10m). No maritime border invented between Guam and CNMI. WGS84 local-equirectangular uniform distance scale in main frame. Updated 2026-11-15.</metadata>
