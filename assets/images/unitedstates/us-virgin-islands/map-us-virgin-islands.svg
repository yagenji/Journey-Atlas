<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" data-map-projection="local-equirectangular-fit-v1" data-map-style="journey-atlas-map-v3-clean-background" aria-label="United States Virgin Islands actual islands, coastlines and real landmarks">
<metadata>GSHHG/GSHHS intermediate (i) coastline via Basemap 2.0.0; Paul Wessel and Walter H. F. Smith, LGPL-3.0-or-later, WGS84; 1200x760, local-equirectangular-fit-v1. Saint Thomas, Saint John, Saint Croix, visible surrounding small islands and British Virgin Islands context keep their real geographic positions. Buck Island (off Saint Croix) coastline is a cartographically simplified real WGS84 shore outline from the 2018 Oregon State University research orthomosaic clip geometry, developed with NOAA and NPS (https://github.com/hokiespurs/buck-island-ortho-map/blob/master/assets/buckbounds.geojson), visually cross-checked against US National Park Service Buck Island aerial map and NASA Earth Observatory image of eastern Saint Croix (public-domain NASA imagery, not reproduced). Orthomosaic repository does not specify a data license; geographical measurements/outline are used as factual references rather than a reproduced artwork. No coastlines or islands invented; no island relocation. Land polygon is distinct from the coral reef boundary. Hassel Island (St Thomas harbor) separately traced in display-scale generalized form from Library of Congress HABS/HAER Hassel Island, Charlotte Amalie location/key plan (https://www.loc.gov/item/vi0192/) cross-referenced with NPS/USGS Hassel coordinate information. Public US government historical survey is the base; the narrow harbour channel is maintained, not bridged by the generalized mainland polygon. Coastlines are editorial-scale, not survey-grade.</metadata>
