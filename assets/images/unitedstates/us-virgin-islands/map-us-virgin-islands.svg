<title id="usvi-map-title">米領ヴァージン諸島と周辺の島々の地図</title>
<desc id="usvi-map-desc">セント・トーマス、セント・ジョン、離れたセント・クロイの実際の位置関係。周辺の実在する小島を利用可能な海岸線データから描いた。小さな島のうちバック島など輪郭が解決できないものは、地図上の実座標マーカーで位置を示す。</desc>
