<title id="usvi-title">米領ヴァージン諸島の地図</title>
<desc id="usvi-desc">セント・トーマスとセント・ジョンの南方に、離れてセント・クロイが位置する。主要三島の実在する輪郭を描き、小島の輪郭は地図の解像度によって省略されている。</desc>
