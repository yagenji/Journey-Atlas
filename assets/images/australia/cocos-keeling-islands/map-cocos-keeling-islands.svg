<title id="cocos-map-title">ココス（キーリング）諸島の旅の地図</title>
<desc id="cocos-map-desc">実在するサンゴ島の海岸線。南ココス環礁を主図に、北キーリング島を別枠で掲載。</desc>
<metadata>Target land: GSHHG/GSHHS full-resolution shoreline via Basemap 2.0.0 (Paul Wessel and Walter H. F. Smith; https://www.soest.hawaii.edu/wessel/gshhg/), assigned with Natural Earth 1:10m Admin-0 map subunits ca96624a56bd078437bca8184e78163e5039ad19 (public domain) unit CCK (Cocos (Keeling) Islands); internal land boundaries follow Natural Earth. Surrounding land: the same GSHHG shoreline, drawn to the canvas edge. WGS84; local-equirectangular-fit-v1, 1200x760. Lagoon is filled at the atoll scale. North Keeling (about 25 km north) is a point in a separate frame; it is below shoreline resolution.</metadata>
