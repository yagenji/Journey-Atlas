<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title description" data-map-projection="local-equirectangular-fit-v1">
<title id="title">オーランド諸島の地図</title>
<desc id="description">実在する島々の海岸線を描いた縮尺地図。小さな島と岩礁の一部は出典データの解像度により省略されています。縮尺に対して小さな岩礁は省略され、Sceneマーカーが実際の座標を示します。</desc>
<metadata>Source: GSHHS / Basemap intermediate coastline, LGPL-3.0-or-later (Paul Wessel and Walter H. F. Smith). https://www.soest.hawaii.edu/wessel/gshhg/ WGS84 / local equirectangular. GSHHS intermediate-resolution coastline; small rocks below the source scale, including Märket, are represented by accurate WGS84 location markers, not fictional coastline.</metadata>
