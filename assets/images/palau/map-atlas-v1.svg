<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Map of Palau" data-map-style="journey-atlas-map-v3-clean-background" data-map-projection="multi-region-local-equirectangular-fit-v1">
<metadata>Palau coastlines and islands rendered from GSHHS/GSHHG intermediate-resolution coastline polygons via Basemap 2.0.0, WGS84, with verified high-resolution OpenStreetMap country-boundary coastline supplements for Ngemelis, Omekang and Kayangel micro-islands from hyperknot/country-levels-export. Existing verified main-island coastline paths reprojected into a single geographic overview. The overview Southwest Islands use all five land polygons from hyperknot/country-levels-export geojson/high/iso1/PW.geojson (OSM relation 571805, ODbL 1.0), including the small islands absent at the previous coastline resolution. Northern and southern main-island areas repeat as enlarged details. Scene coordinates are unchanged.</metadata>
