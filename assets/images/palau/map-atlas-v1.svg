<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Map of Palau" data-map-style="journey-atlas-map-v3-clean-background" data-map-projection="multi-region-local-equirectangular-fit-v1">
<metadata>Palau coastlines and islands rendered from GSHHS/GSHHG intermediate-resolution coastline polygons via Basemap 2.0.0, WGS84, with verified high-resolution OpenStreetMap country-boundary coastline supplements for Ngemelis, Omekang and Kayangel micro-islands from hyperknot/country-levels-export. The northern main island group, Rock Islands/Peleliu/Angaur group, and Southwest Islands are shown in separate geographic frames using real bounds and independent local-equirectangular projection; no coordinates are altered. Reviewed 2026-10-05.</metadata>
