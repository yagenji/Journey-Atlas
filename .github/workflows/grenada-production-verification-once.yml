name: One-time Grenada live production verification
on:
  push:
    branches: [ops/grenada-publication-approval-20260919]
    paths: ['.github/workflows/grenada-production-verification-once.yml']
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated verifier
        uses: actions/checkout@v4
        with:
          ref: ops/grenada-publication-approval-20260919
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual production SHA and published Country delivery
        run: python3 scripts/_grenada_live_verify_once.py
