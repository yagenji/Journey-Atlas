name: Publication Pipeline v2 checks

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Country slug
        required: true
        type: string
      mode:
        description: review or publish
        required: true
        type: choice
        options: [review, publish]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      slug: ${{ steps.target.outputs.slug }}
      mode: ${{ steps.target.outputs.mode }}
      active: ${{ steps.target.outputs.active }}
      source_sha: ${{ steps.target.outputs.source_sha }}
      main_sha: ${{ steps.overlay.outputs.main_sha }}
    steps:
      - name: Checkout Country branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Publication Pipeline v2 target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          DISPATCH_SLUG: ${{ inputs.slug }}
          DISPATCH_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          slug=""; mode=""; active=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            slug="$DISPATCH_SLUG"; mode="$DISPATCH_MODE"
          else
            case "$HEAD_REF" in
              country/*) slug="${HEAD_REF#country/}" ;;
              *)
                echo "slug=" >> "$GITHUB_OUTPUT"; echo "mode=" >> "$GITHUB_OUTPUT"; echo "active=false" >> "$GITHUB_OUTPUT"; echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          fi
          if [ -f "data/countries/$slug.json" ] && [ -f "ops/country-production/$slug.json" ]; then
            active="$(python3 - "$slug" <<'PY'
          import json,sys
          from pathlib import Path
          p=json.loads((Path('data/countries')/f'{sys.argv[1]}.json').read_text())
          print('true' if p.get('publicationPipelineVersion')==2 else 'false')
          PY
            )"
          fi
          if [ "$active" = true ] && [ -z "$mode" ]; then
            mode="$(python3 - "$slug" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads((Path('ops/country-production')/f'{sys.argv[1]}.json').read_text())
          print('publish' if (s.get('finalApproval') or {}).get('state')=='APPROVED' else 'review')
          PY
            )"
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"; echo "mode=$mode" >> "$GITHUB_OUTPUT"; echo "active=$active" >> "$GITHUB_OUTPUT"; echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Compatibility pass for non-v2 PR
        if: steps.target.outputs.active != 'true'
        run: echo "Publication Pipeline v2 inactive; compatibility pass."
      - name: Rebuild target on latest main
        id: overlay
        if: steps.target.outputs.active == 'true'
        env:
          SLUG: ${{ steps.target.outputs.slug }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/country_overlay_v2.py assert-scope "$SLUG" origin/main "$SOURCE_SHA"
          python3 scripts/country_overlay_v2.py capture "$SLUG" /tmp/country-overlay
          main_sha="$(git rev-parse origin/main)"
          git reset --hard origin/main
          python3 scripts/country_overlay_v2.py apply "$SLUG" /tmp/country-overlay
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "Validation base: latest main $main_sha + Country overlay $SOURCE_SHA"
      - name: Install image validation dependency
        if: steps.target.outputs.active == 'true'
        run: python3 -m pip install --disable-pip-version-check --quiet pillow
      - name: Validate target
        if: steps.target.outputs.active == 'true'
        env:
          SLUG: ${{ steps.target.outputs.slug }}
          MODE: ${{ steps.target.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publication_pipeline_v2.py self-test
          if [ "$MODE" = review ]; then python3 scripts/publication_pipeline_v2.py assert-review-ready "$SLUG"; else python3 scripts/publication_pipeline_v2.py assert-publish-ready "$SLUG"; fi
          python3 scripts/validate_country_editorial_v2.py --force "data/countries/$SLUG.json"
          python3 scripts/validate_country_quality_v5.py "data/countries/$SLUG.json"
          python3 scripts/validate_country_map_v6.py "data/countries/$SLUG.json"
          python3 scripts/validate_country.py --strict "data/countries/$SLUG.json"
          python3 scripts/audit_country_image_delivery_targeted.py --slug "$SLUG"
          python3 scripts/validate_images.py --mode audit --slug "$SLUG"
          python3 scripts/validate_images.py --duplicates-only --slug "$SLUG"
          if [ "$MODE" = publish ]; then python3 scripts/validate_production_state_routed.py; fi

  browser-qa:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Compatibility pass for non-v2 PR
        if: needs.validate.outputs.active != 'true'
        run: echo "Publication Pipeline v2 inactive; Browser QA compatibility pass."
      - name: Checkout Country branch
        if: needs.validate.outputs.active == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: needs.validate.outputs.active == 'true'
        with:
          python-version: '3.12'
      - name: Rebuild target on latest main
        if: needs.validate.outputs.active == 'true'
        env:
          SLUG: ${{ needs.validate.outputs.slug }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/country_overlay_v2.py capture "$SLUG" /tmp/country-overlay
          git reset --hard origin/main
          python3 scripts/country_overlay_v2.py apply "$SLUG" /tmp/country-overlay
      - name: Decide whether review Browser QA can be reused
        if: needs.validate.outputs.active == 'true'
        id: reuse
        env:
          SLUG: ${{ needs.validate.outputs.slug }}
          MODE: ${{ needs.validate.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          reuse=false
          if [ "$MODE" = publish ]; then
            review_main="$(python3 - "$SLUG" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads((Path('ops/country-production')/f'{sys.argv[1]}.json').read_text())
          p=s.get('reviewPreview') or {}
          print(p.get('mainBaseCommit') or '')
          PY
            )"
            if [ -n "$review_main" ] && git cat-file -e "$review_main^{commit}" 2>/dev/null; then
              shared=false
              while IFS= read -r path; do
                case "$path" in country.html|assets/js/*|assets/css/*|scripts/build_site.py|scripts/build_country_preview_targeted.py|scripts/qa_published_browser.py) shared=true; break;; esac
              done < <(git diff --name-only "$review_main"..origin/main)
              [ "$shared" = false ] && reuse=true
            fi
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
      - name: Reuse review Browser QA
        if: needs.validate.outputs.active == 'true' && steps.reuse.outputs.reuse == 'true'
        run: echo "Shared rendering unchanged since reviewed main base; reusing review Browser QA."
      - name: Install Browser QA dependency
        if: needs.validate.outputs.active == 'true' && steps.reuse.outputs.reuse != 'true'
        run: python3 -m pip install --disable-pip-version-check --quiet selenium
      - name: Build targeted Country package
        if: needs.validate.outputs.active == 'true' && steps.reuse.outputs.reuse != 'true'
        env:
          TARGET_SLUGS: ${{ needs.validate.outputs.slug }}
          JOURNEY_ATLAS_SITE_URL: http://127.0.0.1:4173/
        run: python3 scripts/build_country_preview_targeted.py
      - name: Start targeted package
        if: needs.validate.outputs.active == 'true' && steps.reuse.outputs.reuse != 'true'
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/publication-v2-http.log 2>&1 & echo $! >/tmp/publication-v2-http.pid
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done; exit 1
      - name: Run Desktop Tablet Mobile Browser QA
        if: needs.validate.outputs.active == 'true' && steps.reuse.outputs.reuse != 'true'
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-publication-v2-output
          QA_SCOPE: ${{ needs.validate.outputs.mode == 'review' && 'unpublished-reviewable' || 'reviewable' }}
          QA_SLUGS: ${{ needs.validate.outputs.slug }}
        run: python3 scripts/qa_published_browser.py
      - name: Stop targeted package
        if: always() && needs.validate.outputs.active == 'true' && steps.reuse.outputs.reuse != 'true'
        run: if [ -f /tmp/publication-v2-http.pid ]; then kill "$(cat /tmp/publication-v2-http.pid)" 2>/dev/null || true; fi
      - name: Upload Browser QA report
        if: always() && needs.validate.outputs.active == 'true' && steps.reuse.outputs.reuse != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: publication-v2-browser-qa-${{ needs.validate.outputs.slug }}-${{ needs.validate.outputs.mode }}
          path: qa-publication-v2-output/
          if-no-files-found: warn
          retention-days: 3
