name: Publication Pipeline v2 checks

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Country slug
        required: true
        type: string
      mode:
        description: review or publish
        required: true
        type: choice
        options: [review, publish]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      slug: ${{ steps.target.outputs.slug }}
      mode: ${{ steps.target.outputs.mode }}
      active: ${{ steps.target.outputs.active }}
      source_sha: ${{ steps.target.outputs.source_sha }}
      main_sha: ${{ steps.overlay.outputs.main_sha }}
    steps:
      - name: Checkout Country branch
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'country/')
        uses: actions/checkout@v4
        with:
          # Compare the real PR head, not GitHub's synthetic PR merge commit.
          # Fetch history only for a real Country overlay comparison.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'country/')
        with:
          python-version: '3.12'
      - name: Resolve Publication Pipeline v2 target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          DISPATCH_SLUG: ${{ inputs.slug }}
          DISPATCH_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          slug=""; mode=""; active=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            slug="$DISPATCH_SLUG"; mode="$DISPATCH_MODE"
          else
            case "$HEAD_REF" in
              country/*) slug="${HEAD_REF#country/}"; slug="${slug%-renewal}" ;;
              *)
                echo "slug=" >> "$GITHUB_OUTPUT"; echo "mode=" >> "$GITHUB_OUTPUT"; echo "active=false" >> "$GITHUB_OUTPUT"; echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          fi
          if [ -f "data/countries/$slug.json" ] && [ -f "ops/country-production/$slug.json" ]; then
            active="$(python3 - "$slug" <<'PY'
          import json,sys
          from pathlib import Path
          p=json.loads((Path('data/countries')/f'{sys.argv[1]}.json').read_text())
          print('true' if p.get('publicationPipelineVersion')==2 else 'false')
          PY
            )"
          fi
          if [ "$active" = true ] && [ -z "$mode" ]; then
            mode="$(python3 - "$slug" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads((Path('ops/country-production')/f'{sys.argv[1]}.json').read_text())
          print('publish' if (s.get('finalApproval') or {}).get('state')=='APPROVED' else 'review')
          PY
            )"
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"; echo "mode=$mode" >> "$GITHUB_OUTPUT"; echo "active=$active" >> "$GITHUB_OUTPUT"; echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Compatibility pass for non-v2 PR
        if: steps.target.outputs.active != 'true'
        run: echo "Publication Pipeline v2 inactive; compatibility pass."
      - name: Rebuild target on latest main
        id: overlay
        if: steps.target.outputs.active == 'true'
        env:
          SLUG: ${{ steps.target.outputs.slug }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/country_overlay_v2.py assert-scope "$SLUG" origin/main "$SOURCE_SHA"
          python3 scripts/country_overlay_v2.py capture "$SLUG" /tmp/country-overlay
          main_sha="$(git rev-parse origin/main)"
          git reset --hard origin/main
          python3 scripts/country_overlay_v2.py apply "$SLUG" /tmp/country-overlay
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "Validation base: latest main $main_sha + Country overlay $SOURCE_SHA"
      - name: Install image validation dependency
        if: steps.target.outputs.active == 'true'
        run: python3 -m pip install --disable-pip-version-check --quiet pillow
      - name: Validate target
        if: steps.target.outputs.active == 'true'
        env:
          SLUG: ${{ steps.target.outputs.slug }}
          MODE: ${{ steps.target.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publication_pipeline_v2.py self-test
          if [ "$MODE" = review ]; then python3 scripts/publication_pipeline_v2.py assert-review-ready "$SLUG"; else python3 scripts/publication_pipeline_v2.py assert-publish-ready "$SLUG"; fi
          python3 scripts/validate_country_editorial_v2.py --force "data/countries/$SLUG.json"
          python3 scripts/validate_country_quality_v5.py "data/countries/$SLUG.json"
          python3 scripts/validate_country_map_v6.py "data/countries/$SLUG.json"
          python3 scripts/validate_country.py --strict "data/countries/$SLUG.json"
          python3 scripts/audit_country_image_delivery_targeted.py --slug "$SLUG"
          python3 scripts/validate_images.py --mode audit --slug "$SLUG"
          python3 scripts/validate_images.py --duplicates-only --slug "$SLUG"
          if [ "$MODE" = publish ]; then python3 scripts/validate_production_state_routed.py; fi

  # On a Country review PR, this is the authoritative QA reused by the review
  # deployment workflow. Explicit dispatch still checks publish/review overlays.
  # Avoid a second dispatch of the same review QA on PR synchronization.
  browser-qa:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.validate.outputs.active == 'true' && needs.validate.outputs.mode == 'review')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Compatibility pass for non-v2 PR
        if: needs.validate.outputs.active != 'true'
        run: echo "Publication Pipeline v2 inactive; Browser QA compatibility pass."
      - name: Checkout Country branch
        if: needs.validate.outputs.active == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: needs.validate.outputs.active == 'true'
        with:
          python-version: '3.12'
      - name: Rebuild target on latest main
        if: needs.validate.outputs.active == 'true'
        env:
          SLUG: ${{ needs.validate.outputs.slug }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/country_overlay_v2.py capture "$SLUG" /tmp/country-overlay
          git reset --hard origin/main
          python3 scripts/country_overlay_v2.py apply "$SLUG" /tmp/country-overlay
      - name: Reuse matching required Country Browser QA when its report proves coverage
        if: github.event_name == 'pull_request' && needs.validate.outputs.active == 'true' && needs.validate.outputs.mode == 'review'
        id: requiredqa
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ needs.validate.outputs.slug }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          HEAD_REF: ${{ github.head_ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'reuse=false' >> "$GITHUB_OUTPUT"
          # The required workflow uses the PR merge tree; a different main
          # would make its rendered output non-equivalent to this v2 overlay.
          if [ "$(git rev-parse origin/main)" != "$EVENT_BASE_SHA" ]; then
            echo 'main advanced; run independent v2 Browser QA.'
            exit 0
          fi
          for attempt in $(seq 1 40); do
            match="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow browser-country-qa.yml --branch "$HEAD_REF" --event pull_request --limit 40 --json databaseId,headSha,status,conclusion | jq -cr --arg sha "$SOURCE_SHA" '[.[] | select(.headSha == $sha)] | first // empty')"
            if [ -z "$match" ]; then sleep 2; continue; fi
            status="$(jq -r .status <<< "$match")"
            if [ "$status" != completed ]; then sleep 2; continue; fi
            conclusion="$(jq -r .conclusion <<< "$match")"
            if [ "$conclusion" != success ]; then
              echo "Required Country Browser QA ended $conclusion; do not replace its failure with a pass." >&2
              exit 1
            fi
            run_id="$(jq -r .databaseId <<< "$match")"
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name country-browser-qa --dir /tmp/required-country-qa; then
              echo 'Required QA artifact unavailable; run independent v2 Browser QA.'
              exit 0
            fi
            if python3 - "$SLUG" <<'PY'
          import json, sys
          from collections import Counter
          from pathlib import Path
          slug = sys.argv[1]
          reports = [p for p in Path('/tmp/required-country-qa').rglob('report.json')
                     if p.parent.name == 'qa-browser-reviewable-output']
          if len(reports) != 1:
              raise SystemExit('Expected one unpublished-reviewable QA report')
          report = json.loads(reports[0].read_text(encoding='utf-8'))
          if report.get('pass') is not True or report.get('failures') or slug not in report.get('countries', []):
              raise SystemExit('Required QA did not pass for this unpublished Country')
          rows = [r for r in report.get('results', []) if r.get('slug') == slug]
          counts = Counter(r.get('viewport') for r in rows if not r.get('errors'))
          if counts != Counter({'desktop': 1, 'tablet': 1, 'mobile': 1}) or len(rows) != 3:
              raise SystemExit('Required QA is missing a clean Desktop/Tablet/Mobile result')
          print(f'Reusing required Browser QA for {slug}: all three viewports PASS')
          PY
            then
              echo 'reuse=true' >> "$GITHUB_OUTPUT"
            else
              echo 'Required QA report did not establish coverage; run independent v2 Browser QA.'
            fi
            exit 0
          done
          echo 'Matching required QA did not finish in time; run independent v2 Browser QA.'
      - name: Decide whether review Browser QA can be reused
        if: needs.validate.outputs.active == 'true'
        id: reuse
        env:
          SLUG: ${{ needs.validate.outputs.slug }}
          MODE: ${{ needs.validate.outputs.mode }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.requiredqa.outputs.reuse }}' = true ]; then
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          reuse=false
          if [ "$MODE" = publish ]; then
            review_main="$(python3 - "$SLUG" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads((Path('ops/country-production')/f'{sys.argv[1]}.json').read_text())
          p=s.get('reviewPreview') or {}
          print(p.get('mainBaseCommit') or '')
          PY
            )"
            if [ -n "$review_main" ] && git cat-file -e "$review_main^{commit}" 2>/dev/null; then
              shared=false
              while IFS= read -r path; do
                case "$path" in country.html|assets/js/*|assets/css/*|scripts/build_site.py|scripts/build_country_preview_targeted.py|scripts/qa_published_browser.py) shared=true; break;; esac
              done < <(git diff --name-only "$review_main"..origin/main)
              [ "$shared" = false ] && reuse=true
            fi
          fi
          if [ "$MODE" = review ]; then
            reviewed_source="$(python3 -c 'import json,sys; s=json.load(open("ops/country-production/"+sys.argv[1]+".json")); p=s.get("reviewPreview") or {}; print(p.get("sourceCommit","") if p.get("state")=="DONE" and p.get("browserQa")=="PASS" else "")' "$SLUG")"
            reviewed_main="$(python3 -c 'import json,sys; s=json.load(open("ops/country-production/"+sys.argv[1]+".json")); print((s.get("reviewPreview") or {}).get("mainBaseCommit") or "")' "$SLUG")"
            if [ -n "$reviewed_source" ] && [ -n "$reviewed_main" ] && git cat-file -e "$reviewed_source^{commit}" 2>/dev/null && git cat-file -e "$reviewed_main^{commit}" 2>/dev/null; then
              shared=false
              while IFS= read -r path; do
                case "$path" in country.html|assets/js/*|assets/css/*|scripts/build_site.py|scripts/build_country_preview_targeted.py|scripts/qa_published_browser.py) shared=true; break;; esac
              done < <(git diff --name-only "$reviewed_main"..origin/main)
              if [ "$shared" = false ] && git diff --quiet "$reviewed_source" "$SOURCE_SHA" -- "data/countries/$SLUG.json" "assets/images/$SLUG" data/theme-taxonomy.json data/atlas-destinations.json data/country-renewal-status.json; then
                reuse=true
              fi
            fi
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
      - name: Reuse review Browser QA
        if: needs.validate.outputs.active == 'true' && steps.reuse.outputs.reuse == 'true'
        run: echo "Reusing verified required Country QA or unchanged previously reviewed render."
      - name: Install Browser QA dependency
        if: needs.validate.outputs.active == 'true' && steps.reuse.outputs.reuse != 'true'
        run: python3 -m pip install --disable-pip-version-check --quiet selenium
      - name: Build targeted Country package
        if: needs.validate.outputs.active == 'true' && steps.reuse.outputs.reuse != 'true'
        env:
          TARGET_SLUGS: ${{ needs.validate.outputs.slug }}
          JOURNEY_ATLAS_SITE_URL: http://127.0.0.1:4173/
        run: python3 scripts/build_country_preview_targeted.py
      - name: Start targeted package
        if: needs.validate.outputs.active == 'true' && steps.reuse.outputs.reuse != 'true'
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/publication-v2-http.log 2>&1 & echo $! >/tmp/publication-v2-http.pid
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done; exit 1
      - name: Run Desktop Tablet Mobile Browser QA
        if: needs.validate.outputs.active == 'true' && steps.reuse.outputs.reuse != 'true'
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-publication-v2-output
          QA_SCOPE: ${{ needs.validate.outputs.mode == 'review' && 'unpublished-reviewable' || 'reviewable' }}
          QA_SLUGS: ${{ needs.validate.outputs.slug }}
        run: python3 scripts/qa_published_browser.py
      - name: Stop targeted package
        if: always() && needs.validate.outputs.active == 'true' && steps.reuse.outputs.reuse != 'true'
        run: if [ -f /tmp/publication-v2-http.pid ]; then kill "$(cat /tmp/publication-v2-http.pid)" 2>/dev/null || true; fi
      - name: Upload Browser QA report
        if: always() && needs.validate.outputs.active == 'true' && steps.reuse.outputs.reuse != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: publication-v2-browser-qa-${{ needs.validate.outputs.slug }}-${{ needs.validate.outputs.mode }}
          path: qa-publication-v2-output/
          if-no-files-found: warn
