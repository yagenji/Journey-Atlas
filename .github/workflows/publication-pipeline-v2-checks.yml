name: Publication Pipeline v2 checks

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Country slug
        required: true
        type: string
      mode:
        description: review or publish
        required: true
        type: choice
        options: [review, publish]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      slug: ${{ steps.target.outputs.slug }}
      mode: ${{ steps.target.outputs.mode }}
      active: ${{ steps.target.outputs.active }}
      source_sha: ${{ steps.target.outputs.source_sha }}
      main_sha: ${{ steps.overlay.outputs.main_sha }}
    steps:
      - name: Checkout Country branch
        uses: actions/checkout@v4
        with:
          # Most pull requests are not active Pipeline v2 Country targets.
          # Resolve that cheap compatibility path from one commit; fetch history
          # only if a real Country overlay comparison is required.
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Publication Pipeline v2 target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          DISPATCH_SLUG: ${{ inputs.slug }}
          DISPATCH_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          slug=""; mode=""; active=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            slug="$DISPATCH_SLUG"; mode="$DISPATCH_MODE"
          else
            case "$HEAD_REF" in
              country/*) slug="${HEAD_REF#country/}" ;;
              *)
                echo "slug=" >> "$GITHUB_OUTPUT"; echo "mode=" >> "$GITHUB_OUTPUT"; echo "active=false" >> "$GITHUB_OUTPUT"; echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          fi
          if [ -f "data/countries/$slug.json" ] && [ -f "ops/country-production/$slug.json" ]; then
            active="$(python3 - "$slug" <<'PY'
          import json,sys
          from pathlib import Path
          p=json.loads((Path('data/countries')/f'{sys.argv[1]}.json').read_text())
          print('true' if p.get('publicationPipelineVersion')==2 else 'false')
          PY
            )"
          fi
          if [ "$active" = true ] && [ -z "$mode" ]; then
            mode="$(python3 - "$slug" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads((Path('ops/country-production')/f'{sys.argv[1]}.json').read_text())
          print('publish' if (s.get('finalApproval') or {}).get('state')=='APPROVED' else 'review')
          PY
            )"
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"; echo "mode=$mode" >> "$GITHUB_OUTPUT"; echo "active=$active" >> "$GITHUB_OUTPUT"; echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Compatibility pass for non-v2 PR
        if: steps.target.outputs.active != 'true'
        run: echo "Publication Pipeline v2 inactive; compatibility pass."
      - name: Rebuild target on latest main
        id: overlay
        if: steps.target.outputs.active == 'true'
        env:
          SLUG: ${{ steps.target.outputs.slug }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/country_overlay_v2.py assert-scope "$SLUG" origin/main "$SOURCE_SHA"
          python3 scripts/country_overlay_v2.py capture "$SLUG" /tmp/country-overlay
          main_sha="$(git rev-parse origin/main)"
          git reset --hard origin/main
          python3 scripts/country_overlay_v2.py apply "$SLUG" /tmp/country-overlay
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "Validation base: latest main $main_sha + Country overlay $SOURCE_SHA"
      - name: Install image validation dependency
        if: steps.target.outputs.active == 'true'
        run: python3 -m pip install --disable-pip-version-check --quiet pillow
      - name: Validate target
        if: steps.target.outputs.active == 'true'
        env:
          SLUG: ${{ steps.target.outputs.slug }}
          MODE: ${{ steps.target.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publication_pipeline_v2.py self-test
          if [ "$MODE" = review ]; then python3 scripts/publication_pipeline_v2.py assert-review-ready "$SLUG"; else python3 scripts/publication_pipeline_v2.py assert-publish-ready "$SLUG"; fi
          python3 scripts/validate_country_editorial_v2.py --force "data/countries/$SLUG.json"
          python3 scripts/validate_country_quality_v5.py "data/countries/$SLUG.json"
          python3 scripts/validate_country_map_v6.py "data/countries/$SLUG.json"
          python3 scripts/validate_country.py --strict "data/countries/$SLUG.json"
          python3 scripts/audit_country_image_delivery_targeted.py --slug "$SLUG"
          python3 scripts/validate_images.py --mode audit --slug "$SLUG"
          python3 scripts/validate_images.py --duplicates-only --slug "$SLUG"
          if [ "$MODE" = publish ]; then python3 scripts/validate_production_state_routed.py; fi

  # The review workflow already dispatches and waits for one targeted QA run.
  # Keep PR checks text-only here so one Country change does not run Browser QA twice.
  browser-qa:
    needs: validate
    if: needs.validate.outputs.active == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Browser QA is delegated to the authoritative workflow_dispatch run."
