name: Verify deliberately skipped Cloudflare no-op deployments

# The existing production verifier already accepts a proven non-runtime
# ancestor SHA. Reuse it rather than creating a second live-QA implementation.
on:
  push:
    branches: [main]
    paths:
      - docs/CLOUDFLARE_NOOP_BUILD.md

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: startsWith(github.event.head_commit.message, '[CF-Pages-Skip]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch full canonical production QA for this main commit
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'verify-production.yml',
              ref: 'main',
              inputs: {slug: ''},
            });
