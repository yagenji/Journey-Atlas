name: Stage tested shared map adapter

on:
  pull_request:
    paths:
      - '.github/workflows/map-context-stage.yml'

permissions:
  contents: read

jobs:
  stage:
    if: github.event.pull_request.number == 935 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply SHA-guarded patch to preparation branch only
        run: python scripts/map_context_stage_payload.py
      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check --quiet 'basemap==2.0.0' 'shapely>=2.0,<3' 'cairosvg>=2.7,<3' 'pillow>=10,<13'
      - name: Check syntax and existing map context tests before saving
        run: |
          python -m py_compile scripts/add_country_map_context.py
          python -m unittest discover -s tests -p 'test_*map_context*.py' -v
      - name: Save staged script on the designated preparation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/add_country_map_context.py
          git diff --cached --quiet && exit 1
          git commit -m 'Support verified legacy map layouts in shared preview generator'
          git push origin HEAD:refs/heads/system/map-context-shared-preparation
