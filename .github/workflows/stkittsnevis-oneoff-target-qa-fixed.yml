name: One-off St Kitts Nevis corrected target QA
on:
  push:
    branches: [country/stkittsnevis]
    paths: [.github/workflows/stkittsnevis-oneoff-target-qa-fixed.yml]
permissions:
  contents: write
jobs:
  target-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install target QA dependencies
        run: python -m pip install --disable-pip-version-check --quiet pillow selenium
      - name: Check actual country references, decode, dimensions, and validators
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          slug='stkittsnevis'
          country=json.loads(Path(f'data/countries/{slug}.json').read_text())
          state=json.loads(Path(f'ops/country-production/{slug}.json').read_text())
          taste=country['taste']['items']
          paths=[country['hero']['image']]+[x['image'] for x in country['scenes']]+[x['image'] for x in taste]
          assert len(paths)==len(set(paths))==13
          hashes=[]
          for name in paths:
              p=Path(name)
              assert p.is_file() and p.stat().st_size>10000,name
              with Image.open(p) as im:
                  im.load()
                  assert im.format=='WEBP' and im.size==(1536,1024),(name,im.format,im.size)
              hashes.append(hashlib.sha256(p.read_bytes()).hexdigest())
          assert len(set(hashes))==13
          assert len(list(Path('assets/images/stkittsnevis/approved').glob('*.webp')))==13
          assert len(taste)==4 and all(x['imageFraming']=='SOURCE_ASPECT' for x in taste)
          assert state['hero']['state']=='APPROVED' and all(x['state']=='APPROVED' for x in state['scenes'])
          print('PASS: 13 unique delivered WebP files, fully decoded 1536x1024; 4 SOURCE_ASPECT')
          print('State phase:',state['phase'],'NEXT:',state['next'])
          for item in state['taste']:
              print('Taste',item['id'],item['state'],item.get('userApprovalEvidence',{}).get('formalApprovalStatus',''))
          registry=json.loads(Path('data/atlas-destinations.json').read_text())
          row=next(r for r in registry['destinations'] if r['slug']==slug)
          assert row['atlasPublished'] is False
          print('PASS: atlasPublished false')
          PY
          python scripts/validate_country_editorial_v2.py data/countries/stkittsnevis.json
          python scripts/validate_country.py --strict data/countries/stkittsnevis.json
          python scripts/audit_country_image_delivery_targeted.py --slug stkittsnevis
          python scripts/validate_images.py --mode audit --slug stkittsnevis
          python scripts/validate_images.py --duplicates-only --slug stkittsnevis
      - name: Build from final uploaded bytes and run desktop tablet mobile browser QA
        shell: bash
        env:
          TARGET_SLUGS: stkittsnevis
          JOURNEY_ATLAS_SITE_URL: http://127.0.0.1:4173/
          JOURNEY_ATLAS_BUILD_VERSION: ${{ github.sha }}
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-stkittsnevis-uploaded
          QA_SCOPE: unpublished-reviewable
          QA_SLUGS: stkittsnevis
        run: |
          set -euo pipefail
          python scripts/build_country_preview_targeted.py
          test -f dist/countries/stkittsnevis/index.html
          python -m http.server 4173 --directory dist >/tmp/stkittsnevis-target-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 25); do
            curl -fsS http://127.0.0.1:4173/countries/stkittsnevis/ >/dev/null && break
            sleep 1
          done
          python scripts/qa_published_browser.py
          echo 'PASS: uploaded-asset browser structure and load at three widths; FOOD03 editorial mismatch remains separate'
      - name: Upload target QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stkittsnevis-uploaded-browser-evidence
          path: qa-stkittsnevis-uploaded/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch .github/workflows/stkittsnevis-oneoff-target-qa-fixed.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary corrected target QA workflow'
            git push
          fi
