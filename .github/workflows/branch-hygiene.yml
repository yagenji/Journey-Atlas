name: Branch hygiene

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/branch-hygiene.yml"
  workflow_dispatch:
    inputs:
      branches:
        description: "Comma-separated branch names to delete. main is always protected."
        required: true
        type: string

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Run merged branch cleanup')
    runs-on: ubuntu-latest
    steps:
      - name: Delete selected non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BRANCHES: ${{ inputs.branches }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            targets="country/moldova-publish-20260908,country/mongolia,country/ukraine,feature/mobility-cross-border-demo,finalize/northmacedonia-production,finalize/vaticancity-production,finalize-slovakia-production,fix/mongolia-herder-icon-20260909,fix/mongolia-xiongnu-fact-20260909,fix/northmacedonia-encounters,fix/required-validate-routing,fix/ukraine-encounters,fix/ukraine-final-qa,fix/ukraine-profile-travel-scale,fix/ukraine-profile-travel-scale-v2,fix/ukraine-travel-scale-examples,ops/cleanup-merged-branches-20260909,publish/portugal,publish/portugal-final,publish/ukraine,publish/ukraine-v2,status/malta-live,system/mongolia-food01-reject-20260909,system/mongolia-food04-candidate-20260909,system/mongolia-hero-approved-20260909,system/mongolia-s01-approved-20260909,system/russia-reconcile-scene-approvals-20260909,system/russia-reject-food02-20260909,system/russia-s07-candidate-20260909,ui-home-lens-info-colors-20260908-v2,ui-home-lens-info-colors-20260908,ops/cleanup-superseded-branches-20260909"
          else
            targets="$MANUAL_BRANCHES"
          fi

          IFS=',' read -ra branches <<< "$targets"
          for raw in "${branches[@]}"; do
            branch="$(printf '%s' "$raw" | xargs)"
            [ -n "$branch" ] || continue
            if [ "$branch" = "main" ]; then
              echo "Refusing to delete protected main branch."
              exit 1
            fi

            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            status="$(curl -sS -o /tmp/delete.json -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/git/refs/heads/$encoded")"

            if [ "$status" = "204" ]; then
              echo "Deleted $branch"
            elif [ "$status" = "404" ]; then
              echo "Already absent: $branch"
            else
              echo "Failed deleting $branch (HTTP $status)"
              cat /tmp/delete.json || true
              exit 1
            fi
          done
