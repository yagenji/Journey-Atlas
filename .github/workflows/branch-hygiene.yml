name: Branch hygiene

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/branch-hygiene.yml"
  workflow_dispatch:
    inputs:
      branches:
        description: "Comma-separated branch names to delete. main is always protected."
        required: true
        type: string

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Run merged branch cleanup')
    runs-on: ubuntu-latest
    steps:
      - name: Delete selected non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BRANCHES: ${{ inputs.branches }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            targets="audit/encounters-20260906,common/travel-scale-variable,complete/ukraine-production,content/encounters-visible-index,content/travel-scale-days-only,content/travel-scale-open-ended-final,country-belarus,country-hungary,country-slovakia,country/bulgaria,country/czechia,country/malta,country/moldova,country/moldova-publish-final-20260908,country/moldova-publish-metadata-20260908,country/moldova-review-fixes-20260908,country/montenegro,country/northmacedonia,country/poland,country/portugal,country/serbia,country/slovenia,country/ukraine-production,country/vaticancity,docs/taste-image-hard-rule,feature/next-routes-related-refresh,finalize/hungary-live-current,finalize/poland-publication,fix-footer-color-unify-20260908,fix-slovakia-travel-scale,fix-slovenia-karst-signature-20260907,fix/belarus-final-review-20260909,fix/belarus-next-routes-related-russia,fix/belarus-review-state-routes,fix/hungary-facts-next-routes,fix/macau-review-details-20260909,fix/mongolia-herder-households-20260909-v2,fix/mongolia-herder-icon-20260909-v2,fix/mongolia-xiongnu-signature-fact,fix/poland-encounters,fix/poland-review-content,fix/portugal-review-copy,fix/reviewable-production-qa,fix/reviewable-production-qa-filter,fix/top-about-info-header-20260907,fix/ukraine-encounters-v2,fix/ukraine-profile-travel-scale-v3,fix/ukraine-travel-scale-examples-v2,ops/mongolia-review-state-sync,publish-slovakia,publish/belarus-20260909,publish/hungary,publish/macau-20260909,publish/malta,publish/mongolia-20260909,publish/montenegro,publish/northmacedonia-final,publish/poland,publish/poland-live,publish/portugal-final2,publish/ukraine-v3,publish/vaticancity,site-info-header-unify-20260907,state/belarus-approve-publish-20260909,state/belarus-qa-pass-20260909,state/current-taste-preflight-hardening-20260909,state/macau-map-qa-20260909,state/macau-publication-complete-20260909,state/macau-review-corrections-pass-20260909,state/macau-review-pass-20260909,state/macau-review-runtime-pass-20260909,state/mongolia-complete-20260909,state/mongolia-final-approval-20260909,state/poland,state/poland-encounter-qa,status/montenegro-live,status/portugal-live,system/country-production-root-fixes-20260909,system/country-production-state,system/hero-render-contract-v3-20260909,system/impact-aware-qa,system/init-mongolia-state-20260909,system/init-russia-state-20260908,system/mongolia-assetqa-pass-20260909,system/mongolia-food01-candidate-20260909,system/mongolia-food02-candidate-20260909,system/mongolia-food03-candidate-20260909,system/mongolia-map-approved-20260909,system/mongolia-map-candidate-20260909,system/mongolia-map-pass-assetqa-blocked-20260909,system/mongolia-review-ready-20260909,system/mongolia-s03-s04-candidates-20260909,system/mongolia-s05-candidate-20260909,system/mongolia-s06-s08-candidates-20260909,system/mongolia-scene-batch-approved-20260909,system/mongolia-scenes-sync-20260909,system/mongolia-state-sync-20260909-2,system/mongolia-taste-batch-approved-20260909,system/new-country-production-cleanup-20260908,system/production-throughput-v2,system/russia-approve-food01-20260909,system/russia-approve-food02-20260909,system/russia-approve-food04-start-regen-20260909,system/russia-approve-hero-20260909,system/russia-approve-s01-20260909,system/russia-approve-s04-s05-20260909,system/russia-approve-s07-start-taste-20260909,system/russia-approve-s08-20260909,system/russia-food02-candidate-20260909,system/russia-food04-candidate-20260909,system/russia-hero-candidate-20260909,system/russia-hero-reject-20260909,system/russia-hero-reset-20260909,system/russia-reconcile-scene-approvals-v2-20260909,system/russia-reject-food01-20260909,system/russia-reject-food02-v2-20260909,system/russia-reject-food03-20260909,system/russia-reject-s02-20260909,system/russia-reject-s03-20260909,system/russia-reject-s06-20260909,system/russia-reject-s07-20260909,system/russia-reset-s02-20260909,system/russia-s07-candidate-v2-20260909,system/russia-start-scene-regen-20260909,system/russia-state-hero-20260909,system/scene-generation-hardening-20260909,system/state-init-and-preview-cleanup-20260909,ui-home-lens-info-colors-20260908-v3"
          else
            targets="$MANUAL_BRANCHES"
          fi

          IFS=',' read -ra branches <<< "$targets"
          for raw in "${branches[@]}"; do
            branch="$(printf '%s' "$raw" | xargs)"
            [ -n "$branch" ] || continue
            if [ "$branch" = "main" ]; then
              echo "Refusing to delete protected main branch."
              exit 1
            fi

            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            status="$(curl -sS -o /tmp/delete.json -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/git/refs/heads/$encoded")"

            if [ "$status" = "204" ]; then
              echo "Deleted $branch"
            elif [ "$status" = "404" ]; then
              echo "Already absent: $branch"
            else
              echo "Failed deleting $branch (HTTP $status)"
              cat /tmp/delete.json || true
              exit 1
            fi
          done
