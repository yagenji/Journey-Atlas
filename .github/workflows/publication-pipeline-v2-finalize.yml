name: Publication Pipeline v2 finalize

on:
  push:
    branches: ["country/**"]
    # Publication readiness changes only through the Country State approval gate.
    # Content/image-only pushes must not launch a publication decision job.
    paths:
      - 'ops/country-production/**'
  workflow_dispatch:
    inputs:
      slug:
        description: Country slug; leave empty to derive from country/<slug>
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.target.outputs.ready }}
      slug: ${{ steps.target.outputs.slug }}
      head_ref: ${{ steps.target.outputs.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve v2 publication target
        id: target
        env:
          INPUT_SLUG: ${{ inputs.slug }}
        shell: bash
        run: |
          set -euo pipefail
          head_ref="$GITHUB_REF_NAME"; slug="${INPUT_SLUG:-}"
          [ -n "$slug" ] || slug="${head_ref#country/}"; slug="${slug%-renewal}"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"; echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"; echo "ready=false" >> "$GITHUB_OUTPUT"
          [ -f "data/countries/$slug.json" ] && [ -f "ops/country-production/$slug.json" ] || exit 0
          active="$(python3 scripts/publication_pipeline_v2.py status "$slug" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("active",False)).lower())')"
          [ "$active" = true ] || exit 0
          python3 scripts/publication_pipeline_v2.py assert-publish-ready "$slug" || exit 0
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Explain manual handoff when external publish identity is not enabled
        if: steps.target.outputs.ready == 'true' && vars.ATLAS_AUTO_PUBLISH != 'enabled'
        run: |
          echo 'Automatic publication is disabled until a separate, authorized publishing identity is configured.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Use the connected GitHub account to finalize the approved Country on one owner-authored PR, wait for required PR checks, then merge and verify the deployed SHA. No GITHUB_TOKEN Country push or PR creation was attempted.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: resolve
    # GITHUB_TOKEN PR creation/updates do not supply required PR checks and have
    # previously created empty failure runs. Do not mutate an approved Country
    # branch until an external identity is explicitly configured and enabled.
    if: needs.resolve.outputs.ready == 'true' && vars.ATLAS_AUTO_PUBLISH == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: country-publication-main
      cancel-in-progress: false
    steps:
      - name: Require independently authorized publishing token
        env:
          PUBLISH_TOKEN: ${{ secrets.ATLAS_PUBLICATION_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo '::error::ATLAS_AUTO_PUBLISH is enabled but ATLAS_PUBLICATION_TOKEN is missing. No Country branch was modified.'
            exit 1
          fi
      - name: Checkout Country branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.ATLAS_PUBLICATION_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure reusable review PR exists
        id: pr
        env:
          GH_TOKEN: ${{ secrets.ATLAS_PUBLICATION_TOKEN }}
          HEAD_REF: ${{ needs.resolve.outputs.head_ref }}
          SLUG: ${{ needs.resolve.outputs.slug }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_REF" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            echo '::error::Open the reusable owner-authored Country PR before final approval. Publishing must not create a new PR.'
            exit 1
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
      - name: Rebuild on latest main, validate and squash merge
        id: merge
        env:
          GH_TOKEN: ${{ secrets.ATLAS_PUBLICATION_TOKEN }}
          HEAD_REF: ${{ needs.resolve.outputs.head_ref }}
          SLUG: ${{ needs.resolve.outputs.slug }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "journey-atlas-publisher"; git config user.email "journey-atlas-publisher@users.noreply.github.com"
          merged_sha=""
          for cycle in $(seq 1 3); do
            git fetch --no-tags origin "+refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF" "+refs/heads/main:refs/remotes/origin/main"
            git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
            source_sha="$(git rev-parse HEAD)"
            python3 scripts/country_overlay_v2.py assert-scope "$SLUG" origin/main "$source_sha"
            python3 scripts/country_overlay_v2.py capture "$SLUG" /tmp/country-overlay
            latest_main="$(git rev-parse origin/main)"
            git reset --hard "$latest_main"
            python3 scripts/country_overlay_v2.py apply "$SLUG" /tmp/country-overlay
            python3 scripts/publication_pipeline_v2.py finalize "$SLUG"
            python3 - "$SLUG" <<'PY'
          import json,sys
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          slug=sys.argv[1]; p=Path('ops/country-production')/f'{slug}.json'; s=json.loads(p.read_text())
          for key in ('publication','reviewDeployment'):
              s.setdefault(key,{})['productionVerification']='PIPELINE_V2_INLINE_SMOKE'
          s.setdefault('publication',{})['separateVerificationPrRequired']=False
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n')
          country=json.loads((Path('data/countries')/f'{slug}.json').read_text())
          status=Path('data/country-renewal-status.json'); payload=json.loads(status.read_text()); rows=payload.setdefault('countries',[])
          row=next((x for x in rows if isinstance(x,dict) and x.get('slug')==slug),None)
          base={'slug':slug,'nameJa':country.get('nameJa') or slug,'wave':9,'published':True,'auditState':'AUDITED','renewalClass':'UNCLASSIFIED','content':'DONE','visual':'DONE','map':'DONE','sources':'DONE','qa':'PASS','production':'CI_GATED','hardImageGate':True,'automatedAudit':'DONE','notes':[f'Publication Pipeline v2 inline Cloudflare smoke is authoritative; no separate verification PR is required.']}
          if row is None: rows.append(base)
          else: row.update(base)
          payload['updatedAt']=datetime.now(timezone(timedelta(hours=9))).date().isoformat(); status.write_text(json.dumps(payload,ensure_ascii=False,separators=(',',':'))+'\n')
          PY
            git add "data/countries/$SLUG.json" "ops/country-production/$SLUG.json" "assets/images/$SLUG" data/atlas-destinations.json data/country-renewal-status.json data/theme-taxonomy.json
            git commit -m "Finalize $SLUG publication via latest-main overlay" || true
            sha="$(git rev-parse HEAD)"
            git push --force-with-lease="refs/heads/$HEAD_REF:$(git rev-parse origin/$HEAD_REF)" origin "HEAD:refs/heads/$HEAD_REF"
            gh workflow run publication-pipeline-v2-checks.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF" -f slug="$SLUG" -f mode=publish
            run_id=""
            for attempt in $(seq 1 30); do
              run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publication-pipeline-v2-checks.yml --branch "$HEAD_REF" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$sha\") | .databaseId" | head -n1)"; [ -n "$run_id" ] && break; sleep 2
            done
            [ -n "$run_id" ] || exit 1; gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            if [ "$(git rev-parse origin/main)" != "$latest_main" ]; then echo "main advanced; retrying latest overlay"; continue; fi
            response="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" -f merge_method=squash -f sha="$sha")"
            if [ "$(printf '%s' "$response" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("merged",False)).lower())')" = true ]; then merged_sha="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha",""))')"; break; fi
          done
          [ -n "$merged_sha" ] || exit 1
          echo "merged_sha=$merged_sha" >> "$GITHUB_OUTPUT"
      - name: Authoritative inline Cloudflare production verification
        env:
          SLUG: ${{ needs.resolve.outputs.slug }}
          EXPECTED_SHA: ${{ steps.merge.outputs.merged_sha }}
          SITE_URL: https://atlas.yagenji.com
        shell: bash
        run: |
          set -euo pipefail
          live=false
          for attempt in $(seq 1 90); do
            meta="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "$SITE_URL/build-meta.json?publication-v2=$GITHUB_RUN_ID-$attempt" || true)"
            live_sha="$(printf '%s' "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then live=true; break; fi
            sleep 4
          done
          [ "$live" = true ] || exit 1
          curl -fsS --max-time 15 "$SITE_URL/countries/$SLUG/?publication-v2=$GITHUB_RUN_ID" | grep -q "data-country=\"$SLUG\""
          curl -fsS --max-time 15 "$SITE_URL/data/countries/$SLUG.json?publication-v2=$GITHUB_RUN_ID" >/dev/null
          echo "Production verification PASS for $SLUG at $EXPECTED_SHA. No follow-up verification PR is required." >> "$GITHUB_STEP_SUMMARY"
