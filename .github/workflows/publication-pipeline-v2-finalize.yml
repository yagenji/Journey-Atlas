name: Publication Pipeline v2 finalize

on:
  push:
    branches: ["country/**"]
  workflow_dispatch:
    inputs:
      slug:
        description: Country slug; leave empty to derive from country/<slug>
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.target.outputs.ready }}
      slug: ${{ steps.target.outputs.slug }}
      head_ref: ${{ steps.target.outputs.head_ref }}
    steps:
      - name: Checkout Country branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve v2 publication target
        id: target
        env:
          INPUT_SLUG: ${{ inputs.slug }}
        shell: bash
        run: |
          set -euo pipefail
          head_ref="$GITHUB_REF_NAME"
          slug="${INPUT_SLUG:-}"
          if [ -z "$slug" ]; then
            slug="${head_ref#country/}"
            slug="${slug%-renewal}"
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "ready=false" >> "$GITHUB_OUTPUT"
          [ -f "data/countries/$slug.json" ] || exit 0
          [ -f "ops/country-production/$slug.json" ] || exit 0

          active="$(python3 scripts/publication_pipeline_v2.py status "$slug" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("active",False)).lower())')"
          if [ "$active" != "true" ]; then
            echo "$slug uses the legacy publication pipeline; v2 finalization is a no-op."
            exit 0
          fi
          if ! python3 scripts/publication_pipeline_v2.py assert-publish-ready "$slug"; then
            echo "$slug is waiting for the explicit final canonical-page approval gate."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # Share the exact final-main lane with the legacy publication queue so
      # in-flight legacy Countries and v2 Countries cannot race into main.
      group: country-publication-main
      cancel-in-progress: false
    steps:
      - name: Checkout Country branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure reusable review PR exists
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ needs.resolve.outputs.head_ref }}
          SLUG: ${{ needs.resolve.outputs.slug }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_REF" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$HEAD_REF" \
              --title "Add ${SLUG^} Country Page" \
              --body "Publication Pipeline v2 reusable review/publication PR. Final canonical approval has been recorded; automated latest-main synchronization, targeted checks and serialized squash merge are authorized.")"
            pr="${url##*/}"
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "Publication PR: #$pr"

      - name: Synchronize, validate and merge from the serialized publication lane
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ needs.resolve.outputs.head_ref }}
          SLUG: ${{ needs.resolve.outputs.slug }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          sync_latest_main() {
            snapshot="/tmp/${SLUG}-publication-v2-shared.json"
            python3 scripts/publication_pipeline_v2.py snapshot-shared "$SLUG" "$snapshot"
            git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
            if git merge-base --is-ancestor origin/main HEAD; then
              return 0
            fi

            set +e
            git merge --no-edit origin/main
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              allowed=(
                "data/atlas-destinations.json"
                "data/atlas-destinations-editorial.json"
                "data/country-renewal-status.json"
                "data/theme-taxonomy.json"
              )
              for path in "${conflicts[@]}"; do
                ok=false
                for candidate in "${allowed[@]}"; do
                  [ "$path" = "$candidate" ] && ok=true && break
                done
                if [ "$ok" != "true" ]; then
                  echo "Unexpected conflict outside shared Country metadata: $path" >&2
                  git merge --abort || true
                  exit 1
                fi
                git checkout --theirs -- "$path"
                git add "$path"
              done
            fi

            python3 scripts/publication_pipeline_v2.py restore-shared "$SLUG" "$snapshot"
            git add data/atlas-destinations.json data/atlas-destinations-editorial.json data/country-renewal-status.json data/theme-taxonomy.json
            if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              git commit --no-edit
            elif ! git diff --cached --quiet; then
              git commit -m "Reconcile $SLUG metadata after latest main sync"
            fi
          }

          ensure_status_row() {
            python3 - "$SLUG" <<'PY'
          import json, sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          slug = sys.argv[1]
          country = json.loads((Path('data/countries') / f'{slug}.json').read_text(encoding='utf-8'))
          path = Path('data/country-renewal-status.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          rows = payload.setdefault('countries', [])
          now = datetime.now(timezone(timedelta(hours=9))).date().isoformat()
          row = {
              'slug': slug,
              'nameJa': country.get('nameJa') or slug,
              'wave': 9,
              'published': True,
              'auditState': 'AUDITED',
              'renewalClass': 'UNCLASSIFIED',
              'content': 'DONE',
              'visual': 'DONE',
              'map': 'DONE',
              'sources': 'DONE',
              'qa': 'PASS',
              'production': 'CI_GATED',
              'hardImageGate': True,
              'notes': [f'New {country.get("nameEn") or slug} Country production completed under Publication Pipeline v2. Final canonical approval recorded; post-merge Cloudflare smoke verification is authoritative.'],
              'automatedAudit': 'DONE',
          }
          existing = next((item for item in rows if isinstance(item, dict) and item.get('slug') == slug), None)
          if existing is None:
              rows.append(row)
          else:
              notes = existing.get('notes') if isinstance(existing.get('notes'), list) and existing.get('notes') else row['notes']
              existing.clear()
              existing.update(row)
              existing['notes'] = notes
          payload['updatedAt'] = max(str(payload.get('updatedAt') or ''), now)
          path.write_text(json.dumps(payload, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          }

          dispatch_checks_and_wait() {
            sha="$1"
            gh workflow run publication-pipeline-v2-checks.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$HEAD_REF" \
              -f slug="$SLUG" \
              -f mode=publish
            run_id=""
            for attempt in $(seq 1 30); do
              run_id="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow publication-pipeline-v2-checks.yml \
                --branch "$HEAD_REF" \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$sha\") | .databaseId" | head -n1)"
              [ -n "$run_id" ] && break
              sleep 2
            done
            [ -n "$run_id" ] || { echo "Unable to locate v2 publish checks" >&2; return 1; }
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          }

          merged_sha=""
          for cycle in $(seq 1 3); do
            echo "Publication Pipeline v2 merge cycle $cycle"
            git fetch --no-tags origin "+refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
            git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
            sync_latest_main
            python3 scripts/publication_pipeline_v2.py finalize "$SLUG"
            ensure_status_row
            git add \
              "ops/country-production/$SLUG.json" \
              data/atlas-destinations.json \
              data/atlas-destinations-editorial.json \
              data/country-renewal-status.json
            if ! git diff --cached --quiet; then
              git commit -m "Finalize $SLUG publication via Pipeline v2"
            fi
            git push origin "HEAD:refs/heads/$HEAD_REF"
            sha="$(git rev-parse HEAD)"

            dispatch_checks_and_wait "$sha"

            git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
            if ! git merge-base --is-ancestor origin/main "$sha"; then
              echo "main advanced while checks ran; restarting on latest main."
              continue
            fi

            set +e
            response="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
              -f merge_method=squash \
              -f sha="$sha" 2>&1)"
            api_status=$?
            set -e
            if [ "$api_status" -eq 0 ]; then
              merged="$(printf '%s' "$response" | python3 -c 'import json,sys; p=json.load(sys.stdin); print(str(p.get("merged",False)).lower())')"
              if [ "$merged" = "true" ]; then
                merged_sha="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha", ""))')"
                break
              fi
            fi
            echo "Merge not accepted yet; retrying with the current main base."
          done

          [ -n "$merged_sha" ] || { echo "Unable to merge after three synchronized cycles" >&2; exit 1; }
          echo "merged_sha=$merged_sha" >> "$GITHUB_OUTPUT"
          echo "Merged $SLUG at $merged_sha"

      - name: Fast Cloudflare live smoke verification
        if: steps.merge.outputs.merged_sha != ''
        env:
          SLUG: ${{ needs.resolve.outputs.slug }}
          EXPECTED_SHA: ${{ steps.merge.outputs.merged_sha }}
          SITE_URL: https://atlas.yagenji.com
        shell: bash
        run: |
          set -euo pipefail
          live=false
          for attempt in $(seq 1 90); do
            meta="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "$SITE_URL/build-meta.json?publication-v2=$GITHUB_RUN_ID-$attempt" || true)"
            live_sha="$(printf '%s' "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""))' 2>/dev/null || true)"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              live=true
              break
            fi
            sleep 4
          done
          [ "$live" = "true" ] || { echo "Cloudflare did not expose $EXPECTED_SHA within the v2 smoke window" >&2; exit 1; }
          curl -fsS --max-time 15 "$SITE_URL/countries/$SLUG/?publication-v2=$GITHUB_RUN_ID" | grep -q "data-country=\"$SLUG\""
          curl -fsS --max-time 15 "$SITE_URL/data/countries/$SLUG.json?publication-v2=$GITHUB_RUN_ID" >/dev/null
          echo "Publication Pipeline v2 live smoke PASS: $SITE_URL/countries/$SLUG/" >> "$GITHUB_STEP_SUMMARY"
