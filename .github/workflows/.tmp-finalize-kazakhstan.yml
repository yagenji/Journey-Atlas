name: Temporary finalize Kazakhstan publication metadata

on:
  push:
    branches: ["country/kazakhstan"]
    paths:
      - '.github/workflows/.tmp-finalize-kazakhstan.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: country/kazakhstan
          fetch-depth: 0
      - name: Update Kazakhstan publication metadata only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          slug = "kazakhstan"
          data = Path("data")

          registry_path = data / "atlas-destinations.json"
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          row = next((x for x in registry.get("destinations", []) if x.get("slug") == slug), None)
          if row is None:
              raise SystemExit("Kazakhstan registry row missing")
          row["atlasPublished"] = True
          row["href"] = "countries/kazakhstan/"
          row["image"] = "assets/images/kazakhstan/approved/hero-lake-kaindy.webp"
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")

          status_path = data / "country-renewal-status.json"
          status = json.loads(status_path.read_text(encoding="utf-8"))
          status["updatedAt"] = "2026-09-13"
          rows = status.setdefault("countries", [])
          new_row = {
              "slug": slug,
              "nameJa": "カザフスタン",
              "wave": 9,
              "published": True,
              "auditState": "AUDITED",
              "renewalClass": "UNCLASSIFIED",
              "content": "DONE",
              "visual": "DONE",
              "map": "DONE",
              "sources": "DONE",
              "qa": "PASS",
              "production": "CI_GATED",
              "hardImageGate": True,
              "notes": [
                  "New Kazakhstan Country production completed to current Reference standard on 2026-09-13.",
                  "User instructed publication after final QA passed. Persistent review deployment, Content QA v3, strict Country validation, approved Hero / eight Scenes / four Taste assets / Map, final area comparison / semantic de-duplication / Travel Trivia / China route revisions, and Desktop / Tablet / Mobile Browser QA passed with zero blocking failures.",
                  "Protocol 2 policyPatch 4 terminal publication uses CI_GATED production verification; post-merge Cloudflare production verification is authoritative."
              ],
              "automatedAudit": "DONE"
          }
          for i, existing in enumerate(rows):
              if existing.get("slug") == slug:
                  rows[i] = new_row
                  break
          else:
              rows.append(new_row)
          status_path.write_text(json.dumps(status, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

          rm .github/workflows/.tmp-finalize-kazakhstan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/atlas-destinations.json data/country-renewal-status.json .github/workflows/.tmp-finalize-kazakhstan.yml
          git commit -m "Finalize Kazakhstan publication registry"
          git push origin HEAD:country/kazakhstan
