name: Validate Publication Pipeline v2

on:
  pull_request:
    paths:
      - 'ops/country-production-policy.json'
      - 'scripts/new_country.py'
      - 'scripts/publication_pipeline_v2.py'
      - 'scripts/country_overlay_v2.py'
      - 'scripts/validate_country_map_v6.py'
      - 'docs/PUBLICATION_PIPELINE_V2.md'
      - '.github/workflows/publication-pipeline-v2-checks.yml'
      - '.github/workflows/publication-pipeline-v2-review.yml'
      - '.github/workflows/publication-pipeline-v2-finalize.yml'
      - '.github/workflows/validate-publication-pipeline-v2.yml'
  push:
    branches: ['main']
    paths:
      - 'ops/country-production-policy.json'
      - 'scripts/new_country.py'
      - 'scripts/publication_pipeline_v2.py'
      - 'scripts/country_overlay_v2.py'
      - 'scripts/validate_country_map_v6.py'
      - 'docs/PUBLICATION_PIPELINE_V2.md'
      - '.github/workflows/publication-pipeline-v2-checks.yml'
      - '.github/workflows/publication-pipeline-v2-review.yml'
      - '.github/workflows/publication-pipeline-v2-finalize.yml'
      - '.github/workflows/validate-publication-pipeline-v2.yml'

permissions:
  contents: read

jobs:
  publication-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          # Helper self-tests read code, workflow YAML, and machine policy only.
          # Real Country/image checks continue in their own workflows.
          sparse-checkout: |
            .github
            ops
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml
      - name: Compile Python sources
        run: python3 -m py_compile scripts/new_country.py scripts/publication_pipeline_v2.py scripts/country_overlay_v2.py scripts/validate_country_map_v6.py
      - name: Run Publication Pipeline v2 helper self-test
        run: python3 scripts/publication_pipeline_v2.py self-test
      - name: Validate workflow YAML parses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          files = [
              '.github/workflows/publication-pipeline-v2-checks.yml',
              '.github/workflows/publication-pipeline-v2-review.yml',
              '.github/workflows/publication-pipeline-v2-finalize.yml',
              '.github/workflows/validate-publication-pipeline-v2.yml',
          ]
          for name in files:
              payload = yaml.safe_load(Path(name).read_text(encoding='utf-8'))
              if not isinstance(payload, dict) or 'jobs' not in payload:
                  raise SystemExit(f'{name}: invalid workflow structure')
              print(f'{name}: YAML parse PASS')
          PY
      - name: Verify overlay, review QA and no-follow-up-PR contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = Path('.github/workflows/publication-pipeline-v2-checks.yml').read_text()
          review = Path('.github/workflows/publication-pipeline-v2-review.yml').read_text()
          final = Path('.github/workflows/publication-pipeline-v2-finalize.yml').read_text()
          if 'country_overlay_v2.py' not in checks or 'country_overlay_v2.py' not in review or 'country_overlay_v2.py' not in final:
              raise SystemExit('latest-main Country overlay must be used by review/checks/finalize')
          if 'separateVerificationPrRequired' not in final or 'No follow-up verification PR is required' not in final:
              raise SystemExit('v2 publication must forbid the old verification-only PR')
          if 'validate_country_map_v6.py' not in checks:
              raise SystemExit('Content QA v6 map hard gate must run in the existing validation cycle')
          if 'slug="${slug%-renewal}"' not in checks:
              raise SystemExit('Country renewal PR must resolve the real Country slug, not compatibility-pass')
          # Construct the expression at runtime; Actions must not interpolate it in this test script.
          expected_ref = 'ref: ' + chr(36) + '{{ github.event.pull_request.head.sha || github.sha }}'
          if checks.count(expected_ref) < 2:
              raise SystemExit('Both PR validation and browser QA must inspect the actual Country head')
          if "needs.validate.outputs.mode == 'review'" not in checks or "github.event_name == 'pull_request'" not in checks:
              raise SystemExit('A new Country review PR must execute real targeted Browser QA')
          if '--event pull_request' not in review or 'gh run watch "$run_id"' not in review:
              raise SystemExit('Review must wait for its existing PR QA rather than silently skip checks')
          print('Pipeline v2 overlay, real PR QA and no-follow-up-PR contract PASS')
          PY
      - name: Verify new Country scaffold opt-in and legacy non-migration contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('scripts/new_country.py').read_text(encoding='utf-8')
          if '"publicationPipelineVersion":2' not in text:
              raise SystemExit('new_country.py must opt new Countries into publicationPipelineVersion:2')
          policy = Path('ops/country-production-policy.json').read_text(encoding='utf-8')
          if '"legacyCountryAutoMigration": false' not in policy:
              raise SystemExit('Policy must explicitly forbid automatic migration of legacy Countries')
          print('Publication Pipeline v2 activation contract PASS')
          PY
