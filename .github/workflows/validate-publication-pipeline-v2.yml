name: Validate Publication Pipeline v2

on:
  pull_request:
    paths:
      - 'ops/country-production-policy.json'
      - 'scripts/new_country.py'
      - 'scripts/publication_pipeline_v2.py'
      - 'docs/PUBLICATION_PIPELINE_V2.md'
      - '.github/workflows/publication-pipeline-v2-checks.yml'
      - '.github/workflows/publication-pipeline-v2-review.yml'
      - '.github/workflows/publication-pipeline-v2-finalize.yml'
      - '.github/workflows/validate-publication-pipeline-v2.yml'
  push:
    branches: ['main']
    paths:
      - 'ops/country-production-policy.json'
      - 'scripts/new_country.py'
      - 'scripts/publication_pipeline_v2.py'
      - 'docs/PUBLICATION_PIPELINE_V2.md'
      - '.github/workflows/publication-pipeline-v2-checks.yml'
      - '.github/workflows/publication-pipeline-v2-review.yml'
      - '.github/workflows/publication-pipeline-v2-finalize.yml'
      - '.github/workflows/validate-publication-pipeline-v2.yml'

permissions:
  contents: read

jobs:
  publication-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Compile Python sources
        run: |
          python3 -m py_compile scripts/new_country.py scripts/publication_pipeline_v2.py

      - name: Run Publication Pipeline v2 helper self-test
        run: python3 scripts/publication_pipeline_v2.py self-test

      - name: Validate workflow YAML parses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          files = [
              '.github/workflows/publication-pipeline-v2-checks.yml',
              '.github/workflows/publication-pipeline-v2-review.yml',
              '.github/workflows/publication-pipeline-v2-finalize.yml',
              '.github/workflows/validate-publication-pipeline-v2.yml',
          ]
          for name in files:
              payload = yaml.safe_load(Path(name).read_text(encoding='utf-8'))
              if not isinstance(payload, dict) or 'jobs' not in payload:
                  raise SystemExit(f'{name}: invalid workflow structure')
              print(f'{name}: YAML parse PASS')
          PY

      - name: Verify new Country scaffold opt-in and legacy non-migration contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('scripts/new_country.py').read_text(encoding='utf-8')
          if '"publicationPipelineVersion":2' not in text:
              raise SystemExit('new_country.py must opt new Countries into publicationPipelineVersion:2')
          policy = Path('ops/country-production-policy.json').read_text(encoding='utf-8')
          if '"legacyCountryAutoMigration": false' not in policy:
              raise SystemExit('Policy must explicitly forbid automatic migration of in-flight legacy Countries')
          print('Publication Pipeline v2 activation contract PASS')
          PY
