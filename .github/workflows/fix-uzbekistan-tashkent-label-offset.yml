name: Fix Uzbekistan Tashkent label offset
on:
  push:
    paths:
      - '.github/workflows/fix-uzbekistan-tashkent-label-offset.yml'
permissions:
  contents: write
  actions: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Uzbekistan branch
        uses: actions/checkout@v4
        with:
          ref: country/uzbekistan
          fetch-depth: 0
      - name: Move Tashkent label above-left
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          country_path = Path('data/countries/uzbekistan.json')
          data = json.loads(country_path.read_text(encoding='utf-8'))
          data['capital']['labelPosition'] = 'left'
          data['capital']['labelOffset'] = {'x': 0, 'y': -24}
          country_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          state_path = Path('ops/country-production/uzbekistan.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['stateRevision'] = int(state.get('stateRevision', 0)) + 1
          state['updatedAt'] = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          state['reviewPreview'] = {
            'mode': 'TARGETED_COUNTRY_BRANCH_PREVIEW',
            'state': 'NOT_STARTED',
            'url': 'https://yagenji.github.io/Journey-Atlas/reviews/uzbekistan/countries/uzbekistan/',
            'browserQa': 'PENDING',
            'deployedAt': None
          }
          state['next'] = {'action': 'DEPLOY_REVIEW_PREVIEW', 'asset': None}
          state_path.write_text(json.dumps(state, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          python scripts/validate_country.py data/countries/uzbekistan.json
      - name: Commit correction and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/countries/uzbekistan.json ops/country-production/uzbekistan.json
          git rm .github/workflows/fix-uzbekistan-tashkent-label-offset.yml
          git commit -m 'Offset Tashkent map label above scene markers'
          git push origin HEAD:country/uzbekistan
      - name: Dispatch corrected Country preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-country-preview.yml --ref country/uzbekistan -f slug=uzbekistan
