name: One-off St Kitts Nevis Taste approval ledger repair
on:
  push:
    branches: [country/stkittsnevis]
    paths: [.github/workflows/stkittsnevis-oneoff-taste-batch-ledger.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Repair pre-boundary approval representation then append truthful batch review ledger
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          p=Path('ops/country-production/stkittsnevis.json')
          s=json.loads(p.read_text())
          assert s['stateRevision']==21 and s['phase']=='TASTE_INITIAL'
          assert [x['id'] for x in s['taste']]==['FOOD01','FOOD02','FOOD03','FOOD04']
          f2=s['taste'][1]; f4=s['taste'][3]
          assert f2['state']=='APPROVED' and f2['approvedGenerationId']=='6eb59039-d6d8-4cba-a3fb-88f48d8a3ee0'
          assert f4['state']=='REVIEW_CANDIDATE' and f4['candidateGenerationId']=='16aac1a2-47f5-4665-b448-432dda306d30'
          assert s['generationContext']['state']=='CLEAN'
          f2['state']='REVIEW_CANDIDATE'
          f2['candidateGenerationId']=f2.pop('approvedGenerationId')
          f2['userApprovalEvidence']={'generationId':f2['candidateGenerationId'],'basis':'User explicitly approved only the FOOD02 Goat Water image; preserve acceptance until truthful batch ledger is created'}
          s['next']={'action':'BATCH_REVIEW_TASTE','asset':None}
          s['stateRevision']+=1
          s['updatedAt']=datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          p.write_text(json.dumps(s,ensure_ascii=False,separators=(',',':'))+'\n')
          print('Pre-boundary corrections staged revision',s['stateRevision'])
          PY
          python scripts/country_production_state_v7.py validate
          git add ops/country-production/stkittsnevis.json
          git commit -m 'Represent accepted Taste candidates at true initial batch boundary'
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          p=Path('ops/country-production/stkittsnevis.json')
          s=json.loads(p.read_text())
          assert s['stateRevision']==22 and s['phase']=='TASTE_INITIAL'
          assert s['next']=={'action':'BATCH_REVIEW_TASTE','asset':None}
          assert s['tasteBatchReview']=={'approval':'PENDING','rounds':[]}
          f1,f2,f3,f4=s['taste']
          assert f1['state']=='REGENERATE' and f3['state']=='REGENERATE'
          assert f2['state']=='REVIEW_CANDIDATE' and f4['state']=='REVIEW_CANDIDATE'
          approved={}
          for f in (f2,f4):
              gid=f.pop('candidateGenerationId')
              assert gid==f['userApprovalEvidence']['generationId']
              f['state']='APPROVED'
              f['approvedGenerationId']=gid
              approved[f['id']]=gid
          now=datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          s['tasteBatchReview']['rounds'].append({'round':1,'reviewBoundary':True,'scope':['FOOD01','FOOD02','FOOD03','FOOD04'],'approvedGenerations':approved,'regenerate':['FOOD01','FOOD03'],'approvedAt':now,'approvalBasis':'User explicitly approved FOOD02 and FOOD04 in separate turns; FOOD01 and FOOD03 were not approved. This first batch-boundary ledger records those decisions without inventing simultaneous approval or prior generation reservations.'})
          s['phase']='TASTE_REGEN'
          s['next']={'action':'GENERATE_FOOD','asset':'FOOD01'}
          s['stateRevision']+=1
          s['updatedAt']=now
          p.write_text(json.dumps(s,ensure_ascii=False,separators=(',',':'))+'\n')
          print('Taste boundary ledger saved revision',s['stateRevision'])
          PY
          python scripts/country_production_state_v7.py validate
          git add ops/country-production/stkittsnevis.json
          git rm .github/workflows/stkittsnevis-oneoff-taste-batch-ledger.yml
          git commit -m 'Record accepted Goat Water and conch fritters at Taste batch boundary'
          git push
