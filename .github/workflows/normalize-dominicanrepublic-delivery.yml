name: One-time Dominican Republic image delivery normalization

on:
  push:
    branches: ["country/dominicanrepublic"]
    paths:
      - ".github/workflows/normalize-dominicanrepublic-delivery.yml"

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: country/dominicanrepublic
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet "pillow>=10,<13"
      - name: Normalize only the approved Dominican Republic delivery assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import normalize_country_image_delivery as delivery
          slug = "dominicanrepublic"
          plans = delivery.build_plan([slug])
          if len(plans) != 13:
              raise SystemExit(f"Expected exactly 13 normalization plans, got {len(plans)}")
          delivery.print_plan(plans)
          delivery.apply(plans, [slug])
          errors = delivery.audit_delivery([slug])
          if errors:
              raise SystemExit("\n".join(errors))
          print("Dominican Republic delivery normalization PASS")
          PY
      - name: Commit normalized bytes and remove this one-time runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/normalize-dominicanrepublic-delivery.yml
          git add assets/images/dominicanrepublic/approved
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "Normalize Dominican Republic approved image delivery"
          git push origin HEAD:country/dominicanrepublic
