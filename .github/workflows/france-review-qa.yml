name: France review browser QA

on:
  push:
    branches:
      - country-france
    paths:
      - '.github/workflows/france-review-qa.yml'

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check France production URL
        env:
          TARGET_URL: https://atlas.yagenji.com/countries/france/
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const target = process.env.TARGET_URL;
          const viewports = [
            { name: 'desktop', width: 1440, height: 900 },
            { name: 'tablet', width: 768, height: 1024 },
            { name: 'mobile', width: 390, height: 844 },
          ];
          const expected = {
            facts: 7, signatures: 3, scenes: 8, encounters: 8,
            extras: 6, trivia: 5, seasons: 4, personas: 3, tips: 3, related: 3,
          };
          const browser = await chromium.launch({ headless: true });
          const all = [];
          let failed = false;

          for (const vp of viewports) {
            const page = await browser.newPage({ viewport: { width: vp.width, height: vp.height }, deviceScaleFactor: 1 });
            const consoleErrors = [];
            const pageErrors = [];
            const requestFailures = [];
            const badResponses = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => pageErrors.push(String(err)));
            page.on('requestfailed', req => requestFailures.push({url:req.url(), error:req.failure()?.errorText || ''}));
            page.on('response', res => { if (res.status() >= 400) badResponses.push({url:res.url(), status:res.status()}); });

            const response = await page.goto(target, { waitUntil: 'networkidle', timeout: 90000 });
            await page.waitForSelector('#country-template', { state: 'visible', timeout: 30000 });
            await page.waitForTimeout(1500);

            const data = await page.evaluate((expected) => {
              const byId = id => document.getElementById(id);
              const count = id => byId(id)?.children?.length ?? -1;
              const imgs = [...document.images];
              const failedImages = imgs.filter(i => !i.complete || i.naturalWidth === 0).map(i => i.currentSrc || i.src);
              const themeChips = [...document.querySelectorAll('#country-theme-list .country-theme-chip')].map(e => e.textContent.trim());
              const h1s = [...document.querySelectorAll('h1')];
              const headings = [...document.querySelectorAll('h1,h2,h3,h4,h5,h6')].map(h => ({level:+h.tagName.slice(1), text:h.textContent.trim()}));
              const headingJumps = [];
              for (let i=1;i<headings.length;i++) if (headings[i].level > headings[i-1].level + 1) headingJumps.push({from:headings[i-1],to:headings[i]});
              const missingAlt = imgs.filter(i => !i.hasAttribute('alt')).map(i => i.src);
              const emptyAltNonDecorative = imgs.filter(i => i.getAttribute('alt') === '' && i.getAttribute('role') !== 'presentation' && !i.hasAttribute('aria-hidden')).map(i => i.src);
              const duplicateIds = [...document.querySelectorAll('[id]')].map(e=>e.id).filter((id,i,a)=>a.indexOf(id)!==i);
              const badInteractiveNames = [...document.querySelectorAll('a,button,input,select,textarea')]
                .filter(el => {
                  const aria = (el.getAttribute('aria-label') || '').trim();
                  const text = (el.textContent || '').trim();
                  const title = (el.getAttribute('title') || '').trim();
                  const value = (el.getAttribute('value') || '').trim();
                  const alt = el.querySelector('img')?.getAttribute('alt')?.trim() || '';
                  return !aria && !text && !title && !value && !alt;
                }).map(el => el.outerHTML.slice(0,160));
              const hero = document.querySelector('.hero img, #country-template .hero img');
              const mapImg = document.querySelector('#country-map-art img');
              const sceneImgs = [...document.querySelectorAll('#scene-cards img')];
              const header = document.querySelector('header');
              const heroSection = document.querySelector('.hero, #country-template .hero');
              const headerBox = header?.getBoundingClientRect();
              const heroBox = heroSection?.getBoundingClientRect();
              const headerHeroOverlap = !!(headerBox && heroBox && headerBox.bottom > heroBox.top + 8 && headerBox.top < heroBox.bottom);
              const bodyText = document.body.innerText;
              const links = [...document.querySelectorAll('a[href]')].map(a=>a.href);
              return {
                title: document.title,
                lang: document.documentElement.lang || '',
                h1Count: h1s.length,
                h1: h1s[0]?.textContent?.trim() || '',
                headings,
                headingJumps,
                robots: document.querySelector('meta[name="robots"]')?.content || '',
                canonical: document.querySelector('link[rel="canonical"]')?.href || '',
                themeChips,
                counts: {
                  facts: count('facts'),
                  signatures: count('signature-facts'),
                  scenes: count('scene-cards'),
                  encounters: count('encounters'),
                  extras: count('atlas-extras-grid'),
                  trivia: count('travel-trivia-grid'),
                  seasons: count('seasons'),
                  personas: count('personas'),
                  tips: count('tips'),
                  related: count('related'),
                },
                updatedAreaText: bodyText.includes('日本の約1.44倍'),
                updatedBaguetteText: bodyText.includes('年間約60億本'),
                staleTgvText: bodyText.includes('最大320 km/h') || bodyText.includes('TGVの営業最高速度'),
                heroLoaded: !!hero && hero.complete && hero.naturalWidth > 0,
                heroSize: hero ? {w:hero.naturalWidth,h:hero.naturalHeight} : null,
                mapLoaded: !!mapImg && mapImg.complete && mapImg.naturalWidth > 0,
                mapSize: mapImg ? {w:mapImg.naturalWidth,h:mapImg.naturalHeight} : null,
                sceneImageCount: sceneImgs.length,
                sceneImagesLoaded: sceneImgs.filter(i => i.complete && i.naturalWidth > 0).length,
                totalImages: imgs.length,
                failedImages,
                missingAlt,
                emptyAltNonDecorative,
                duplicateIds,
                badInteractiveNames,
                scrollWidth: document.documentElement.scrollWidth,
                innerWidth: window.innerWidth,
                horizontalOverflow: document.documentElement.scrollWidth > window.innerWidth + 2,
                headerHeroOverlap,
                linksCount: links.length,
              };
            }, expected);

            const status = response?.status() || 0;
            const checks = {
              http200: status === 200,
              noindex: data.robots === 'noindex,follow',
              canonical: data.canonical === target,
              themes: JSON.stringify(data.themeChips) === JSON.stringify(['街を歩く','時をたどる','食をめぐる']),
              counts: Object.entries(expected).every(([k,v]) => data.counts[k] === v),
              updatedArea: data.updatedAreaText,
              updatedBaguette: data.updatedBaguetteText,
              noStaleTgv: !data.staleTgvText,
              heroLoaded: data.heroLoaded,
              mapLoaded: data.mapLoaded,
              scenesLoaded: data.sceneImageCount === 8 && data.sceneImagesLoaded === 8,
              noFailedImages: data.failedImages.length === 0,
              noHorizontalOverflow: !data.horizontalOverflow,
              noConsoleErrors: consoleErrors.length === 0 && pageErrors.length === 0,
              noRequestFailures: requestFailures.length === 0,
              noBadResponses: badResponses.length === 0,
              oneH1: data.h1Count === 1,
              noHeadingJumps: data.headingJumps.length === 0,
              noMissingAlt: data.missingAlt.length === 0,
              noDuplicateIds: data.duplicateIds.length === 0,
              interactiveNames: data.badInteractiveNames.length === 0,
              langSet: !!data.lang,
              franceTitle: /フランス/.test(data.title) && /FRANCE/.test(data.title),
            };
            if (Object.values(checks).some(v => !v)) failed = true;

            await page.screenshot({ path: `qa-france-${vp.name}.png`, fullPage: true });
            const result = { viewport: vp, status, checks, data, consoleErrors, pageErrors, requestFailures, badResponses };
            all.push(result);
            console.log('FRANCE_QA ' + JSON.stringify(result));
            await page.close();
          }
          await browser.close();
          fs.writeFileSync('qa-france-results.json', JSON.stringify(all, null, 2));
          if (failed) process.exit(1);
          NODE
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: france-review-browser-qa
          path: |
            qa-france-results.json
            qa-france-desktop.png
            qa-france-tablet.png
            qa-france-mobile.png
          retention-days: 3
