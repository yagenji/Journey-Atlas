name: Stage guarded Saint Lucia canonical review once
on:
  push:
    branches: [ops/manual-stlucia-review-pages-20260923]
    paths: [.github/workflows/stage-stlucia-canonical-once.yml]
permissions:
  contents: write
jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SLUG: stlucia
      SOURCE_SHA: 2817472dada5dab4680336b90aea6a58ceaaeaf5
      MAIN_SHA: 44cf916c6dfe7f1c8607e3409fda5c08f67939cb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2817472dada5dab4680336b90aea6a58ceaaeaf5
          fetch-depth: 2
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed source, unpublished registry, and immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/country/stlucia --jq '.object.sha')" = "$SOURCE_SHA"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq '.object.sha')" = "$MAIN_SHA"
          test "$(gh run view 35794706466 --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')" = success
          git fetch --no-tags origin 4d9ea990fd252ffbef376d8b75820e55c39cd76b
          git diff --quiet 4d9ea990fd252ffbef376d8b75820e55c39cd76b "$SOURCE_SHA" -- "assets/images/$SLUG"
          python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('ops/country-production/stlucia.json').read_text())
          assert state['phase']=='QA'
          assert state['reviewPreview']['state']=='DONE' and state['reviewPreview']['browserQa']=='PASS'
          assert state['reviewPreview']['sourceCommit']=='4d9ea990fd252ffbef376d8b75820e55c39cd76b'
          assert state['finalApproval']['state']=='PENDING' and state['publication']['atlasPublished'] is False
          PY
          echo 'Checking canonical host response without changing its deployment:'
          curl --fail --silent --show-error --location --max-time 15 https://atlas.yagenji.com/build-meta.json -o /tmp/canonical-host-meta.json || true
          if [ -s /tmp/canonical-host-meta.json ]; then head -c 300 /tmp/canonical-host-meta.json; echo; else echo 'Canonical host not accessible from this runner; deployment must remain unverified.'; fi
      - name: Rebuild only approved Country overlay on pinned main and prepare canonical noindex State
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/country_overlay_v2.py capture "$SLUG" /tmp/stlucia-canonical-overlay
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          git reset --hard origin/main
          python3 scripts/country_overlay_v2.py apply "$SLUG" /tmp/stlucia-canonical-overlay
          python3 scripts/canonical_review_v2.py prepare "$SLUG"
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 scripts/validate_country.py --strict data/countries/stlucia.json
          python3 scripts/validate_country_quality_v5.py --force data/countries/stlucia.json
          python3 scripts/validate_country_map_v6.py data/countries/stlucia.json
          python3 scripts/audit_country_image_delivery_targeted.py --slug stlucia
          python3 scripts/validate_images.py --mode audit --slug stlucia
          python3 scripts/validate_production_state_routed.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          country=json.loads(Path('data/countries/stlucia.json').read_text())
          state=json.loads(Path('ops/country-production/stlucia.json').read_text())
          registry=json.loads(Path('data/atlas-destinations.json').read_text())
          assert country['slug']=='stlucia'
          assert state['reviewDeployment']['state']=='DEPLOYING'
          assert state['reviewDeployment']['url']=='https://atlas.yagenji.com/countries/stlucia/'
          assert state['finalApproval']['state']=='PENDING' and state['publication']['atlasPublished'] is False
          assert next(x for x in registry['destinations'] if x['slug']=='stlucia')['atlasPublished'] is False
          PY
          cp data/countries/stlucia.json /tmp/stlucia-canonical-country.json
          cp ops/country-production/stlucia.json /tmp/stlucia-canonical-state.json
          git reset --hard
          git fetch --no-tags --depth=1 origin +refs/heads/ops/manual-stlucia-review-pages-20260923:refs/remotes/origin/ops/manual-stlucia-review-pages-20260923
          git checkout -B ops/manual-stlucia-review-pages-20260923 origin/ops/manual-stlucia-review-pages-20260923
          mkdir -p ops/manual-review-staging
          cp /tmp/stlucia-canonical-country.json ops/manual-review-staging/stlucia-canonical-country.json
          cp /tmp/stlucia-canonical-state.json ops/manual-review-staging/stlucia-canonical-state.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/manual-review-staging/stlucia-canonical-*.json
          git commit -m 'Stage guarded Saint Lucia canonical review data for connected-account commit'
          git push origin HEAD:ops/manual-stlucia-review-pages-20260923
          echo 'Staged canonical noindex State and Country; Country PR and main were not changed.' >> "$GITHUB_STEP_SUMMARY"