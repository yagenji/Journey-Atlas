name: Audit Country icon integrity

on:
  pull_request:
    paths:
      - "data/countries/**"
      - "assets/icons/atlas-icons.svg"
      - "assets/js/app.js"
      - "scripts/audit_icons.py"
      - ".github/workflows/audit-icons.yml"
  # The PR check remains the gate. Publication v2 and canonical review also
  # audit icons before integration; repeat audits on every main merge add
  # Actions runs without an additional pre-merge safety check.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Country icon integrity
        run: python3 scripts/audit_icons.py
