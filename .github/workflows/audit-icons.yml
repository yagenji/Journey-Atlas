name: Audit Country icon integrity

on:
  pull_request:
    paths:
      - "data/countries/**"
      - "assets/icons/atlas-icons.svg"
      - "assets/js/app.js"
      - "scripts/audit_icons.py"
      - ".github/workflows/audit-icons.yml"
  push:
    branches: ["main"]
    paths:
      - "data/countries/**"
      - "assets/icons/atlas-icons.svg"
      - "assets/js/app.js"
      - "scripts/audit_icons.py"
      - ".github/workflows/audit-icons.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Country icon integrity
        run: python scripts/audit_icons.py
