name: St Kitts Nevis temporary previsual QA
on:
  push:
    branches:
      - country/stkittsnevis
    paths:
      - data/countries/stkittsnevis.json
      - assets/images/stkittsnevis/map-atlas-v1.svg
      - .github/workflows/stkittsnevis-content-map-preflight.yml
permissions:
  contents: read
jobs:
  target-content-map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install map QA dependencies only
        run: python -m pip install --disable-pip-version-check --quiet 'shapely>=2,<3' 'cairosvg>=2.7,<3' 'pillow>=10,<13'
      - name: Verify country editorial v6 and map coordinates
        run: |
          python3 scripts/validate_country_editorial_v2.py data/countries/stkittsnevis.json
          python3 scripts/validate_country_quality_v5.py data/countries/stkittsnevis.json
          python3 scripts/validate_country_map_v6.py data/countries/stkittsnevis.json
          python3 - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from xml.etree import ElementTree as ET
          import cairosvg
          from PIL import Image
          p=Path('assets/images/stkittsnevis/map-atlas-v1.svg')
          root=ET.fromstring(p.read_bytes())
          assert root.get('viewBox') == '0 0 1200 760'
          assert root.find(".//*[@id='geographic-context']") is not None
          raster=cairosvg.svg2png(bytestring=p.read_bytes(),output_width=1200,output_height=760)
          with Image.open(BytesIO(raster)) as image:
              image.load()
              assert image.size == (1200,760)
          print('St Kitts Nevis map: SVG XML, real geographic context and full 1200x760 decode PASS')
          PY
