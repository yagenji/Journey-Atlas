name: France final production QA
on:
  push:
    branches: [country-france]
    paths: ['.github/workflows/france-final-publish-qa.yml']
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify published France
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const viewports=[
            {name:'desktop',width:1440,height:900},
            {name:'tablet',width:768,height:1024},
            {name:'mobile',width:390,height:844},
          ];
          let failed=false;
          for (const vp of viewports) {
            const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
            const consoleErrors=[],pageErrors=[],requestFailures=[],badResponses=[];
            page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>requestFailures.push(r.url()));
            page.on('response',r=>{if(r.status()>=400) badResponses.push({url:r.url(),status:r.status()})});
            const res=await page.goto('https://atlas.yagenji.com/countries/france/',{waitUntil:'networkidle',timeout:90000});
            await page.waitForSelector('#app .country-page',{state:'visible',timeout:30000});
            await page.waitForFunction(()=>document.querySelectorAll('#scene-cards .scene-card').length===8,null,{timeout:30000});
            const h=await page.evaluate(()=>document.documentElement.scrollHeight);
            for(let y=0;y<h;y+=650){await page.evaluate(y=>scrollTo(0,y),y);await page.waitForTimeout(60);}
            await page.evaluate(()=>scrollTo(0,0)); await page.waitForTimeout(700);

            const data=await page.evaluate(()=>{
              const bgLoaded=el=>!!el && el.classList.contains('has-image') && getComputedStyle(el).backgroundImage!=='none';
              const markerEls=[...document.querySelectorAll('#map-markers .map-marker,#map-markers .map-hero-marker,#map-markers .map-capital-marker')];
              const rects=markerEls.map(el=>{const r=el.getBoundingClientRect();return {label:(el.textContent||el.getAttribute('aria-label')||'').trim(),l:r.left,r:r.right,t:r.top,b:r.bottom,w:r.width,h:r.height}}).filter(x=>x.w&&x.h);
              const overlaps=[];
              for(let i=0;i<rects.length;i++)for(let j=i+1;j<rects.length;j++){const a=rects[i],b=rects[j];if(!(a.r<=b.l||b.r<=a.l||a.b<=b.t||b.b<=a.t))overlaps.push([a.label,b.label]);}
              const imgs=[...document.images];
              return {
                robots:document.querySelector('meta[name="robots"]')?.content||'',
                canonical:document.querySelector('link[rel="canonical"]')?.href||'',
                themes:[...document.querySelectorAll('#country-theme-list .country-theme-chip')].map(x=>x.textContent.trim()),
                scenes:document.querySelectorAll('#scene-cards .scene-card').length,
                sceneImages:[...document.querySelectorAll('#scene-cards .scene-image')].filter(bgLoaded).length,
                hero:bgLoaded(document.querySelector('.hero-art')),
                mapLoaded:!!document.querySelector('#country-map-art .map-base')?.naturalWidth,
                markerCount:rects.length,
                overlaps,
                overflow:document.documentElement.scrollWidth>innerWidth+2,
                failedImages:imgs.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.src),
                text:document.body.innerText
              };
            });
            const checks={
              http200:res?.status()===200,
              indexFollow:data.robots==='index,follow',
              canonical:data.canonical==='https://atlas.yagenji.com/countries/france/',
              themes:JSON.stringify(data.themes)===JSON.stringify(['街を歩く','時をたどる','食をめぐる']),
              scenes:data.scenes===8&&data.sceneImages===8,
              hero:data.hero,
              map:data.mapLoaded,
              markers:data.markerCount>=9&&data.overlaps.length===0,
              noOverflow:!data.overflow,
              noImageFailures:data.failedImages.length===0,
              noConsoleErrors:consoleErrors.length===0&&pageErrors.length===0,
              noRequestFailures:requestFailures.length===0,
              noBadResponses:badResponses.length===0,
              updatedCopy:data.text.includes('職人は「Tour de France」で技を受け継ぐ')&&data.text.includes('ヨーロッパの外にもフランスが続いている')
            };
            if(Object.values(checks).some(v=>!v)) failed=true;
            console.log('FRANCE_PUBLISH_QA='+JSON.stringify({vp,status:res?.status(),checks,data,consoleErrors,pageErrors,requestFailures,badResponses}));
            await page.screenshot({path:`france-published-${vp.name}.png`,fullPage:true});
            await page.close();
          }

          const page=await browser.newPage();
          const [homeRes,siteRes]=await Promise.all([
            page.goto('https://atlas.yagenji.com/',{waitUntil:'networkidle',timeout:90000}),
            fetch('https://atlas.yagenji.com/sitemap.xml',{cache:'no-store'})
          ]);
          const home=await page.content();
          const sitemap=await siteRes.text();
          const navigation={
            home200:homeRes?.status()===200,
            topLinksFrance:home.includes('countries/france/'),
            sitemapFrance:sitemap.includes('https://atlas.yagenji.com/countries/france/')
          };
          console.log('FRANCE_PUBLISH_NAV='+JSON.stringify(navigation));
          if(Object.values(navigation).some(v=>!v)) failed=true;
          await page.close();
          await browser.close();
          if(failed) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: france-final-publish-qa
          path: france-published-*.png
          retention-days: 3
