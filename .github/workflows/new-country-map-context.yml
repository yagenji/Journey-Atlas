name: New Country geographic context preflight

on:
  pull_request:
    paths:
      - 'scripts/add_country_map_context.py'
      - 'scripts/generate_country_map_with_context.py'
      - 'tests/test_add_country_map_context.py'
      - 'tests/test_generate_country_map_with_context.py'
      - '.github/workflows/new-country-map-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  new-country-map-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geographic preview dependencies
        run: python -m pip install --disable-pip-version-check --quiet 'basemap==2.0.0' 'shapely>=2,<3' 'cairosvg>=2.7,<3' 'pillow>=10,<13'
      - name: Check isolated new-Country wrapper and shared context
        run: |
          python -m py_compile scripts/add_country_map_context.py scripts/generate_country_map_with_context.py
          python -m unittest discover -s tests -p 'test_add_country_map_context.py' -v
          python -m unittest discover -s tests -p 'test_generate_country_map_with_context.py' -v
      - name: Render existing Iceland reference without writing approved assets
        run: |
          python scripts/add_country_map_context.py \
            --country-json data/countries/iceland.json \
            --input assets/images/iceland/map-atlas-v2.svg \
            --output /tmp/new-country-map-context-smoke.svg
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import cairosvg
          from PIL import Image
          source = Path('assets/images/iceland/map-atlas-v2.svg')
          preview = Path('/tmp/new-country-map-context-smoke.svg')
          ns = '{http://www.w3.org/2000/svg}'
          before = [dict(node.attrib) for node in ET.fromstring(source.read_bytes()).iter(ns + 'path')]
          root = ET.fromstring(preview.read_bytes())
          context = next(node for node in root.iter(ns + 'g') if node.get('id') == 'geographic-context')
          context_nodes = {id(node) for node in context.iter(ns + 'path')}
          after = [dict(node.attrib) for node in root.iter(ns + 'path') if id(node) not in context_nodes]
          assert before == after, 'Existing country paths changed'
          png = cairosvg.svg2png(bytestring=preview.read_bytes(), output_width=1200, output_height=760)
          image = Image.open(BytesIO(png))
          image.load()
          assert image.size == (1200, 760)
          assert source.exists() and preview.exists()
          print('Iceland source paths preserved; 1200x760 context preview fully decoded')
          PY
