name: New Country geographic context preflight

on:
  pull_request:
    paths:
      - 'scripts/add_country_map_context.py'
      - 'scripts/add_country_border_context.py'
      - 'scripts/generate_country_map_with_context.py'
      - 'tests/test_add_country_map_context.py'
      - 'tests/test_add_country_border_context.py'
      - 'tests/test_generate_country_map_with_context.py'
      - '.github/workflows/new-country-map-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  new-country-map-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geographic preview dependencies
        run: python -m pip install --disable-pip-version-check --quiet 'basemap==2.0.0' 'shapely>=2,<3' 'cairosvg>=2.7,<3' 'pillow>=10,<13'
      - name: Check isolated new-Country wrapper and shared context
        run: |
          python -m py_compile scripts/add_country_map_context.py scripts/add_country_border_context.py scripts/generate_country_map_with_context.py
          python -m unittest discover -s tests -p 'test_add_country_map_context.py' -v
          python -m unittest discover -s tests -p 'test_add_country_border_context.py' -v
          python -m unittest discover -s tests -p 'test_generate_country_map_with_context.py' -v
      - name: Render existing Iceland reference without writing approved assets
        run: |
          source=assets/images/iceland/map-atlas-v2.svg
          preview=/tmp/new-country-map-context-smoke.svg
          if grep -q 'id="geographic-context"' "$source"; then
            cp "$source" "$preview"
          else
            python scripts/add_country_map_context.py \
              --country-json data/countries/iceland.json \
              --input "$source" \
              --output "$preview"
          fi
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import cairosvg
          from PIL import Image
          source = Path('assets/images/iceland/map-atlas-v2.svg')
          preview = Path('/tmp/new-country-map-context-smoke.svg')
          ns = '{http://www.w3.org/2000/svg}'

          def protected_paths(path):
              root = ET.fromstring(path.read_bytes())
              generated = set()
              for group in root.iter(ns + 'g'):
                  if group.get('id') in {'geographic-context', 'context-national-borders'}:
                      generated.update(id(node) for node in group.iter(ns + 'path'))
              return [dict(node.attrib) for node in root.iter(ns + 'path') if id(node) not in generated]

          assert protected_paths(source) == protected_paths(preview), 'Existing country paths changed'
          png = cairosvg.svg2png(bytestring=preview.read_bytes(), output_width=1200, output_height=760)
          image = Image.open(BytesIO(png))
          image.load()
          assert image.size == (1200, 760)
          assert source.exists() and preview.exists()
          print('Iceland protected paths preserved; 1200x760 context preview fully decoded')
          PY
