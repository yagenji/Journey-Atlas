name: Apply remaining Antigua Japanese copy
on:
  push:
    branches: ['country/antiguabarbuda-renewal']
    paths: ['.github/workflows/one-time-antigua-apply-20260917.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: country/antiguabarbuda-renewal
          persist-credentials: true
      - name: Localize checked visible text and clean one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('data/countries/antiguabarbuda.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['slug']=='antiguabarbuda' and d.get('atlasPublished',False) is False
          assert d['hero']['location']=='Shirley Heights Lookout / English Harbour'
          d['hero']['location']='シャーリー・ハイツ展望台／イングリッシュ・ハーバー'
          assert 'Devil’s Bridge' in d['travelScale']['items'][0]['text']
          d['travelScale']['items'][0]['text']=d['travelScale']['items'][0]['text'].replace('Devil’s Bridge','デビルズ・ブリッジ')
          assert 'Wallings' in d['travelScale']['items'][1]['text']
          d['travelScale']['items'][1]['text']=d['travelScale']['items'][1]['text'].replace('Wallings','ウォーリングス自然保護区')
          for root in ('hero','scenes','atlasExtras','travelTrivia','taste','travelScale','seasons','transport','personas','signatureFacts','tips','relatedCountries'):
            def audit(obj,path=''):
              if isinstance(obj,dict):
                for key,v in obj.items():
                  if key in {'nameLocal','mapLabel','nameEn','themeEn','categoryEn','topicKey','sourceKey','image','imageState','mapRegion','id','icon','color','slug','flag','affinityType','coordinates','mapOffset','source','sources'}:continue
                  if key in {'lead','description','text','intro','reason','note','interestReason','location'} and isinstance(v,str) and re.search('[A-Za-z]{2,}',v):raise AssertionError((root,path+'.'+key,v))
                  if isinstance(v,(list,dict)):audit(v,path+'.'+key)
              elif isinstance(obj,list):
                for i,v in enumerate(obj):audit(v,path+f'[{i}]')
            audit(d[root])
          assert d['facts'][3]['value']=='442.6 km²（日本の約0.12％）'
          p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print('PASS: Japanese story fields and Japan area ratio')
          PY
          git rm .github/workflows/one-time-antigua-apply-20260917.yml .github/workflows/one-time-antigua-language-audit-20260917.yml
          git add data/countries/antiguabarbuda.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Localize remaining Antigua Hero and itinerary text'
          git push origin HEAD:refs/heads/country/antiguabarbuda-renewal