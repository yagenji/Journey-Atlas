name: One-off St Kitts Nevis delivered QA
on:
  push:
    branches: [country/stkittsnevis]
    paths: [.github/workflows/stkittsnevis-once-delivered-qa.yml]
permissions:
  contents: write
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install target dependencies
        run: python -m pip install --disable-pip-version-check --quiet pillow selenium
      - name: Audit exact delivered assets and Country state
        shell: bash
        run: |
          set +e
          failed=0
          for command in \
            'python scripts/validate_country_editorial_v2.py data/countries/stkittsnevis.json' \
            'python scripts/validate_country.py --strict data/countries/stkittsnevis.json' \
            'python scripts/audit_country_image_delivery_targeted.py --slug stkittsnevis' \
            'python scripts/validate_images.py --mode audit --slug stkittsnevis' \
            'python scripts/validate_images.py --duplicates-only --slug stkittsnevis' \
            'python scripts/country_production_state_v7.py validate'; do
            echo "::group::$command"
            bash -c "$command"; code=$?
            echo "TARGET_CHECK status=$code command=$command"
            echo '::endgroup::'
            if [ "$code" -ne 0 ]; then failed=1; fi
          done
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('ops/country-production/stkittsnevis.json').read_text())
          c=json.loads(Path('data/countries/stkittsnevis.json').read_text())
          r=json.loads(Path('data/atlas-destinations.json').read_text())
          print('STATE_SUMMARY',json.dumps({'phase':s['phase'],'next':s['next'],'stateRevision':s['stateRevision'],'taste':[{'id':x['id'],'state':x['state'],'approvalEvidence':x.get('userApprovalEvidence'),'candidateGenerationId':x.get('candidateGenerationId')} for x in s['taste']],'assetHandoff':s.get('assetHandoff'),'qa':s.get('qa'),'finalApproval':s.get('finalApproval')},ensure_ascii=False))
          print('COUNTRY_FOOD_SOURCE_ASPECT',[x.get('imageFraming') for x in c.get('taste',[])])
          print('REGISTRY_DESTINATION',next((x for x in r['destinations'] if x.get('slug')=='stkittsnevis'),None))
          PY
          exit "$failed"
      - name: Build and exercise full target page in desktop tablet mobile
        if: always()
        shell: bash
        env:
          TARGET_SLUGS: stkittsnevis
          JOURNEY_ATLAS_SITE_URL: http://127.0.0.1:4173/
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-stkittsnevis-delivered
          QA_SCOPE: unpublished-reviewable
          QA_SLUGS: stkittsnevis
        run: |
          set -euo pipefail
          python scripts/build_country_preview_targeted.py
          python -m http.server 4173 --directory dist >/tmp/stkittsnevis-delivered-qa.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:4173/countries/stkittsnevis/ >/dev/null; then break; fi
            sleep 1
          done
          python scripts/qa_published_browser.py
      - name: Upload narrow QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stkittsnevis-delivered-target-qa
          path: qa-stkittsnevis-delivered/
          if-no-files-found: ignore
          retention-days: 5
      - name: Remove temporary QA workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch .github/workflows/stkittsnevis-once-delivered-qa.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-off St Kitts Nevis delivered QA workflow'
            git push
          fi
