name: Fix Uzbekistan travel scale

on:
  push:
    branches:
      - country/uzbekistan
    paths:
      - .github/workflows/fix-uzbekistan-travel-scale.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Uzbekistan branch
        uses: actions/checkout@v4
        with:
          ref: country/uzbekistan
          fetch-depth: 0

      - name: Update continuous travel day ranges
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path('data/countries/uzbekistan.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          items = data['travelScale']['items']

          items[0] = {
              'duration': '3〜4日',
              'title': 'サマルカンドとブハラで、二つのオアシス都市を見る',
              'text': '高速鉄道を軸に、レギスタンの大きな王朝建築と、街路の中に宗教建築が続くブハラを比較する。初回の短い旅なら都市を増やしすぎず、違いを歩いて見る構成にしやすい。例：タシケント → サマルカンド → ブハラ。',
              'icon': 'city',
          }
          items[1] = {
              'duration': '5〜7日',
              'title': 'サマルカンド、ブハラ、ヒヴァを一本の軸でつなぐ',
              'text': '三つの歴史都市を主軸に、タシケントを発着点として組み込む。建築の色だけでなく、都市の大きさ、街路、砂漠を挟んだ距離感まで見えてくる。例：タシケント → サマルカンド → ブハラ → ヒヴァ。',
              'icon': 'map',
          }
          items[2] = {
              'duration': '8日以上',
              'title': '古都から、興味に合わせて別地域へ広げる',
              'text': '三つの古都を軸に、フェルガナの工芸、チャルヴァクの山地、ムイナクとアラル海などから、日数と関心に合わせて地域を追加する。すべてを一度に詰め込まず、移動距離を見ながら一地域ずつ広げる。例：三古都＋フェルガナ、または三古都＋ヌクス・ムイナク。',
              'icon': 'compass',
          }

          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

      - name: Validate Uzbekistan content
        run: |
          python3 scripts/validate_country_editorial_v2.py data/countries/uzbekistan.json

      - name: Remove one-time workflow
        run: rm .github/workflows/fix-uzbekistan-travel-scale.yml

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/countries/uzbekistan.json .github/workflows/fix-uzbekistan-travel-scale.yml
          git commit -m "Fix Uzbekistan travel scale continuity"
          git push origin HEAD:country/uzbekistan
