name: Saint Lucia marker spacing one-shot

on:
  push:
    branches: [country/stlucia-map-zoom-review-20260923]
    paths: [.github/workflows/stlucia-marker-spacing-once.yml]

permissions:
  contents: write

jobs:
  spacing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: country/stlucia-map-zoom-review-20260923
      - name: Install geometry checker
        run: python3 -m pip install --disable-pip-version-check shapely
      - name: Solve strict five-percent, 71px, inland, hero-safe constraints
        run: |
          python3 - <<'PY'
          import json, math, re, time
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from shapely.geometry import Point,Polygon
          from shapely.ops import unary_union
          from shapely.affinity import affine_transform

          json_path=Path('data/countries/stlucia.json')
          svg_path=Path('assets/images/stlucia/map-atlas-v1.svg')
          data=json.loads(json_path.read_text(encoding='utf-8'))
          b=data['map']['bounds']
          assert b=={'north':14.16,'south':13.68,'west':-61.19,'east':-60.79}
          NS='{http://www.w3.org/2000/svg}'
          root=ET.fromstring(svg_path.read_text(encoding='utf-8'))
          group=next(c for c in root if c.attrib.get('id')=='map-geography-zoom')
          transform=list(map(float,re.findall(r'-?\d+(?:\.\d+)?',group.attrib['transform'])))
          assert len(transform)==6
          target=next(c for c in group if c.tag==NS+'path')
          polygons=[]
          for part in re.findall(r'M\s*([^Z]+)Z',target.attrib['d']):
              points=[(float(x),float(y)) for x,y in re.findall(r'(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)',part)]
              if len(points)>2:polygons.append(Polygon(points))
          assert polygons and all(p.is_valid for p in polygons)
          land=affine_transform(unary_union(polygons),transform).buffer(-14)
          assert not land.is_empty
          c=math.cos(math.radians((b['north']+b['south'])/2))
          s=min(1200/((b['east']-b['west'])*c),760/(b['north']-b['south']))
          ox=(1200-(b['east']-b['west'])*c*s)/2
          oy=(760-(b['north']-b['south'])*s)/2
          def geo(coords):return ox+(coords['longitude']-b['west'])*c*s,oy+(b['north']-coords['latitude'])*s
          def shown(item):
              x,y=geo(item['coordinates']);o=item.get('mapOffset') or {}
              return x+12*float(o.get('x',0)),y+7.6*float(o.get('y',0))
          scenes=data['scenes']
          fixed=[shown(data['capital'])]+[shown(scenes[i]) for i in (0,1,7)]
          hero=shown(data['hero'])
          assert all(land.contains(Point(x,y)) for x,y in fixed)
          assert all(math.hypot(x-x2,y-y2)>=71 for i,(x,y) in enumerate(fixed) for x2,y2 in fixed[i+1:])
          ids=(2,3,4,5,6)
          candidate=[];costs=[]
          for idx in ids:
              gx,gy=geo(scenes[idx]['coordinates'])
              options=[]
              # Offset contract is Euclidean 5%, not per-axis 5%.
              for dx in range(-60,61,5):
                  for dy in range(-38,39,4):
                      if (dx/12)**2+(dy/7.6)**2>4.95**2:continue
                      x,y=gx+dx,gy+dy
                      if not land.contains(Point(x,y)):continue
                      if math.hypot(x-hero[0],y-hero[1])<64.5:continue
                      if any(math.hypot(x-fx,y-fy)<71.5 for fx,fy in fixed):continue
                      options.append((x,y,dx*dx+dy*dy))
              options.sort(key=lambda a:(a[2],a[0],a[1]))
              print('candidate count',idx+1,len(options),flush=True)
              assert options, f'no feasible location for Scene {idx+1}'
              candidate.append(options)
          compatibility={}
          for i in range(5):
              for j in range(5):
                  if i==j:continue
                  compatibility[i,j]=[]
                  for x,y,_ in candidate[i]:
                      mask=0
                      for k,(xx,yy,_) in enumerate(candidate[j]):
                          if math.hypot(x-xx,y-yy)>=71.5:mask|=1<<k
                      compatibility[i,j].append(mask)
          initial=[(1<<len(x))-1 for x in candidate]
          nodes=[0];start=time.monotonic()
          def solve(domains,assigned):
              nodes[0]+=1
              if nodes[0]>260000 or time.monotonic()-start>42:
                  return None
              if len(assigned)==5:return assigned
              remaining=[i for i in range(5) if i not in assigned]
              i=min(remaining,key=lambda q:domains[q].bit_count())
              m=domains[i]
              while m:
                  low=m & -m;idx=low.bit_length()-1;m-=low
                  nxt=domains[:];nxt[i]=low
                  good=True
                  for j in remaining:
                      if i==j:continue
                      nxt[j]&=compatibility[i,j][idx]
                      if not nxt[j]:good=False;break
                  if good:
                      ans=solve(nxt,{**assigned,i:idx})
                      if ans is not None:return ans
              return None
          solution=solve(initial,{})
          print('search nodes',nodes[0], 'seconds',round(time.monotonic()-start,1),flush=True)
          assert solution is not None,'No feasible all-on-land 71px layout within 5% offsets; do not bypass map hard gates'
          final=[shown(s) for s in scenes]
          leaders=[]
          for i,k in solution.items():
              x,y,_=candidate[i][k]
              scene_index=ids[i]
              gx,gy=geo(scenes[scene_index]['coordinates'])
              scenes[scene_index]['mapOffset']={'x':round((x-gx)/12,4),'y':round((y-gy)/7.6,4)}
              final[scene_index]=(x,y)
              if math.hypot(x-gx,y-gy)>52:
                  leaders.append((gx,gy,x,y))
              print('Scene',scene_index+1,'badge',round(x,1),round(y,1),'offset_percent',scenes[scene_index]['mapOffset'],flush=True)
          assert all(land.contains(Point(x,y)) for x,y in final)
          assert all(math.hypot(x-x2,y-y2)>=71.3 for k,(x,y) in enumerate(final) for x2,y2 in final[k+1:])
          assert all(math.hypot(x-fx,y-fy)>=71.3 for x,y in final for fx,fy in fixed[:1])
          assert all(math.hypot(x-hero[0],y-hero[1])>=64.3 for x,y in final)
          guide=ET.Element(NS+'g',{'id':'map-marker-leaders','fill':'none','stroke':'#31576a','stroke-width':'1.1','stroke-dasharray':'3 3','stroke-linecap':'round','opacity':'0.65'})
          for gx,gy,x,y in leaders:
              ET.SubElement(guide,NS+'line',{'x1':f'{gx:.2f}','y1':f'{gy:.2f}','x2':f'{x:.2f}','y2':f'{y:.2f}'})
          if leaders:root.append(guide)
          data['map']['source']+=' User-requested marker repositioning keeps all eight numbered markers on actual land, at least 71px apart and within the validated 5% visual-offset contract; real coordinates unchanged.'
          ET.register_namespace('','http://www.w3.org/2000/svg')
          svg_path.write_text(ET.tostring(root,encoding='unicode')+'\n',encoding='utf-8')
          json_path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY
          python3 scripts/validate_country.py --strict data/countries/stlucia.json
      - name: Commit revised Country map and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stlucia-marker-spacing-once.yml
          git add data/countries/stlucia.json assets/images/stlucia/map-atlas-v1.svg
          git commit -m 'Fit Saint Lucia inland badges to strict 71px/5% map contract'
          git push origin HEAD:country/stlucia-map-zoom-review-20260923
