name: Saint Lucia southwest map inset one-shot

on:
  push:
    branches: [country/stlucia-map-zoom-review-20260923]
    paths: [.github/workflows/stlucia-marker-spacing-once.yml]

permissions:
  contents: write

jobs:
  inset:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: country/stlucia-map-zoom-review-20260923
      - name: Install geometry checker
        run: python3 -m pip install --disable-pip-version-check shapely
      - name: Build southwest detail using the existing coast and validated projection
        run: |
          python3 - <<'PY'
          import json, math, re, time, copy
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from shapely.geometry import Point,Polygon,box
          from shapely.ops import unary_union
          from shapely.affinity import affine_transform

          jp=Path('data/countries/stlucia.json')
          sp=Path('assets/images/stlucia/map-atlas-v1.svg')
          d=json.loads(jp.read_text(encoding='utf-8'))
          main=d['map']['bounds']
          assert main=={'north':14.16,'south':13.68,'west':-61.19,'east':-60.79}
          old={'north':14.45,'south':13.55,'west':-61.25,'east':-60.7}
          detail={'north':13.89,'south':13.815,'west':-61.095,'east':-60.992}
          rect={'x':820,'y':168,'width':365,'height':522}
          assert not d['map'].get('regions')
          NS='{http://www.w3.org/2000/svg}'
          root=ET.fromstring(sp.read_text(encoding='utf-8'))
          assert root.attrib['viewBox']=='0 0 1200 760'
          main_group=next(e for e in root if e.attrib.get('id')=='map-geography-zoom')
          target=next(e for e in main_group if e.tag==NS+'path')
          rings=[]
          for part in re.findall(r'M\s*([^Z]+)Z',target.attrib['d']):
              pts=[(float(x),float(y)) for x,y in re.findall(r'(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)',part)]
              if len(pts)>2:rings.append(Polygon(pts))
          assert rings and all(p.is_valid for p in rings)
          country=unary_union(rings)
          def fit(bounds,canvas):
              c=math.cos(math.radians((bounds['north']+bounds['south'])/2))
              scale=min(canvas['width']/((bounds['east']-bounds['west'])*c),canvas['height']/(bounds['north']-bounds['south']))
              ox=canvas['x']+(canvas['width']-(bounds['east']-bounds['west'])*c*scale)/2
              oy=canvas['y']+(canvas['height']-(bounds['north']-bounds['south'])*scale)/2
              return c,scale,ox,oy
          c0,s0,x0,y0=fit(old,{'x':0,'y':0,'width':1200,'height':760})
          c,s,ox,oy=fit(detail,rect)
          sx=s*c/(s0*c0);sy=s/s0
          tx=ox+(old['west']-detail['west'])*s*c-sx*x0
          ty=oy+(detail['north']-old['north'])*s-sy*y0
          inset_transform=[sx,0,0,sy,tx,ty]
          land=affine_transform(country,inset_transform)
          safe=land.buffer(-14).intersection(box(rect['x']+18,rect['y']+18,rect['x']+rect['width']-18,rect['y']+rect['height']-18))
          assert not safe.is_empty
          def project(q):
              return (ox+(q['longitude']-detail['west'])*c*s,oy+(detail['north']-q['latitude'])*s)
          scenes=d['scenes'];ids=(2,3,4,5,6)
          fixed=[]
          def main_project(q,o):
              mc,ms,mx,my=fit(main,{'x':0,'y':0,'width':1200,'height':760})
              return mx+(q['longitude']-main['west'])*mc*ms+12*o.get('x',0),my+(main['north']-q['latitude'])*ms+7.6*o.get('y',0)
          for item in [d['capital'],d['hero'],scenes[0],scenes[1],scenes[7]]:
              fixed.append(main_project(item['coordinates'],item.get('mapOffset') or {}))
          candidates=[]
          for idx in ids:
              item=scenes[idx];gx,gy=project(item['coordinates'])
              assert detail['south']<=item['coordinates']['latitude']<=detail['north']
              assert detail['west']<=item['coordinates']['longitude']<=detail['east']
              opts=[]
              for dx in range(-60,61,4):
                  for dy in range(-38,39,3):
                      if math.hypot(dx/12,dy/7.6)>4.85:continue
                      x,y=gx+dx,gy+dy
                      if not safe.contains(Point(x,y)):continue
                      if any(math.hypot(x-fx,y-fy)<75 for fx,fy in fixed):continue
                      opts.append((x,y,dx*dx+dy*dy))
              opts.sort(key=lambda a:(a[2],a[0],a[1]))
              print('Scene',idx+1,'legal inset positions',len(opts),flush=True)
              assert opts,'detail region too small; no legal inland badge'
              candidates.append(opts)
          compat={}
          for i in range(5):
              for j in range(5):
                  if i==j:continue
                  rows=[]
                  for x,y,_ in candidates[i]:
                      mask=0
                      for k,(xx,yy,_) in enumerate(candidates[j]):
                          if math.hypot(x-xx,y-yy)>=75:mask|=1<<k
                      rows.append(mask)
                  compat[i,j]=rows
          domains=[(1<<len(opts))-1 for opts in candidates]
          count=[0];start=time.monotonic()
          def solve(domains,assigned):
              count[0]+=1
              if count[0]>500000 or time.monotonic()-start>42:return None
              if len(assigned)==5:return assigned
              free=[i for i in range(5) if i not in assigned]
              i=min(free,key=lambda t:domains[t].bit_count())
              options=domains[i]
              while options:
                  bit=options & -options; k=bit.bit_length()-1;options-=bit
                  next_domains=domains[:];next_domains[i]=bit;valid=True
                  for j in free:
                      if j==i:continue
                      next_domains[j]&=compat[i,j][k]
                      if not next_domains[j]:valid=False;break
                  if valid:
                      solution=solve(next_domains,{**assigned,i:k})
                      if solution is not None:return solution
              return None
          chosen=solve(domains,{})
          print('search nodes',count[0],'seconds',round(time.monotonic()-start,2),flush=True)
          assert chosen is not None,'Cannot achieve safe inset placement; no forced pass'
          for n,idx in enumerate(ids):
              x,y,_=candidates[n][chosen[n]]
              gx,gy=project(scenes[idx]['coordinates'])
              scenes[idx]['mapRegion']='soufriere-detail'
              scenes[idx]['mapOffset']={'x':round((x-gx)/12,4),'y':round((y-gy)/7.6,4)}
              print('Scene',idx+1,'position',round(x,1),round(y,1),'offset',scenes[idx]['mapOffset'],flush=True)
          d['map']['regions']=[{'id':'soufriere-detail','bounds':detail,'rect':rect}]
          d['map']['insetNote']='南西部の近接する景色③〜⑦は、右側の地理座標に基づく拡大図に表示しています。'
          d['map']['source']+=' Southwest inset 2026-09-23: original approved geoBoundaries ADM0 outline affinely reprojected into separate clipped frame, WGS84; no invented shoreline or shifted location coordinates.'
          # Draw clipped inset to the right of the main island, using exactly the
          # original path data, fill, boundary stroke, and shared map palette.
          defs=next(e for e in root if e.tag==NS+'defs')
          clip=ET.SubElement(defs,NS+'clipPath',{'id':'stlucia-sw-clip'})
          ET.SubElement(clip,NS+'rect',{'x':str(rect['x']),'y':str(rect['y']),'width':str(rect['width']),'height':str(rect['height'])})
          frame=ET.SubElement(root,NS+'g',{'id':'stlucia-southwest-inset'})
          ET.SubElement(frame,NS+'rect',{'x':str(rect['x']-7),'y':str(rect['y']-34),'width':str(rect['width']+14),'height':str(rect['height']+41),'rx':'4','fill':'#eaf2f4','stroke':'#31576a','stroke-width':'1.3'})
          ET.SubElement(frame,NS+'text',{'x':str(rect['x']+10),'y':str(rect['y']-12),'font-family':'Arial, sans-serif','font-size':'15','font-weight':'600','fill':'#31576a'}).text='SOUTHWEST / DETAIL'
          clipped=ET.SubElement(frame,NS+'g',{'clip-path':'url(#stlucia-sw-clip)'})
          ET.SubElement(clipped,NS+'rect',{'x':str(rect['x']),'y':str(rect['y']),'width':str(rect['width']),'height':str(rect['height']),'fill':'url(#sea)'})
          geo_group=ET.SubElement(clipped,NS+'g',{'transform':f'matrix({sx:.12f} 0 0 {sy:.12f} {tx:.12f} {ty:.12f})'})
          geo_group.append(copy.deepcopy(target))
          ET.register_namespace('','http://www.w3.org/2000/svg')
          sp.write_text(ET.tostring(root,encoding='unicode')+'\n',encoding='utf-8')
          jp.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY
          python3 scripts/validate_country.py --strict data/countries/stlucia.json
      - name: Commit new inset and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stlucia-marker-spacing-once.yml
          git add data/countries/stlucia.json assets/images/stlucia/map-atlas-v1.svg
          git commit -m 'Add geography-accurate southwest inset for dense Saint Lucia markers'
          git push origin HEAD:country/stlucia-map-zoom-review-20260923
