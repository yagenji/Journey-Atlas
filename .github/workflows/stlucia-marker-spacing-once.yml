name: Saint Lucia marker spacing one-shot

on:
  push:
    branches: [country/stlucia-map-zoom-review-20260923]
    paths: [.github/workflows/stlucia-marker-spacing-once.yml]

permissions:
  contents: write

jobs:
  spacing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: country/stlucia-map-zoom-review-20260923
      - name: Install geographic layout solver
        run: python3 -m pip install --disable-pip-version-check shapely scipy
      - name: Preserve verified geometry; solve required marker spacing inland
        run: |
          python3 - <<'PY'
          import json, math, re
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import numpy as np
          from scipy.optimize import linear_sum_assignment
          from shapely.geometry import Point,Polygon
          from shapely.ops import unary_union
          from shapely.affinity import affine_transform

          json_path=Path('data/countries/stlucia.json')
          svg_path=Path('assets/images/stlucia/map-atlas-v1.svg')
          data=json.loads(json_path.read_text(encoding='utf-8'))
          bounds=data['map']['bounds']
          assert bounds=={'north':14.16,'south':13.68,'west':-61.19,'east':-60.79}
          NS='{http://www.w3.org/2000/svg}'
          root=ET.fromstring(svg_path.read_text(encoding='utf-8'))
          group=next(c for c in root if c.attrib.get('id')=='map-geography-zoom')
          matrix=list(map(float,re.findall(r'-?\d+(?:\.\d+)?',group.attrib['transform'])))
          assert len(matrix)==6 and matrix[0]>1.5 and matrix[3]>1.5
          target=next(c for c in group if c.tag==NS+'path')
          polys=[]
          for segment in re.findall(r'M\s*([^Z]+)Z',target.attrib['d']):
              xy=[(float(x),float(y)) for x,y in re.findall(r'(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)',segment)]
              if len(xy)>2:polys.append(Polygon(xy))
          assert polys and all(p.is_valid for p in polys)
          land=affine_transform(unary_union(polys),matrix)
          inland=land.buffer(-14)
          assert not inland.is_empty
          clat=(bounds['north']+bounds['south'])/2
          c=math.cos(math.radians(clat))
          s=min(1200/((bounds['east']-bounds['west'])*c),760/(bounds['north']-bounds['south']))
          ox=(1200-(bounds['east']-bounds['west'])*c*s)/2
          oy=(760-(bounds['north']-bounds['south'])*s)/2
          def geo(c0):return (ox+(c0['longitude']-bounds['west'])*c*s,oy+(bounds['north']-c0['latitude'])*s)
          def plotted(item):
              x,y=geo(item['coordinates']);offset=item.get('mapOffset') or {}
              return (x+12*float(offset.get('x',0)),y+7.6*float(offset.get('y',0)))
          scenes=data['scenes']
          fixed=[plotted(data['capital'])]+[plotted(scenes[i]) for i in (0,1,7)]
          assert all(inland.contains(Point(x,y)) for x,y in fixed)
          assert all(math.hypot(x-x2,y-y2)>=71 for i,(x,y) in enumerate(fixed) for x2,y2 in fixed[i+1:])
          indices=[2,3,4,5,6]
          geographic=[geo(scenes[i]['coordinates']) for i in indices]
          best=None
          # The 78px lattice is a display-only collision solver: geographic points never move.
          # Try 100 lattice translations; Hungarian assignment minimizes total displacement.
          for ix in range(0,78,7):
              for iy in range(0,78,7):
                  slots=[]
                  for x in range(454+ix,778,78):
                      for y in range(346+iy,710,78):
                          if not inland.contains(Point(x,y)):continue
                          if any(math.hypot(x-fx,y-fy)<72 for fx,fy in fixed):continue
                          slots.append((x,y))
                  if len(slots)<len(indices):continue
                  costs=np.array([[math.hypot(px-x,py-y)**2 for x,y in slots] for px,py in geographic])
                  costs[costs>185**2]=1e9
                  rows,cols=linear_sum_assignment(costs)
                  if len(rows)!=5 or any(costs[r,c]>=1e9 for r,c in zip(rows,cols)):continue
                  score=sum(float(costs[r,c]) for r,c in zip(rows,cols))
                  chosen=[slots[cols[list(rows).index(r)]] for r in range(5)]
                  if best is None or score<best[0]:best=(score,chosen)
          assert best is not None,'No legal 71px-spaced inland layout; keep PR draft'
          placements=list(fixed[1:3])+best[1]+[fixed[3]]
          assert len(placements)==8
          assert all(inland.contains(Point(x,y)) for x,y in placements)
          assert all(math.hypot(x-x2,y-y2)>=71 for i,(x,y) in enumerate(placements) for x2,y2 in placements[i+1:])
          assert all(math.hypot(x-cx,y-cy)>=71 for x,y in placements for cx,cy in fixed[:1])
          for idx,(x,y) in enumerate(placements):
              gx,gy=geo(scenes[idx]['coordinates'])
              scenes[idx]['mapOffset']={'x':round((x-gx)/12,4),'y':round((y-gy)/7.6,4)}
              print('Scene',idx+1,'badge',x,y,'offset_px',round(math.hypot(x-gx,y-gy),1))
          # Where a visual badge is moved more than one normal map-marker gap,
          # add a fine guide connecting it to the original real coordinates.
          guides=ET.Element(NS+'g',{'id':'map-marker-leaders','fill':'none','stroke':'#31576a','stroke-width':'1.1','stroke-dasharray':'3 3','stroke-linecap':'round','opacity':'0.65'})
          for idx,(x,y) in enumerate(placements):
              gx,gy=geo(scenes[idx]['coordinates'])
              if math.hypot(x-gx,y-gy)>60:
                  ET.SubElement(guides,NS+'line',{'x1':f'{gx:.2f}','y1':f'{gy:.2f}','x2':str(x),'y2':str(y)})
          if len(guides):root.append(guides)
          data['map']['source']+=' Review marker layout: 71px minimum between the eight numbered scenes and capital, all numbered badges at least 14px inside verified land; dotted leader guides show original geographic anchors where offsets exceed 60px.'
          ET.register_namespace('','http://www.w3.org/2000/svg')
          svg_path.write_text(ET.tostring(root,encoding='unicode')+'\n',encoding='utf-8')
          json_path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print('all 8 inland; minimum 71px; leader guides',len(guides))
          PY
          python3 scripts/validate_country.py --strict data/countries/stlucia.json
      - name: Commit revised map and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stlucia-marker-spacing-once.yml
          git add data/countries/stlucia.json assets/images/stlucia/map-atlas-v1.svg
          git commit -m 'Space Saint Lucia map badges at least 71px apart on land'
          git push origin HEAD:country/stlucia-map-zoom-review-20260923
