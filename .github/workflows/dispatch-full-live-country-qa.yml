name: Dispatch full live Country QA

on:
  push:
    branches:
      - system/map-context-shared-preparation
    paths:
      - '.github/workflows/dispatch-full-live-country-qa.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: system/map-context-shared-preparation
          fetch-depth: 0
      - name: Dispatch production verification for every published Country
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          slugs="$(git show origin/main:data/atlas-destinations.json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(",".join(x["slug"] for x in d["destinations"] if x.get("atlasPublished")) )')"
          echo "Published Country count: $(printf '%s' "$slugs" | tr ',' '\n' | wc -l)"
          gh workflow run verify-production.yml --ref main -f slug="$slugs"
      - name: Remove one-time dispatcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/dispatch-full-live-country-qa.yml
          git add .github/workflows/dispatch-full-live-country-qa.yml
          git commit -m "Remove temporary full live Country QA dispatcher"
          git push origin HEAD:system/map-context-shared-preparation
