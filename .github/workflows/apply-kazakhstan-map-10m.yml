name: Apply Kazakhstan 1:10m map rebuild

on:
  push:
    branches:
      - fix/kazakhstan-map-10m
    paths:
      - 'scripts/fix_kazakhstan_map_10m.py'
      - '.github/workflows/apply-kazakhstan-map-10m.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/kazakhstan-map-10m
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install map dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet geopandas shapely
      - name: Rebuild Kazakhstan map
        run: python3 scripts/fix_kazakhstan_map_10m.py
      - name: Validate rebuilt map and Country
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('assets/images/kazakhstan/map-atlas-v1.svg')
          ET.parse(path)
          text = path.read_text(encoding='utf-8')
          assert 'Natural Earth 1:10m Admin 0 Countries' in text
          assert 'ca96624a56bd078437bca8184e78163e5039ad19' in text
          print('SVG XML/source QA: PASS')
          PY
          python3 scripts/test_country_editorial_v2.py
          python3 scripts/validate_country_editorial_v2.py data/countries/kazakhstan.json
          python3 scripts/validate_country.py --strict data/countries/kazakhstan.json
          python3 scripts/build_country_preview_targeted.py --slugs kazakhstan
      - name: Commit rebuilt map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/countries/kazakhstan.json assets/images/kazakhstan/map-atlas-v1.svg
          git diff --cached --quiet && exit 0
          git commit -m 'Rebuild Kazakhstan map from Natural Earth 1:10m'
          git push origin HEAD:fix/kazakhstan-map-10m
