name: Apply Antigua review copy and clean temporary files
on:
  push:
    branches: ['country/antiguabarbuda-renewal']
    paths: ['.github/workflows/antigua-apply-copy-cleanup-20260917.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: country/antiguabarbuda-renewal
          persist-credentials: true
      - name: Apply and verify named corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('data/countries/antiguabarbuda.json'); d=json.loads(p.read_text(encoding='utf-8'))
          assert d['slug']=='antiguabarbuda' and d.get('atlasPublished',False) is False
          assert len(d['scenes'])==8 and len(d['taste']['items'])==4
          assert d['hero']['location']=='Shirley Heights Lookout / English Harbour'
          d['hero']['location']='シャーリー・ハイツ展望台／イングリッシュ・ハーバー'
          for i,en,ja in [(0,'Devil’s Bridge','デビルズ・ブリッジ'),(1,'Wallings','ウォーリングス自然保護区')]:
            old=d['travelScale']['items'][i]['text']; assert en in old,(i,old)
            d['travelScale']['items'][i]['text']=old.replace(en,ja)
          # EC is a legitimate currency abbreviation, not untranslated prose.
          d['travelTrivia'][4]['title']=d['travelTrivia'][4]['title'].replace('ECドル','東カリブ・ドル')
          d['travelTrivia'][4]['text']=d['travelTrivia'][4]['text'].replace('ECドル','東カリブ・ドル')
          for root in ('hero','scenes','atlasExtras','travelTrivia','taste','travelScale','seasons','transport','personas','signatureFacts','tips','relatedCountries'):
            def audit(v):
              if isinstance(v,list):
                for item in v:audit(item)
              elif isinstance(v,dict):
                for k,item in v.items():
                  if k in ('lead','description','text','intro','reason','note','interestReason','location') and isinstance(item,str):
                    if re.search('[A-Za-z]{2,}',item):raise AssertionError((root,k,item))
                  elif isinstance(item,(list,dict)) and k not in ('sources','sourceDates'):audit(item)
            audit(d[root])
          assert d['facts'][3]['value']=='442.6 km²（日本の約0.12％）'
          p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print('PASS: Hero, two itinerary examples, currency caption, all Japanese prose; no publication changes.')
          PY
          git rm .github/workflows/antigua-apply-copy-cleanup-20260917.yml .github/workflows/one-time-antigua-apply-20260917.yml .github/workflows/one-time-antigua-language-audit-20260917.yml
          git add data/countries/antiguabarbuda.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finish Antigua Japanese review copy and remove temporary workflows'
          git push origin HEAD:refs/heads/country/antiguabarbuda-renewal