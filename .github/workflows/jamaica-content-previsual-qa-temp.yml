name: Temporary Jamaica previsual content QA
on:
  push:
    paths:
      - '.github/workflows/jamaica-content-previsual-qa-temp.yml'
permissions:
  contents: read
jobs:
  jamaica-previsual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dd4c374534953931a373a840939676f4ba1f2e28
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Country commit and content identifiers
        run: |
          test "$(git rev-parse HEAD)" = dd4c374534953931a373a840939676f4ba1f2e28
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/countries/jamaica.json').read_text())
          s=json.loads(Path('ops/country-production/jamaica.json').read_text())
          t=json.loads(Path('data/theme-taxonomy.json').read_text())
          r=json.loads(Path('data/atlas-destinations.json').read_text())
          assert d['slug']==s['slug']=='jamaica'
          assert s['phase']=='CONTENT' and s['publication']['atlasPublished'] is False
          assert d['map']['svg']=='assets/images/jamaica/map-atlas-v1.svg' and s['map']['state']=='APPROVED'
          assert len(d['scenes'])==8 and len(d['taste']['items'])==4 and len(d['relatedCountries'])==3
          refs=[d['hero']['image'],*[x['image'] for x in d['scenes']],*[x['image'] for x in d['taste']['items']]]
          assert len(refs)==len(set(refs))==13 and all(Path(x).is_file() for x in refs)
          assignments=[x['id'] for x in t['themes'] if 'jamaica' in x['examples']]
          assert 1<=len(assignments)<=4,assignments
          assert sum(x['slug']=='jamaica' for x in r['destinations'])==1
          assert next(x for x in r['destinations'] if x['slug']=='jamaica')['atlasPublished'] is False
          assert d['sourcesVerifiedAt'] and d['sources'] and d['sourceDates']
          print('PASS content shape, unique image references, taxonomy assignment',assignments,'canonical unpublished destination and dated source metadata')
          PY
      - name: Validate actual Country editorial and Content QA v6
        run: |
          python scripts/validate_country_editorial_v2.py --force data/countries/jamaica.json
          python scripts/validate_country_quality_v5.py data/countries/jamaica.json
      - name: Validate Map locations and production Country JSON strict schema
        run: |
          python scripts/validate_country_map_v6.py data/countries/jamaica.json
          python scripts/validate_country.py --strict data/countries/jamaica.json
