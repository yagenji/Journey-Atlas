name: Refresh Uzbekistan preview

on:
  push:
    branches:
      - country/uzbekistan
    paths:
      - .github/workflows/refresh-uzbekistan-preview.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Uzbekistan branch
        uses: actions/checkout@v4
        with:
          ref: country/uzbekistan
      - name: Remove one-time refresher
        run: rm .github/workflows/refresh-uzbekistan-preview.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Uzbekistan preview refresher"
          git push origin HEAD:country/uzbekistan
