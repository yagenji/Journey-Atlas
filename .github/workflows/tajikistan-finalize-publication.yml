name: Finalize Tajikistan publication

on:
  push:
    branches: ["country/tajikistan"]
    paths:
      - ".github/workflows/tajikistan-finalize-publication.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Country branch
        uses: actions/checkout@v4
        with:
          ref: country/tajikistan
          fetch-depth: 0

      - name: Finalize publication metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          slug = "tajikistan"
          now = datetime.now(timezone(timedelta(hours=9))).replace(microsecond=0).isoformat()
          production_url = f"https://atlas.yagenji.com/countries/{slug}/"
          review_url = f"https://yagenji.github.io/Journey-Atlas/reviews/{slug}/countries/{slug}/"

          state_path = Path("ops/country-production/tajikistan.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          assert state.get("productionProtocolId") == "2.0"
          assert (state.get("qa") or {}).get("state") == "PASS"
          preview = state.get("reviewPreview") or {}
          assert preview.get("state") == "DONE"
          assert preview.get("browserQa") == "PASS"
          assert preview.get("url") == review_url
          assert all((item or {}).get("state") == "APPROVED" for item in state.get("scenes", []))
          assert all((item or {}).get("state") == "APPROVED" for item in state.get("taste", []))
          assert (state.get("hero") or {}).get("state") == "APPROVED"
          assert (state.get("map") or {}).get("state") == "APPROVED"
          assert (state.get("assetHandoff") or {}).get("state") == "PASS"
          assert (state.get("assetHandoff") or {}).get("verifiedRasterCount") == 13

          state["contentRef"] = "main"
          state["stateRef"] = "main"
          state["phase"] = "COMPLETE"
          state["stateRevision"] = int(state.get("stateRevision", 0)) + 1
          state["updatedAt"] = now
          state.setdefault("qa", {})["state"] = "PASS"
          state["qa"]["productionState"] = "CI_GATED"
          state["reviewDeployment"] = {"state": "DONE", "url": production_url}
          state["finalApproval"] = {
              "state": "APPROVED",
              "approvedAt": now,
              "basis": "User instruction: QAして問題なければ公開して. Tajikistan persistent review passed targeted Country validation, approved-asset checks, Image Policy validation, and Desktop / Tablet / Mobile Browser QA after the Pamir content update; publication remains CI-gated through the serialized Protocol 2 queue."
          }
          state["publication"] = {
              "state": "PUBLISHED",
              "atlasPublished": True,
              "productionVerification": "CI_GATED",
              "requestedAt": now,
              "publishedUrl": production_url,
              "robots": "index,follow",
              "sitemapListed": True,
              "linkedFromRegistry": True,
              "note": "Registry publication and terminal Production State are committed on the same publication PR. Publication CI must validate the published build, discovery link, indexability, sitemap inclusion and production route; post-merge production verification is authoritative."
          }
          state["next"] = {"action": "NONE", "asset": None}
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          registry_path = Path("data/atlas-destinations.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          row = next(item for item in registry.get("destinations", []) if item.get("slug") == slug)
          row["atlasPublished"] = True
          row["href"] = f"countries/{slug}/"
          row["image"] = "assets/images/tajikistan/approved/hero-wakhan-upper-panj-road.webp"
          registry["updatedAt"] = now[:10]
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Validate terminal publication state
        run: |
          python3 scripts/country_production_protocol_v2.py validate
          python3 scripts/image_policy_v72.py validate

      - name: Commit terminal publication state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tajikistan-finalize-publication.yml
          git add -f ops/country-production/tajikistan.json data/atlas-destinations.json
          git commit -m "Approve Tajikistan for publication"
          git push origin HEAD:country/tajikistan
