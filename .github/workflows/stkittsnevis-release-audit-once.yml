name: One-off St Kitts Nevis publication readiness audit
on:
  push:
    branches: [country/stkittsnevis]
    paths: [.github/workflows/stkittsnevis-release-audit-once.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check target data, map, rasters, and production state
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 scripts/validate_country_editorial_v2.py --force data/countries/stkittsnevis.json
          python3 scripts/validate_country_quality_v5.py data/countries/stkittsnevis.json
          python3 scripts/validate_country_map_v6.py data/countries/stkittsnevis.json
          python3 scripts/validate_country.py --strict data/countries/stkittsnevis.json
          python3 scripts/audit_country_image_delivery_targeted.py --slug stkittsnevis
          python3 scripts/validate_images.py --mode audit --slug stkittsnevis
          python3 scripts/validate_images.py --duplicates-only --slug stkittsnevis
          python3 scripts/country_production_state_v7.py validate
      - name: Report real image approvals and canonical review gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import publication_pipeline_v2 as p
          s=json.loads(Path('ops/country-production/stkittsnevis.json').read_text())
          r=json.loads(Path('data/atlas-destinations.json').read_text())
          row=next(x for x in r['destinations'] if isinstance(x,dict) and x.get('slug')=='stkittsnevis')
          print('STATE',json.dumps({'revision':s['stateRevision'],'phase':s['phase'],'next':s['next'],'sceneBatchReview':(s.get('sceneBatchReview') or {}).get('approval'),'tasteBatchReview':(s.get('tasteBatchReview') or {}).get('approval'),'taste':[{'id':x['id'],'state':x['state'],'approvalEvidence':x.get('userApprovalEvidence',{}).get('generationId')} for x in s['taste']],'handoff':s['assetHandoff'],'qa':s.get('qa'),'finalApproval':s['finalApproval'],'atlasPublished':row.get('atlasPublished')},ensure_ascii=False))
          errors=p.review_ready_errors('stkittsnevis',s)
          print('CANONICAL_REVIEW_GATE_ERRORS',json.dumps(errors,ensure_ascii=False))
          assert errors==[], 'Cannot publish: unpublished canonical review cannot pass with unresolved image approvals'
          PY
      - name: Remove one-off audit workflow without changing Country material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/stkittsnevis-release-audit-once.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-off St Kitts Nevis release audit'
            git push origin HEAD:country/stkittsnevis
          fi
