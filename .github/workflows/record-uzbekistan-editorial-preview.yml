name: Record updated Uzbekistan review preview

on:
  push:
    branches: ["country/uzbekistan"]
    paths: [".github/workflows/record-uzbekistan-editorial-preview.yml"]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Uzbekistan branch
        uses: actions/checkout@v4
        with:
          ref: country/uzbekistan
          fetch-depth: 0
      - name: Record successful review preview
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          p = Path('ops/country-production/uzbekistan.json')
          s = json.loads(p.read_text(encoding='utf-8'))
          s['stateRevision'] = int(s.get('stateRevision', 0)) + 1
          s['updatedAt'] = datetime.now(ZoneInfo('Asia/Tokyo')).replace(microsecond=0).isoformat()
          s['qa'] = {'state': 'PASS', 'productionState': 'CI_GATED'}
          s['reviewPreview'] = {
              'mode': 'TARGETED_COUNTRY_BRANCH_PREVIEW',
              'state': 'DONE',
              'url': 'https://yagenji.github.io/Journey-Atlas/reviews/uzbekistan/countries/uzbekistan/',
              'browserQa': 'PASS',
              'deployedAt': '2026-09-13T14:59:06+09:00',
          }
          metrics = s.setdefault('productionMetrics', {})
          metrics['reviewPreviewDeployments'] = int(metrics.get('reviewPreviewDeployments', 0)) + 1
          metrics['browserQaCycles'] = int(metrics.get('browserQaCycles', 0)) + 1
          metrics['canonicalReviewReadyAt'] = '2026-09-13T14:59:06+09:00'
          s['finalApproval'] = {'state': 'PENDING'}
          s['next'] = {'action': 'REVIEW_CANONICAL_URL', 'asset': None}
          p.write_text(json.dumps(s, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          python3 scripts/country_production_protocol_v2.py validate
      - name: Commit state and remove recorder
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/record-uzbekistan-editorial-preview.yml
          git add ops/country-production/uzbekistan.json
          git commit -m "Record Uzbekistan editorial review preview passed"
          git push origin HEAD:country/uzbekistan
