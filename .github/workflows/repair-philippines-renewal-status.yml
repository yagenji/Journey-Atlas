name: Repair Philippines renewal status

on:
  push:
    branches: ["country/philippines"]
    paths:
      - '.github/workflows/repair-philippines-renewal-status.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Philippines branch
        uses: actions/checkout@v4
        with:
          ref: country/philippines
          fetch-depth: 0

      - name: Append Philippines renewal status without rewriting existing rows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/country-renewal-status.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          countries = data.setdefault('countries', [])
          if not any(row.get('slug') == 'philippines' for row in countries if isinstance(row, dict)):
              countries.append({
                  'slug': 'philippines',
                  'nameJa': 'フィリピン',
                  'wave': 9,
                  'published': True,
                  'auditState': 'AUDITED',
                  'renewalClass': 'UNCLASSIFIED',
                  'content': 'DONE',
                  'visual': 'DONE',
                  'map': 'DONE',
                  'sources': 'DONE',
                  'qa': 'PASS',
                  'production': 'CI_GATED',
                  'hardImageGate': True,
                  'notes': [
                      'New Philippines Country production completed to current Reference standard on 2026-09-12.',
                      'User instructed publication if final QA passed. Persistent review deployment, strict Country validation, Production State validation, approved Hero / eight Scenes / four Taste assets / Map, and Desktop / Tablet / Mobile Browser QA passed with zero blocking failures after the final related-destination correction.',
                      'Revision-7 terminal publication uses CI_GATED production verification; post-merge Cloudflare production verification is authoritative.'
                  ],
                  'automatedAudit': 'DONE'
              })
          data['updatedAt'] = '2026-09-12'
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/country-renewal-status.json; then
            echo 'Philippines renewal status already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/country-renewal-status.json
          git commit -m 'chore: register Philippines publication status'
          git push origin HEAD:country/philippines
