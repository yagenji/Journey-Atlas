name: Reconcile verified canonical Country reviews

# Recover live verification State when a Country was integrated before the
# canonical promotion workflow could record its QA result. Never publish.
on:
  pull_request:
    paths: ['.github/workflows/reconcile-canonical-review-state.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/reconcile-canonical-review-state.yml']
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Comma-separated unpublished review Countries; blank selects all eligible pending reviews'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: country-publication-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check workflow and canonical review guards
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 - <<'PYTEST'
          import yaml
          from pathlib import Path
          workflow = yaml.load(Path('.github/workflows/reconcile-canonical-review-state.yml').read_text(), Loader=yaml.BaseLoader)
          assert 'pull_request' in workflow['on']
          assert 'push' in workflow['on']
          assert 'workflow_dispatch' in workflow['on']
          assert workflow['permissions']['contents'] == 'write'
          PYTEST
          python3 scripts/test_canonical_review_v2.py
          python3 scripts/validate_production_state_routed.py

  reconcile:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QA_BASE_URL: https://atlas.yagenji.com
      QA_SCOPE: unpublished-reviewable
      QA_OUT_DIR: qa-canonical-reconciliation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select eligible previously integrated review Countries
        id: targets
        env:
          REQUESTED_SLUGS: ${{ inputs.slugs }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path('.')
          rows = {r['slug']: r for r in json.loads((root / 'data/atlas-destinations.json').read_text())['destinations']}
          requested = [s.strip() for s in os.environ.get('REQUESTED_SLUGS', '').split(',') if s.strip()]
          selected = []
          for path in sorted((root / 'ops/country-production').glob('*.json')):
              slug = path.stem
              if requested and slug not in requested:
                  continue
              if not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*', slug):
                  continue
              country_path = root / 'data/countries' / (slug + '.json')
              if not country_path.exists() or slug not in rows:
                  continue
              state = json.loads(path.read_text())
              country = json.loads(country_path.read_text())
              if not (state.get('productionProtocolId') == '2.0'
                      and country.get('publicationPipelineVersion') == 2
                      and state.get('publicationPipelineVersion') == 2
                      and rows[slug].get('atlasPublished') is False
                      and not rows[slug].get('href')
                      and (state.get('publication') or {}).get('atlasPublished') is False
                      and (state.get('finalApproval') or {}).get('state') == 'PENDING'
                      and (state.get('reviewDeployment') or {}).get('state') == 'DEPLOYING'
                      and (state.get('reviewPreview') or {}).get('state') == 'DONE'
                      and (state.get('reviewPreview') or {}).get('browserQa') == 'PASS'
                      and (state.get('assetHandoff') or {}).get('state') == 'PASS'
                      and (state.get('assetHandoff') or {}).get('verifiedRasterCount') == 13):
                  continue
              selected.append(slug)
          if requested and (len(requested) != len(set(requested)) or set(requested) != set(selected)):
              raise SystemExit(f'Requested Countries are not all eligible: requested={requested}, selected={selected}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('slugs=' + ','.join(selected) + '\n')
              out.write('available=' + str(bool(selected)).lower() + '\n')
          print('Eligible pending canonical reviews:', selected)
          PY

      - name: Install live Browser QA dependency
        if: steps.targets.outputs.available == 'true'
        run: python3 -m pip install --disable-pip-version-check --quiet selenium

      - name: Require the exact current main commit on Cloudflare
        if: steps.targets.outputs.available == 'true'
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [ "$current_main" = "$GITHUB_SHA" ] || { echo 'main advanced; do not reconcile a stale run' >&2; exit 1; }
          live_sha=''
          for attempt in $(seq 1 60); do
            meta="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://atlas.yagenji.com/build-meta.json?reconcile=$GITHUB_RUN_ID-$attempt" || true)"
            live_sha="$(printf '%s' "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)"
            [ "$live_sha" != "$GITHUB_SHA" ] && sleep 5 || break
          done
          [ "$live_sha" = "$GITHUB_SHA" ] || { echo "Cloudflare commit mismatch: expected=$GITHUB_SHA, live=$live_sha" >&2; exit 1; }

      - name: Run authoritative live QA and unpublished discovery checks
        if: steps.targets.outputs.available == 'true'
        env:
          QA_SLUGS: ${{ steps.targets.outputs.slugs }}
        run: python3 scripts/qa_published_browser.py

      - name: Validate and push State-only reconciliation branch
        if: steps.targets.outputs.available == 'true'
        env:
          QA_SLUGS: ${{ steps.targets.outputs.slugs }}
        run: |
          set -euo pipefail
          [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ] || { echo 'main advanced during QA; retry on latest main' >&2; exit 1; }
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          slugs = os.environ['QA_SLUGS'].split(',')
          report = json.loads(Path('qa-canonical-reconciliation/report.json').read_text())
          assert report['pass'] and not report['failures'], 'Live QA must pass completely'
          assert set(report['countries']) == set(slugs), 'Browser QA target mismatch'
          for slug in slugs:
              found = [row for row in report['results'] if row['slug'] == slug]
              assert {row['viewport'] for row in found} == {'desktop', 'tablet', 'mobile'}, slug
              assert all(not row['errors'] for row in found), slug
              subprocess.run(['python3', 'scripts/canonical_review_v2.py', 'verified', slug], check=True)
              state = json.loads((Path('ops/country-production') / f'{slug}.json').read_text())
              assert state['finalApproval']['state'] == 'PENDING'
              assert state['publication']['atlasPublished'] is False
              assert state['reviewDeployment']['state'] == 'DONE'
              assert state['reviewDeployment']['productionVerification'] == 'LIVE_BROWSER_QA_PASS'
          PY
          python3 scripts/validate_production_state_routed.py
          python3 scripts/country_production_protocol_v2.py validate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="system/verified-canonical-reviews-$GITHUB_RUN_ID"
          git switch -c "$branch"
          IFS=',' read -ra slugs <<< "$QA_SLUGS"
          for slug in "${slugs[@]}"; do git add "ops/country-production/$slug.json"; done
          changed="$(git diff --cached --name-only | wc -l)"
          [ "$changed" -eq "${#slugs[@]}" ] || { echo 'Expected State-only changes are missing' >&2; exit 1; }
          git diff --cached --name-only
          git commit -m 'Record verified canonical noindex Country reviews'
          git push origin "HEAD:refs/heads/$branch"
          echo "State-only review branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          echo 'No Country final approval or publication flag was changed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-state-reconciliation-${{ github.run_id }}
          path: qa-canonical-reconciliation/
          if-no-files-found: ignore
          retention-days: 7
