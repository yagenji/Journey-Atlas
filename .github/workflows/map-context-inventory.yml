name: Inventory published map context previews

on:
  pull_request:
    paths:
      - 'scripts/add_country_map_context.py'
      - 'scripts/generate_country_map_with_context.py'
      - 'scripts/normalize_country_map_lakes.py'
      - 'tests/audit_map_context_inventory.py'
      - 'tests/audit_map_lake_normalization.py'
      - '.github/workflows/map-context-inventory.yml'

permissions:
  contents: write

jobs:
  published-map-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preview-only dependencies
        run: python -m pip install --disable-pip-version-check --quiet 'basemap==2.0.0' 'shapely>=2.0,<3' 'cairosvg>=2.7,<3' 'pillow>=10,<13'
      - name: Audit canonical published maps and rasterize supported previews
        run: |
          python -m py_compile tests/audit_map_context_inventory.py tests/audit_map_lake_normalization.py scripts/normalize_country_map_lakes.py scripts/generate_country_map_with_context.py
          python tests/audit_map_context_inventory.py --shard ${{ matrix.shard }} --shards 4 --output /tmp/atlas-map-inventory/shard-${{ matrix.shard }}/context
          python tests/audit_map_lake_normalization.py --shard ${{ matrix.shard }} --shards 4 --output /tmp/atlas-map-inventory/shard-${{ matrix.shard }}/lakes
      - name: Preserve report and preview images only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-context-inventory-shard-${{ matrix.shard }}
          path: /tmp/atlas-map-inventory/shard-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 3

  apply-normalized-lakes:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/map-lake-consistency'
    needs: published-map-inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: map-context-inventory-shard-*
          path: /tmp/atlas-lake-artifacts
          merge-multiple: true
      - name: Apply generated normalized SVGs
        run: |
          if [ -d /tmp/atlas-lake-artifacts/lakes/normalized/assets/images ]; then
            cp -r /tmp/atlas-lake-artifacts/lakes/normalized/assets/images/. assets/images/
          fi
          git status --short
          if git diff --quiet -- assets/images; then
            echo 'No map asset changes to apply.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images
          git commit -m 'Normalize remaining Country map lakes'
          git push origin HEAD:${{ github.head_ref }}
