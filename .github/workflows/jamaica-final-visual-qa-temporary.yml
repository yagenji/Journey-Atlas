name: Jamaica full visual image QA
on:
  push:
    branches: [qa/jamaica-page-visual-review-20260919]
    paths: ['.github/workflows/jamaica-final-visual-qa-temporary.yml']
permissions:
  contents: read
jobs:
  jamaica-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - uses: actions/checkout@v4
        with:
          ref: 34cf8a3db3dfbd3d1df2102b4f73df2268110862
          path: country-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage existing Country bytes and run current required editorial, image, Map QA
        run: |
          (cd country-source && python scripts/country_overlay_v2.py capture jamaica /tmp/jamaica-qa-overlay)
          (cd site && python scripts/country_overlay_v2.py apply jamaica /tmp/jamaica-qa-overlay)
          python -m pip install --disable-pip-version-check --quiet pillow selenium
          cd site
          python scripts/validate_country.py --strict data/countries/jamaica.json
          python scripts/validate_country_quality_v5.py data/countries/jamaica.json
          python scripts/validate_country_map_v6.py data/countries/jamaica.json
          python scripts/validate_images.py --mode hard --slug jamaica
          python scripts/validate_images.py --duplicates-only --slug jamaica
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from publication_pipeline_v2 import review_ready_errors,publish_ready_errors,state_for_slug
          s=state_for_slug('jamaica')
          print('FORMAL_REVIEW_BLOCKERS:',review_ready_errors('jamaica',s))
          print('FORMAL_PUBLICATION_BLOCKERS:',publish_ready_errors('jamaica',s))
          assert s['publication']['atlasPublished'] is False
          PY
      - name: Build and scroll every real image into view before screenshot and assert complete decode
        working-directory: site
        env:
          TARGET_SLUGS: jamaica
          JOURNEY_ATLAS_SITE_URL: http://127.0.0.1:4173/
        run: |
          python scripts/build_country_preview_targeted.py
          python -m http.server 4173 --directory dist >/tmp/jamaica-image-qa-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/countries/jamaica/ >/dev/null && break; sleep 1; done
          mkdir -p /tmp/jamaica-qa/screens
          python - <<'PY'
          import base64,json,time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from shutil import which
          opts=Options()
          for flag in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--hide-scrollbars','--force-device-scale-factor=1'): opts.add_argument(flag)
          d=webdriver.Chrome(service=Service(which('chromedriver')) if which('chromedriver') else Service(),options=opts)
          results=[]
          try:
              for label,w,h,mobile in [('desktop',1440,1000,False),('tablet',834,1112,False),('mobile',390,844,True)]:
                  d.set_window_size(w,h)
                  d.execute_cdp_cmd('Emulation.setDeviceMetricsOverride',{'width':w,'height':h,'deviceScaleFactor':1,'mobile':mobile})
                  d.get('http://127.0.0.1:4173/countries/jamaica/')
                  WebDriverWait(d,35).until(lambda x: len(x.find_elements(By.CSS_SELECTOR,'.scene-image'))==8 and len(x.find_elements(By.CSS_SELECTOR,'.taste-card__img'))==4)
                  elements=d.find_elements(By.CSS_SELECTOR,'.hero-art, .map-base, .scene-image, .taste-card__img')
                  assert len(elements)==14,len(elements)
                  for el in elements:
                      d.execute_script('arguments[0].scrollIntoView({block:"center"})',el)
                      time.sleep(0.18)
                  WebDriverWait(d,25).until(lambda x:x.execute_script('''return [...document.querySelectorAll('.scene-image')].every(e=>e.classList.contains('has-image')) && [...document.querySelectorAll('.taste-card__img')].every(e=>e.complete && e.naturalWidth>0) && document.querySelector('.map-base').complete && document.querySelector('.map-base').naturalWidth>0 && document.querySelector('.hero-art').classList.contains('has-image');'''))
                  result=d.execute_script('''return {viewport:innerWidth,scroll:document.documentElement.scrollWidth,heroLoaded:document.querySelector('.hero-art').classList.contains('has-image'),scenesLoaded:[...document.querySelectorAll('.scene-image')].filter(e=>e.classList.contains('has-image')).length,tasteLoaded:[...document.querySelectorAll('.taste-card__img')].filter(e=>e.complete&&e.naturalWidth>0).length,mapLoaded:document.querySelector('.map-base').naturalWidth>0,scenePlaceholders:[...document.querySelectorAll('.scene-placeholder')].filter(e=>!e.hidden).length,robots:document.querySelector('meta[name=robots]')?.content};''')
                  assert result['scroll']<=w+2 and result['scenesLoaded']==8 and result['tasteLoaded']==4 and result['heroLoaded'] and result['mapLoaded'] and result['scenePlaceholders']==0 and 'noindex' in result['robots'],result
                  d.execute_script('scrollTo(0,0)');time.sleep(0.4)
                  payload=d.execute_cdp_cmd('Page.captureScreenshot',{'format':'png','captureBeyondViewport':True,'fromSurface':True})['data']
                  Path('/tmp/jamaica-qa/screens/'+label+'.png').write_bytes(base64.b64decode(payload))
                  result['name']=label;results.append(result)
                  print('TRUE FULL IMAGE QA PASS',label,result)
          finally:
              d.quit()
          Path('/tmp/jamaica-qa/summary.json').write_text(json.dumps(results,indent=2))
          PY
      - name: Attach complete rendered page screenshots and structured QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jamaica-all-13-images-loaded-qa
          path: /tmp/jamaica-qa/
          if-no-files-found: warn
          retention-days: 3
