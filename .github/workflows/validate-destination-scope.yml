name: Validate canonical destination scope

on:
  push:
    branches: ["main"]
    paths:
      - 'data/atlas-scope.json'
      - 'data/atlas-destinations.json'
      - 'data/atlas-destinations-editorial.json'
      - 'data/region-taxonomy.json'
      - 'scripts/validate_destination_scope.py'
  pull_request:
    paths:
      - 'data/atlas-scope.json'
      - 'data/atlas-destinations.json'
      - 'data/atlas-destinations-editorial.json'
      - 'data/region-taxonomy.json'
      - 'scripts/validate_destination_scope.py'
      - 'scripts/validate_lens_slugs.py'

permissions:
  contents: read

jobs:
  validate-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical 201 destinations
        run: python3 scripts/validate_destination_scope.py
      - name: Compile related validator
        run: python3 -m py_compile scripts/validate_destination_scope.py scripts/validate_lens_slugs.py
