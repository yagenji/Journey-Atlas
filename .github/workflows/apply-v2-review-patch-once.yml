name: Apply v2 review pipeline fix once
on:
  push:
    branches: [fix/publication-v2-review-idempotency-20260916]
    paths: [.github/workflows/apply-v2-review-patch-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/publication-v2-review-idempotency-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact shared-source changes and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'Unexpected edit anchor in {path}: occurrences={text.count(old)}: {old[:90]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')
          script = 'scripts/publication_pipeline_v2.py'
          replace_once(script,
              'import json\nfrom datetime import datetime, timedelta, timezone\n',
              'import json\nimport subprocess\nfrom datetime import datetime, timedelta, timezone\n')
          replace_once(script,
              '    preview = state.get("reviewPreview") if isinstance(state.get("reviewPreview"), dict) else {}\n    if preview.get("state") == "DONE" and preview.get("browserQa") == "PASS" and preview.get("url"):\n        errors.append("review preview is already complete")\n',
              '')
          gate = '''def review_needed(slug: str, state: dict[str, Any]) -> bool:
              """Only re-review if the target's material changed after its validated preview.

              State reconciliation and approval-only commits are not a reason to
              redeploy or rerun Browser QA. Unknown/expired source commits fail
              open toward a fresh QA, never toward an unverified publication.
              """
              if (state.get("finalApproval") or {}).get("state") == "APPROVED":
                  return False
              if (state.get("publication") or {}).get("atlasPublished") is True:
                  return False
              preview = state.get("reviewPreview") or {}
              if preview.get("state") != "DONE" or preview.get("browserQa") != "PASS" or not preview.get("url"):
                  return True
              source = preview.get("sourceCommit")
              if not isinstance(source, str) or not source:
                  return True
              paths = [
                  f"data/countries/{slug}.json",
                  f"assets/images/{slug}",
                  "data/theme-taxonomy.json",
                  "data/atlas-destinations.json",
                  "data/country-renewal-status.json",
              ]
              try:
                  subprocess.run(["git", "cat-file", "-e", f"{source}^{{commit}}"],
                                 cwd=ROOT, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True)
                  diff = subprocess.run(["git", "diff", "--quiet", source, "HEAD", "--", *paths],
                                        cwd=ROOT, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              except (OSError, subprocess.CalledProcessError):
                  return True
              return diff.returncode != 0


          '''
          replace_once(script, 'def publish_ready_errors(slug: str, state: dict[str, Any]) -> list[str]:\n',
                       gate + 'def publish_ready_errors(slug: str, state: dict[str, Any]) -> list[str]:\n')
          replace_once(script,
              '    for name in ("status", "assert-review-ready", "assert-publish-ready", "finalize"):\n',
              '    for name in ("status", "review-needed", "assert-review-ready", "assert-publish-ready", "finalize"):\n')
          replace_once(script,
              '        if args.command == "status":\n            print(json.dumps(status(args.slug), ensure_ascii=False))\n',
              '        if args.command == "status":\n            print(json.dumps(status(args.slug), ensure_ascii=False))\n        elif args.command == "review-needed":\n            needed = review_needed(args.slug, state_for_slug(args.slug))\n            print(f"{args.slug}: review {\'required\' if needed else \'already current\'}")\n            return 0 if needed else 2\n')
          review = '.github/workflows/publication-pipeline-v2-review.yml'
          replace_once(review,
              '          [ "$active" = true ] || exit 0\n          python3 scripts/publication_pipeline_v2.py assert-review-ready "$slug" || exit 0\n',
              '          [ "$active" = true ] || exit 0\n          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then\n            if ! python3 scripts/publication_pipeline_v2.py review-needed "$slug"; then\n              echo "No target content changed since its validated review; State-only push requires no new preview."\n              exit 0\n            fi\n          fi\n          python3 scripts/publication_pipeline_v2.py assert-review-ready "$slug" || exit 0\n')
          preview = '.github/workflows/deploy-country-preview.yml'
          replace_once(preview,
              '          should_preview = ready and not published\n',
              '          country_path = Path("data/countries") / f"{slug}.json"\n          v2_country = country_path.exists() and json.loads(country_path.read_text(encoding="utf-8")).get("publicationPipelineVersion") == 2\n          should_preview = ready and not published and not v2_country\n')
          checks = '.github/workflows/publication-pipeline-v2-checks.yml'
          replace_once(checks,
              '          MODE: ${{ needs.validate.outputs.mode }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          reuse=false\n',
              '          MODE: ${{ needs.validate.outputs.mode }}\n          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          reuse=false\n')
          replace_once(checks,
              '          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"\n',
              '''          if [ "$MODE" = review ]; then
                    reviewed_source="$(python3 - "$SLUG" <<'REVIEW_SOURCE'
                  import json,sys
                  from pathlib import Path
                  state=json.loads((Path('ops/country-production')/f'{sys.argv[1]}.json').read_text())
                  preview=state.get('reviewPreview') or {}
                  if preview.get('state') == 'DONE' and preview.get('browserQa') == 'PASS':
                      print(preview.get('sourceCommit') or '')
                  REVIEW_SOURCE
                    )"
                    reviewed_main="$(python3 - "$SLUG" <<'REVIEW_MAIN'
                  import json,sys
                  from pathlib import Path
                  state=json.loads((Path('ops/country-production')/f'{sys.argv[1]}.json').read_text())
                  print((state.get('reviewPreview') or {}).get('mainBaseCommit') or '')
                  REVIEW_MAIN
                    )"
                    if [ -n "$reviewed_source" ] && [ -n "$reviewed_main" ] && git cat-file -e "$reviewed_source^{commit}" 2>/dev/null && git cat-file -e "$reviewed_main^{commit}" 2>/dev/null; then
                      shared=false
                      while IFS= read -r path; do
                        case "$path" in country.html|assets/js/*|assets/css/*|scripts/build_site.py|scripts/build_country_preview_targeted.py|scripts/qa_published_browser.py) shared=true; break;; esac
                      done < <(git diff --name-only "$reviewed_main"..origin/main)
                      if [ "$shared" = false ] && git diff --quiet "$reviewed_source" "$SOURCE_SHA" -- "data/countries/$SLUG.json" "assets/images/$SLUG" data/theme-taxonomy.json data/atlas-destinations.json data/country-renewal-status.json; then
                        reuse=true
                      fi
                    fi
                  fi
                  echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
              ''')
          test = Path('scripts/test_publication_v2_review_gate.py')
          if test.exists():
              raise SystemExit('Regression test already exists; stop rather than replace')
          test.write_text('''#!/usr/bin/env python3
          """Regression checks for idempotent Pipeline v2 review state."""
          from __future__ import annotations
          import json
          import subprocess
          import tempfile
          import unittest
          from pathlib import Path
          from unittest.mock import patch
          import publication_pipeline_v2 as pipeline

          class ReviewIdempotenceTest(unittest.TestCase):
              def test_completed_preview_is_valid_but_not_redeployed_for_state_only_commit(self):
                  state = {
                      "productionProtocolId": "2.0",
                      "hero": {"state": "APPROVED"},
                      "scenes": [{"state": "APPROVED"} for _ in range(8)],
                      "taste": [{"state": "APPROVED"} for _ in range(4)],
                      "sceneBatchReview": {"approval": "APPROVED"},
                      "tasteBatchReview": {"approval": "APPROVED"},
                      "assetHandoff": {"state": "PASS", "verifiedRasterCount": 13},
                      "finalApproval": {"state": "PENDING"},
                      "publication": {"state": "DRAFT", "atlasPublished": False},
                  }
                  with tempfile.TemporaryDirectory() as root:
                      root = Path(root)
                      subprocess.run(['git','init','-q',str(root)],check=True)
                      subprocess.run(['git','-C',str(root),'config','user.email','qa@example.invalid'],check=True)
                      subprocess.run(['git','-C',str(root),'config','user.name','QA'],check=True)
                      country = root/'data/countries/example.json'
                      country.parent.mkdir(parents=True)
                      country.write_text(json.dumps({'slug':'example'}))
                      subprocess.run(['git','-C',str(root),'add','.'],check=True)
                      subprocess.run(['git','-C',str(root),'commit','-qm','reviewed source'],check=True)
                      reviewed = subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()
                      state['reviewPreview']={'state':'DONE','browserQa':'PASS','url':'https://example.invalid/reviews/example/', 'sourceCommit':reviewed}
                      with patch.object(pipeline, 'ROOT', root), patch.object(pipeline, 'is_active', return_value=True):
                          self.assertEqual(pipeline.review_ready_errors('example',state),[])
                          self.assertFalse(pipeline.review_needed('example',state))
                          (root/'ops').mkdir()
                          (root/'ops/state.txt').write_text('state only')
                          subprocess.run(['git','-C',str(root),'add','.'],check=True)
                          subprocess.run(['git','-C',str(root),'commit','-qm','reconcile state'],check=True)
                          self.assertFalse(pipeline.review_needed('example',state))
                          country.write_text(json.dumps({'slug':'example','updated':True}))
                          subprocess.run(['git','-C',str(root),'add','.'],check=True)
                          subprocess.run(['git','-C',str(root),'commit','-qm','revise country'],check=True)
                          self.assertTrue(pipeline.review_needed('example',state))
                          state['publication']['atlasPublished']=True
                          self.assertIn('Country is already published',pipeline.review_ready_errors('example',state))
                          self.assertFalse(pipeline.review_needed('example',state))

          if __name__=='__main__':
              unittest.main()
          '''.replace('\n          ', '\n'), encoding='utf-8')
          Path('.github/workflows/apply-v2-review-patch-once.yml').unlink()
          print('Applied exact review idempotence, duplicate-preview, and Browser QA reuse fixes.')
          PY
          python3 -m py_compile scripts/publication_pipeline_v2.py scripts/test_publication_v2_review_gate.py
          python3 scripts/test_publication_v2_review_gate.py
          python3 scripts/publication_pipeline_v2.py self-test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/publication_pipeline_v2.py scripts/test_publication_v2_review_gate.py .github/workflows/publication-pipeline-v2-review.yml .github/workflows/publication-pipeline-v2-checks.yml .github/workflows/deploy-country-preview.yml .github/workflows/apply-v2-review-patch-once.yml
          git diff --cached --check
          git commit -m 'Make Pipeline v2 review idempotent and skip duplicate previews'
          git push origin HEAD:refs/heads/fix/publication-v2-review-idempotency-20260916
