name: Apply Honduras review corrections once
on:
  push:
    branches: [fix/honduras-review-feedback-20260918]
    paths: [.github/workflows/honduras-review-feedback-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/honduras-review-feedback-20260918
          persist-credentials: true
      - name: Update only Honduras Country data and remove this one-time workflow
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/countries/honduras.json')
          country = json.loads(path.read_text(encoding='utf-8'))
          assert country['slug'] == 'honduras'
          area = next(row for row in country['facts'] if row['label'] == '面積')
          assert area['value'] == '112,492 km²', area
          area['value'] = '112,492 km²（日本の約30%）'
          original = country['relatedCountries']
          assert [row['slug'] for row in original] == ['guatemala','belize','costarica'], original
          registry = json.loads(Path('data/atlas-destinations.json').read_text(encoding='utf-8'))['destinations']
          slugs = {row['slug']: row for row in registry}
          assert {'guatemala','elsalvador','nicaragua'} <= slugs.keys()
          guatemala = original[0]
          country['relatedCountries'] = [
              guatemala,
              {'slug':'elsalvador','nameEn':'EL SALVADOR','nameJa':'エルサルバドル','flag':'🇸🇻',
               'reason':'南西に国境を接する国。フォンセカ湾に面した地域から内陸の山地へ、隣り合う二つの国の地形と暮らしをたどれる。','affinityType':'CULTURE'},
              {'slug':'nicaragua','nameEn':'NICARAGUA','nameJa':'ニカラグア','flag':'🇳🇮',
               'reason':'東と南東に国境を接する国。カリブ海沿岸の低地や内陸の湖を通して、中央アメリカの地形のつながりを見られる。','affinityType':'LANDSCAPE'},
          ]
          source = country['sources']['area']
          assert '112,492' in source and 'data.un.org/en/iso/hn.html' in source
          country['sources']['area'] = source + ' Japan comparator: UNData Japan profile, surface area 377,930 km²; 112,492 / 377,930 ≈ 29.8%, rounded to 30%. https://data.un.org/en/iso/jp.html'
          assert country['updatedAt'] == '2026-09-18'
          path.write_text(json.dumps(country, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          assert [row['slug'] for row in json.loads(path.read_text(encoding='utf-8'))['relatedCountries']] == ['guatemala','elsalvador','nicaragua']
          print('Honduras area comparison and three true land neighbors recorded; no other country data or assets changed.')
          PY
          git rm .github/workflows/honduras-review-feedback-once.yml
          git add data/countries/honduras.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Correct Honduras neighboring countries and Japan area comparison'
          git push origin HEAD:refs/heads/fix/honduras-review-feedback-20260918
