name: Temporary Jordan final approval

on:
  push:
    branches: ["country/jordan"]

permissions:
  contents: write

jobs:
  approve:
    if: contains(github.event.head_commit.message, 'Record Jordan final approval trigger')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Jordan branch
        uses: actions/checkout@v4
        with:
          ref: country/jordan
          fetch-depth: 0

      - name: Record final approval and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          state_path = Path('ops/country-production/jordan.json')
          country_path = Path('data/countries/jordan.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          country = json.loads(country_path.read_text(encoding='utf-8'))

          assert state.get('productionProtocolId') == '2.0'
          assert state.get('productionProtocolPolicyPatch') == 5
          assert country.get('publicationPipelineVersion') == 2
          assert (state.get('qa') or {}).get('state') == 'PASS'
          preview = state.get('reviewPreview') or {}
          assert preview.get('state') == 'DONE'
          assert preview.get('browserQa') == 'PASS'
          assert preview.get('url') == 'https://yagenji.github.io/Journey-Atlas/reviews/jordan/countries/jordan/'
          capital = country.get('capital') or {}
          assert (capital.get('labelOffset') or {}).get('y') == -28
          assert state.get('publication', {}).get('atlasPublished') is False

          now = datetime.now(timezone(timedelta(hours=9))).replace(microsecond=0).isoformat()
          state['finalApproval'] = {
              'state': 'APPROVED',
              'approvedAt': now,
              'basis': 'User instructed: QAして問題なければ公開して. Latest Jordan Content QA v5 and Desktop/Tablet/Mobile Browser QA passed after the Amman label correction.'
          }
          state['stateRevision'] = int(state.get('stateRevision') or 0) + 1
          state['updatedAt'] = now
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rm -f .github/workflows/tmp-jordan-final-approval.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ops/country-production/jordan.json
          git add -u .github/workflows/tmp-jordan-final-approval.yml
          git commit -m "Approve Jordan final publication"
          git push origin HEAD:country/jordan
