name: One-time United States approved Scene delivery normalization

on:
  push:
    branches:
      - ops/one-shot-unitedstates-source-metadata-20260916
    paths:
      - .github/workflows/one-shot-unitedstates-source-metadata.yml

permissions:
  contents: write

jobs:
  normalize-eight-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Country branch
        uses: actions/checkout@v4
        with:
          ref: country/unitedstates
          fetch-depth: 0
      - name: Install original image delivery dependency
        run: python3 -m pip install --disable-pip-version-check --quiet pillow
      - name: Normalize only the eight approved Scenes and fully verify output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys,subprocess
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0,'scripts')
          import normalize_country_image_delivery as delivery
          slug='unitedstates'
          data=json.loads((Path('data/countries')/f'{slug}.json').read_text())
          assert len(data['scenes'])==8 and len(data['taste']['items'])==4
          expected={scene['image'] for scene in data['scenes']}
          assert len(expected)==8
          assert not delivery.published_registry_hero_mismatches(), 'Refusing to touch unrelated registry data'
          plans=delivery.build_plan([slug])
          delivery.print_plan(plans)
          assert len(plans)==8 and {p.source for p in plans}==expected
          assert all(p.source==p.target and p.new_size==(1200,800) and p.old_size==(1536,1024) for p in plans)
          before,after,updates=delivery.apply(plans,[slug])
          assert updates==0
          assert not delivery.audit_delivery([slug])
          for path in expected:
              with Image.open(path) as im:
                  im.load()
                  assert im.format=='WEBP' and im.size==(1200,800),path
          for item in [data['hero'], *data['taste']['items']]:
              with Image.open(item['image']) as im:
                  im.load()
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==expected,f'Unexpected changed paths: {changed.symmetric_difference(expected)}'
          print(f'PASS: exactly {len(expected)} approved Scenes downsampled, fully decoded; bytes {before} -> {after}; no other tracked changes')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- assets/images/unitedstates/approved/*.webp
          git diff --cached --check
          git commit -m 'Normalize eight approved United States Scenes to 1200x800'
          git push origin HEAD:refs/heads/country/unitedstates
