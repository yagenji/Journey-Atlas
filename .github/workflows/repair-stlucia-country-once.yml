name: Apply Saint Lucia Country fixes once
on:
  push:
    branches: [country/saintlucia-recovery-clean-v3]
    paths: [.github/workflows/repair-stlucia-country-once.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the recovery branch
        uses: actions/checkout@v4
        with:
          ref: country/saintlucia-recovery-clean-v3
          fetch-depth: 2
      - name: Restore unrelated Country and CSS from main
        run: |
          git fetch origin main --depth=1
          git restore --source=origin/main -- data/countries/dominica.json assets/css/taste-image-framing.css
      - name: Correct only canonical Saint Lucia Country content
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/countries/stlucia.json')
          d=json.loads(path.read_text(encoding='utf-8'))
          assert d['slug']=='stlucia' and d['publicationPipelineVersion']==2
          assert d['map']['bounds']=={'north':14.45,'south':13.55,'west':-61.25,'east':-60.7}
          assert len(d['scenes'])==8 and len(d['taste']['items'])==4
          assert d['capital']['nameEn']=='Castries'
          # Display offsets are percentages of 1200x760. Real lat/lon remain unchanged.
          # Layout solved against the existing 55/64/71px marker clearance rules,
          # with <5% radial offset for every marker and >0.5px headroom.
          offsets=[(-0.9271,-4.3960),(0.9344,4.8610),(-0.0498,-4.1295),
                   (3.5970,0.2526),(-2.7157,-4.1385),(1.7997,-4.6112),
                   (-4.4166,2.2352),(3.2563,3.7282),(4.4498,-2.1683),
                   (0.2507,-4.2714)]
          import math
          assert all(math.hypot(x,y)<5 for x,y in offsets)
          d['capital']['labelPosition']='right'
          d['capital']['labelOffset']={'x':0,'y':0}
          for item, (x,y) in zip([d['capital'],d['hero'],*d['scenes']],offsets):
              item['mapOffset']={'x':x,'y':y}
          for item in d['facts']:
              if item['label']=='人口':
                  assert '172,948' in item['value']
                  item['value']='172,948人（2022年国勢調査・常住人口）'
          d['sourceDates']['population']='2022'
          d['sourceDates']['countryArea']='2026-09-19'
          for item in d['taste']['items']:
              item['imageState']='APPROVED'
          path.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY
      - name: Validate updated Country with existing validators
        run: |
          python3 scripts/validate_country.py --strict data/countries/stlucia.json
          python3 scripts/validate_country_quality_v5.py --force data/countries/stlucia.json
      - name: Commit repaired data and remove one-shot maintenance workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-stlucia-country-once.yml
          git add data/countries/stlucia.json data/countries/dominica.json assets/css/taste-image-framing.css
          git commit -m 'Resolve Saint Lucia marker clearance and editorial QA; exclude unrelated changes'
          git push origin HEAD:country/saintlucia-recovery-clean-v3
