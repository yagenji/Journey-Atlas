name: Nicaragua approved-asset recovery (one-time)
on:
  push:
    branches: [country/nicaragua]
    paths: [.github/workflows/nicaragua-recovery-once.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing image validator requirements
        run: python3 -m pip install Pillow
      - name: Verify all 13 final assets, restore explicit user approvals, validate every transition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          from PIL import Image
          from scripts.validate_images import verify_raster, visual_fingerprint, _hamming, _thumbnail_rms
          from scripts.country_production_state_v7 import validate_transition, validate_state_dict
          from scripts.country_production_protocol_v2 import validate_protocol_state
          root=Path.cwd(); slug='nicaragua'; p=root/'ops/country-production/nicaragua.json'
          s=json.loads(p.read_text()); country=json.loads((root/'data/countries/nicaragua.json').read_text())
          assert s['phase']=='HERO' and s['hero']['state']=='REVIEW_CANDIDATE' and s['publication']['atlasPublished'] is False, 'unexpected State, manual inspection required'
          assert len(s['scenes'])==8 and len(s['taste'])==4
          assert country.get('publicationPipelineVersion')==2, 'Publication Pipeline v2 missing'
          expected=[('HERO',s['hero'],country['hero']['image'],(1200,760))]
          expected += [(x['id'],x,y['image'],(1200,800)) for x,y in zip(s['scenes'],country['scenes'])]
          expected += [(x['id'],x,y['image'],(1200,800)) for x,y in zip(s['taste'],country['taste']['items'])]
          assert len(expected)==13
          fingerprints=[]
          for item_id,item,path,minimum in expected:
              assert item['asset']==path and path.startswith('assets/images/nicaragua/approved/') and path.endswith('.webp'),(item_id,path)
              full=root/path; assert full.is_file(),f'missing {path}'
              w,h,fmt=verify_raster(full)
              assert fmt=='WEBP' and w>=minimum[0] and h>=minimum[1] and abs(w/h-1.5)<.015, f'bad dimensions/format: {item_id} {w}x{h} {fmt}'
              blob=subprocess.check_output(['git','hash-object',str(full)],text=True).strip()
              fp=visual_fingerprint(full)
              for other_id,other_fp in fingerprints:
                  assert fp['digest']!=other_fp['digest'],f'duplicate artwork: {item_id}, {other_id}'
                  assert not (_hamming(fp['ahash'],other_fp['ahash'])<=2 and _hamming(fp['dhash'],other_fp['dhash'])<=2 and _thumbnail_rms(fp['thumb'],other_fp['thumb'])<=12), f'near duplicate artwork: {item_id}, {other_id}'
              fingerprints.append((item_id,fp))
              item['recoveryGitBlobSha']=blob
              item['recoveryEvidence']='User approved current repository asset in Nicaragua production chat on 2026-09-17; image identity recovered via git blob SHA, not claimed as original generation UUID.'
              print('ASSET_QA_PASS',item_id,path,w,h,blob,flush=True)
          def timestamp(): return datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          def commit_stage(title,change):
              global s
              before=json.loads(json.dumps(s));change();s['stateRevision']+=1;s['updatedAt']=timestamp()
              from scripts.country_production_state import derive_next
              s['next']=derive_next(s)
              problems=validate_transition(before,s,'ops/country-production/nicaragua.json')+validate_state_dict(s,'nicaragua.json')+validate_protocol_state(s,'nicaragua.json')
              assert not problems, '\n'.join(problems)
              p.write_text(json.dumps(s,ensure_ascii=False,separators=(',',':'))+'\n')
              subprocess.run(['git','add',str(p)],check=True)
              subprocess.run(['git','commit','-m',title],check=True)
              print('STATE_VALID',title,s['phase'],s['next'],flush=True)
          def recover_hero_scene_candidates():
              h=s['hero'];h['state']='APPROVED';h['approvedGenerationId']=h.pop('candidateGenerationId');h['userApprovedAt']=timestamp()
              s['phase']='SCENES_REVIEW'
              for item in s['scenes']:
                  item['state']='REVIEW_CANDIDATE';item['candidateGenerationId']='git-blob:'+item['recoveryGitBlobSha']
                  item['candidateVisualQa']={'targetIdentity':'PASS','previousAssetRepeat':'PASS','collageTypography':'PASS'}
          commit_stage('Recover user-approved Nicaragua Hero and 8 scene candidates',recover_hero_scene_candidates)
          def recover_scene_batch_taste_candidates():
              s['sceneBatchReview']={'approval':'APPROVED','rounds':[{'round':1,'reviewBoundary':True,'approvedAt':timestamp(),'scope':[x['id'] for x in s['scenes']],'approvedGenerations':{x['id']:x['candidateGenerationId'] for x in s['scenes']},'regenerate':[],'approvalEvidence':'User explicitly approved all 13 current Nicaragua assets on 2026-09-17; git-blob generation handles are recovery identifiers, not original model generation UUIDs.'}]}
              for item in s['scenes']:
                  item['state']='APPROVED';item['approvedGenerationId']=item.pop('candidateGenerationId');item.pop('candidateVisualQa',None)
              s['phase']='TASTE_REVIEW'
              for item in s['taste']:
                  item['state']='REVIEW_CANDIDATE';item['candidateGenerationId']='git-blob:'+item['recoveryGitBlobSha']
                  item['candidateVisualQa']={k:'PASS' for k in ('targetIdentity','dishIdentity','singleDish','integralComponentsOnly','plainBackground','decorativePropsAbsent','previousAssetRepeat','collageTypography')}
          commit_stage('Record Nicaragua eight-scene batch approval with immutable evidence',recover_scene_batch_taste_candidates)
          def recover_taste_batch():
              s['tasteBatchReview']={'approval':'APPROVED','rounds':[{'round':1,'reviewBoundary':True,'approvedAt':timestamp(),'scope':[x['id'] for x in s['taste']],'approvedGenerations':{x['id']:x['candidateGenerationId'] for x in s['taste']},'regenerate':[],'approvalEvidence':'User explicitly approved all 13 current Nicaragua assets on 2026-09-17; git-blob generation handles are recovery identifiers, not original model generation UUIDs.'}]}
              for item in s['taste']:
                  item['state']='APPROVED';item['approvedGenerationId']=item.pop('candidateGenerationId');item.pop('candidateVisualQa',None)
              s['phase']='ASSET_QA'
              s['assetHandoff']={'mode':'USER_HANDOFF','state':'PASS','expectedRasterCount':13,'verifiedRasterCount':13,'verifiedAt':timestamp(),'verification':'Full Pillow verify+load, 3:2 dimensions, exact and perceptual duplicates, Country JSON path parity on GitHub runner at source commit.'}
              s['productionMetrics']['assetHandoffs']=1;s['productionMetrics']['sceneBatchReviews']=1;s['productionMetrics']['tasteBatchReviews']=1;s['productionMetrics']['tasteBatchApprovedAt']=timestamp()
              s['publicationPipelineVersion']=2
          commit_stage('Record Nicaragua four-Taste batch approval and verified 13-raster handoff',recover_taste_batch)
          assert s['publication']['atlasPublished'] is False and s['finalApproval']['state']=='PENDING'
          print('RECOVERY_COMPLETE_SHA',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          PY
          git -c user.name='journey-atlas-recovery' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' status --short
          git push origin HEAD:refs/heads/country/nicaragua
        env:
          GIT_AUTHOR_NAME: journey-atlas-recovery
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: journey-atlas-recovery
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
