name: Verify live Saint Lucia review and stage State once
on:
  push:
    branches: [ops/manual-stlucia-review-pages-20260923]
    paths: [.github/workflows/reconcile-verified-stlucia-preview-once.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SLUG: stlucia
      SOURCE_SHA: 4d9ea990fd252ffbef376d8b75820e55c39cd76b
      REVIEW_URL: https://yagenji.github.io/Journey-Atlas/reviews/stlucia/countries/stlucia/
      QA_BASE_URL: https://yagenji.github.io/Journey-Atlas/reviews/stlucia/
      QA_SCOPE: unpublished-reviewable
      QA_SLUGS: stlucia
      QA_OUT_DIR: qa-stlucia-live
    steps:
      - name: Verify live review, deployment source, and independent QA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/country/stlucia --jq '.object.sha')" = "$SOURCE_SHA"
          test "$(gh run view 35793917076 --repo "$GITHUB_REPOSITORY" --json conclusion,headSha --jq '.conclusion')" = success
          test "$(gh run view 35794255416 --repo "$GITHUB_REPOSITORY" --json conclusion,headSha --jq '.conclusion')" = success
          test "$(gh run view 35794255416 --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')" = 6f8b8beb715ff4bc36c7f0d2c53762cfebca91fd
          curl --fail --silent --show-error --location "$REVIEW_URL" -o /tmp/stlucia-review-live.html
          grep -qi 'noindex' /tmp/stlucia-review-live.html
          grep -qi 'SAINT LUCIA\|セントルシア' /tmp/stlucia-review-live.html
          curl --fail --silent --show-error --location https://yagenji.github.io/Journey-Atlas/reviews/index.json -o /tmp/reviews-index.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/reviews-index.json'))
          row=next(row for row in data['previews'] if row['slug']=='stlucia')
          assert row['sourceSha']=='4d9ea990fd252ffbef376d8b75820e55c39cd76b'
          print('Live review and Pages source match.')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 4d9ea990fd252ffbef376d8b75820e55c39cd76b
          fetch-depth: 1
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate live Pages review at Desktop Tablet Mobile
        run: |
          python3 -m pip install --disable-pip-version-check --quiet selenium
          python3 scripts/qa_published_browser.py
      - name: Reconcile verified review State without pushing to Country branch as Actions bot
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publication_pipeline_v2.py reconcile-review stlucia --source-commit "$SOURCE_SHA" --review-url "$REVIEW_URL" --run-id 35794255416
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('ops/country-production/stlucia.json'); s=json.loads(p.read_text())
          s['reviewPreview']['mainBaseCommit']='44cf916c6dfe7f1c8607e3409fda5c08f67939cb'
          assert s['phase']=='QA' and s['reviewPreview']['state']=='DONE' and s['reviewPreview']['browserQa']=='PASS'
          assert s['finalApproval']['state']=='PENDING' and s['publication']['atlasPublished'] is False
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 scripts/validate_production_state_routed.py
          cp ops/country-production/stlucia.json /tmp/verified-stlucia-state.json
          git fetch --no-tags --depth=1 origin +refs/heads/ops/manual-stlucia-review-pages-20260923:refs/remotes/origin/ops/manual-stlucia-review-pages-20260923
          git checkout -B ops/manual-stlucia-review-pages-20260923 origin/ops/manual-stlucia-review-pages-20260923
          mkdir -p ops/manual-review-staging
          cp /tmp/verified-stlucia-state.json ops/manual-review-staging/stlucia.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/manual-review-staging/stlucia.json
          git commit -m 'Stage live-verified Saint Lucia review State for connected-account commit'
          git push origin HEAD:ops/manual-stlucia-review-pages-20260923
          echo 'Verified State staged; do not use GITHUB_TOKEN to change the Country PR.' >> "$GITHUB_STEP_SUMMARY"
