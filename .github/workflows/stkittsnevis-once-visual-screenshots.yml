name: One-off St Kitts Nevis visual screenshots
on:
  push:
    branches: [country/stkittsnevis]
    paths: [.github/workflows/stkittsnevis-once-visual-screenshots.yml]
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and image tools
        run: python -m pip install --disable-pip-version-check --quiet pillow selenium
      - name: Build target and capture exact Country layout at all three widths
        env:
          TARGET_SLUGS: stkittsnevis
          JOURNEY_ATLAS_SITE_URL: http://127.0.0.1:4173/
          QA_BASE_URL: http://127.0.0.1:4173
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_country_preview_targeted.py
          python -m http.server 4173 --directory dist >/tmp/stkittsnevis-visual-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 25); do
            curl -fsS http://127.0.0.1:4173/countries/stkittsnevis/ >/dev/null && break
            sleep 1
          done
          python - <<'PY'
          import sys,json
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0,'scripts')
          import qa_published_browser as qa
          dest=Path('qa-stkittsnevis-visual');dest.mkdir(exist_ok=True)
          driver=qa.make_driver();results=[]
          try:
              for label,cfg in qa.VIEWPORTS.items():
                  qa.set_viewport(driver,cfg)
                  driver.get('http://127.0.0.1:4173/countries/stkittsnevis/')
                  qa.wait_for_country(driver)
                  qa.scroll_entire_page(driver)
                  full=dest/(label+'-full.jpg');qa.full_page_screenshot(driver,full)
                  with Image.open(full) as im:
                      im.load();width,height=im.size
                      assert width>=cfg['width'] and height>cfg['height'],(label,im.size)
                      for title,selector in [('hero','.hero'),('map','#country-map-art'),('taste','#taste-section')]:
                          box=driver.execute_script('let e=document.querySelector(arguments[0]); if(!e)return null;let b=e.getBoundingClientRect();return {x:b.left+scrollX,y:b.top+scrollY,w:b.width,h:b.height}',selector)
                          if box:
                              left=max(0,round(box['x']));top=max(0,round(box['y']));right=min(width,round(box['x']+box['w']));bottom=min(height,round(box['y']+box['h']))
                              if right>left and bottom>top:im.crop((left,top,right,bottom)).save(dest/(label+'-'+title+'.jpg'),quality=85)
                  results.append({'viewport':label,'fullImage':[width,height],'files':sorted(x.name for x in dest.glob(label+'-*.jpg'))})
                  print('SCREENSHOT',label,width,height,flush=True)
          finally:
              driver.quit()
          (dest/'screenshot-manifest.json').write_text(json.dumps(results,indent=2))
          PY
      - name: Upload actual visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stkittsnevis-visual-screenshots
          path: qa-stkittsnevis-visual/
          retention-days: 7
          if-no-files-found: warn
      - name: Remove ephemeral screenshot workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch .github/workflows/stkittsnevis-once-visual-screenshots.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-off St Kitts Nevis screenshot workflow'
            git push
          fi
