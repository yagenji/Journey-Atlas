name: Saint Lucia map zoom one-shot

on:
  push:
    branches:
      - country/stlucia-map-zoom-review-20260923
    paths:
      - .github/workflows/stlucia-map-zoom-once.yml

permissions:
  contents: write

jobs:
  zoom:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: country/stlucia-map-zoom-review-20260923
      - name: Install geometry checker
        run: python3 -m pip install --disable-pip-version-check shapely
      - name: Reproject original verified coast and place badges on land
        run: |
          python3 - <<'PY'
          import json, math, re
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from shapely.geometry import Polygon, Point
          from shapely.ops import unary_union
          from shapely.affinity import affine_transform

          data_path = Path('data/countries/stlucia.json')
          svg_path = Path('assets/images/stlucia/map-atlas-v1.svg')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          before = data['map']['bounds']
          assert before == {'north':14.45,'south':13.55,'west':-61.25,'east':-60.7}, 'Country bounds changed; halt rather than overwrite'
          after = {'north':14.16,'south':13.68,'west':-61.19,'east':-60.79}
          NS = 'http://www.w3.org/2000/svg'
          ET.register_namespace('', NS)
          root = ET.fromstring(svg_path.read_text(encoding='utf-8'))
          assert root.attrib.get('viewBox') == '0 0 1200 760'
          target_paths = [child for child in root if child.tag == f'{{{NS}}}path']
          context = [child for child in root if child.attrib.get('id') == 'geographic-context']
          assert len(target_paths) == len(context) == 1, 'unexpected map geometry; halt'
          target = target_paths[0]
          d = target.attrib['d']
          rings = []
          for segment in re.findall(r'M\s*([^Z]+)Z', d):
              xy = [(float(x),float(y)) for x,y in re.findall(r'(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)',segment)]
              if len(xy) > 2:
                  rings.append(Polygon(xy))
          assert rings and all(r.is_valid for r in rings), 'invalid source coastline'
          country = unary_union(rings)
          assert country.is_valid

          def fit(bounds):
              clat = (bounds['north']+bounds['south']) / 2
              c = math.cos(math.radians(clat))
              scale = min(1200 / ((bounds['east']-bounds['west']) * c), 760 / (bounds['north']-bounds['south']))
              offx = (1200 - (bounds['east']-bounds['west']) * c * scale)/2
              offy = (760 - (bounds['north']-bounds['south']) * scale)/2
              return c,scale,offx,offy
          c0,s0,ox0,oy0 = fit(before)
          c1,s1,ox1,oy1 = fit(after)
          sx = s1*c1/(s0*c0)
          sy = s1/s0
          tx = ox1 + (before['west']-after['west'])*s1*c1 - sx*ox0
          ty = oy1 + (after['north']-before['north'])*s1 - sy*oy0
          transformed = affine_transform(country,[sx,0,0,sy,tx,ty])
          xmin,ymin,xmax,ymax = transformed.bounds
          assert 30 < xmin < 950 and 40 < ymin < 200 and 650 < ymax < 730 and xmax < 1170, (xmin,ymin,xmax,ymax)
          safe_land = transformed.buffer(-14)
          assert not safe_land.is_empty

          def project(coords):
              return (ox1+(coords['longitude']-after['west'])*c1*s1,
                      oy1+(after['north']-coords['latitude'])*s1)

          # The coordinates are immutable. Only visual mapOffset is recomputed.
          capital = data['capital']
          capx,capy = project(capital['coordinates'])
          all_badges = []
          def find_badge(x,y, radius=120):
              candidates = []
              for step in range(0,radius+1,4):
                  for dy in range(-step,step+1,4):
                      for dx in range(-step,step+1,4):
                          if max(abs(dx),abs(dy)) != step: continue
                          px,py = x+dx,y+dy
                          if not safe_land.contains(Point(px,py)): continue
                          if any(math.hypot(px-bx,py-by) < 35 for bx,by in all_badges): continue
                          candidates.append((dx*dx+dy*dy,px,py))
                  if candidates:
                      candidates.sort()
                      return candidates[0][1:]
              raise RuntimeError(f'cannot place inland badge at {(x,y)}')

          cx,cy = find_badge(capx,capy)
          all_badges.append((cx,cy))
          capital['mapOffset']={'x':round((cx-capx)/12,4),'y':round((cy-capy)/7.6,4)}
          placements=[]
          # Place the narrow northern site first, then the crowded southwest.
          for idx in (0,2,3,4,5,6,1,7):
              scene = data['scenes'][idx]
              x,y = project(scene['coordinates'])
              px,py = find_badge(x,y,radius=145)
              scene['mapOffset']={'x':round((px-x)/12,4),'y':round((py-y)/7.6,4)}
              all_badges.append((px,py))
              placements.append((idx+1,round(px,1),round(py,1),round(math.hypot(px-x,py-y),1)))
          assert len(placements) == 8
          assert len({(round(x),round(y)) for x,y in all_badges}) == 9
          assert all(safe_land.contains(Point(px,py)) for px,py in all_badges)
          assert all(math.hypot(x1-x2,y1-y2)>=34.9 for i,(x1,y1) in enumerate(all_badges) for x2,y2 in all_badges[i+1:])

          # Transform the SAME approved source geometry, including genuine nearby land.
          # No invented coastline, border, or landmark is introduced.
          original_rect = next(child for child in root if child.tag == f'{{{NS}}}rect')
          group = ET.Element(f'{{{NS}}}g',{'id':'map-geography-zoom','transform':f'matrix({sx:.12f} 0 0 {sy:.12f} {tx:.12f} {ty:.12f})'})
          root.remove(context[0]);root.remove(target)
          group.append(context[0]);group.append(target)
          root.insert(list(root).index(original_rect)+1,group)
          root.set('data-map-projection','local-equirectangular-fit-v1')
          data['map']['bounds']=after
          data['map']['source'] += ' Review zoom 2026-09-23: only viewport changed; same approved verified geometry affinely reprojected to match Country map.bounds; marker geographic coordinates untouched, display offsets recomputed against real land polygon.'
          svg_path.write_text(ET.tostring(root,encoding='unicode')+'\n',encoding='utf-8')
          data_path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print('map bounds',after,'land bbox',tuple(round(v,1) for v in transformed.bounds))
          for p in sorted(placements):print('inland Scene',*p)
          print('capital',round(cx,1),round(cy,1))
          PY
          python3 -m json.tool data/countries/stlucia.json >/dev/null
          python3 - <<'PY'
          from xml.etree import ElementTree as ET
          root=ET.parse('assets/images/stlucia/map-atlas-v1.svg').getroot()
          assert root.attrib['viewBox']=='0 0 1200 760'
          assert any(child.attrib.get('id')=='map-geography-zoom' for child in root)
          print('SVG syntax and 1200x760 viewBox PASS')
          PY
      - name: Commit Country-only map revision, remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stlucia-map-zoom-once.yml
          git add data/countries/stlucia.json assets/images/stlucia/map-atlas-v1.svg
          git commit -m 'Zoom Saint Lucia true coastline and move Scene badges inland'
          git push origin HEAD:country/stlucia-map-zoom-review-20260923
