name: Deploy Country Preview to GitHub Pages

on:
  push:
    branches:
      - "country/**"
    paths:
      - ".github/preview-trigger/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image QA dependency
        run: python -m pip install --disable-pip-version-check --quiet pillow

      - name: Validate source syntax
        run: |
          python -m py_compile scripts/build_site.py scripts/validate_country.py scripts/audit_published_countries.py scripts/validate_images.py scripts/validate_lens_slugs.py scripts/new_country.py scripts/package_site.py scripts/build_cloudflare.py
          node --check assets/js/app.js
          node --check assets/js/top.js

      - name: Validate published renewal registry
        run: python scripts/audit_published_countries.py

      - name: Enforce renewed Country image hard gate
        run: python scripts/validate_images.py --mode hard

      - name: Build clean production package
        env:
          JOURNEY_ATLAS_SITE_URL: https://atlas.yagenji.com/
        run: python scripts/build_cloudflare.py

      - name: Validate packaged output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_redirects
          test -f dist/_headers
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/assets/css/country.css
          test -f dist/assets/js/app.js
          if find dist -type f \( -name '*.b64' -o -name '*.parts.json' \) | grep -q .; then
            echo 'encoded source files leaked into dist'
            exit 1
          fi

      - name: Browser smoke current Country
        run: |
          slug="${GITHUB_REF_NAME#country/}"
          slug="${slug%-renewal}"
          test -f "dist/countries/${slug}/index.html"
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo "No Chromium-compatible browser found on runner"
            exit 1
          fi
          python -m http.server 4173 --directory dist >/tmp/journey-atlas-preview-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          "$browser" --headless --no-sandbox --disable-gpu --virtual-time-budget=8000             --dump-dom "http://127.0.0.1:4173/countries/${slug}/" > "/tmp/${slug}-dom.html"
          python - "$slug" <<'PY'
          import re
          import sys
          from pathlib import Path

          slug = sys.argv[1]
          dom = Path(f"/tmp/{slug}-dom.html").read_text(encoding="utf-8")
          section = re.search(r'<section class="taste-section" id="taste-section"([^>]*)>', dom)
          if not section:
              raise SystemExit(f"{slug}: Taste section missing from rendered DOM")
          if "hidden" in section.group(1):
              raise SystemExit(f"{slug}: Taste section remains hidden after runtime render")

          cards = len(re.findall(r'class="taste-card(?:\s|"|$)', dom))
          images = len(re.findall(r'class="taste-card__img"', dom))
          if cards != 4 or images != 4:
              raise SystemExit(f"{slug}: expected 4 Taste cards/images, got cards={cards}, images={images}")
          if "taste-card--image-error" in dom:
              raise SystemExit(f"{slug}: at least one Taste image emitted a browser load error")
          if "food-" not in dom:
              raise SystemExit(f"{slug}: rendered Taste images have no food asset URL")
          print(f"{slug}: browser Taste smoke PASS ({cards} cards / {images} images)")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload clean site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
