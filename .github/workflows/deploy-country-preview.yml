name: Deploy Country Preview to GitHub Pages

on:
  push:
    branches:
      - "country/**"
    paths:
      - ".github/preview-trigger/**"
  workflow_dispatch:
    inputs:
      slug:
        description: "Country slug. Leave empty to derive from country/<slug> branch."
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages is one shared deployment surface for this repository. Keep the
# shared queue serialized to prevent one Country preview from racing another
# and overwriting an in-flight deployment. The targeted build below makes each
# queued preview short instead of paying an all-Country build cost.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve target Country
        id: target
        shell: bash
        env:
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          slug="${INPUT_SLUG:-}"
          if [ -z "$slug" ]; then
            slug="${GITHUB_REF_NAME#country/}"
            slug="${slug%-renewal}"
          fi
          if [ -z "$slug" ] || [ ! -f "data/countries/$slug.json" ]; then
            echo "Unable to resolve Country slug from ref=$GITHUB_REF_NAME input=${INPUT_SLUG:-<empty>}" >&2
            exit 1
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

          qa_scope="$(python3 - "$slug" <<'PY'
          import json
          import sys
          from pathlib import Path

          slug = sys.argv[1]
          published = False
          for name in ("atlas-destinations.json", "atlas-destinations-editorial.json"):
              path = Path("data") / name
              payload = json.loads(path.read_text(encoding="utf-8"))
              for row in payload.get("destinations", []):
                  if row.get("slug") == slug:
                      published = bool(row.get("atlasPublished"))
                      break
          print("published" if published else "unpublished-reviewable")
          PY
          )"
          echo "qa_scope=$qa_scope" >> "$GITHUB_OUTPUT"
          echo "Target Country: $slug ($qa_scope)"

      - name: Install targeted QA dependencies
        run: python -m pip install --disable-pip-version-check --quiet pillow selenium

      - name: Validate source syntax
        run: |
          python -m py_compile \
            scripts/build_site.py \
            scripts/build_country_preview_targeted.py \
            scripts/validate_country.py \
            scripts/validate_country_editorial_v2.py \
            scripts/validate_images.py \
            scripts/audit_country_image_delivery_targeted.py \
            scripts/qa_published_browser.py
          node --check assets/js/app.js

      - name: Validate target Country only
        shell: bash
        env:
          SLUG: ${{ steps.target.outputs.slug }}
        run: |
          set -euo pipefail
          python scripts/validate_country_editorial_v2.py "data/countries/$SLUG.json"
          python scripts/validate_country.py --strict "data/countries/$SLUG.json"
          python scripts/audit_country_image_delivery_targeted.py --slug "$SLUG"
          python scripts/validate_images.py --mode audit --slug "$SLUG"
          python scripts/validate_images.py --duplicates-only --slug "$SLUG"

      - name: Build local targeted Country preview
        env:
          TARGET_SLUGS: ${{ steps.target.outputs.slug }}
          JOURNEY_ATLAS_SITE_URL: http://127.0.0.1:4173/
        run: python scripts/build_country_preview_targeted.py

      - name: Start local targeted preview
        run: |
          python -m http.server 4173 --directory dist >/tmp/journey-atlas-country-preview.log 2>&1 &
          echo $! > /tmp/journey-atlas-country-preview.pid
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/journey-atlas-country-preview.log || true
          exit 1

      - name: Run target Desktop Tablet Mobile Browser QA
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-country-preview-output
          QA_SCOPE: ${{ steps.target.outputs.qa_scope }}
          QA_SLUGS: ${{ steps.target.outputs.slug }}
        run: python scripts/qa_published_browser.py

      - name: Stop local targeted preview
        if: always()
        run: |
          if [ -f /tmp/journey-atlas-country-preview.pid ]; then
            kill "$(cat /tmp/journey-atlas-country-preview.pid)" 2>/dev/null || true
          fi

      # Rebuild only the same target Country with production canonical metadata.
      # This remains a targeted sub-second package build; it does not regenerate
      # or validate unrelated Country pages.
      - name: Build deployable targeted Country preview
        env:
          TARGET_SLUGS: ${{ steps.target.outputs.slug }}
          JOURNEY_ATLAS_SITE_URL: https://atlas.yagenji.com/
        run: python scripts/build_country_preview_targeted.py

      - name: Validate targeted packaged output
        shell: bash
        env:
          SLUG: ${{ steps.target.outputs.slug }}
        run: |
          set -euo pipefail
          test -f "dist/countries/$SLUG/index.html"
          test -f "dist/data/countries/$SLUG.json"
          test -f dist/assets/css/country.css
          test -f dist/assets/js/app.js
          test -f dist/preview-build-meta.json
          test "$(find dist/data/countries -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')" = "1"
          test "$(find dist/countries -mindepth 2 -maxdepth 2 -type f -name 'index.html' | wc -l | tr -d ' ')" = "1"
          if find dist -type f \( -name '*.b64' -o -name '*.parts.json' \) | grep -q .; then
            echo 'encoded source files leaked into targeted preview'
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload targeted Country preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy targeted Country preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report Country review URL
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SLUG: ${{ steps.target.outputs.slug }}
        run: |
          review_url="${PAGE_URL%/}/countries/$SLUG/"
          echo "## Country review preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$review_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Review URL: $review_url"

      - name: Upload targeted Browser QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: country-preview-browser-qa-${{ steps.target.outputs.slug }}
          path: qa-country-preview-output/
          if-no-files-found: warn
          retention-days: 3
