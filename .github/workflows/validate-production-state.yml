name: Validate production state and QA routing

on:
  push:
    branches: ["main"]
    paths:
      - 'ops/country-production/**'
      - 'ops/country-production-policy.json'
      - 'ops/image-generation-policy.json'
      - 'data/countries/**'
      - 'data/atlas-destinations.json'
      - 'data/atlas-destinations-editorial.json'
      - 'scripts/country_production_state.py'
      - 'scripts/country_production_protocol_v2.py'
      - 'scripts/validate_production_state_routed.py'
      - 'scripts/classify_country_impact.py'
      - 'scripts/manage_review_preview_site.py'
      - 'scripts/externalize_review_preview_images.py'
      - '.github/workflows/validate-production-state.yml'
      - '.github/workflows/browser-country-qa.yml'
      - '.github/workflows/branch-hygiene.yml'
      - '.github/workflows/verify-production.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/deploy-country-preview.yml'
      - '.github/workflows/publish-country-queue.yml'
      - 'WORKFLOW.md'
      - 'docs/COUNTRY_PRODUCTION_STATE.md'
      - 'docs/COUNTRY_PRODUCTION_PROTOCOL_2.md'
      - 'docs/NEW_COUNTRY_START.md'
      - 'docs/COUNTRY_PAGE_TEMPLATE.md'
      - 'docs/CLOUDFLARE_PAGES.md'
      - 'docs/ILLUSTRATION_STYLE_GUIDE.md'
      - 'docs/SCENE_IMAGE_PRODUCTION.md'
      - 'docs/*_CONTENT_PLAN.md'
  pull_request:
    paths:
      - 'ops/country-production/**'
      - 'ops/country-production-policy.json'
      - 'ops/image-generation-policy.json'
      - 'data/countries/**'
      - 'data/atlas-destinations.json'
      - 'data/atlas-destinations-editorial.json'
      - 'scripts/country_production_state.py'
      - 'scripts/country_production_protocol_v2.py'
      - 'scripts/validate_production_state_routed.py'
      - 'scripts/classify_country_impact.py'
      - 'scripts/manage_review_preview_site.py'
      - 'scripts/externalize_review_preview_images.py'
      - '.github/workflows/validate-production-state.yml'
      - '.github/workflows/browser-country-qa.yml'
      - '.github/workflows/branch-hygiene.yml'
      - '.github/workflows/verify-production.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/deploy-country-preview.yml'
      - '.github/workflows/publish-country-queue.yml'
      - 'WORKFLOW.md'
      - 'docs/COUNTRY_PRODUCTION_STATE.md'
      - 'docs/COUNTRY_PRODUCTION_PROTOCOL_2.md'
      - 'docs/NEW_COUNTRY_START.md'
      - 'docs/COUNTRY_PAGE_TEMPLATE.md'
      - 'docs/CLOUDFLARE_PAGES.md'
      - 'docs/ILLUSTRATION_STYLE_GUIDE.md'
      - 'docs/SCENE_IMAGE_PRODUCTION.md'
      - 'docs/*_CONTENT_PLAN.md'
  workflow_dispatch:

concurrency:
  group: validate-production-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate automation syntax
        run: |
          python3 -m py_compile \
            scripts/country_production_state.py \
            scripts/country_production_protocol_v2.py \
            scripts/validate_production_state_routed.py \
            scripts/classify_country_impact.py \
            scripts/manage_review_preview_site.py \
            scripts/externalize_review_preview_images.py
          python3 scripts/classify_country_impact.py --self-test
          python3 scripts/country_production_protocol_v2.py self-test
          python3 scripts/manage_review_preview_site.py self-test
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/country_production_state.py")
          spec = importlib.util.spec_from_file_location("country_state", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          state = module.new_state({"slug": "test-slug", "nameEn": "Test Slug"})
          assert state["phase"] == "CONTENT"
          assert state["next"] == {"action": "COMPLETE_CONTENT_DESIGN", "asset": None}
          assert state["imageGenerationPolicy"]["revision"] == 6
          assert state["executionPolicy"]["sceneApproval"] == "BATCH"
          assert state["executionPolicy"]["tasteApproval"] == "BATCH"
          assert len(state["scenes"]) == 8
          assert len(state["taste"]) == 4
          assert all(item["state"] == "NOT_STARTED" for item in state["scenes"])
          assert all(item["state"] == "NOT_STARTED" for item in state["taste"])
          print("Initializer contract self-test passed")
          PY

      - name: Validate workflow YAML syntax
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for path in [
              Path(".github/workflows/browser-country-qa.yml"),
              Path(".github/workflows/verify-production.yml"),
              Path(".github/workflows/deploy-pages.yml"),
              Path(".github/workflows/deploy-country-preview.yml"),
              Path(".github/workflows/publish-country-queue.yml"),
              Path(".github/workflows/validate-production-state.yml"),
          ]:
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"YAML OK: {path}")
          PY

      - name: Validate canonical Country production state
        run: python3 scripts/validate_production_state_routed.py

      - name: Validate Content Plan / Production State separation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          forbidden = [
              "## Production state",
              "NEXT IMAGE",
              "Image state:",
              "## Production gates",
              "Current generation cursor",
              "Current cursor update",
          ]

          errors = []
          for path in sorted(Path("docs").glob("*_CONTENT_PLAN.md")):
              text = path.read_text(encoding="utf-8")
              for token in forbidden:
                  if token in text:
                      errors.append(f"{path}: forbidden operational token {token!r}")

          if errors:
              raise SystemExit("\n".join(errors))

          print("Content Plans contain editorial/design intent only.")
          PY
