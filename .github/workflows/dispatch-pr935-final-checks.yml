name: Dispatch PR935 final checks

on:
  push:
    branches:
      - system/map-context-shared-preparation
    paths:
      - '.github/workflows/dispatch-pr935-final-checks.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: system/map-context-shared-preparation
          fetch-depth: 0
      - name: Remove dispatcher and create final verification head
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/dispatch-pr935-final-checks.yml
          git add .github/workflows/dispatch-pr935-final-checks.yml
          git commit -m "Remove temporary PR935 final-check dispatcher"
          git push origin HEAD:system/map-context-shared-preparation
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Dispatch official final checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='system/map-context-shared-preparation'
          gh workflow run validate-country-data.yml --ref "$branch"
          gh workflow run browser-country-qa.yml --ref "$branch"
          gh workflow run map-context-preflight.yml --ref "$branch"
          echo "Dispatched official checks for $FINAL_SHA"
