name: Apply future Country region contract docs (temporary)

on:
  push:
    branches:
      - fix/region-contract-future-countries
    paths:
      - .github/workflows/apply-region-contract-docs-temp.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/region-contract-future-countries
          fetch-depth: 0
      - name: Apply docs and scaffold changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def repl(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if text.count(old)!=1: raise SystemExit(f'{path}: expected one match for {old[:60]!r}, got {text.count(old)}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          repl('docs/NEW_COUNTRY_START.md',
          'Taste画像は docs/TASTE_IMAGE_PRODUCTION.md に従ってください。\n\nContent Planは何を作るかだけを保持し、PHASE / NEXT IMAGE / APPROVED状態 / generation cursor / failure logを持たせないでください。',
          'Taste画像は docs/TASTE_IMAGE_PRODUCTION.md に従ってください。\n\n【Country region 表記の絶対ルール】\n- Country JSON の `region` は `data/region-taxonomy.json` をSingle Source of Truthとし、destination registryの `iso2` が所属するsubregionの `labelEn` をそのまま使用してください。subregionがない地域はtop-level `labelEn` を使用してください。\n- 表記形式は必ず `{TAXONOMY LABEL} / {整数緯度}°N|S` とします。例：`EAST ASIA / 35°N`、`SOUTHERN EUROPE / 42°N`。\n- `CENTRAL EUROPE`、`SOUTHEASTERN EUROPE`、`BALTIC SEA`、`NORTH ATLANTIC` のようなCountry独自分類や、`ATLANTIC`、`BLACK SEA`、`NORTHERN ASIA` 等の緯度以外のsuffixを追加してはいけません。\n- `scripts/new_country.py` で新規scaffoldを作る場合、taxonomy labelは自動で固定されます。Map bounds確定後に `python3 scripts/normalize_country_region_labels.py` を実行して代表緯度を付与し、`python3 scripts/audit_country_region_labels.py` を通してください。\n- 代表緯度は既存の妥当な整数緯度を維持し、未設定の場合はCountry map boundsの南北中央を整数丸めして決定します。推測で別の緯度を足さないでください。\n- Region auditがPASSするまでReview Package / Review Deploymentへ進んではいけません。\n\nContent Planは何を作るかだけを保持し、PHASE / NEXT IMAGE / APPROVED状態 / generation cursor / failure logを持たせないでください。')
          repl('docs/NEW_COUNTRY_START.md','→ Country JSON / taxonomy implementation\n→ validation','→ Country JSON / taxonomy implementation\n→ region normalization / audit\n→ validation')

          repl('docs/COUNTRY_TEMPLATE.md','## Information design\n\n### Common basic facts',
          '## Information design\n\n### Region metadata contract\n\n`region` is a controlled metadata field, not free editorial copy.\n\n- `data/region-taxonomy.json` is the Single Source of Truth for the region label.\n- Resolve the destination through `data/atlas-destinations.json` or `data/atlas-destinations-editorial.json`, use its `iso2`, and use the matching taxonomy subregion `labelEn` exactly. When a taxonomy region has no subregions, use its top-level `labelEn`.\n- Final format is exactly `{TAXONOMY LABEL} / {integer latitude}°N|S`.\n- Do not invent alternate geographic labels or non-latitude suffixes for an individual Country. Labels such as `CENTRAL EUROPE`, `SOUTHEASTERN EUROPE`, `BALTIC SEA`, `NORTH ATLANTIC`, `ATLANTIC`, or `BLACK SEA` are invalid unless they become an explicit taxonomy `labelEn`.\n- For a new scaffold, `scripts/new_country.py` locks the taxonomy label first. After final map bounds exist, run `python3 scripts/normalize_country_region_labels.py`; it preserves an existing valid integer latitude or derives one from the north/south map-bounds midpoint when latitude is missing.\n- Before Review Deployment, `python3 scripts/audit_country_region_labels.py` must pass. The primary Country validation workflow runs the same audit automatically.\n\n### Common basic facts')

          repl('docs/COUNTRY_PAGE_TEMPLATE.md','## 2. Hero\n\n- 1つの実在する風景を使う。',
          '## 2. Hero\n\n### 国名上部のRegion表記\n\n- `region` は自由記述ではなく `data/region-taxonomy.json` に従う。destination registryの `iso2` から対応する `labelEn` を決定する。\n- 最終表記は必ず `{TAXONOMY LABEL} / {整数緯度}°N|S` とする。\n- 国ごとに `CENTRAL EUROPE`、`SOUTHEASTERN EUROPE`、`BALTIC SEA`、`NORTH ATLANTIC` 等の独自地域名を作らない。海域名や大陸横断説明を緯度の代わりに付けない。\n- 新規CountryはMap bounds確定後に `scripts/normalize_country_region_labels.py` で正規化し、`scripts/audit_country_region_labels.py` をPASSしてからReview Deploymentへ進む。\n\n- 1つの実在する風景を使う。')
          repl('docs/COUNTRY_PAGE_TEMPLATE.md','7. Review Deploymentでは `atlasPublished:false` を維持し、ユーザー承認後のみ `true` にする。','7. `region` が `data/region-taxonomy.json` の `labelEn` と一致し、`{TAXONOMY LABEL} / {整数緯度}°N|S` 形式で、代表緯度がmap boundsと矛盾しない。\n8. Review Deploymentでは `atlasPublished:false` を維持し、ユーザー承認後のみ `true` にする。')

          repl('docs/COUNTRY_PRODUCTION_STATE.md',
          '3. build and QA Map;\n4. implement Country JSON and taxonomy;\n5. run source/data validation;\n6. prepare one Review Package integration;\n7. integrate to `main` once for review deployment;\n8. run targeted Desktop / Tablet / Mobile QA for that Country;\n9. write `phase: REVIEW`;\n10. present the canonical URL.',
          '3. build and QA Map;\n4. implement Country JSON and taxonomy;\n5. normalize `region` from `data/region-taxonomy.json` + final map bounds with `python3 scripts/normalize_country_region_labels.py`;\n6. require `python3 scripts/audit_country_region_labels.py` to pass;\n7. run source/data validation;\n8. prepare one Review Package integration;\n9. integrate to `main` once for review deployment;\n10. run targeted Desktop / Tablet / Mobile QA for that Country;\n11. write `phase: REVIEW`;\n12. present the canonical URL.')
          repl('docs/COUNTRY_PRODUCTION_STATE.md','Do not pause merely to report intermediate progress.\n\n## Review / publication','The Region implementation gate is mandatory for every new Country: `region` must use the taxonomy label for the destination ISO2 and the final `{TAXONOMY LABEL} / {integer latitude}°N|S` format. Country-specific geographic nicknames or sea/continental suffixes are not allowed in this field.\n\nDo not pause merely to report intermediate progress.\n\n## Review / publication')

          repl('scripts/new_country.py','REGISTRY_PATHS = [\n    ROOT / "data" / "atlas-destinations.json",\n    ROOT / "data" / "atlas-destinations-editorial.json",\n]\n','REGISTRY_PATHS = [\n    ROOT / "data" / "atlas-destinations.json",\n    ROOT / "data" / "atlas-destinations-editorial.json",\n]\nTAXONOMY_PATH = ROOT / "data" / "region-taxonomy.json"\n')
          repl('scripts/new_country.py','def blank_scene(index: int, slug: str) -> dict:\n','def taxonomy_region_for_iso2(iso2: str) -> str | None:\n    taxonomy = json.loads(TAXONOMY_PATH.read_text(encoding="utf-8"))\n    for region in taxonomy.get("regions", []):\n        subregions = region.get("subregions") or []\n        if subregions:\n            for subregion in subregions:\n                if iso2 in subregion.get("iso2", []):\n                    return subregion.get("labelEn")\n        elif iso2 in region.get("iso2", []):\n            return region.get("labelEn")\n    return None\n\n\ndef blank_scene(index: int, slug: str) -> dict:\n')
          repl('scripts/new_country.py','def scaffold(destination: dict) -> dict:\n    slug = destination["slug"]','def scaffold(destination: dict, region_label: str) -> dict:\n    slug = destination["slug"]')
          repl('scripts/new_country.py','        "region": "",','        "region": region_label,')
          repl('scripts/new_country.py','    if not destination:\n        parser.error(f"Unknown destination slug: {args.slug}")\n\n    output = COUNTRY_DIR / f"{args.slug}.json"','    if not destination:\n        parser.error(f"Unknown destination slug: {args.slug}")\n\n    region_label = taxonomy_region_for_iso2(destination.get("iso2", ""))\n    if not region_label:\n        parser.error(f"No region-taxonomy assignment for {args.slug}: {destination.get(\'iso2\')!r}")\n\n    output = COUNTRY_DIR / f"{args.slug}.json"')
          repl('scripts/new_country.py','    output.write_text(json.dumps(scaffold(destination), ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")\n    print(f"Created {output.relative_to(ROOT)}")\n    print("Next: fill content/assets, run strict validation, then set atlasPublished=true only when release-ready.")','    output.write_text(json.dumps(scaffold(destination, region_label), ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")\n    print(f"Created {output.relative_to(ROOT)}")\n    print(f"Region taxonomy label locked: {region_label}")\n    print("After map.bounds is final: run python3 scripts/normalize_country_region_labels.py, then python3 scripts/audit_country_region_labels.py.")\n    print("Next: fill content/assets, run strict validation, then set atlasPublished=true only when release-ready.")')
          PY
          git diff --check
          python3 -m py_compile scripts/new_country.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/NEW_COUNTRY_START.md docs/COUNTRY_TEMPLATE.md docs/COUNTRY_PAGE_TEMPLATE.md docs/COUNTRY_PRODUCTION_STATE.md scripts/new_country.py
          git commit -m "Apply region contract to future Country production"
          git push origin HEAD:fix/region-contract-future-countries
