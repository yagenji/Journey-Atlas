name: One-time Grenada production state reconciliation
on:
  push:
    branches: [country/grenada-state-review-sync-20260919]
    paths: ['.github/workflows/grenada-state-sync-once.yml']
permissions:
  contents: write
  actions: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify corrected live QA evidence and update only Grenada Production State
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/grenada-reviewed-live-qa
          gh run download 35375638056 --repo yagenji/Journey-Atlas --name production-reviewable-country-browser-qa --dir /tmp/grenada-reviewed-live-qa
          python3 - <<'PY'
          import copy, datetime, json
          from pathlib import Path
          qa=json.loads(Path('/tmp/grenada-reviewed-live-qa/report.json').read_text(encoding='utf-8'))
          assert qa.get('pass') is True and qa.get('failures') == []
          assert qa.get('baseUrl') == 'https://atlas.yagenji.com'
          results=qa.get('results') or []
          assert len(results)==3 and {r['viewport'] for r in results}=={'desktop','tablet','mobile'}
          for result in results:
              assert result['slug']=='grenada' and result['errors']==[]
              audit=result['audit']
              assert audit['robots'].replace(' ','').lower()=='noindex,follow'
              assert audit['nextRouteCount']==0 and audit['nextRoutesVisible'] is False
              assert audit['map']['imageLoaded'] is True
              assert not audit['imgFailures'] and not audit['missingBackgroundMedia']
              assert audit['overflow']['delta']==0 and not audit['clippedText']
          country=json.loads(Path('data/countries/grenada.json').read_text(encoding='utf-8'))
          assert country['slug']=='grenada' and country['publicationPipelineVersion']==2
          assert 'japanAreaComparison' not in country['map']
          assert country['nextRoutes']==[]
          assert len(country['scenes'])==8 and len(country['taste']['items'])==4
          assert len(country['signatureFacts'])==3
          assert [f['value'] for f in country['signatureFacts']]==['3島','7つ','2種類']
          assert all(not i['text'].startswith('例：') for i in country['travelScale']['items'])
          registry=json.loads(Path('data/atlas-destinations.json').read_text(encoding='utf-8'))
          rows=[r for r in registry['destinations'] if r.get('slug')=='grenada']
          assert len(rows)==1 and rows[0].get('atlasPublished') is False and not rows[0].get('href')
          p=Path('ops/country-production/grenada.json')
          state=json.loads(p.read_text(encoding='utf-8'))
          assert state['phase']=='ASSET_QA' and state['stateRevision']==14
          assert state['finalApproval']['state']=='PENDING'
          assert state['publication']['atlasPublished'] is False and state['publication']['state']=='DRAFT'
          assert state['assetHandoff']['state']=='PASS' and state['assetHandoff']['verifiedRasterCount']==13
          assert state['reviewPreview']['state']=='NOT_STARTED'  # No persistent branch preview was deployed.
          before=copy.deepcopy(state)
          state['phase']='REVIEW'  # Actual legacy canonical unpublished review, not a fictitious branch-preview gate.
          state['contentRef']='main'
          state['stateRef']='main'
          state['implementation']={'state':'DONE'}
          state['qa']={'state':'PASS','productionState':'NOT_STARTED'}  # Formal published-page verification remains pending.
          state['reviewDeployment']={
              'state':'DONE',
              'url':'https://atlas.yagenji.com/countries/grenada/',
              'productionVerification':'LIVE_BROWSER_QA_PASS',
              'atlasPublished':False,
              'linkedFromRegistry':False,
              'verifiedAt':'2026-09-19T02:42:13+09:00',
              'verificationBasis':'Cloudflare current/equivalent SHA verified by Actions run 35375638056 for correction commit 417ddabc2e1f3cdc81ca2b0387a64501b677fc2a; canonical unpublished-reviewable Desktop/Tablet/Mobile QA PASS, 0 failures.'
          }
          state['stateRevision']+=1
          state['updatedAt']=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat(timespec='seconds')
          state['next']={'action':'REVIEW_CANONICAL_URL','asset':None}
          for key in ('hero','scenes','taste','map','sceneBatchReview','tasteBatchReview','assetHandoff','finalApproval','publication','reviewPreview','executionPolicy'):
              assert state[key]==before[key],key
          p.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('STATE_RECONCILED phase=REVIEW ref=main reviewDeployment=DONE next=REVIEW_CANONICAL_URL approval=PENDING published=false')
          PY
          python3 scripts/validate_production_state_routed.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/country-production/grenada.json
          git commit -m 'Reconcile Grenada State with verified unpublished canonical review'
          git push origin HEAD:country/grenada-state-review-sync-20260919