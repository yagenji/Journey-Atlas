name: Normalize Saint Vincent approved delivery once

on:
  push:
    branches:
      - country/stvincentgrenadines
    paths:
      - ".github/workflows/normalize-stvincent-approved-once.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: country/stvincentgrenadines
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install Pillow
      - name: Normalize and move exact preserved delivery assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import json, shutil

          root = Path("assets/images/stvincentgrenadines")
          approved = root / "approved"
          approved.mkdir(exist_ok=True)

          crop_scenes = [1, 3, 4, 5, 6, 7]
          for n in crop_scenes:
              path = root / f"scene-{n}.webp"
              with Image.open(path) as im:
                  if im.size != (1672, 941):
                      raise SystemExit(f"{path}: unexpected source size {im.size}")
                  out = ImageOps.fit(im, (1200, 800), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
                  out.save(path, "WEBP", quality=92, method=6)
              with Image.open(path) as check:
                  if check.format != "WEBP" or check.size != (1200, 800):
                      raise SystemExit(f"{path}: delivery verification failed")
              print(f"{path}: 1672x941 -> centered 3:2 crop -> 1200x800")

          names = ["hero.webp"] + [f"scene-{n}.webp" for n in range(1,9)] + [f"food-{n}.webp" for n in range(1,5)]
          for name in names:
              src = root / name
              dst = approved / name
              if not src.is_file():
                  raise SystemExit(f"missing {src}")
              shutil.move(str(src), str(dst))
              print(f"moved {src} -> {dst}")

          country_path = Path("data/countries/stvincentgrenadines.json")
          country = json.loads(country_path.read_text(encoding="utf-8"))
          prefix = "assets/images/stvincentgrenadines/approved/"
          country["hero"]["image"] = prefix + "hero.webp"
          for idx, item in enumerate(country["scenes"], 1):
              item["image"] = prefix + f"scene-{idx}.webp"
          for idx, item in enumerate(country["taste"]["items"], 1):
              item["image"] = prefix + f"food-{idx}.webp"

          country["scenes"][0]["mapOffset"] = {"x": -3.75, "y": 1.2}
          country["scenes"][3]["mapOffset"] = {"x": -2.5, "y": 3.25}
          for fact in country["facts"]:
              if fact.get("label") == "人口":
                  fact["value"] = "約11万人（2021年・世界銀行、外務省掲載値）"
          country["sources"]["map"] = country["sources"]["geometry"]
          for item in country.get("travelTrivia", []):
              if item.get("sourceKey") == "breadfruit":
                  item["sourceKey"] = "food"
          country["updatedAt"] = "2026-09-24"
          country_path.write_text(json.dumps(country, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          state_path = Path("ops/country-production/stvincentgrenadines.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          state["hero"]["asset"] = prefix + "hero.webp"
          for idx, item in enumerate(state["scenes"], 1):
              item["asset"] = prefix + f"scene-{idx}.webp"
          for idx, item in enumerate(state["taste"], 1):
              item["asset"] = prefix + f"food-{idx}.webp"
          state["stateRevision"] = int(state.get("stateRevision", 0)) + 1
          state["updatedAt"] = "2026-09-24T00:20:00+09:00"
          state["assetHandoff"]["verificationBasis"] = (
              "Exact user-handoff raster set from upload commit ce673cdcfd63a194fcced6912b38c5a0c54fe567 "
              "is preserved without regeneration. Canonical copies were matched by Git blob identity before delivery normalization. "
              "All production rasters now live under approved/. Six original 1672x941 Scene deliveries were centered-cropped only "
              "to the required 3:2 frame and resized to 1200x800; two 1536x1024 Scenes and four 1536x1024 Taste images were resized "
              "to 1200x800 without crop. The Hero remains its preserved 1536x1024 delivery. Missing original generation UUIDs are "
              "intentionally not fabricated. Final delivery blobs are pinned by the closed-provenance validator."
          )
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit normalized approved delivery and retire workflow
        run: |
          rm .github/workflows/normalize-stvincent-approved-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/images/stvincentgrenadines data/countries/stvincentgrenadines.json ops/country-production/stvincentgrenadines.json .github/workflows/normalize-stvincent-approved-once.yml
          git commit -m "Normalize Saint Vincent approved delivery"
          git push origin HEAD:country/stvincentgrenadines
