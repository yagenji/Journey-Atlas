name: Normalize Country region labels (temporary)

on:
  push:
    branches:
      - fix/country-region-label-audit
    paths:
      - scripts/normalize_country_region_labels.py
      - .github/workflows/normalize-country-region-labels-temp.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/country-region-label-audit
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize region labels
        run: python scripts/normalize_country_region_labels.py
      - name: Commit normalized Country data
        run: |
          if git diff --quiet -- data/countries; then
            echo "No Country region changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/countries
          git commit -m "Normalize Country region labels"
          git push origin HEAD:fix/country-region-label-audit
