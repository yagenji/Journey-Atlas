name: Monaco OSM land-area relation QA

on:
  push:
    branches: ["qa-monaco-live"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Reconstruct OSM relation 36990
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -A 'JourneyAtlasQA/1.0' \
            'https://api.openstreetmap.org/api/0.6/relation/36990/full' \
            -o /tmp/land.osm
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import math, json

          root=ET.parse('/tmp/land.osm').getroot()
          nodes={int(n.attrib['id']):(float(n.attrib['lon']),float(n.attrib['lat'])) for n in root.findall('node')}
          ways={}
          for w in root.findall('way'):
              ways[int(w.attrib['id'])]=[int(nd.attrib['ref']) for nd in w.findall('nd')]
          rel=next(r for r in root.findall('relation') if int(r.attrib['id'])==36990)
          members=[]
          for m in rel.findall('member'):
              if m.attrib['type']=='way':
                  wid=int(m.attrib['ref']); role=m.attrib.get('role','')
                  if wid in ways:
                      members.append((wid,role,ways[wid]))
          tags={t.attrib['k']:t.attrib['v'] for t in rel.findall('tag')}
          print('REL_TAGS='+json.dumps(tags,ensure_ascii=False,sort_keys=True))
          print('WAY_MEMBERS='+str(len(members)))
          print('ROLES='+json.dumps({r:sum(1 for _,rr,_ in members if rr==r) for r in sorted(set(rr for _,rr,_ in members))}))
          for wid,role,seq in members:
              print(f'MEMBER way={wid} role={role} nodes={len(seq)} first={seq[0]} last={seq[-1]}')

          outer=[list(seq) for _,role,seq in members if role in ('outer','')]
          if not outer: raise SystemExit('no outer ways')
          rings=[]
          while outer:
              chain=outer.pop(0)
              changed=True
              while chain[0]!=chain[-1] and changed:
                  changed=False
                  for i,s in enumerate(outer):
                      if chain[-1]==s[0]:
                          chain.extend(s[1:]); outer.pop(i); changed=True; break
                      if chain[-1]==s[-1]:
                          chain.extend(list(reversed(s[:-1]))); outer.pop(i); changed=True; break
                      if chain[0]==s[-1]:
                          chain=s[:-1]+chain; outer.pop(i); changed=True; break
                      if chain[0]==s[0]:
                          chain=list(reversed(s[1:]))+chain; outer.pop(i); changed=True; break
              rings.append(chain)
          print('RINGS='+str(len(rings)))
          for idx,chain in enumerate(rings):
              print(f'RING_{idx}_NODES={len(chain)} CLOSED={chain[0]==chain[-1]}')

          closed=[c for c in rings if c[0]==c[-1]]
          if not closed: raise SystemExit('no closed ring')
          chain=max(closed,key=len)
          coords=[nodes[n] for n in chain]
          lat0=sum(y for x,y in coords)/len(coords)
          kx=111.320*math.cos(math.radians(lat0)); ky=110.574
          pts=[(x*kx,y*ky) for x,y in coords]
          area=abs(sum(x1*y2-x2*y1 for (x1,y1),(x2,y2) in zip(pts,pts[1:])))/2
          print(f'AREA_KM2={area:.6f}')
          print(f'OFFICIAL_DELTA_PERCENT={(area/2.084-1)*100:.3f}')
          print(f'BBOX={min(x for x,y in coords)},{min(y for x,y in coords)},{max(x for x,y in coords)},{max(y for x,y in coords)}')
          print('COORDS='+json.dumps(coords,separators=(',',':')))
          PY
