name: Monaco final live map QA

on:
  push:
    branches: ["qa-monaco-live"]
    paths-ignore:
      - "qa-output/live-map/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
      - name: Wait for current map on production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            curl -fsSL https://atlas.yagenji.com/assets/images/monaco/map-atlas-v1.svg -o /tmp/map.svg
            curl -fsSL https://atlas.yagenji.com/data/countries/monaco.json -o /tmp/country.json
            if grep -Fq 'OpenStreetMap relation 36990' /tmp/map.svg \
              && grep -Fq '2.083473 km' /tmp/map.svg \
              && grep -Fq 'OpenStreetMap relation 36990' /tmp/country.json; then
              echo "PRODUCTION_MAP=CURRENT"
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "production map did not update"
              exit 1
            fi
            sleep 5
          done
          grep -Fq 'viewBox="0 0 1200 760"' /tmp/map.svg
          ! grep -Fq '<ellipse' /tmp/map.svg
          ! grep -Fq '<radialGradient' /tmp/map.svg
          echo "ELLIPSE=0"
          echo "RADIAL_GRADIENT=0"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run responsive map browser QA
        shell: bash
        run: |
          mkdir -p qa-output/live-map
          cat > qa-map.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const url='https://atlas.yagenji.com/countries/monaco/';
            const viewports=[
              {name:'desktop',width:1440,height:1100},
              {name:'tablet',width:820,height:1180},
              {name:'mobile',width:390,height:844},
            ];
            const browser=await chromium.launch({headless:true});
            const reports=[];
            let failures=0;
            for(const vp of viewports){
              const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
              const consoleErrors=[], pageErrors=[], failedRequests=[];
              page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('requestfailed',r=>failedRequests.push(r.url()+' :: '+(r.failure()?.errorText||'')));
              const response=await page.goto(url,{waitUntil:'networkidle',timeout:60000});
              const map=page.locator('#country-map-art');
              await map.scrollIntoViewIfNeeded();
              await page.waitForFunction(() => {
                const img=document.querySelector('#country-map-art .map-base');
                return !!(img && img.complete && img.naturalWidth>0);
              },null,{timeout:30000});
              await page.waitForTimeout(700);
              const report=await page.evaluate(() => {
                const map=document.querySelector('#country-map-art');
                const mapBase=map?.querySelector('.map-base');
                const rect=map.getBoundingClientRect();
                const els=[...document.querySelectorAll('#map-markers > *')];
                const markers=els.map(el=>{
                  const r=el.getBoundingClientRect();
                  return {
                    label:el.getAttribute('aria-label')||'',
                    cls:el.className,
                    x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom,
                    leftStyle:parseFloat(el.style.left),topStyle:parseFloat(el.style.top)
                  };
                });
                const overlaps=[];
                for(let i=0;i<markers.length;i++){
                  for(let j=i+1;j<markers.length;j++){
                    const a=markers[i],b=markers[j];
                    const ix=Math.max(0,Math.min(a.right,b.right)-Math.max(a.x,b.x));
                    const iy=Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.y,b.y));
                    if(ix*iy>25) overlaps.push({a:a.label,b:b.label,area:Math.round(ix*iy)});
                  }
                }
                const outOfBounds=markers.filter(m=>m.leftStyle<0||m.leftStyle>100||m.topStyle<0||m.topStyle>100).map(m=>m.label);
                return {
                  mapLoaded:!!(mapBase && mapBase.complete && mapBase.naturalWidth>0),
                  mapSrc:mapBase?.src||'',
                  mapRect:{x:rect.x,y:rect.y,w:rect.width,h:rect.height},
                  markerCount:markers.length,
                  sceneMarkerCount:document.querySelectorAll('#map-markers .map-marker').length,
                  overlaps,
                  outOfBounds,
                  bodyOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                  pageCountry:document.documentElement.dataset.country,
                  robots:document.querySelector('meta[name="robots"]')?.content||''
                };
              });
              const checks={
                http200:response?.status()===200,
                monaco:report.pageCountry==='monaco',
                noindex:report.robots==='noindex,follow',
                mapLoaded:report.mapLoaded,
                currentMap:report.mapSrc.includes('/assets/images/monaco/map-atlas-v1.svg'),
                markers:report.markerCount===10,
                sceneMarkers:report.sceneMarkerCount===8,
                noMarkerOverlap:report.overlaps.length===0,
                markersInCanvas:report.outOfBounds.length===0,
                noHorizontalOverflow:report.bodyOverflow<=1,
                noConsoleErrors:consoleErrors.length===0,
                noPageErrors:pageErrors.length===0,
                noFailedRequests:failedRequests.length===0
              };
              const failed=Object.entries(checks).filter(([,v])=>!v).map(([k])=>k);
              failures+=failed.length;
              const out={viewport:vp,checks,failed,...report,consoleErrors,pageErrors,failedRequests};
              reports.push(out);
              console.log('\n=== '+vp.name.toUpperCase()+' ===');
              console.log(JSON.stringify(out));
              await map.screenshot({path:`qa-output/live-map/monaco-map-${vp.name}.png`});
              await page.close();
            }
            await browser.close();
            fs.writeFileSync('qa-output/live-map/report.json',JSON.stringify(reports,null,2));
            if(failures){console.error('HARD_FAILURE_COUNT='+failures);process.exit(1)}
            console.log('HARD_FAILURE_COUNT=0');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node qa-map.js
      - name: Commit live map QA screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-output/live-map/
          git diff --cached --quiet && exit 0
          git commit -m "qa: capture Monaco current live map"
          git push
