name: Monaco final publication QA

on:
  push:
    branches: ["qa-monaco-live"]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Monaco published production state
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            curl -fsSL https://atlas.yagenji.com/countries/monaco/ -o /tmp/page.html
            curl -fsSL https://atlas.yagenji.com/data/countries/monaco.json -o /tmp/country.json
            curl -fsSL https://atlas.yagenji.com/data/atlas-destinations.json -o /tmp/dest.json
            curl -fsSL https://atlas.yagenji.com/sitemap.xml -o /tmp/sitemap.xml
            curl -fsSL https://atlas.yagenji.com/ -o /tmp/top.html
            curl -fsSL https://atlas.yagenji.com/assets/images/monaco/map-atlas-v1.svg -o /tmp/map.svg

            if grep -Fq '<meta name="robots" content="index,follow">' /tmp/page.html \
              && grep -Fq 'https://atlas.yagenji.com/countries/monaco/' /tmp/sitemap.xml \
              && grep -Eq 'href="(\./)?countries/monaco/|href="/countries/monaco/' /tmp/top.html \
              && grep -Fq '"atlasPublished": true' /tmp/dest.json \
              && grep -Fq 'モナコとインドネシアの国旗はよく似ている' /tmp/country.json \
              && grep -Fq '小国の日常文化まで見てみたい人' /tmp/country.json \
              && grep -Fq '土地の家庭的な食文化を知る入口になる' /tmp/country.json \
              && grep -Fq 'OpenStreetMap relation 36990' /tmp/map.svg; then
              echo "PRODUCTION_PUBLICATION_STATE=UPDATED"
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "production publication state did not update"
              exit 1
            fi
            sleep 5
          done

          ! grep -Fq '<ellipse' /tmp/map.svg
          ! grep -Fq '<radialGradient' /tmp/map.svg
          echo "SITEMAP_MONACO=PASS"
          echo "TOP_LINK_MONACO=PASS"
          echo "ROBOTS_INDEX_FOLLOW=PASS"
          echo "EDITORIAL_FIXES=PASS"
          echo "MAP_FORBIDDEN_ELEMENTS=0"

      - name: Install browser QA tools
        run: |
          npm install --no-save playwright@1.55.0 axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: Run live browser QA
        shell: bash
        run: |
          cat > qa.js <<'NODE'
          const { chromium } = require('playwright');
          const axeSource = require('axe-core').source;
          (async () => {
            const url='https://atlas.yagenji.com/countries/monaco/';
            const viewports=[
              {name:'desktop',width:1440,height:1100},
              {name:'tablet',width:820,height:1180},
              {name:'mobile',width:390,height:844},
            ];
            const browser=await chromium.launch({headless:true});
            let failures=0;
            for(const vp of viewports){
              const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
              const consoleErrors=[], pageErrors=[], failedRequests=[];
              page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('requestfailed',r=>failedRequests.push(r.url()+' :: '+(r.failure()?.errorText||'')));
              const response=await page.goto(url,{waitUntil:'networkidle',timeout:60000});
              await page.waitForSelector('.country-page',{state:'visible',timeout:30000});
              await page.waitForTimeout(800);
              const report=await page.evaluate(() => {
                const markers=[...document.querySelectorAll('#map-markers > *')].map(el=>{
                  const r=el.getBoundingClientRect();
                  return {label:el.getAttribute('aria-label')||'',x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom};
                });
                const overlaps=[];
                for(let i=0;i<markers.length;i++){
                  for(let j=i+1;j<markers.length;j++){
                    const a=markers[i],b=markers[j];
                    const ix=Math.max(0,Math.min(a.right,b.right)-Math.max(a.x,b.x));
                    const iy=Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.y,b.y));
                    if(ix*iy>25) overlaps.push({a:a.label,b:b.label,area:Math.round(ix*iy)});
                  }
                }
                const mapBase=document.querySelector('#country-map-art .map-base');
                return {
                  country:document.documentElement.dataset.country,
                  robots:document.querySelector('meta[name="robots"]')?.content||'',
                  canonical:document.querySelector('link[rel="canonical"]')?.href||'',
                  theme:[...document.querySelectorAll('#country-theme-list .country-theme-chip')].map(x=>x.textContent.trim()),
                  scenes:document.querySelectorAll('#scene-cards .scene-card').length,
                  encounters:document.querySelectorAll('#encounters > *').length,
                  signature:document.querySelectorAll('#signature-facts > *').length,
                  extras:document.querySelectorAll('#atlas-extras-grid > *').length,
                  trivia:document.querySelectorAll('#travel-trivia-grid > *').length,
                  seasons:document.querySelectorAll('#seasons > *').length,
                  personas:document.querySelectorAll('#personas > *').length,
                  tips:document.querySelectorAll('#tips > *').length,
                  related:document.querySelectorAll('#related > *').length,
                  markers:markers.length,
                  sceneMarkers:document.querySelectorAll('#map-markers .map-marker').length,
                  overlaps,
                  mapLoaded:!!(mapBase&&mapBase.complete&&mapBase.naturalWidth>0),
                  horizontalOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                  text:document.body.innerText
                };
              });
              await page.addScriptTag({content:axeSource});
              const axe=await page.evaluate(async()=>await axe.run(document,{
                runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa']}
              }));
              const serious=axe.violations.filter(v=>['critical','serious'].includes(v.impact));
              const checks={
                http200:response?.status()===200,
                country:report.country==='monaco',
                indexFollow:report.robots==='index,follow',
                canonical:report.canonical==='https://atlas.yagenji.com/countries/monaco/',
                theme:report.theme.length===1&&report.theme[0]==='街を歩く',
                scenes:report.scenes===8,
                encounters:report.encounters===8,
                signature:report.signature===3,
                extras:report.extras===6,
                trivia:report.trivia===5,
                seasons:report.seasons===4,
                personas:report.personas===3,
                tips:report.tips===3,
                related:report.related===3,
                markers:report.markers===10&&report.sceneMarkers===8,
                noMarkerOverlap:report.overlaps.length===0,
                mapLoaded:report.mapLoaded,
                noHorizontalOverflow:report.horizontalOverflow<=1,
                flagFix:report.text.includes('モナコとインドネシアの国旗はよく似ている'),
                personaFix:report.text.includes('小国の日常文化まで見てみたい人'),
                barbFix:report.text.includes('土地の家庭的な食文化を知る入口になる'),
                noConsoleErrors:consoleErrors.length===0,
                noPageErrors:pageErrors.length===0,
                noFailedRequests:failedRequests.length===0,
                noSeriousA11y:serious.length===0
              };
              const failed=Object.entries(checks).filter(([,v])=>!v).map(([k])=>k);
              failures+=failed.length;
              console.log('\n=== '+vp.name.toUpperCase()+' ===');
              console.log('CHECKS '+JSON.stringify(checks));
              console.log('FAILED '+JSON.stringify(failed));
              console.log('MARKER_OVERLAPS '+JSON.stringify(report.overlaps));
              console.log('CONSOLE_ERRORS '+JSON.stringify(consoleErrors));
              console.log('PAGE_ERRORS '+JSON.stringify(pageErrors));
              console.log('FAILED_REQUESTS '+JSON.stringify(failedRequests));
              console.log('AXE_SERIOUS '+JSON.stringify(serious.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.length}))));
              await page.close();
            }
            await browser.close();
            if(failures){console.error('HARD_FAILURE_COUNT='+failures);process.exit(1)}
            console.log('HARD_FAILURE_COUNT=0');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node qa.js
