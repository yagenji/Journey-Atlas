name: Monaco geodesic land-area QA

on:
  push:
    branches: ["qa-monaco-live"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install pyproj
        run: pip install pyproj
      - name: Reconstruct OSM relation 36990 and measure geodesically
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -A 'JourneyAtlasQA/1.0' \
            'https://api.openstreetmap.org/api/0.6/relation/36990/full' \
            -o /tmp/land.osm
          curl -fsSL \
            'https://raw.githubusercontent.com/BrickHario/wordOrigin/669fa71d233a7c738d937f6cda4f8bb18d48ae57/data/MCO.geojson' \
            -o /tmp/old.json
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import json
          from pyproj import Geod

          geod=Geod(ellps='WGS84')

          def polygon_area(coords):
              lons=[p[0] for p in coords]
              lats=[p[1] for p in coords]
              a,_=geod.polygon_area_perimeter(lons,lats)
              return abs(a)/1_000_000

          root=ET.parse('/tmp/land.osm').getroot()
          nodes={int(n.attrib['id']):(float(n.attrib['lon']),float(n.attrib['lat'])) for n in root.findall('node')}
          ways={int(w.attrib['id']):[int(nd.attrib['ref']) for nd in w.findall('nd')] for w in root.findall('way')}
          rel=next(r for r in root.findall('relation') if int(r.attrib['id'])==36990)
          members=[(int(m.attrib['ref']),m.attrib.get('role','')) for m in rel.findall('member') if m.attrib['type']=='way']
          outer=[list(ways[wid]) for wid,role in members if role in ('outer','') and wid in ways]

          rings=[]
          while outer:
              chain=outer.pop(0)
              changed=True
              while chain[0]!=chain[-1] and changed:
                  changed=False
                  for i,s in enumerate(outer):
                      if chain[-1]==s[0]:
                          chain.extend(s[1:]); outer.pop(i); changed=True; break
                      if chain[-1]==s[-1]:
                          chain.extend(list(reversed(s[:-1]))); outer.pop(i); changed=True; break
                      if chain[0]==s[-1]:
                          chain=s[:-1]+chain; outer.pop(i); changed=True; break
                      if chain[0]==s[0]:
                          chain=list(reversed(s[1:]))+chain; outer.pop(i); changed=True; break
              if chain[0]!=chain[-1]:
                  raise SystemExit('unclosed ring')
              rings.append([nodes[n] for n in chain])

          areas=[polygon_area(r) for r in rings]
          total=sum(areas)

          old=json.load(open('/tmp/old.json'))['features'][0]['geometry']
          old_rings=old['coordinates'] if old['type']=='Polygon' else [r for p in old['coordinates'] for r in p]
          old_area=sum(polygon_area(r) for r in old_rings)

          official=2.084
          print('RING_COUNT='+str(len(rings)))
          for i,(r,a) in enumerate(zip(rings,areas)):
              print(f'RING_{i}_AREA_GEODESIC_KM2={a:.6f}')
              print(f'RING_{i}_POINTS={len(r)}')
          print(f'CURRENT_OSM_GEODESIC_KM2={total:.6f}')
          print(f'OLD_SOURCE_GEODESIC_KM2={old_area:.6f}')
          print(f'OFFICIAL_KM2={official:.6f}')
          print(f'CURRENT_DELTA_PERCENT={(total/official-1)*100:.3f}')
          print(f'OLD_DELTA_PERCENT={(old_area/official-1)*100:.3f}')
          print(f'CURRENT_MINUS_OLD_KM2={total-old_area:.6f}')
          PY
