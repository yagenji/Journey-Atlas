name: Monaco Mareterra geometry QA

on:
  push:
    branches: ["qa-monaco-live"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Mareterra land geometry
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -A 'JourneyAtlasQA/1.0 (https://atlas.yagenji.com/)' \
            'https://nominatim.openstreetmap.org/search?q=Mareterra%2C%20Monaco&format=geojson&polygon_geojson=1&limit=10' \
            -o /tmp/mareterra.json
          python3 - <<'PY'
          import json, math
          def rings(g):
              if g['type']=='Polygon': return g['coordinates']
              if g['type']=='MultiPolygon': return [r for p in g['coordinates'] for r in p]
              return []
          def area(g):
              total=0
              for ring in rings(g):
                  lat0=sum(p[1] for p in ring)/len(ring)
                  kx=111.320*math.cos(math.radians(lat0)); ky=110.574
                  pts=[(p[0]*kx,p[1]*ky) for p in ring]
                  total += abs(sum(x1*y2-x2*y1 for (x1,y1),(x2,y2) in zip(pts,pts[1:]+pts[:1])))/2
              return total
          j=json.load(open('/tmp/mareterra.json'))
          for i,f in enumerate(j.get('features',[])):
              p=f.get('properties',{})
              print('CANDIDATE',i)
              print('DISPLAY',p.get('display_name'))
              print('TYPE',p.get('type'),'CLASS',p.get('category'),'OSM',p.get('osm_type'),p.get('osm_id'))
              print('GEOM',f['geometry']['type'],'AREA_KM2',area(f['geometry']),'BBOX',f.get('bbox'))
              print('POINTS',sum(len(r) for r in rings(f['geometry'])))
          PY
