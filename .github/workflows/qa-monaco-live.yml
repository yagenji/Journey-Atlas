name: Monaco production state probe

on:
  push:
    branches: ["qa-monaco-live"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live publication state
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L -D /tmp/page.h https://atlas.yagenji.com/countries/monaco/ -o /tmp/page.html
          curl -fsSL https://atlas.yagenji.com/data/countries/monaco.json -o /tmp/country.json
          curl -fsSL https://atlas.yagenji.com/data/atlas-destinations.json -o /tmp/dest.json
          curl -fsSL https://atlas.yagenji.com/sitemap.xml -o /tmp/sitemap.xml
          curl -fsSL https://atlas.yagenji.com/assets/images/monaco/map-atlas-v1.svg -o /tmp/map.svg

          echo "=== PAGE ==="
          head -30 /tmp/page.h
          grep -Eo '<meta name="robots" content="[^"]+"|<title>[^<]+' /tmp/page.html | head -10 || true

          echo "=== REGISTRY ==="
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/dest.json'))
          m=next((x for x in j.get('destinations',[]) if x.get('slug')=='monaco'),None)
          print(m)
          PY

          echo "=== SITEMAP ==="
          grep -o 'https://atlas.yagenji.com/countries/monaco/' /tmp/sitemap.xml || true

          echo "=== CONTENT ==="
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/country.json'))
          print('flag=', next((x['title'] for x in c['travelTrivia'] if 'flag' in x['topicKey']), None))
          print('persona=', c['personas'][2]['title'])
          print('barb=', next((x['text'] for x in c['atlasExtras'] if x['topicKey']=='barbagiuan-monegasque-specialty'), None))
          print('map_source=', c['map']['source'])
          PY

          echo "=== MAP ==="
          grep -o 'OpenStreetMap relation 36990[^<]*' /tmp/map.svg | head -1 || true
          if grep -q '<ellipse' /tmp/map.svg; then echo ELLIPSE=1; else echo ELLIPSE=0; fi
          if grep -q '<radialGradient' /tmp/map.svg; then echo RADIAL=1; else echo RADIAL=0; fi
