name: Monaco browser QA

on:
  push:
    branches: ["qa-monaco-live"]
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser QA tools
        run: |
          npm install --no-save playwright@1.55.0 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Run live responsive and accessibility QA
        shell: bash
        run: |
          cat > qa.js <<'NODE'
          const { chromium } = require('playwright');
          const axeSource = require('axe-core').source;
          (async () => {
          const url = 'https://atlas.yagenji.com/countries/monaco/';
          const viewports = [
            {name:'desktop', width:1440, height:1100},
            {name:'tablet', width:820, height:1180},
            {name:'mobile', width:390, height:844},
          ];
          const browser = await chromium.launch({headless:true});
          let hardFailures = 0;

          for (const vp of viewports) {
            const page = await browser.newPage({viewport:{width:vp.width,height:vp.height}});
            const consoleErrors = [];
            const pageErrors = [];
            const failedRequests = [];
            page.on('console', msg => { if (msg.type()==='error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => pageErrors.push(String(err)));
            page.on('requestfailed', req => failedRequests.push(req.url()+' :: '+(req.failure()?.errorText||'')));

            const response = await page.goto(url,{waitUntil:'networkidle',timeout:60000});
            await page.waitForSelector('.country-page',{state:'visible',timeout:30000});
            await page.waitForTimeout(1200);

            const report = await page.evaluate(() => {
              const visible = el => {
                if(!el) return false;
                const s=getComputedStyle(el), r=el.getBoundingClientRect();
                return s.display!=='none' && s.visibility!=='hidden' && Number(s.opacity)!==0 && r.width>0 && r.height>0;
              };
              const count = sel => document.querySelectorAll(sel).length;
              const bbox = sel => {
                const el=document.querySelector(sel); if(!el) return null;
                const r=el.getBoundingClientRect();
                return {x:r.x,y:r.y,w:r.width,h:r.height,b:r.bottom,r:r.right};
              };
              const bodyOverflow = document.documentElement.scrollWidth - document.documentElement.clientWidth;
              const hero = document.querySelector('.hero-art');
              const heroStyle = hero ? getComputedStyle(hero) : null;
              const map = document.querySelector('#country-map-art');
              const mapStyle = map ? getComputedStyle(map) : null;
              const markerEls=[...document.querySelectorAll('#map-markers > *')];
              const markerRects=markerEls.map((el,i)=>{
                const r=el.getBoundingClientRect();
                return {i,cls:el.className,label:el.getAttribute('aria-label')||'',x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom};
              });
              const intersections=[];
              for(let i=0;i<markerRects.length;i++){
                for(let j=i+1;j<markerRects.length;j++){
                  const a=markerRects[i],b=markerRects[j];
                  const ix=Math.max(0,Math.min(a.right,b.right)-Math.max(a.x,b.x));
                  const iy=Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.y,b.y));
                  const area=ix*iy;
                  if(area>25) intersections.push({a:a.label,b:b.label,area:Math.round(area)});
                }
              }
              const h1=count('h1');
              const headings=[...document.querySelectorAll('h1,h2,h3')].map(h=>({tag:h.tagName,text:h.textContent.trim()}));
              const interactive=[...document.querySelectorAll('a,button,[role="button"]')];
              const unnamedInteractive=interactive.filter(el=>!(el.getAttribute('aria-label')||el.textContent.trim()||el.getAttribute('title'))).length;
              const missingSceneBg=[...document.querySelectorAll('.scene-image')].filter(el=>{
                const bg=getComputedStyle(el).backgroundImage;
                return !bg || bg==='none';
              }).length;
              const imgs=[...document.images].map(img=>({src:img.currentSrc||img.src,complete:img.complete,nw:img.naturalWidth,nh:img.naturalHeight}));
              return {
                title:document.title,
                lang:document.documentElement.lang,
                country:document.documentElement.dataset.country,
                robots:document.querySelector('meta[name="robots"]')?.content||'',
                canonical:document.querySelector('link[rel="canonical"]')?.href||'',
                themeText:[...document.querySelectorAll('#country-theme-list .country-theme-chip')].map(x=>x.textContent.trim()),
                counts:{
                  facts:count('#facts > *'),
                  signature:count('#signature-facts > *'),
                  markers:count('#map-markers > *'),
                  sceneMarkers:count('#map-markers .map-marker'),
                  scenes:count('#scene-cards .scene-card'),
                  encounters:count('#encounters > *'),
                  extras:count('#atlas-extras-grid > *'),
                  trivia:count('#travel-trivia-grid > *'),
                  seasons:count('#seasons > *'),
                  personas:count('#personas > *'),
                  tips:count('#tips > *'),
                  related:count('#related > *')
                },
                visible:{
                  hero:visible(hero),
                  themes:visible(document.querySelector('#country-theme-context')),
                  signature:visible(document.querySelector('#signature-facts-section')),
                  map:visible(map),
                  extras:visible(document.querySelector('#atlas-extras-section')),
                  trivia:visible(document.querySelector('#travel-trivia-section')),
                  travelGrid:visible(document.querySelector('.travel-grid')),
                  related:visible(document.querySelector('.journey-footer'))
                },
                heroBackground:heroStyle?.backgroundImage||'',
                heroSize:bbox('.hero-art'),
                mapBackground:mapStyle?.backgroundImage||'',
                mapSize:bbox('#country-map-art'),
                bodyOverflow,
                missingSceneBg,
                markerIntersections:intersections,
                h1,
                headings,
                unnamedInteractive,
                imgs
              };
            });

            await page.addScriptTag({content: axeSource});
            const axe = await page.evaluate(async () => await axe.run(document,{
              runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa']},
              rules:{'color-contrast':{enabled:true}}
            }));
            const serious = axe.violations.filter(v=>['critical','serious'].includes(v.impact));

            const checks = {
              http200: response && response.status()===200,
              title: report.title==='モナコ | MONACO — JOURNEY ATLAS',
              country: report.country==='monaco',
              noindex: report.robots==='noindex,follow',
              canonical: report.canonical==='https://atlas.yagenji.com/countries/monaco/',
              theme: report.themeText.length===1 && report.themeText[0]==='街を歩く',
              heroVisible: report.visible.hero && report.heroBackground!=='none',
              mapVisible: report.visible.map && report.mapBackground!=='none',
              scenes: report.counts.scenes===8 && report.missingSceneBg===0,
              sceneMarkers: report.counts.sceneMarkers===8,
              allMarkers: report.counts.markers===10,
              encounters: report.counts.encounters===8,
              signature: report.counts.signature===3,
              extras: report.counts.extras===6,
              trivia: report.counts.trivia===5,
              seasons: report.counts.seasons===4,
              personas: report.counts.personas>=3,
              tips: report.counts.tips===3,
              related: report.counts.related===3,
              noHorizontalOverflow: report.bodyOverflow<=1,
              oneH1: report.h1===1,
              namedControls: report.unnamedInteractive===0,
              noConsoleErrors: consoleErrors.length===0,
              noPageErrors: pageErrors.length===0,
              noFailedRequests: failedRequests.length===0,
              noSeriousA11y: serious.length===0,
            };
            const failed=Object.entries(checks).filter(([,v])=>!v).map(([k])=>k);
            if(failed.length) hardFailures += failed.length;

            console.log('\n=== '+vp.name.toUpperCase()+' '+vp.width+'x'+vp.height+' ===');
            console.log('CHECKS '+JSON.stringify(checks));
            console.log('FAILED '+JSON.stringify(failed));
            console.log('COUNTS '+JSON.stringify(report.counts));
            console.log('VISIBLE '+JSON.stringify(report.visible));
            console.log('HERO_SIZE '+JSON.stringify(report.heroSize));
            console.log('MAP_SIZE '+JSON.stringify(report.mapSize));
            console.log('BODY_OVERFLOW '+report.bodyOverflow);
            console.log('MARKER_INTERSECTIONS '+JSON.stringify(report.markerIntersections));
            console.log('CONSOLE_ERRORS '+JSON.stringify(consoleErrors));
            console.log('PAGE_ERRORS '+JSON.stringify(pageErrors));
            console.log('FAILED_REQUESTS '+JSON.stringify(failedRequests));
            console.log('AXE_SERIOUS '+JSON.stringify(serious.map(v=>({id:v.id,impact:v.impact,help:v.help,nodes:v.nodes.length,targets:v.nodes.slice(0,3).map(n=>n.target)}))));
            console.log('AXE_ALL '+JSON.stringify(axe.violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.length}))));
            await page.close();
          }

          await browser.close();
          if(hardFailures){ console.error('HARD_FAILURE_COUNT='+hardFailures); process.exit(1); }
          console.log('HARD_FAILURE_COUNT=0');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node qa.js
