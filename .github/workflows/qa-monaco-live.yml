name: Monaco OSM land-area QA

on:
  push:
    branches: ["qa-monaco-live"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check OSM Monaco land_area relation 36990
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -A 'JourneyAtlasQA/1.0 (https://atlas.yagenji.com/)' \
            'https://nominatim.openstreetmap.org/lookup?osm_ids=R36990&format=geojson&polygon_geojson=1' \
            -o /tmp/land.json
          python3 - <<'PY'
          import json, math
          def rings(g):
              if g['type']=='Polygon': return g['coordinates']
              if g['type']=='MultiPolygon': return [r for p in g['coordinates'] for r in p]
              return []
          def area(g):
              total=0
              for ring in rings(g):
                  lat0=sum(p[1] for p in ring)/len(ring)
                  kx=111.320*math.cos(math.radians(lat0)); ky=110.574
                  pts=[(p[0]*kx,p[1]*ky) for p in ring]
                  total += abs(sum(x1*y2-x2*y1 for (x1,y1),(x2,y2) in zip(pts,pts[1:]+pts[:1])))/2
              return total
          j=json.load(open('/tmp/land.json'))
          for f in j.get('features',[]):
              p=f.get('properties',{})
              a=area(f['geometry'])
              print('DISPLAY='+str(p.get('display_name')))
              print('OSM_TYPE='+str(p.get('osm_type')))
              print('OSM_ID='+str(p.get('osm_id')))
              print('GEOM='+f['geometry']['type'])
              print(f'AREA_KM2={a:.6f}')
              print(f'OFFICIAL_DELTA_PERCENT={(a/2.084-1)*100:.3f}')
              print('POINTS='+str(sum(len(r) for r in rings(f['geometry']))))
              print('BBOX='+','.join(map(str,f.get('bbox',[]))))
              print('GEOJSON='+json.dumps(f['geometry'],separators=(',',':')))
          PY
