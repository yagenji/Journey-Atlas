name: Temporary Jamaica map attribution and target QA
on:
  push:
    paths:
      - '.github/workflows/jamaica-map-source-qa-temp.yml'
permissions:
  contents: write
jobs:
  map-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: country/jamaica
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact current Country JSON and map, change source attribution only
        run: |
          test "$(git hash-object data/countries/jamaica.json)" = 133ac70534d1cd9c130bb112a90f5235f37874fc
          test "$(git hash-object assets/images/jamaica/map-atlas-v1.svg)" = bef562dc42240b75eedc7ccaad2386858520bec3
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('data/countries/jamaica.json');old=p.read_text()
          old_note='DRAFT ONLY: Existing GSHHS/GSHHG intermediate coastline and surrounding land via Basemap, Jamaica identified against Natural Earth ADM0. Replace and verify with the current shared single-region geographic-context wrapper using a verified Jamaica ADM0 source; no map QA pass or production approval yet.'
          assert old.count(old_note)==1
          source='Jamaica main island: NOAA GSHHS full-resolution shoreline via Basemap 2.0.0, selected against Natural Earth 1:10m JAM ADM0 (pinned GeoJSON Git blob c12c1433a0a8a5684d051ebd0f015b723eea8461). Surrounding land: GSHHS intermediate; WGS84; 1200×760 common geographic-context map; verified 2026-09-18. Sources: https://www.ngdc.noaa.gov/mgg/shorelines/ and https://www.naturalearthdata.com/.'
          new=old.replace(json.dumps(old_note,ensure_ascii=False),json.dumps(source,ensure_ascii=False))
          assert new != old and old.replace(json.dumps(old_note,ensure_ascii=False),'')==new.replace(json.dumps(source,ensure_ascii=False),'')
          assert json.loads(new)['map']['source']==source
          assert json.loads(new)['publicationPipelineVersion']==2 and json.loads(new)['slug']=='jamaica'
          p.write_text(new)
          print('Changed only map.source; original map and real coordinates unchanged; new git blob:',__import__('subprocess').check_output(['git','hash-object',str(p)],text=True).strip())
          PY
      - name: Run actual target map and label validators
        run: |
          python scripts/validate_country_quality_v5.py data/countries/jamaica.json
          python scripts/validate_country_map_v6.py data/countries/jamaica.json
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          p=Path('assets/images/jamaica/map-atlas-v1.svg');s=p.read_text();r=ET.fromstring(s)
          assert r.get('viewBox')=='0 0 1200 760'
          assert '<image' not in s and 'xlink:href' not in s
          assert 'NOAA GSHHS full-resolution' in s
          print('PASS 1200x760 self-contained stored map and accurate SVG source')
          PY
      - name: Run focused editorial validator to distinguish unrelated issues
        continue-on-error: true
        run: python scripts/validate_country_editorial_v2.py data/countries/jamaica.json
      - name: Stage exact source-corrected JSON as orphan blob for connector-controlled commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,base64
          from pathlib import Path
          data=Path('data/countries/jamaica.json').read_bytes()
          Path('/tmp/jamaica-content-blob.json').write_text(json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}))
          PY
          expected=$(git hash-object data/countries/jamaica.json)
          actual=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input /tmp/jamaica-content-blob.json --jq .sha)
          test "$actual" = "$expected"
          printf 'VERIFIED_JAMAICA_JSON_BLOB_SHA=%s\n' "$actual"
          echo 'PASS: attributed Country JSON staged as blob, no Country branch/State/main mutation.'
