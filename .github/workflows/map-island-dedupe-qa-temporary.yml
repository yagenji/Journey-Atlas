name: Temporary shared island map regression

on:
  push:
    paths:
      - '.github/workflows/map-island-dedupe-qa-temporary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-shared-island-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shared map dependencies
        run: python -m pip install --disable-pip-version-check --quiet 'basemap==2.0.0' 'shapely>=2,<3' 'geopandas>=1,<2' 'cairosvg>=2.7,<3' 'pillow>=10,<13'
      - name: Run existing wrapper tests and new island-context regressions
        run: |
          python -m unittest discover -s tests -p 'test_generate_country_map_with_context.py' -v
          python -m unittest discover -s tests -p 'test_new_map_island_overlap.py' -v
          python -m unittest discover -s tests -p 'test_add_country_map_context.py' -v
      - name: Fetch exactly pinned Jamaica production JSON and ADM0 source
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/yagenji/Journey-Atlas/a6cfaca8ab18719c9b6917c8c16cd002391ee15f/data/countries/jamaica.json \
            --output /tmp/jamaica.json
          test "$(git hash-object /tmp/jamaica.json)" = '133ac70534d1cd9c130bb112a90f5235f37874fc'
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/AshKyd/geojson-regions/main/public/countries/10m/JAM.geojson \
            --output /tmp/JAM-10m.geojson
          test "$(git hash-object /tmp/JAM-10m.geojson)" = 'c12c1433a0a8a5684d051ebd0f015b723eea8461'
          python - <<'PY'
          import json
          from pathlib import Path
          from shapely.geometry import shape
          original=json.loads(Path('/tmp/JAM-10m.geojson').read_text())
          assert original['type']=='Feature' and original['properties']['adm0_a3']=='JAM'
          geom=shape(original['geometry'])
          assert geom.is_valid and not geom.is_empty and geom.area>0.5
          original['properties']['ADMIN']='Jamaica'
          Path('/tmp/JAM-10m-normalized.geojson').write_text(json.dumps({'type':'FeatureCollection','features':[original]}))
          print('PASS pinned exact Jamaica JSON and Natural Earth 1:10m ADM0 data')
          PY
      - name: Run shared generator end to end for Jamaica
        run: |
          python scripts/generate_country_map_with_context.py \
            --country-json /tmp/jamaica.json \
            --source natural-earth \
            --dataset /tmp/JAM-10m-normalized.geojson \
            --country-name Jamaica \
            --output /tmp/jamaica-map-fixed.svg
      - name: Verify complete SVG decode and no duplicated Jamaica silhouette
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import sys
          import cairosvg
          from PIL import Image
          sys.path.insert(0,'scripts')
          from generate_country_map_with_context import strip_redundant_island_context
          svg=Path('/tmp/jamaica-map-fixed.svg').read_text()
          root=ET.fromstring(svg)
          ns='{http://www.w3.org/2000/svg}'
          assert root.tag == ns+'svg' and root.get('viewBox')=='0 0 1200 760'
          assert root.get('data-map-projection')=='local-equirectangular-fit-v1'
          groups=[g for g in root.iter(ns+'g') if g.get('id')=='geographic-context']
          targets=[p for p in root.iter(ns+'path') if p.get('fill')=='url(#land)']
          assert len(groups)==1 and len(targets)>0
          assert strip_redundant_island_context(svg)==(svg,0), 'Redundant target island remains'
          png=cairosvg.svg2png(bytestring=svg.encode(),output_width=1200,output_height=760)
          image=Image.open(BytesIO(png));image.load()
          assert image.size==(1200,760)
          Path('/tmp/jamaica-map-fixed.png').write_bytes(png)
          Path('/tmp/jamaica-map-proof.txt').write_text('Shared map fix commit: '+__import__('os').environ['GITHUB_SHA']+'\nJamaica Country JSON Git blob: 133ac70534d1cd9c130bb112a90f5235f37874fc\nADM0 original Git blob: c12c1433a0a8a5684d051ebd0f015b723eea8461\n1200x760 complete decode; no redundant GSHHS island silhouette. Pending final geographic, label and Browser QA.\n')
          print('PASS full 1200x760 decode, ADM0 target intact and no duplicate island')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shared-island-map-jamaica-qa
          path: |
            /tmp/jamaica-map-fixed.svg
            /tmp/jamaica-map-fixed.png
            /tmp/jamaica-map-proof.txt
          if-no-files-found: error
          retention-days: 3
