name: Apply Travel Scale day restoration

on:
  push:
    branches:
      - fix/restore-travel-scale-days
    paths:
      - 'scripts/apply_restore_travel_scale_days.py'
      - '.github/workflows/apply-restore-travel-scale-days.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-travel-scale-days
      - name: Apply shared Travel Scale restoration
        run: python3 scripts/apply_restore_travel_scale_days.py
      - name: Run focused regression tests
        run: |
          python3 scripts/test_country_editorial_v2.py
          python3 scripts/validate_country_editorial_v2.py data/countries/kazakhstan.json
          python3 scripts/validate_country.py --strict data/countries/kazakhstan.json
      - name: Commit restored shared rules
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CONTENT_QUALITY_RULES_V3.md docs/COUNTRY_PAGE_TEMPLATE.md docs/NEW_COUNTRY_START.md docs/COUNTRY_PRODUCTION_PROTOCOL_2.md ops/country-production-policy.json scripts/validate_country_editorial_v2.py scripts/validate_country.py scripts/test_country_editorial_v2.py scripts/new_country.py
          git add -f data/countries/kazakhstan.json
          git diff --cached --quiet && exit 0
          git commit -m 'Restore day-based Travel Scale across Content QA v3'
          git push origin HEAD:fix/restore-travel-scale-days
