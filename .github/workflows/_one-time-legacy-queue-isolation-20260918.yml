name: Apply isolated legacy publication queue guard once

on:
  push:
    branches:
      - ops/fix-country-pipeline-reconciliation-20260918
    paths:
      - .github/workflows/_one-time-legacy-queue-isolation-20260918.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'yagenji/Journey-Atlas' && github.ref == 'refs/heads/ops/fix-country-pipeline-reconciliation-20260918' && github.actor == 'yagenji'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/fix-country-pipeline-reconciliation-20260918
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolate v2 from legacy publication queue
        run: python3 scripts/_one_time_legacy_queue_isolation_20260918.py
      - name: Commit scoped files and remove one-time bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/_one_time_legacy_queue_isolation_20260918.py
          test ! -e .github/workflows/_one-time-legacy-queue-isolation-20260918.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Exclude v2 Countries from the legacy publication queue'
          git push origin HEAD:refs/heads/ops/fix-country-pipeline-reconciliation-20260918
