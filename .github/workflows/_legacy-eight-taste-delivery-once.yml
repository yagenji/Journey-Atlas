name: One-time legacy Taste delivery repair
on:
  push:
    branches: [fix/legacy-taste-3x2-delivery-20260918]
    paths: [.github/workflows/_legacy-eight-taste-delivery-once.yml]
permissions:
  contents: write
jobs:
  convert-eight-existing-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check --quiet pillow
      - name: Preserve the eight approved dishes and extend only background to 3:2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          from PIL import Image, ImageFilter
          files={
           'antiguabarbuda/approved/food-ducana.webp':('e4005df336775ec6b94de1b80cfffadde7fe25a7',(1200,900)),
           'antiguabarbuda/approved/food-fungee.webp':('e6ec743b90eb7aba1faa29933b41442833c9a88e',(1200,900)),
           'antiguabarbuda/approved/food-goat-water.webp':('8131a5029099ca75af7ff6db216295390970e8ab',(1200,900)),
           'antiguabarbuda/approved/food-pepperpot.webp':('908ca93e6745084cc0cd1d257eaae70e2415cf3c',(1200,900)),
           'unitedstates/approved/food-louisiana-gumbo.webp':('2e6bafe0830d198c40f174086e4950af83b339b9',(1448,1086)),
           'unitedstates/approved/food-new-england-clam-chowder.webp':('669bdb7a486c7df0a0f22f59b9a98fc91fc170b9',(1448,1086)),
           'unitedstates/approved/food-new-york-style-pizza.webp':('686ecc3d4f0c432cc31bbd0f9b756f2e7f02a78d',(1448,1086)),
           'unitedstates/approved/food-texas-smoked-brisket.webp':('baff666c8c5df2b9360bff0403c871abfd3455c3',(1448,1086)),
          }
          for name,(sha,dimensions) in files.items():
              path=Path('assets/images')/name
              assert subprocess.check_output(['git','hash-object',str(path)],text=True).strip()==sha, f'Source changed: {name}'
              with Image.open(path) as image:
                  image.load()
                  assert image.size==dimensions and image.format=='WEBP'
                  original=image.convert('RGB')
              w,h=original.size
              target=h*3//2
              assert target>w and target*2==h*3
              l=(target-w)//2
              r=target-w-l
              canvas=Image.new('RGB',(target,h))
              left=original.crop((0,0,24,h)).resize((l,h),Image.Resampling.BICUBIC).filter(ImageFilter.GaussianBlur(4))
              right=original.crop((w-24,0,w,h)).resize((r,h),Image.Resampling.BICUBIC).filter(ImageFilter.GaussianBlur(4))
              canvas.paste(left,(0,0))
              canvas.paste(original,(l,0))
              canvas.paste(right,(l+w,0))
              canvas.resize((1200,800),Image.Resampling.LANCZOS).save(path,'WEBP',quality=90,method=6)
              with Image.open(path) as result:
                  result.load()
                  assert result.size==(1200,800) and result.format=='WEBP'
              print(f'{name} 1200x800 sha256={hashlib.sha256(path.read_bytes()).hexdigest()}')
          PY
      - name: Enforce unchanged source-image delivery and hard gates
        run: |
          python3 scripts/normalize_country_image_delivery.py --audit
          python3 scripts/validate_images.py --mode hard
      - name: Commit only eight normalized assets and remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/_legacy-eight-taste-delivery-once.yml
          git add -- assets/images/antiguabarbuda/approved/food-*.webp assets/images/unitedstates/approved/food-*.webp
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={
           '.github/workflows/_legacy-eight-taste-delivery-once.yml',
           'assets/images/antiguabarbuda/approved/food-ducana.webp',
           'assets/images/antiguabarbuda/approved/food-fungee.webp',
           'assets/images/antiguabarbuda/approved/food-goat-water.webp',
           'assets/images/antiguabarbuda/approved/food-pepperpot.webp',
           'assets/images/unitedstates/approved/food-louisiana-gumbo.webp',
           'assets/images/unitedstates/approved/food-new-england-clam-chowder.webp',
           'assets/images/unitedstates/approved/food-new-york-style-pizza.webp',
           'assets/images/unitedstates/approved/food-texas-smoked-brisket.webp',
          }
          assert changed==expected,(changed^expected)
          print('PASS: exactly eight delivery assets plus temporary helper deletion; no country JSON or publication edits')
          PY
          git commit -m 'Normalize eight legacy Taste assets to 3:2 without crop'
          git push origin HEAD:refs/heads/fix/legacy-taste-3x2-delivery-20260918