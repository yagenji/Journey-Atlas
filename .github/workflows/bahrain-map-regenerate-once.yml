name: Bahrain map regenerate once

on:
  push:
    branches:
      - country/bahrain
    paths:
      - .github/workflows/bahrain-map-regenerate-once.yml

permissions:
  contents: write

jobs:
  finalize-map-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: country/bahrain
          fetch-depth: 0
      - name: Update Bahrain map source and reset review preview
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          country_path = Path('data/countries/bahrain.json')
          country = json.loads(country_path.read_text(encoding='utf-8'))
          country['map']['source'] = (
              'geoBoundaries gbOpen ADM0 (BHR), sourced from OpenStreetMap / Wambacher under ODbL 1.0. '
              'The full-resolution coastline and island geometry is projected into the existing JOURNEY ATLAS '
              'multi-region local-equirectangular layout; only subpixel SVG coordinate rounding is applied. '
              'Main Bahrain and Hawar remain separate map.regions so WGS84 coordinates stay authoritative.'
          )
          country['sourceDates']['geometry'] = '2026-09-15'
          country['sources']['geometry'] = (
              'geoBoundaries gbOpen BHR ADM0, boundary BHR-ADM0-88433195; source OpenStreetMap / Wambacher; '
              'Open Data Commons Open Database License 1.0. Source geometry reports 10,579 mean vertices. '
              'JOURNEY ATLAS projects the full-resolution geometry into the Bahrain main/Hawar map regions '
              'and reduces only duplicate/subpixel SVG coordinates for display.'
          )
          country_path.write_text(json.dumps(country, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          state_path = Path('ops/country-production/bahrain.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['stateRevision'] = int(state.get('stateRevision', 0)) + 1
          state['updatedAt'] = datetime.now(ZoneInfo('Asia/Tokyo')).isoformat(timespec='seconds')
          state['reviewPreview'] = {
              'mode': 'TARGETED_COUNTRY_BRANCH_PREVIEW',
              'state': 'NOT_STARTED',
              'url': None,
              'browserQa': 'NOT_STARTED',
              'pipelineVersion': 2,
          }
          state['next'] = {'action': 'OPEN_REVIEW_PR_FOR_TARGETED_PREVIEW', 'asset': None}
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/countries/bahrain.json ops/country-production/bahrain.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Bahrain high-resolution map source and reset review"
          git push origin HEAD:country/bahrain
