name: One-time Belize review correction
on:
  push:
    branches: [fix/belize-review-feedback-20260918]
    paths: [.github/workflows/_belize-feedback-once.yml]
permissions:
  contents: write
jobs:
  apply-reviewed-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only the documented Belize review corrections
        run: python3 scripts/_belize_review_feedback_once.py
      - name: Validate resulting source and publication guard
        run: |
          node --check assets/js/app.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/countries/belize.json').read_text())
          registry=json.loads(Path('data/atlas-destinations.json').read_text())
          state=json.loads(Path('ops/country-production/belize.json').read_text())
          row=next(x for x in registry['destinations'] if x['slug']=='belize')
          assert row['atlasPublished'] is False
          assert state['finalApproval']['state']=='PENDING'
          assert state['publication']['atlasPublished'] is False
          assert len(data['scenes'])==8 and len(data['taste']['items'])==4
          assert data['map']['japanAreaComparison'].startswith('国土面積は日本の約6.1%')
          assert '世界で2番目' in data['signatureFacts'][0]['value']
          print('BELIZE_REPAIR_PREVIEW_GUARD_PASS')
          PY
      - name: Commit only Country data and shared UI fixes; remove one-time helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- scripts/_belize_review_feedback_once.py .github/workflows/_belize-feedback-once.yml
          git add -- data/countries/belize.json assets/js/app.js assets/css/taste-image-framing.css assets/css/site-unify.css
          git diff --cached --check
          git commit -m 'Apply Belize map, reef and shared 4:3 Taste review fixes'
          git push origin HEAD:refs/heads/fix/belize-review-feedback-20260918
