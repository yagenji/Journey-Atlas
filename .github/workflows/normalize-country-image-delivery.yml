name: Normalize Country image delivery

on:
  push:
    branches: ["perf/country-image-normalize"]
    paths:
      - 'scripts/normalize_country_image_delivery.py'
      - '.github/workflows/normalize-country-image-delivery.yml'
      - 'data/countries/**'
      - 'assets/images/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-country-image-delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Show normalization plan
        shell: bash
        run: |
          set +e
          python3 scripts/normalize_country_image_delivery.py --audit
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            exit "$status"
          fi

      - name: Normalize delivery assets
        run: python3 scripts/normalize_country_image_delivery.py --apply

      - name: Verify full decode and image rules
        run: python3 scripts/validate_images.py --mode audit

      - name: Commit normalized binaries and references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/images data/countries
          if git diff --cached --quiet; then
            echo "No normalization changes to commit."
            exit 0
          fi
          git status --short
          git commit -m "Normalize Country image delivery assets"
          git push origin HEAD:${GITHUB_REF_NAME}
