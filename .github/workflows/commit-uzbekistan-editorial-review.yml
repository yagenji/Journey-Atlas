name: Commit validated Uzbekistan editorial fixes

on:
  push:
    branches: ["country/uzbekistan"]
    paths: [".github/workflows/commit-uzbekistan-editorial-review.yml"]

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Uzbekistan branch
        uses: actions/checkout@v4
        with:
          ref: country/uzbekistan
          fetch-depth: 0

      - name: Reapply validated transformation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/refresh-uzbekistan-editorial.yml').read_text(encoding='utf-8')
          start = source.index("          import json\n")
          end = source.index("          PY\n", start)
          code = source[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())
          code = code.replace("data.setdefault('sourceDates', {})['editorialReview'] = '2026-09-13'", "data.setdefault('sourceDates', {})['afrosiyob'] = '2026-09-13'")
          Path('/tmp/apply_uzbekistan_editorial.py').write_text(code + '\n', encoding='utf-8')
          PY
          python3 /tmp/apply_uzbekistan_editorial.py
          python3 scripts/validate_country_editorial_v2.py data/countries/uzbekistan.json
          python3 scripts/validate_country.py --strict data/countries/uzbekistan.json
          python3 scripts/country_production_protocol_v2.py validate

      - name: Commit exact validated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-uzbekistan-editorial.yml
          git rm .github/workflows/refresh-uzbekistan-editorial-final.yml
          git rm .github/workflows/commit-uzbekistan-editorial-review.yml
          git add -f data/countries/uzbekistan.json
          git add ops/country-production/uzbekistan.json
          git commit -m "Refine Uzbekistan facts trivia encounters and related countries"
          git push origin HEAD:country/uzbekistan
