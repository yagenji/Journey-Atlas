name: Verify exact live Honduras content once
on:
  push:
    branches: [verify/honduras-exact-review-20260918]
    paths: [.github/workflows/honduras-exact-live-review-once.yml]
permissions:
  contents: write
jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/honduras-exact-review-20260918
          fetch-depth: 2
          persist-credentials: true
      - name: Confirm exact live SHA and country JSON
        shell: bash
        run: |
          set -euo pipefail
          expected='4bb24068fd6a64941e8c5b886721f45f6617ac8a'
          test "$(git rev-parse HEAD^)" = "$expected"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$expected"
          bash scripts/http_fetch_retry.sh "https://atlas.yagenji.com/build-meta.json?review=$GITHUB_RUN_ID" /tmp/honduras-review-meta.json
          bash scripts/http_fetch_retry.sh "https://atlas.yagenji.com/data/countries/honduras.json?review=$GITHUB_RUN_ID" /tmp/honduras-review-live.json
          bash scripts/http_fetch_retry.sh "https://atlas.yagenji.com/countries/honduras/?review=$GITHUB_RUN_ID" /tmp/honduras-review-live.html
          EXPECTED="$expected" python3 - <<'PY'
          import json,os
          from pathlib import Path
          expected=os.environ['EXPECTED']
          meta=json.loads(Path('/tmp/honduras-review-meta.json').read_text())
          assert meta['commit']==expected, ('Wrong live SHA',meta.get('commit'),expected)
          source=json.loads(Path('data/countries/honduras.json').read_text())
          live=json.loads(Path('/tmp/honduras-review-live.json').read_text())
          assert live['nextRoutes']==source['nextRoutes']
          assert live['signatureFacts']==source['signatureFacts']
          assert [x['countryEn'] for x in live['nextRoutes']]==['GUATEMALA','EL SALVADOR','NICARAGUA']
          assert [x['value'] for x in live['signatureFacts']]==['約1,000 km','約7.4%','16代']
          assert 'data-country="honduras"' in Path('/tmp/honduras-review-live.html').read_text()
          assert json.loads(Path('data/atlas-destinations.json').read_text())['destinations']
          print('EXACT_LIVE_JSON_PASS: SHA',expected,'NEXT ROUTES: GUATEMALA / EL SALVADOR / NICARAGUA; SIGNATURE FACTS: 約1,000 km / 約7.4% / 16代')
          PY
      - name: Install Selenium (same dependency as production browser QA)
        run: python3 -m pip install --disable-pip-version-check --quiet selenium
      - name: Verify visibly rendered route and number cards at three viewports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          browser=webdriver.Chrome(options=opts)
          try:
              for label,width,height in [('desktop',1440,900),('tablet',820,1180),('mobile',390,844)]:
                  browser.set_window_size(width,height)
                  browser.get('https://atlas.yagenji.com/countries/honduras/?exact-review='+label)
                  WebDriverWait(browser,45).until(lambda d: len(d.find_elements(By.CSS_SELECTOR,'#next-routes-grid > article'))==3 and len(d.find_elements(By.CSS_SELECTOR,'#signature-facts > article'))==3)
                  route_section=browser.find_element(By.CSS_SELECTOR,'#next-routes-section')
                  facts_section=browser.find_element(By.CSS_SELECTOR,'#signature-facts-section')
                  assert route_section.is_displayed() and facts_section.is_displayed(),label
                  routes=browser.find_elements(By.CSS_SELECTOR,'#next-routes-grid > article')
                  numbers=browser.find_elements(By.CSS_SELECTOR,'#signature-facts > article')
                  for route,expected in zip(routes,['GUATEMALA','EL SALVADOR','NICARAGUA']):
                      assert expected in route.text.upper(),(label,expected,route.text)
                  for card,expected in zip(numbers,['約1,000 km','約7.4%','16代']):
                      assert expected in card.text,(label,expected,card.text)
                  assert 'El Amatillo' in routes[1].text,(label,routes[1].text)
                  assert 'El Guasaule' in routes[2].text,(label,routes[2].text)
                  robots=browser.find_element(By.CSS_SELECTOR,'meta[name="robots"]').get_attribute('content').lower()
                  assert 'noindex' in robots and 'follow' in robots,(label,robots)
                  print('EXACT_RENDER_PASS',label,'route_count',len(routes),'route_names',[r.text.splitlines()[0] for r in routes],'number_values',['約1,000 km','約7.4%','16代'],'robots',robots)
          finally:
              browser.quit()
          PY
      - name: Record verified unpublished review in existing Production State and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/canonical_review_v2.py verified honduras
          python3 scripts/validate_production_state_routed.py
          python3 scripts/country_production_protocol_v2.py validate
          python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('ops/country-production/honduras.json').read_text())
          assert state['reviewDeployment']['state']=='DONE'
          assert state['reviewDeployment']['productionVerification']=='LIVE_BROWSER_QA_PASS'
          assert state['reviewDeployment']['atlasPublished'] is False
          assert state['finalApproval']['state']=='PENDING'
          assert state['publication']['atlasPublished'] is False
          assert state['next']['action']=='REVIEW_CANONICAL_URL'
          print('STATE_PASS review DONE, final approval PENDING, atlasPublished false')
          PY
          git rm .github/workflows/honduras-exact-live-review-once.yml
          git add ops/country-production/honduras.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record specific live Honduras route and facts QA in State'
          git push origin HEAD:refs/heads/verify/honduras-exact-review-20260918
