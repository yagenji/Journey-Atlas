name: QA Estonia final visual fixes

on:
  push:
    branches:
      - estonia-v4-visual-qa
    paths:
      - .github/workflows/qa-estonia-final-fixes.yml

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: estonia-v4-visual-qa
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: Verify all Estonia final images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          base=Path("assets/images/estonia/approved")
          names=[
            "hero-tallinn-old-town-atlas.webp",
            "viru-bog-atlas.webp",
            "soomaa-atlas.webp",
            "panga-cliff-atlas.webp",
            "kaali-crater-atlas.webp",
            "narva-castle-atlas.webp",
            "suur-taevaskoda-atlas.webp",
            "kopu-lighthouse-atlas.webp",
            "suur-munamagi-atlas.webp",
          ]
          for name in names:
              p=base/name
              assert p.exists(), name
              with Image.open(p) as im:
                  im.load()
                  assert im.format=="WEBP", (name,im.format)
                  assert im.size==(1200,800), (name,im.size)
          assert (base/"suur-taevaskoda-atlas.webp").stat().st_size == 433336
          assert (base/"kopu-lighthouse-atlas.webp").stat().st_size == 299706
          print("Estonia final image QA passed: 9/9")
          PY
      - name: Validate Estonia JSON
        run: python scripts/validate_country.py data/countries/estonia.json
      - name: Build Cloudflare review package
        env:
          JOURNEY_ATLAS_SITE_URL: https://atlas.yagenji.com/
        run: python scripts/build_cloudflare.py
      - name: Verify packaged Estonia review page
        run: |
          test -f dist/countries/estonia/index.html
          test -f dist/data/countries/estonia.json
          test -f dist/assets/images/estonia/approved/suur-taevaskoda-atlas.webp
          test -f dist/assets/images/estonia/approved/kopu-lighthouse-atlas.webp
          grep -q 'suur-taevaskoda-atlas.webp' dist/data/countries/estonia.json
          grep -q 'kopu-lighthouse-atlas.webp' dist/data/countries/estonia.json
          grep -q 'noindex,follow' dist/countries/estonia/index.html
          if grep -q 'countries/estonia/' dist/sitemap.xml; then echo "Estonia leaked into sitemap"; exit 1; fi
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/qa-estonia-final-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/qa-estonia-final-fixes.yml
          git commit -m "chore(estonia): remove temporary final-fix QA workflow"
          git push origin HEAD:estonia-v4-visual-qa
