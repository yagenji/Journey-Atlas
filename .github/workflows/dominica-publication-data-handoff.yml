name: Dominica post-publication live verification
on:
  push:
    branches: [ops/dominica-publication-handoff-20260923]
permissions:
  contents: read
jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact merged publication commit
        uses: actions/checkout@v4
        with:
          ref: eaf786d6f8818eb29345dd7025c5cce195d6caeb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact production SHA and canonical publication routes
        shell: bash
        run: |
          set -euo pipefail
          expected='eaf786d6f8818eb29345dd7025c5cce195d6caeb'
          test "$(git rev-parse HEAD)" = "$expected"
          live=''
          for n in $(seq 1 70); do
            curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://atlas.yagenji.com/build-meta.json?publish-dominica=$GITHUB_RUN_ID-$n" > /tmp/dominica-build.json || true
            live="$(python3 -c 'import json;print(json.load(open("/tmp/dominica-build.json")).get("commit",""))' 2>/dev/null || true)"
            echo "Deployed SHA check attempt=$n live=$live expected=$expected"
            [ "$live" != "$expected" ] || break
            sleep 5
          done
          [ "$live" = "$expected" ] || { echo 'Wrong production SHA' >&2; exit 1; }
          curl -fsS --retry 3 'https://atlas.yagenji.com/countries/dominica/' > /tmp/dominica-page.html
          curl -fsS --retry 3 'https://atlas.yagenji.com/data/countries/dominica.json' > /tmp/dominica-country.json
          curl -fsS --retry 3 'https://atlas.yagenji.com/data/atlas-destinations.json' > /tmp/dominica-registry.json
          curl -fsS --retry 3 'https://atlas.yagenji.com/sitemap.xml' > /tmp/dominica-sitemap.xml
          curl -fsS --retry 3 'https://atlas.yagenji.com/' > /tmp/dominica-home.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          from html.parser import HTMLParser
          root=Path('/tmp')
          country=json.loads((root/'dominica-country.json').read_text())
          area=next(x['value'] for x in country['facts'] if x['label']=='面積')
          assert area=='750 km²（日本の約0.20％）' and '504' not in area,area
          class Meta(HTMLParser):
              def __init__(self): super().__init__();self.robots=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='meta' and a.get('name','').lower()=='robots':self.robots.append(a.get('content','').lower())
          html=(root/'dominica-page.html').read_text();parser=Meta();parser.feed(html)
          assert 'data-country="dominica"' in html,'Wrong country route'
          assert parser.robots and any('index' in x and 'noindex' not in x and 'follow' in x for x in parser.robots),parser.robots
          assert '/countries/dominica/' in (root/'dominica-sitemap.xml').read_text(),'Country missing from sitemap'
          registry=json.loads((root/'dominica-registry.json').read_text())
          assert len(registry['destinations'])==201
          row=next(x for x in registry['destinations'] if x['slug']=='dominica')
          assert row['atlasPublished'] is True and row['href']=='countries/dominica/' and row['image']=='assets/images/dominica/approved/hero-scotts-head-soufriere.webp',row
          assert (root/'dominica-home.html').stat().st_size>1000,'Homepage unreachable'
          state=json.loads(Path('ops/country-production/dominica.json').read_text())
          assert state['finalApproval']['state']=='APPROVED' and state['publication']['state']=='PUBLISHED'
          print('PASS exact production SHA, corrected percentage, index/follow, sitemap, canonical registry/public link, homepage and approved publication State.')
          PY
      - name: Live Dominica Desktop Tablet Mobile browser QA
        env:
          QA_BASE_URL: https://atlas.yagenji.com
          QA_SCOPE: published
          QA_SLUGS: dominica
          QA_OUT_DIR: qa-dominica-published
        run: |
          python3 -m pip install --disable-pip-version-check --quiet selenium
          python3 scripts/qa_published_browser.py
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dominica-published-qa-20260923
          path: qa-dominica-published/
          if-no-files-found: warn
          retention-days: 3
