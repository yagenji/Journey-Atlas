name: Temporary Jordan label review trigger

on:
  push:
    branches:
      - country/jordan
    paths:
      - .github/workflows/tmp-jordan-label-review-trigger.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: country/jordan
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove temporary trigger without retriggering workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/tmp-jordan-label-review-trigger.yml
          git add .github/workflows/tmp-jordan-label-review-trigger.yml
          git commit -m "Remove temporary Jordan label review trigger"
          git push origin HEAD:country/jordan
