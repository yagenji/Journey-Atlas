name: One-off St Kitts Nevis FOOD03 output reconciliation
on:
  push:
    branches: [country/stkittsnevis]
    paths: [.github/workflows/stkittsnevis-oneoff-pelau-reconcile.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reject non-Pelau FOOD03 and preserve approved assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          p=Path('ops/country-production/stkittsnevis.json')
          s=json.loads(p.read_text(encoding='utf-8'))
          f1,f2,f3,f4=s['taste']
          assert s['slug']=='stkittsnevis' and s['phase']=='TASTE_REGEN'
          assert s['next']=={'action':'RECONCILE_GENERATION','asset':'FOOD03'}
          assert s['generationContext']['state']=='CLEAN'
          assert f3['state']=='GENERATING' and f3['id']=='FOOD03'
          assert f3['generationReservation']['asset']=='FOOD03'
          assert f3['generationReservation']['contentId']==f3['contentId']=='food-3'
          assert f3['generationReservation']['generationContextEpoch']==s['generationContext']['epoch']
          assert f1['state']=='REVIEW_CANDIDATE' and f1['candidateGenerationId']=='641eaa2f-c782-4a01-86e5-7be16cd488ec'
          assert f2['state']==f4['state']=='APPROVED'
          gid='27a312c7-9854-4183-a997-edb0142fa4e6'
          assert gid not in f3.get('rejectedGenerationIds',[])
          f3['rejectedGenerationIds'].append(gid)
          f3['state']='REGENERATE'
          f3.pop('generationReservation')
          f3['lastFailureReason']='DISH_IDENTITY_AND_DECORATIVE_PROPS'
          f3['promptSeriesRejectCount']=f3.get('promptSeriesRejectCount',0)+1
          s['next']={'action':'GENERATE_FOOD','asset':'FOOD03'}
          s['stateRevision']+=1
          s['updatedAt']=datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          assert s['publication']['atlasPublished'] is False
          p.write_text(json.dumps(s,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print('Rejected FOOD03 image with wrong bean variety and unrelated sides:',gid)
          PY
          python scripts/country_production_state_v7.py validate
          git add ops/country-production/stkittsnevis.json
          git rm .github/workflows/stkittsnevis-oneoff-pelau-reconcile.yml
          git commit -m 'Reject FOOD03 image with wrong beans and unrelated sides'
          git push
