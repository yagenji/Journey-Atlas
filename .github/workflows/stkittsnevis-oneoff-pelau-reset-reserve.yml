name: One-off St Kitts Nevis Pelau generation context reset
on:
  push:
    branches: [country/stkittsnevis]
    paths: [.github/workflows/stkittsnevis-oneoff-pelau-reset-reserve.yml]
permissions:
  contents: write
jobs:
  reset-and-reserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reset prior-turn context and reserve only FOOD03
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json,uuid
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          p=Path('ops/country-production/stkittsnevis.json')
          s=json.loads(p.read_text(encoding='utf-8'))
          assert s['slug']=='stkittsnevis' and s['phase']=='TASTE_REGEN'
          assert s['next']=={'action':'RESET_GENERATION_CONTEXT','asset':None}
          assert s['generationContext']['state']=='CONTAMINATED'
          assert s['generationContext']['lastFailureAsset']=='FOOD03'
          assert s['generationContext']['lastFailureReason']=='WRONG_TARGET_CARRYOVER'
          f1,f2,f3,f4=s['taste']
          assert f1['state']=='REVIEW_CANDIDATE' and f1['candidateGenerationId']=='641eaa2f-c782-4a01-86e5-7be16cd488ec'
          assert f2['state']=='APPROVED' and f4['state']=='APPROVED'
          assert f3['state']=='REGENERATE' and f3['id']=='FOOD03'
          assert f3['promptSeries']==2 and not f3.get('generationReservation')
          assert not any(x['state']=='GENERATING' for x in s['taste'])
          assert s['publication']['atlasPublished'] is False
          now=datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          s['generationContext']['epoch']+=1
          s['generationContext']['state']='CLEAN'
          s['generationContext']['lastResetAt']=now
          s['generationContext']['lastFailureAsset']=None
          s['generationContext']['lastFailureReason']=None
          f3['state']='GENERATING'
          f3['generationReservation']={'reservationId':str(uuid.uuid4()),'asset':'FOOD03','contentId':f3['contentId'],'promptSeries':f3['promptSeries'],'generationContextEpoch':s['generationContext']['epoch'],'reservedAt':now}
          s['next']={'action':'RECONCILE_GENERATION','asset':'FOOD03'}
          s['stateRevision']+=1
          s['updatedAt']=now
          p.write_text(json.dumps(s,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print('FOOD03 only: reserved in clean context epoch',s['generationContext']['epoch'])
          PY
          python scripts/country_production_state_v7.py validate
          git add ops/country-production/stkittsnevis.json
          git rm .github/workflows/stkittsnevis-oneoff-pelau-reset-reserve.yml
          git commit -m 'Reset Pelau generation context and reserve FOOD03 alone'
          git push
