name: Dispatch Uzbekistan review preview

on:
  push:
    branches: ["country/uzbekistan"]
    paths:
      - ".github/workflows/dispatch-uzbekistan-preview.yml"

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Uzbekistan branch
        uses: actions/checkout@v4
        with:
          ref: country/uzbekistan
          fetch-depth: 1

      - name: Remove one-time dispatcher
        run: |
          set -euo pipefail
          rm .github/workflows/dispatch-uzbekistan-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/dispatch-uzbekistan-preview.yml
          git commit -m "Remove one-time Uzbekistan preview dispatcher"
          git push origin HEAD:country/uzbekistan

      - name: Dispatch canonical Country preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-country-preview.yml --ref country/uzbekistan -f slug=uzbekistan
