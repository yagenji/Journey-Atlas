name: Verify JOURNEY ATLAS Cloudflare Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "verify-cloudflare-production"
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout expected source
        uses: actions/checkout@v4

      - name: Wait for atlas.yagenji.com to serve this commit
        env:
          SITE_URL: https://atlas.yagenji.com
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            meta="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$SITE_URL/build-meta.json?qa=$GITHUB_RUN_ID-$attempt" || true)"
            live_sha="$(printf '%s' "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)"
            echo "attempt=$attempt expected=$EXPECTED_SHA live=$live_sha"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "Cloudflare production is serving the expected commit."
              exit 0
            fi
            sleep 10
          done
          echo "atlas.yagenji.com did not reach expected commit: $EXPECTED_SHA"
          exit 1

      - name: Verify Spain V3 production payload
        env:
          SITE_URL: https://atlas.yagenji.com
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache'             "$SITE_URL/data/countries/spain.json?qa=$GITHUB_RUN_ID"             -o /tmp/spain.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/spain.json").read_text(encoding="utf-8"))
          scene_ids = [scene.get("id") for scene in data.get("scenes", [])]
          required_scenes = {
              "las-medulas-mirador-orellan",
              "ronda-puente-nuevo-tajo",
          }
          missing = sorted(required_scenes - set(scene_ids))
          if missing:
              raise SystemExit(f"Spain V3 scenes missing in production: {missing}")
          if len(data.get("taste", {}).get("items", [])) < 2:
              raise SystemExit("Spain V3 taste block missing in production")
          if len(data.get("seasonMatrix", {}).get("rows", [])) != 4:
              raise SystemExit("Spain V3 season matrix missing in production")
          if len(data.get("travelScale", {}).get("items", [])) != 3:
              raise SystemExit("Spain V3 travel scale missing in production")
          print("Spain V3 production JSON verified.")
          PY

      - name: Verify production runtime assets and route
        env:
          SITE_URL: https://atlas.yagenji.com
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache'             "$SITE_URL/countries/spain/?qa=$GITHUB_RUN_ID" -o /tmp/spain.html
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache'             "$SITE_URL/assets/js/app.js?qa=$GITHUB_RUN_ID" -o /tmp/app.js
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache'             "$SITE_URL/assets/css/country.css?qa=$GITHUB_RUN_ID" -o /tmp/country.css
          grep -q 'data-country="spain"' /tmp/spain.html
          grep -q 'renderTaste(fragment, data.taste)' /tmp/app.js
          grep -q 'renderTravelScale(fragment, data.travelScale)' /tmp/app.js
          grep -q 'taste-section' /tmp/country.css
          grep -q 'season-matrix' /tmp/country.css
          echo "Production route, JS and CSS verified."
