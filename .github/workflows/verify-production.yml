name: Verify JOURNEY ATLAS Cloudflare Production

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "verify-cloudflare-production"
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout expected source
        uses: actions/checkout@v4

      - name: Verify shared Country CSS architecture
        run: |
          set -euo pipefail
          profile_sources="$(grep -l 'country-facts-strip' assets/css/*.css | sort | tr '\n' ' ' | sed 's/ $//')"
          test "$profile_sources" = "assets/css/country-icon-system.css"
          transport_sources="$(grep -l 'travel-planning__block--transport .transport' assets/css/*.css | sort | tr '\n' ' ' | sed 's/ $//')"
          test "$transport_sources" = "assets/css/country-discovery-v3.css"
          grep -q 'grid-template-columns:repeat(6,minmax(0,1fr))' assets/css/country-icon-system.css
          grep -q 'Transport — single shared layout' assets/css/country-discovery-v3.css
          echo "Shared Country CSS architecture verified."

      - name: Wait for atlas.yagenji.com to serve this commit
        env:
          SITE_URL: https://atlas.yagenji.com
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            meta="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$SITE_URL/build-meta.json?qa=$GITHUB_RUN_ID-$attempt" || true)"
            live_sha="$(printf '%s' "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)"
            echo "attempt=$attempt expected=$EXPECTED_SHA live=$live_sha"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "Cloudflare production is serving the expected commit."
              exit 0
            fi
            sleep 10
          done
          echo "atlas.yagenji.com did not reach expected commit within the 10-minute verification window: $EXPECTED_SHA"
          exit 1

      - name: Verify Spain V3 production payload
        env:
          SITE_URL: https://atlas.yagenji.com
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache'             "$SITE_URL/data/countries/spain.json?qa=$GITHUB_RUN_ID"             -o /tmp/spain.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/spain.json").read_text(encoding="utf-8"))
          scene_ids = [scene.get("id") for scene in data.get("scenes", [])]
          required_scenes = {
              "las-medulas-mirador-orellan",
              "ronda-puente-nuevo-tajo",
          }
          missing = sorted(required_scenes - set(scene_ids))
          if missing:
              raise SystemExit(f"Spain V3 scenes missing in production: {missing}")
          taste = data.get("taste", {})
          if taste.get("title") != "スペインで食べたいもの" or len(taste.get("items", [])) != 4:
              raise SystemExit("Spain food shortlist is not the reviewed 4-item version")
          expected_food_images = {
              "paella": "assets/images/spain/approved/food-paella.webp",
              "jamon-iberico": "assets/images/spain/approved/food-jamon-iberico.webp",
              "tortilla-espanola": "assets/images/spain/approved/food-tortilla-espanola.webp",
              "churros-con-chocolate": "assets/images/spain/approved/food-churros-con-chocolate.webp",
          }
          for item in taste.get("items", []):
              if item.get("image") != expected_food_images.get(item.get("id")):
                  raise SystemExit(f"Spain food image mismatch: {item.get('id')} -> {item.get('image')}")
              if item.get("imageState") != "APPROVED":
                  raise SystemExit(f"Spain food image is not approved: {item.get('id')}")
          if "seasonMatrix" in data:
              raise SystemExit("Removed Spain season matrix is still present in production")
          travel_scale = data.get("travelScale", {})
          if travel_scale.get("title") != "旅の目安日程" or len(travel_scale.get("items", [])) != 3:
              raise SystemExit("Spain travel scale is not the reviewed version")
          durations = [item.get("duration") for item in travel_scale.get("items", [])]
          if durations != ["3〜4日", "5〜7日", "8日以上"]:
              raise SystemExit(f"Spain travel durations are not continuous: {durations}")
          route_titles = [item.get("title") for item in travel_scale.get("items", [])]
          expected_route_titles = [
              "一つの都市を拠点に近郊へ",
              "高速鉄道で2〜3都市をつなぐ",
              "都市に地方の町や景観を加える",
          ]
          if route_titles != expected_route_titles:
              raise SystemExit(f"Spain travel routes are not the reviewed version: {route_titles}")
          if data.get("transport", {}).get("title") != "高速鉄道・在来線・車":
              raise SystemExit("Spain transport title is not Japanese")
          tips = data.get("tips", [])
          if not tips or tips[0].get("title") != "昼食と夕食は、少し遅めに考える":
              raise SystemExit("Spain Travel Notes overlap fix is missing")
          extras = data.get("atlasExtras", [])
          if len(extras) < 5 or extras[4].get("title") != "日が落ちても、街の暮らしは屋外に続く":
              raise SystemExit("Spain Beyond the Scenery overlap fix is missing")
          trivia_titles = [item.get("title") for item in data.get("travelTrivia", [])]
          if "8月のブニョールでは、街全体がトマト色になる" not in trivia_titles:
              raise SystemExit("Spain Tomatina experience trivia is missing")
          if any(item.get("topicKey") == "gomera-whistled-language" for item in data.get("travelTrivia", [])):
              raise SystemExit("Replaced Silbo Gomero trivia is still present")
          print("Spain V3 production JSON verified.")
          PY

      - name: Verify production runtime assets and route
        env:
          SITE_URL: https://atlas.yagenji.com
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache'             "$SITE_URL/countries/spain/?qa=$GITHUB_RUN_ID" -o /tmp/spain.html
          curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache'             "$SITE_URL/about/?qa=$GITHUB_RUN_ID" -o /tmp/about.html
          curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache'             "$SITE_URL/assets/js/app.js?qa=$GITHUB_RUN_ID" -o /tmp/app.js
          curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache'             "$SITE_URL/assets/css/country.css?qa=$GITHUB_RUN_ID" -o /tmp/country.css
          for food in food-paella.webp food-jamon-iberico.webp food-tortilla-espanola.webp food-churros-con-chocolate.webp; do
            curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache'               "$SITE_URL/assets/images/spain/approved/$food?qa=$GITHUB_RUN_ID"               -o "/tmp/$food"
            test -s "/tmp/$food"
          done
          grep -q 'data-country="spain"' /tmp/spain.html
          grep -q 'renderTaste(fragment, data.taste)' /tmp/app.js
          grep -q 'renderTravelScale(fragment, data.travelScale)' /tmp/app.js
          grep -q 'travel-scale__icon' /tmp/app.js
          grep -q 'transport-icon' /tmp/app.js
          grep -q 'travel-planning__block--transport .transport-icon' /tmp/country.css
          grep -q "旅の目安日程" /tmp/spain.json
          ! grep -q '8〜14日' /tmp/spain.json
          grep -q 'travel-planning' /tmp/country.css
          grep -q 'grid-template-columns:repeat(6,minmax(0,1fr))' /tmp/country.css
          grep -q 'grid-column:1 / -1' /tmp/country.css
          grep -q 'margin-top:0!important' /tmp/country.css
          grep -q 'travel-guidance' /tmp/country.css
          grep -q 'taste-section' /tmp/country.css
          grep -q 'repeat(4,minmax(0,1fr))' /tmp/country.css
          grep -q 'aspect-ratio:3 / 2' /tmp/country.css
          grep -q '>国から探す<' /tmp/spain.html
                    grep -q '>地図から探す<' /tmp/spain.html
          ! grep -q '<a href="https://journey.yagenji.com/" target="_blank" rel="noopener noreferrer">JOURNEY LENS</a>' /tmp/spain.html
          grep -q 'id="country-lens-bridge"' /tmp/spain.html
          grep -q 'initCountryLensBridge(data)' /tmp/app.js
          grep -q 'parseCountryLensFeed' /tmp/app.js
          grep -q 'country-lens-bridge__link' /tmp/country.css
          ! grep -q 'renderSeasonMatrix' /tmp/app.js
          ! grep -q 'scene-role' /tmp/app.js
          ! grep -q 'season-matrix' /tmp/country.css
          ! grep -q 'scene-role' /tmp/country.css
          grep -q '<title>このサイトについて — JOURNEY ATLAS</title>' /tmp/about.html
          grep -q 'href="about/"' /tmp/spain.html
          echo "Production route, JS and CSS verified."

      - name: Run all-published Desktop / Tablet / Mobile browser QA
        env:
          QA_BASE_URL: https://atlas.yagenji.com
          QA_OUT_DIR: qa-browser-output
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo "No Chromium-compatible browser found on runner"
            exit 1
          fi
          python3 -m pip install --disable-pip-version-check --quiet selenium
          python3 scripts/qa_published_browser.py

      - name: Upload production browser QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-country-browser-qa
          path: qa-browser-output/
          if-no-files-found: warn
          retention-days: 3
