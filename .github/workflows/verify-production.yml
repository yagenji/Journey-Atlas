name: Verify JOURNEY ATLAS production

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "about/**"
      - "faq/**"
      - "country.html"
      - "404.html"
      - "_redirects"
      - "assets/css/**"
      - "assets/js/**"
      - "assets/images/**"
      - "data/countries/**"
      - "data/theme-taxonomy.json"
      - "data/atlas-destinations.json"
      - "scripts/build_site.py"
      - "scripts/package_site.py"
      - "scripts/build_cloudflare.py"
      - "scripts/qa_published_browser.py"
      - "scripts/qa_country_browser.py"
      - ".github/workflows/verify-production.yml"
  workflow_dispatch:
    inputs:
      slug:
        description: "Optional Country slug; blank verifies the current production change"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: verify-cloudflare-production
  cancel-in-progress: false

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed Countries
        id: target
        shell: bash
        env:
          REQUESTED_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${REQUESTED_SLUG:-}" ]; then
            echo "slugs=$REQUESTED_SLUG" >> "$GITHUB_OUTPUT"
            echo "full=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          else
            base=""
          fi
          python3 - "$base" "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          base, output = sys.argv[1:]
          files = subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines() if base else []
          slugs = set()
          asset_folders = set()
          for path in files:
              match = re.fullmatch(r"data/countries/([^/]+)\.json", path)
              if match:
                  slugs.add(match.group(1))
              match = re.match(r"assets/images/([^/]+)/", path)
              if match and match.group(1) != "top":  # assets/images/top/ holds top-page art, not a Country
                  asset_folders.add(match.group(1))

          # Asset directory names are not guaranteed to equal canonical Country
          # slugs (for example united-kingdom -> unitedkingdom). Resolve changed
          # asset folders from actual Country JSON references before live QA.
          country_dir = Path("data/countries")
          for folder in sorted(asset_folders):
              prefix = f"assets/images/{folder}/"
              matched = set()
              direct = country_dir / f"{folder}.json"
              if direct.exists():
                  matched.add(folder)
              for country_path in country_dir.glob("*.json"):
                  try:
                      payload = country_path.read_text(encoding="utf-8")
                  except OSError:
                      continue
                  if prefix in payload:
                      matched.add(country_path.stem)
              if not matched:
                  raise SystemExit(f"Changed asset folder has no owning Country JSON: {folder}")
              slugs.update(matched)

          if base and "data/atlas-destinations.json" in files:
              try:
                  old = json.loads(subprocess.check_output(
                      ["git", "show", f"{base}:data/atlas-destinations.json"], text=True
                  ))
                  new = json.loads(Path("data/atlas-destinations.json").read_text(encoding="utf-8"))
                  old_rows = {row.get("slug"): row for row in old.get("destinations", []) if row.get("slug")}
                  new_rows = {row.get("slug"): row for row in new.get("destinations", []) if row.get("slug")}
                  for slug in set(old_rows) | set(new_rows):
                      if old_rows.get(slug) != new_rows.get(slug):
                          slugs.add(slug)
              except Exception:
                  pass

          # Files loaded only by the top page (index.html). Country pages never load them,
          # so changing them must not trigger the full 200-Country live QA (which hits the job timeout).
          top_only_js = {"assets/js/top.js", "assets/js/map-regions.js"}
          top_only_css = {
              "assets/css/top.css",
              "assets/css/top-layout-v3.css",
              "assets/css/top-layout-v4.css",
              "assets/css/top-scope.css",
              "assets/css/top-ux.css",
              "assets/css/map-regions.css",
          }
          shared = any(
              path == "country.html"
              or (path.startswith("assets/css/") and path not in top_only_css and not path.startswith("assets/css/top-"))
              or (path.startswith("assets/js/") and path not in top_only_js)
              or path in {"scripts/build_site.py", "scripts/package_site.py", "scripts/build_cloudflare.py"}
              for path in files
          )
          with open(output, "a", encoding="utf-8") as handle:
              handle.write("slugs=" + ",".join(sorted(slugs)) + "\n")
              handle.write("full=" + ("true" if shared and not slugs else "false") + "\n")
          PY

      - name: Wait for Cloudflare to serve this commit
        env:
          SITE_URL: https://atlas.yagenji.com
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            meta="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$SITE_URL/build-meta.json?qa=$GITHUB_RUN_ID-$attempt" || true)"
            live_sha="$(printf '%s' "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)"
            echo "attempt=$attempt expected=$EXPECTED_SHA live=$live_sha"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Production did not reach expected commit: $EXPECTED_SHA"
          exit 1

      - name: Verify runtime baseline
        run: |
          set -euo pipefail
          # Each fetch is retried so one slow edge response does not fail the run;
          # every retry and failure is written as an annotation (readable through
          # the check-run API even when the job log cannot be downloaded).
          fetch() {
            local url="$1" out="$2" attempt
            for attempt in 1 2 3 4; do
              if curl -fsS --max-time 20 "$url?qa=$GITHUB_RUN_ID-$attempt" -o "$out"; then
                return 0
              fi
              echo "::warning title=Fetch retry::$url (attempt $attempt)"
              sleep 5
            done
            echo "::error title=Fetch failed::$url"
            return 1
          }
          contains() {
            if ! grep -Fq "$1" "$2"; then
              echo "::error title=Baseline content missing::$2 does not contain: $1"
              return 1
            fi
          }
          site=https://atlas.yagenji.com
          fetch "$site/" /tmp/top.html
          fetch "$site/assets/js/app.js" /tmp/app.js
          fetch "$site/assets/js/top.js" /tmp/top.js
          fetch "$site/assets/js/map-regions.js" /tmp/map-regions.js
          fetch "$site/assets/css/country.css" /tmp/country.css
          fetch "$site/data/atlas-destinations.json" /tmp/atlas-destinations.json
          fetch "$site/data/top-season-index.json" /tmp/top-season-index.json
          fetch "$site/about/" /tmp/about.html
          fetch "$site/faq/" /tmp/faq.html
          for f in top.html app.js top.js map-regions.js country.css atlas-destinations.json about.html faq.html; do
            test -s "/tmp/$f" || { echo "::error title=Baseline file empty::/tmp/$f"; exit 1; }
          done
          python3 -c "import json,sys; c=json.load(open('/tmp/top-season-index.json'))['countries']; sys.exit(0 if len(c)==202 else '::error title=Season index::top-season-index.json: expected 202 Countries, got %d' % len(c))"
          contains 'id="season-months"' /tmp/top.html
          contains 'const ATLAS_TOTAL = 202;' /tmp/top.js
          contains 'dest.length || 202' /tmp/map-regions.js
          contains '202' /tmp/about.html
          contains 'パレスチナ' /tmp/about.html
          contains '202' /tmp/faq.html
          contains 'パレスチナ' /tmp/faq.html
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path('/tmp/atlas-destinations.json').read_text(encoding='utf-8'))
          destinations = payload.get('destinations') or []
          palestine = next((row for row in destinations if row.get('slug') == 'palestine'), None)
          problems = []
          if payload.get('count') != 202:
              problems.append(f"count={payload.get('count')}")
          if len(destinations) != 202:
              problems.append(f"destinations={len(destinations)}")
          if palestine is None:
              problems.append('palestine missing from production registry')
          elif palestine.get('atlasPublished') is not True or palestine.get('href') != 'countries/palestine/':
              problems.append(f'palestine row: {palestine}')
          if problems:
              print('::error title=Production registry::' + '; '.join(problems))
              sys.exit(1)
          PY

      - name: Verify changed Country routes
        if: steps.target.outputs.slugs != ''
        env:
          TARGET_SLUGS: ${{ steps.target.outputs.slugs }}
        run: |
          set -euo pipefail
          fetch() {
            local url="$1" out="$2" attempt
            for attempt in 1 2 3 4; do
              if curl -fsS --max-time 20 "$url?qa=$GITHUB_RUN_ID-$attempt" -o "$out"; then
                return 0
              fi
              echo "::warning title=Fetch retry::$url (attempt $attempt)"
              sleep 5
            done
            echo "::error title=Fetch failed::$url"
            return 1
          }
          for slug in $(printf '%s' "$TARGET_SLUGS" | tr ',' ' '); do
            [ -f "data/countries/$slug.json" ] || continue
            fetch "https://atlas.yagenji.com/countries/$slug/" "/tmp/$slug.html"
            fetch "https://atlas.yagenji.com/data/countries/$slug.json" "/tmp/$slug.json"
            test -s "/tmp/$slug.html" || { echo "::error title=Country route empty::$slug page"; exit 1; }
            test -s "/tmp/$slug.json" || { echo "::error title=Country route empty::$slug JSON"; exit 1; }
            grep -q "data-country=\"$slug\"" "/tmp/$slug.html" || { echo "::error title=Country route content::$slug page lacks data-country"; exit 1; }
          done

      - name: Install Browser QA dependency
        if: steps.target.outputs.slugs != '' || steps.target.outputs.full == 'true'
        run: python3 -m pip install --disable-pip-version-check --quiet selenium

      - name: Run live target Desktop / Tablet / Mobile QA
        if: steps.target.outputs.slugs != ''
        env:
          QA_BASE_URL: https://atlas.yagenji.com
          QA_OUT_DIR: qa-production-browser-output
          QA_SCOPE: reviewable
          QA_SLUGS: ${{ steps.target.outputs.slugs }}
          QA_RETRY_AUDIT: "1"
        run: python3 scripts/qa_country_browser.py

      - name: Run full published live QA for shared rendering changes
        if: steps.target.outputs.full == 'true'
        env:
          QA_BASE_URL: https://atlas.yagenji.com
          QA_OUT_DIR: qa-production-browser-output
          QA_SCOPE: published
          QA_RETRY_AUDIT: "1"
        run: python3 scripts/qa_published_browser.py

      - name: Upload production Browser QA
        if: always() && (steps.target.outputs.slugs != '' || steps.target.outputs.full == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: production-country-browser-qa
          path: qa-production-browser-output/
          if-no-files-found: warn
          retention-days: 3
