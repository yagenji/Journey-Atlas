name: Verify JOURNEY ATLAS Cloudflare Production
# Operational trigger: India live production QA 2026-09-12
# Operational trigger: Bangladesh live production QA 2026-09-12

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "country.html"
      - "404.html"
      - "_redirects"
      - "faq/**"
      - "privacy/**"
      - "assets/css/**"
      - "assets/js/**"
      - "assets/images/**"
      - "assets/icons/**"
      - "data/countries/**"
      - "data/theme-taxonomy.json"
      - "data/atlas-destinations.json"
      - "data/atlas-destinations-editorial.json"
      - "scripts/build_site.py"
      - "scripts/package_site.py"
      - "scripts/build_cloudflare.py"
      - ".github/workflows/verify-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "verify-cloudflare-production"
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      production_changed: ${{ steps.impact.outputs.production_changed }}
      browser_scope: ${{ steps.impact.outputs.browser_scope }}
      target_slugs: ${{ steps.impact.outputs.target_slugs }}
      published_slugs: ${{ steps.impact.outputs.published_slugs }}
      reviewable_slugs: ${{ steps.impact.outputs.reviewable_slugs }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify production impact
        id: impact
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "production_changed=true" >> "$GITHUB_OUTPUT"
            echo "browser_scope=all" >> "$GITHUB_OUTPUT"
            echo "target_slugs=" >> "$GITHUB_OUTPUT"
            echo "published_slugs=" >> "$GITHUB_OUTPUT"
            echo "reviewable_slugs=" >> "$GITHUB_OUTPUT"
            echo "Manual run: full production verification requested."
            exit 0
          fi
          base_sha="$(git rev-parse HEAD^)"
          if git diff --name-only "$base_sha" HEAD | grep -qx '.github/workflows/verify-production.yml'; then
            echo "production_changed=true" >> "$GITHUB_OUTPUT"
            echo "browser_scope=all" >> "$GITHUB_OUTPUT"
            echo "target_slugs=" >> "$GITHUB_OUTPUT"
            echo "published_slugs=" >> "$GITHUB_OUTPUT"
            echo "reviewable_slugs=" >> "$GITHUB_OUTPUT"
            echo "Production verification workflow changed: full verification requested."
            exit 0
          fi
          python3 scripts/classify_country_impact.py --base "$base_sha" --head HEAD --github-output "$GITHUB_OUTPUT"

  runtime:
    needs: classify
    if: needs.classify.outputs.production_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout expected source
        uses: actions/checkout@v4

      - name: Verify shared Country CSS architecture
        run: |
          set -euo pipefail
          profile_sources="$(grep -l 'country-facts-strip' assets/css/*.css | sort | tr '\n' ' ' | sed 's/ $//')"
          test "$profile_sources" = "assets/css/country-icon-system.css"
          transport_structure_sources="$(grep -l '^\.travel-planning__block--transport \.transport{$' assets/css/*.css | sort | tr '\n' ' ' | sed 's/ $//')"
          test "$transport_structure_sources" = "assets/css/country-discovery-v3.css"

      - name: Wait for atlas.yagenji.com to serve this commit
        env:
          SITE_URL: https://atlas.yagenji.com
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            meta="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$SITE_URL/build-meta.json?qa=$GITHUB_RUN_ID-$attempt" || true)"
            live_sha="$(printf '%s' "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)"
            echo "attempt=$attempt expected=$EXPECTED_SHA live=$live_sha"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "Cloudflare production is serving the expected commit."
              exit 0
            fi
            sleep 5
          done
          echo "atlas.yagenji.com did not reach expected commit within the 10-minute verification window: $EXPECTED_SHA"
          exit 1

      - name: Verify production runtime baseline
        env:
          SITE_URL: https://atlas.yagenji.com
        run: |
          set -euo pipefail
          bash scripts/http_fetch_retry.sh "$SITE_URL/?qa=$GITHUB_RUN_ID" /tmp/top.html
          bash scripts/http_fetch_retry.sh "$SITE_URL/about/?qa=$GITHUB_RUN_ID" /tmp/about.html
          bash scripts/http_fetch_retry.sh "$SITE_URL/assets/js/app.js?qa=$GITHUB_RUN_ID" /tmp/app.js
          bash scripts/http_fetch_retry.sh "$SITE_URL/assets/css/country.css?qa=$GITHUB_RUN_ID" /tmp/country.css
          test -s /tmp/top.html
          test -s /tmp/about.html
          test -s /tmp/app.js
          test -s /tmp/country.css
          grep -q 'renderTaste(fragment, data.taste)' /tmp/app.js
          grep -q 'renderTravelScale(fragment, data.travelScale)' /tmp/app.js
          grep -q 'travel-planning' /tmp/country.css
          echo "Production runtime baseline verified."

      - name: Verify changed Country routes and payloads
        if: needs.classify.outputs.target_slugs != ''
        env:
          SITE_URL: https://atlas.yagenji.com
          TARGET_SLUGS: ${{ needs.classify.outputs.target_slugs }}
        run: |
          set -euo pipefail
          for slug in $(printf '%s' "$TARGET_SLUGS" | tr ',' ' '); do
            [ -n "$slug" ] || continue
            [ -f "data/countries/$slug.json" ] || continue
            bash scripts/http_fetch_retry.sh "$SITE_URL/countries/$slug/?qa=$GITHUB_RUN_ID" "/tmp/$slug.html"
            bash scripts/http_fetch_retry.sh "$SITE_URL/data/countries/$slug.json?qa=$GITHUB_RUN_ID" "/tmp/$slug.json"
            test -s "/tmp/$slug.html"
            test -s "/tmp/$slug.json"
            grep -q "data-country=\"$slug\"" "/tmp/$slug.html"
            echo "Verified production Country route: $slug"
          done

      - name: Verify Spain shared baseline
        if: needs.classify.outputs.browser_scope == 'all'
        env:
          SITE_URL: https://atlas.yagenji.com
        run: |
          set -euo pipefail
          bash scripts/http_fetch_retry.sh "$SITE_URL/data/countries/spain.json?qa=$GITHUB_RUN_ID" /tmp/spain.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/spain.json").read_text(encoding="utf-8"))
          if len(data.get("scenes", [])) != 8:
              raise SystemExit("Spain shared baseline: scenes != 8")
          taste = data.get("taste", {})
          if taste.get("title") != "スペインで食べたいもの" or len(taste.get("items", [])) != 4:
              raise SystemExit("Spain shared baseline: Taste mismatch")
          travel = data.get("travelScale", {})
          if travel.get("title") != "旅の目安日程" or len(travel.get("items", [])) != 3:
              raise SystemExit("Spain shared baseline: Travel Scale mismatch")
          if [item.get("icon") for item in travel.get("items", [])] != ["city", "map", "compass"]:
              raise SystemExit("Spain shared baseline: icon order mismatch")
          print("Spain shared baseline verified.")
          PY

  qa-reviewable:
    needs: [classify, runtime]
    if: |
      always() &&
      needs.runtime.result == 'success' &&
      (needs.classify.outputs.browser_scope == 'all' || needs.classify.outputs.reviewable_slugs != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout expected source
        uses: actions/checkout@v4
      - name: Install browser QA dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet selenium
      - name: Run production unpublished-reviewable browser QA
        env:
          QA_BASE_URL: https://atlas.yagenji.com
          QA_OUT_DIR: qa-browser-reviewable-output
          QA_SCOPE: unpublished-reviewable
          QA_SLUGS: ${{ needs.classify.outputs.reviewable_slugs }}
        run: python3 scripts/qa_published_browser.py
      - name: Upload reviewable browser QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-reviewable-country-browser-qa
          path: qa-browser-reviewable-output/
          if-no-files-found: warn
          retention-days: 3

  qa-published:
    needs: [classify, runtime]
    if: |
      always() &&
      needs.runtime.result == 'success' &&
      (needs.classify.outputs.browser_scope == 'all' || needs.classify.outputs.published_slugs != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout expected source
        uses: actions/checkout@v4
      - name: Install browser QA dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet selenium
      - name: Run production published browser QA
        env:
          QA_BASE_URL: https://atlas.yagenji.com
          QA_OUT_DIR: qa-browser-output
          QA_SCOPE: published
          QA_SLUGS: ${{ needs.classify.outputs.published_slugs }}
        run: python3 scripts/qa_published_browser.py
      - name: Upload published browser QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-published-country-browser-qa
          path: qa-browser-output/
          if-no-files-found: warn
          retention-days: 3
