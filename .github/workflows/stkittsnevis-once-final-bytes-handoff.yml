name: One-off St Kitts Nevis normalized image handoff
on:
  push:
    branches: [country/stkittsnevis]
    paths: [.github/workflows/stkittsnevis-once-final-bytes-handoff.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install target QA prerequisites
        run: python -m pip install --disable-pip-version-check --quiet pillow selenium
      - name: Verify only normalized delivered images and target data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          c=json.loads(Path('data/countries/stkittsnevis.json').read_text())
          s=json.loads(Path('ops/country-production/stkittsnevis.json').read_text())
          t=c['taste']['items']
          assert len(c['scenes'])==8 and len(t)==4
          assert all(x.get('imageFraming')=='SOURCE_ASPECT' for x in t)
          refs=[c['hero']['image']]+[x['image'] for x in c['scenes']]+[x['image'] for x in t]
          assert len(refs)==len(set(refs))==13
          assert sorted(Path('assets/images/stkittsnevis/approved').glob('*.webp'))==sorted(Path(p) for p in refs)
          for index,ref in enumerate(refs):
            assert ref.startswith('assets/images/stkittsnevis/approved/')
            path=Path(ref)
            with Image.open(path) as img:img.verify()
            with Image.open(path) as img:
              img.load(); size=img.size; fmt=img.format
            assert fmt=='WEBP' and size==((1536,1024) if index==0 else (1200,800)),(ref,size,fmt)
            print('VERIFIED_FINAL',ref,size,path.stat().st_size)
          assert s['phase']=='TASTE_REGEN' and s['taste'][2]['state']=='REGENERATE'
          assert s['taste'][2]['userApprovalEvidence']['visualApprovalReceived'] is True
          assert s['finalApproval']['state']=='PENDING'
          registry=json.loads(Path('data/atlas-destinations.json').read_text())
          matches=[x for x in registry['destinations'] if (x if isinstance(x,str) else x.get('slug'))=='stkittsnevis']
          assert len(matches)==1 and (isinstance(matches[0],str) or not matches[0].get('atlasPublished'))
          print('ALL_13_FINAL_RASTERS_VERIFIED')
          PY
          python scripts/audit_country_image_delivery_targeted.py --slug stkittsnevis
          python scripts/validate_images.py --mode audit --slug stkittsnevis
          python scripts/validate_images.py --duplicates-only --slug stkittsnevis
          python scripts/validate_country_editorial_v2.py data/countries/stkittsnevis.json
          python scripts/validate_country.py --strict data/countries/stkittsnevis.json
          python scripts/country_production_state_v7.py validate
      - name: Browser QA from final normalized bytes
        shell: bash
        env:
          TARGET_SLUGS: stkittsnevis
          JOURNEY_ATLAS_SITE_URL: http://127.0.0.1:4173/
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-stkittsnevis-normalized
          QA_SCOPE: unpublished-reviewable
          QA_SLUGS: stkittsnevis
        run: |
          set -euo pipefail
          python scripts/build_country_preview_targeted.py
          python -m http.server 4173 --directory dist >/tmp/stkittsnevis-final-qa.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:4173/countries/stkittsnevis/ >/dev/null; then break; fi
            sleep 1
          done
          python scripts/qa_published_browser.py
      - name: Record verified handoff without changing Taste approvals or publication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          p=Path('ops/country-production/stkittsnevis.json')
          s=json.loads(p.read_text())
          h=s['assetHandoff']
          assert s['phase']=='TASTE_REGEN' and s['stateRevision']==28
          assert h['state']=='PENDING' and h['verifiedRasterCount']==0 and h['expectedRasterCount']==13
          assert s['taste'][2]['state']=='REGENERATE' and s['taste'][2]['userApprovalEvidence']['formalApprovalStatus']=='PENDING_COMPLIANT_QA_OR_EXPLICIT_PRODUCTION_EXCEPTION'
          now=datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          h.update(state='PASS',verifiedRasterCount=13,verifiedAt=now)
          s['productionMetrics']['assetHandoffs']+=1
          s['stateRevision']+=1
          s['updatedAt']=now
          p.write_text(json.dumps(s,ensure_ascii=False,separators=(',',':'))+'\n')
          print('ASSET_HANDOFF VERIFIED 13; FOOD03 FORMAL APPROVAL STILL PENDING; NEXT',s['next'])
          PY
          python scripts/country_production_state_v7.py validate
          python scripts/country_production_protocol_v2.py validate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/country-production/stkittsnevis.json
          git rm .github/workflows/stkittsnevis-once-final-bytes-handoff.yml
          git commit -m 'Verify all 13 final rasters while retaining outstanding FOOD03 QA'
          git push
      - name: Upload focused browser QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stkittsnevis-final-bytes-browser-qa
          path: qa-stkittsnevis-normalized/
          if-no-files-found: ignore
          retention-days: 5
      - name: Remove temporary workflow if verification failed
        if: failure()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch .github/workflows/stkittsnevis-once-final-bytes-handoff.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-off St Kitts Nevis final-byte verification workflow'
            git push
          fi
