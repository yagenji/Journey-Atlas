name: Build Sweden v5 scene

on:
  workflow_dispatch:
  push:
    branches: ["sweden-v3-build"]
    paths:
      - 'data/sweden-build-next.txt'
      - '.github/workflows/build-sweden-v5-scenes.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sweden build branch
        uses: actions/checkout@v4
        with:
          ref: sweden-v3-build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Resolve single scenery target
        id: target
        run: |
          SCENE="$(tr -d '\r\n ' < data/sweden-build-next.txt)"
          test -n "$SCENE"
          echo "scene=$SCENE" >> "$GITHUB_OUTPUT"
          echo "Building Sweden scenery: $SCENE"
      - name: Build one v5 illustrated scene
        run: python3 scripts/build_sweden_v5_scenes.py --scene "${{ steps.target.outputs.scene }}"
      - name: Validate one v5 illustrated scene
        run: python3 scripts/qa_sweden_scene.py "${{ steps.target.outputs.scene }}"
      - name: Commit one Sweden v5 scene
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/sweden/v5 data/sweden-v5-image-credits.json
          if git diff --cached --quiet; then
            echo "No Sweden scene changes"
            exit 0
          fi
          git commit -m "build: add Sweden v5 ${{ steps.target.outputs.scene }} artwork"
          git push origin HEAD:sweden-v3-build
