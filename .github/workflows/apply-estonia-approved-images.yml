name: Apply Estonia approved images

on:
  push:
    branches:
      - estonia-v2-visual
    paths:
      - .github/workflows/apply-estonia-approved-images.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Estonia visual branch
        uses: actions/checkout@v4
        with:
          ref: estonia-v2-visual
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image QA dependency
        run: python -m pip install pillow

      - name: Expand approved image bundle
        run: |
          set -euo pipefail
          cd assets/images/estonia/approved
          test -f estonia-github-ready-webp.zip
          unzip -o estonia-github-ready-webp.zip
          rm estonia-github-ready-webp.zip

      - name: Verify Estonia final images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          base = Path("assets/images/estonia/approved")
          names = [
              "hero-tallinn-old-town.webp",
              "viru-bog.webp",
              "soomaa.webp",
              "panga-cliff.webp",
              "kaali-crater.webp",
              "narva-castle.webp",
              "suur-taevaskoda.webp",
              "kopu-lighthouse.webp",
              "suur-munamagi.webp",
          ]
          for name in names:
              p = base / name
              with Image.open(p) as im:
                  im.load()
                  assert im.format == "WEBP", (name, im.format)
                  assert im.size == (1200, 800), (name, im.size)
          print("Estonia final image QA passed: 9 WebP files at 1200x800")
          PY

      - name: Validate Estonia country data
        run: python scripts/validate_country.py data/countries/estonia.json

      - name: Commit approved final images
        run: |
          set -euo pipefail
          rm .github/workflows/apply-estonia-approved-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/estonia/approved .github/workflows/apply-estonia-approved-images.yml
          git commit -m "feat(estonia): apply approved generated images"
          git push origin HEAD:estonia-v2-visual
