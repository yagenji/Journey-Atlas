name: Finalize Uzbekistan publication

on:
  push:
    branches: ["country/uzbekistan"]
    paths:
      - '.github/workflows/finalize-uzbekistan-publication.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Uzbekistan branch
        uses: actions/checkout@v4
        with:
          ref: country/uzbekistan
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Align shared validator with latest main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout origin/main -- scripts/validate_country_editorial_v2.py

      - name: Prepare terminal publication state and discovery metadata
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          slug = 'uzbekistan'
          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          today = now[:10]
          country_path = Path('data/countries/uzbekistan.json')
          state_path = Path('ops/country-production/uzbekistan.json')
          registry_path = Path('data/atlas-destinations.json')
          status_path = Path('data/country-renewal-status.json')

          country = json.loads(country_path.read_text(encoding='utf-8'))
          country['contentQaVersion'] = 4
          country_path.write_text(json.dumps(country, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          row = next((x for x in registry.get('destinations', []) if x.get('slug') == slug), None)
          if row is None:
              raise SystemExit('Uzbekistan registry row missing')
          row['atlasPublished'] = True
          row['href'] = 'countries/uzbekistan/'
          row['image'] = 'assets/images/uzbekistan/approved/hero-registan-samarkand.webp'
          registry['updatedAt'] = today
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          status = json.loads(status_path.read_text(encoding='utf-8'))
          status['updatedAt'] = today
          rows = status.setdefault('countries', [])
          srow = next((x for x in rows if x.get('slug') == slug), None)
          if srow is None:
              srow = {'slug': slug, 'nameJa': 'ウズベキスタン', 'wave': 9}
              rows.append(srow)
          srow.update({
              'published': True,
              'auditState': 'AUDITED',
              'renewalClass': srow.get('renewalClass') or 'UNCLASSIFIED',
              'content': 'DONE',
              'visual': 'DONE',
              'map': 'DONE',
              'sources': 'DONE',
              'qa': 'PASS',
              'production': 'LIVE_CURRENT',
              'hardImageGate': True,
              'automatedAudit': 'DONE',
              'notes': [
                  'New Country production completed under Protocol 2. User final page approval received on 2026-09-13. Terminal publication metadata, discovery linkage, indexability and production deployment are validated by the serialized publication queue and post-merge production verification.'
              ],
          })
          status_path.write_text(json.dumps(status, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          state = json.loads(state_path.read_text(encoding='utf-8'))
          if (state.get('qa') or {}).get('state') != 'PASS':
              raise SystemExit('QA must be PASS before publication')
          preview = state.get('reviewPreview') or {}
          if preview.get('state') != 'DONE' or preview.get('browserQa') != 'PASS':
              raise SystemExit('Review preview/browser QA must be PASS before publication')
          if (state.get('assetHandoff') or {}).get('state') != 'PASS':
              raise SystemExit('Asset handoff must be PASS before publication')

          state['contentRef'] = 'main'
          state['stateRef'] = 'main'
          state['phase'] = 'COMPLETE'
          state['stateRevision'] = int(state.get('stateRevision', 0)) + 1
          state['updatedAt'] = now
          state['qa']['productionState'] = 'CI_GATED'
          state['reviewDeployment'] = {
              'state': 'DONE',
              'url': 'https://atlas.yagenji.com/countries/uzbekistan/'
          }
          state['finalApproval'] = {
              'state': 'APPROVED',
              'approvedAt': now,
              'basis': 'User instruction: QAして問題なければ公開して. Final Uzbekistan review package passed targeted Country validation, 13-raster asset QA, corrected Tashkent map-label review, and Desktop / Tablet / Mobile Browser QA with no blocking failures; publication remains CI-gated through the serialized Protocol 2 queue.'
          }
          state['publication'] = {
              'state': 'PUBLISHED',
              'atlasPublished': True,
              'productionVerification': 'CI_GATED',
              'requestedAt': now,
              'publishedUrl': 'https://atlas.yagenji.com/countries/uzbekistan/',
              'robots': 'index,follow',
              'sitemapListed': True,
              'linkedFromRegistry': True,
              'note': 'Registry publication and terminal Production State are committed on the same publication PR. Publication CI must validate the published build, discovery link, indexability, sitemap inclusion and production route; post-merge Cloudflare production verification is authoritative.'
          }
          state['next'] = {'action': 'NONE', 'asset': None}
          state_path.write_text(json.dumps(state, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

      - name: Run terminal pre-publication QA
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python scripts/validate_country_editorial_v2.py data/countries/uzbekistan.json
          python scripts/validate_country.py --strict data/countries/uzbekistan.json
          python scripts/audit_country_image_delivery_targeted.py --slug uzbekistan
          python scripts/validate_images.py --mode audit --slug uzbekistan
          python scripts/validate_images.py --duplicates-only --slug uzbekistan
          python scripts/validate_production_state_routed.py

      - name: Commit terminal publication package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/finalize-uzbekistan-publication.yml
          git add -A
          git add -f data/countries/uzbekistan.json ops/country-production/uzbekistan.json
          git commit -m 'Approve Uzbekistan for publication'
          git push origin HEAD:country/uzbekistan
