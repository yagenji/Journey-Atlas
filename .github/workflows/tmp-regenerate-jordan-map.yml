name: Temporary regenerate Jordan map

on:
  push:
    branches:
      - country/jordan
    paths:
      - '.github/workflows/tmp-regenerate-jordan-map.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Jordan branch
        uses: actions/checkout@v4
        with:
          ref: country/jordan
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install map dependencies
        run: pip install shapely cairosvg pillow

      - name: Regenerate Jordan map with official geoBoundaries geometry
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          from shapely.geometry import shape
          from shapely.ops import unary_union
          from scripts.generate_country_map import polygon_path

          API_URL = 'https://www.geoboundaries.org/api/current/gbOpen/JOR/ADM0/'
          BOUNDS = (34.75, 29.1, 39.45, 33.5)
          SIMPLIFY = 0.0007

          with urllib.request.urlopen(API_URL, timeout=30) as response:
              metadata = json.load(response)
          if metadata.get('boundaryID') != 'JOR-ADM0-64752131':
              raise SystemExit(f"Unexpected geoBoundaries dataset: {metadata.get('boundaryID')}")
          if metadata.get('boundaryLicense') != 'Creative Commons Attribution 4.0 International (CC BY 4.0)':
              raise SystemExit(f"Unexpected geoBoundaries license: {metadata.get('boundaryLicense')}")

          source_url = metadata['gjDownloadURL']
          request = urllib.request.Request(source_url, headers={'User-Agent': 'Journey-Atlas-map-build/1.0'})
          with urllib.request.urlopen(request, timeout=30) as response:
              raw = response.read()
          if raw.startswith(b'version https://git-lfs.github.com/spec/v1'):
              raise SystemExit('Official geoBoundaries download returned only a Git LFS pointer')
          geojson = json.loads(raw)

          geometries = [shape(feature['geometry']) for feature in geojson.get('features', [])]
          if not geometries:
              raise SystemExit('Official geoBoundaries dataset contains no features')
          geometry = unary_union(geometries)
          land_path = polygon_path(geometry, BOUNDS, SIMPLIFY)
          if not land_path:
              raise SystemExit('Generated empty Jordan land path')

          old_path = Path('assets/images/jordan/map-atlas-v1.svg')
          svg = old_path.read_text(encoding='utf-8')
          source_note = (
              'geoBoundaries gbOpen JOR ADM0 detailed boundary; '
              f"boundaryID={metadata.get('boundaryID')}; boundaryYear={metadata.get('boundaryYearRepresented')}; "
              f"buildDate={metadata.get('buildDate')}; source={metadata.get('boundarySource')}; "
              f"license={metadata.get('boundaryLicense')}; sourceURL={source_url}; "
              'WGS84; local equirectangular fit with longitude scaled by cos(31.30 degrees); '
              'existing GSHHS intermediate-resolution inland-water treatment retained; JOURNEY ATLAS map-v3 clean background.'
          )
          svg = re.sub(r'<metadata>.*?</metadata>', f'<metadata>{source_note}</metadata>', svg, count=1, flags=re.S)
          pattern = r'(<path\s+d=")[^"]+("\s+fill="url\(#land\)"[^>]*/>)'
          svg, count = re.subn(pattern, lambda m: m.group(1) + land_path + m.group(2), svg, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected to replace one land path; replaced {count}')

          output = Path('assets/images/jordan/map-atlas-v2.svg')
          output.write_text(svg, encoding='utf-8')
          ET.parse(output)
          print(f'Wrote {output} ({output.stat().st_size} bytes)')
          print(f"Source vertices: {metadata.get('meanVertices')}; simplify={SIMPLIFY}")
          PY

      - name: Render SVG QA preview
        run: |
          python - <<'PY'
          import cairosvg
          from PIL import Image
          cairosvg.svg2png(url='assets/images/jordan/map-atlas-v2.svg', write_to='/tmp/jordan-map-v2.png', output_width=1200, output_height=760)
          with Image.open('/tmp/jordan-map-v2.png') as im:
              assert im.size == (1200, 760)
              im.verify()
          print('Rendered 1200x760 PNG successfully')
          PY

      - name: Commit generated map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/jordan/map-atlas-v2.svg
          git diff --cached --quiet && exit 0
          git commit -m 'Refine Jordan map boundary geometry'
          git push origin HEAD:country/jordan

      - name: Upload map QA preview
        uses: actions/upload-artifact@v4
        with:
          name: jordan-map-v2-preview
          path: /tmp/jordan-map-v2.png
          retention-days: 3
