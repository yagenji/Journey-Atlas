name: Temporary integrate Jordan map v2

on:
  push:
    branches:
      - country/jordan
    paths:
      - '.github/workflows/tmp-regenerate-jordan-map.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Jordan branch
        uses: actions/checkout@v4
        with:
          ref: country/jordan
          fetch-depth: 0

      - name: Integrate map v2 and invalidate stale QA
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          country_path = Path('data/countries/jordan.json')
          state_path = Path('ops/country-production/jordan.json')
          map_path = Path('assets/images/jordan/map-atlas-v2.svg')
          if not map_path.exists():
              raise SystemExit('Jordan map v2 is missing')

          country = json.loads(country_path.read_text(encoding='utf-8'))
          country['map']['svg'] = 'assets/images/jordan/map-atlas-v2.svg'
          country['map']['source'] = (
              'geoBoundaries gbOpen JOR ADM0 detailed boundary '
              '(boundaryID JOR-ADM0-64752131, boundary year 2016, build 2023-12-12, CC BY 4.0) '
              'with GSHHS intermediate-resolution inland-water treatment; WGS84; '
              'local equirectangular fit with longitude scaled by cos(31.30°); '
              'JOURNEY ATLAS map-v3 clean background.'
          )
          country['updatedAt'] = '2026-09-15'
          country_path.write_text(json.dumps(country, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          now = datetime.now(ZoneInfo('Asia/Tokyo')).isoformat(timespec='seconds')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['stateRevision'] = int(state.get('stateRevision', 0)) + 1
          state['updatedAt'] = now
          state['phase'] = 'QA'
          state['map']['state'] = 'APPROVED'
          state['map']['asset'] = 'assets/images/jordan/map-atlas-v2.svg'
          state['implementation']['state'] = 'DONE'
          state['implementation']['completedAt'] = now
          state['qa'] = {'state': 'NOT_STARTED', 'productionState': 'NOT_STARTED'}
          state['reviewDeployment'] = {'state': 'NOT_STARTED', 'url': None}
          state['reviewPreview'] = {
              'mode': 'TARGETED_COUNTRY_BRANCH_PREVIEW',
              'state': 'NOT_STARTED',
              'url': None,
              'browserQa': 'NOT_STARTED',
              'deployedAt': None
          }
          metrics = state.setdefault('productionMetrics', {})
          metrics['canonicalReviewReadyAt'] = None
          state['finalApproval'] = {'state': 'PENDING'}
          state['publication'] = {'state': 'DRAFT', 'atlasPublished': False}
          state['next'] = {'action': 'RUN_COUNTRY_QA', 'asset': None}
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Integrated Jordan map v2 and invalidated stale QA state')
          PY

      - name: Remove temporary workflow and commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-regenerate-jordan-map.yml
          git add -f data/countries/jordan.json
          git add ops/country-production/jordan.json
          git diff --cached --check
          git commit -m 'Integrate refined Jordan map and rerun QA'
          git push origin HEAD:country/jordan
