name: Build map quality v2

on:
  push:
    branches:
      - map-quality-v2

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: map-quality-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install map build dependencies
        run: pip install shapely cairosvg pillow
      - name: Build detailed maps
        run: python scripts/build_map_quality_v2.py
      - name: Render QA previews
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image, ImageDraw
          maps = [
              ('SWEDEN', Path('assets/images/sweden/map-atlas-v2.svg')),
              ('FINLAND', Path('assets/images/finland/map-atlas-v2.svg')),
          ]
          qa = Path('map-quality-v2-qa')
          qa.mkdir(exist_ok=True)
          rendered = []
          for name, source in maps:
              target = qa / f'{name.lower()}-map-v2.png'
              cairosvg.svg2png(url=str(source), write_to=str(target), output_width=1200, output_height=760)
              rendered.append((name, target))
          sheet = Image.new('RGB', (1200, 1600), 'white')
          draw = ImageDraw.Draw(sheet)
          y = 0
          for name, target in rendered:
              draw.text((12, y + 8), name, fill='black')
              image = Image.open(target).convert('RGB')
              sheet.paste(image, (0, y + 40))
              y += 800
          sheet.save(qa / 'contact-sheet.png')
          PY
      - name: Commit generated maps
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/sweden/map-atlas-v2.svg assets/images/finland/map-atlas-v2.svg
          git diff --cached --quiet && exit 0
          git commit -m 'build: generate detailed Sweden Finland maps [skip ci]'
          git push origin HEAD:map-quality-v2
      - uses: actions/upload-artifact@v4
        with:
          name: map-quality-v2-qa
          path: map-quality-v2-qa/
