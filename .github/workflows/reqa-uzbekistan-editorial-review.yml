name: Re-run Uzbekistan target QA after editorial review

on:
  push:
    branches: ["country/uzbekistan"]
    paths: [".github/workflows/reqa-uzbekistan-editorial-review.yml"]

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Uzbekistan branch
        uses: actions/checkout@v4
        with:
          ref: country/uzbekistan
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA dependency
        run: python -m pip install --disable-pip-version-check --quiet pillow
      - name: Run complete target QA
        shell: bash
        run: |
          python3 scripts/validate_country_editorial_v2.py data/countries/uzbekistan.json
          python3 scripts/validate_country.py --strict data/countries/uzbekistan.json
          python3 scripts/audit_country_image_delivery_targeted.py --slug uzbekistan
          python3 scripts/validate_images.py --mode audit --slug uzbekistan
          python3 scripts/validate_images.py --duplicates-only --slug uzbekistan
          python3 scripts/country_production_protocol_v2.py validate
      - name: Mark target QA passed
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p = Path('ops/country-production/uzbekistan.json')
          s = json.loads(p.read_text(encoding='utf-8'))
          s['stateRevision'] = int(s.get('stateRevision', 0)) + 1
          s['updatedAt'] = datetime.now(ZoneInfo('Asia/Tokyo')).replace(microsecond=0).isoformat()
          s['qa'] = {'state': 'PASS', 'productionState': 'CI_GATED'}
          s['reviewPreview'] = {'mode': 'TARGETED_COUNTRY_BRANCH_PREVIEW', 'state': 'NOT_STARTED', 'url': None, 'browserQa': 'NOT_STARTED', 'deployedAt': None}
          s['next'] = {'action': 'OPEN_REVIEW_PR_FOR_TARGETED_PREVIEW', 'asset': None}
          p.write_text(json.dumps(s, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          python3 scripts/country_production_protocol_v2.py validate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reqa-uzbekistan-editorial-review.yml
          git add ops/country-production/uzbekistan.json
          git commit -m "Mark Uzbekistan editorial review QA passed"
          git push origin HEAD:country/uzbekistan
