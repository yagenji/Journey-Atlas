name: Temporary Jamaica existing-raster integrity QA
on:
  push:
    paths:
      - '.github/workflows/jamaica-raster-integrity-qa-temp.yml'
permissions:
  contents: read
jobs:
  target-image-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dd4c374534953931a373a840939676f4ba1f2e28
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing image validator dependency
        run: python -m pip install --disable-pip-version-check --quiet 'pillow>=10,<13'
      - name: Verify pinned Country SHA and all thirteen declared original WebP bytes
        run: |
          test "$(git rev-parse HEAD)" = dd4c374534953931a373a840939676f4ba1f2e28
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/countries/jamaica.json').read_text())
          members=[data['hero']['image']]+[row['image'] for row in data['scenes']]+[row['image'] for row in data['taste']['items']]
          assert len(members)==13 and len(set(members))==13
          assert all(p.startswith('assets/images/jamaica/approved/') and p.endswith('.webp') and Path(p).is_file() for p in members)
          print('PASS exact thirteen referenced Jamaica WebPs exist at approved paths')
          PY
      - name: Validate image decode dimensions references and production folder hygiene
        run: python scripts/validate_images.py --mode hard --slug jamaica
      - name: Run actual 42-pair repository near-duplicate gate
        run: python scripts/validate_images.py --duplicates-only --slug jamaica
