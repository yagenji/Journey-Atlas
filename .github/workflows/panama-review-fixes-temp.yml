name: Panama review fixes temp

on:
  push:
    branches:
      - country/panama
    paths:
      - .github/workflows/panama-review-fixes-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: country/panama
          fetch-depth: 0
      - name: Apply Panama review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('data/countries/panama.json')
          data = json.loads(p.read_text(encoding='utf-8'))

          # 1) Area: add Japan comparison.
          for fact in data.get('facts', []):
              if fact.get('label') == '面積':
                  fact['value'] = '75,517 km²（日本の約20%）'

          # 2) Replace ordinary Baru elevation Signature Fact with Darien scale.
          facts = data.get('signatureFacts', [])
          if len(facts) >= 2:
              facts[1] = {
                  'topicKey': 'darien-world-heritage-area-579000ha',
                  'label': 'ダリエン国立公園の世界遺産登録面積',
                  'value': '579,000 ha',
                  'note': 'ユネスコ世界遺産として登録される範囲。海岸から低地林・山地林まで連続する、パナマ最大の保護地域のスケールを示す。',
                  'icon': 'forest',
                  'interestReason': '単なる「広い森」ではなく、約5,790 km²の保護地域が国の東部に連続していることを数字で直感的に示せるため。'
              }

          # 3) Move displayed S06 marker landward while preserving real coordinates.
          # Also separate the Hero marker slightly to the southeast to retain marker clearance.
          data.setdefault('hero', {})['mapOffset'] = {'x': 1.3, 'y': 1.3}
          for scene in data.get('scenes', []):
              if scene.get('id') == 'san-lorenzo-chagres':
                  scene['mapOffset'] = {'x': 0.4, 'y': 0.5}

          # 4) Sancocho image is fixed by shared main CSS (#831): no raster mutation here.

          # 5) Make Colombia connection explicitly air, not overland.
          for route in data.get('nextRoutes', []):
              if route.get('countryEn') == 'COLOMBIA':
                  route['path'] = 'Panama City → Cartagena（空路）'
                  route['description'] = 'パナマとコロンビアの間は道路が連続していない。ダリエンを陸路で越える前提にはせず、パナマシティから空路でカルタヘナへ続ける周遊軸として扱う。植民都市、港湾、Afro-Caribbean文化を別の国から比較できる。'
                  route['statusNote'] = '陸路不可。Pan-American HighwayはYavizaで途切れ、コロンビアへ道路は続かない。ここでは定期空路による接続を示す。'

          # 6) Make duration examples achievable and less overpacked.
          scale = data.get('travelScale', {}).get('items', [])
          if len(scale) >= 3:
              scale[0] = {
                  'duration': '3〜4日',
                  'title': '首都と運河に絞る',
                  'text': 'パナマシティを拠点に、カスコ・アンティグオと運河見学に絞る。例：パナマシティ滞在 → カスコ・アンティグオ → アグア・クララ（またはミラフローレス）。エル・バジェまでは入れず、都市と運河を無理なく見る。',
                  'icon': 'city'
              }
              scale[1] = {
                  'duration': '5〜7日',
                  'title': '近郊の1地域を加える',
                  'text': '首都圏に加えて、エル・バジェまたはグナヤラなど一つの地域を足す。例：パナマシティ → エル・バジェ → パナマシティ。移動日を圧縮せず、近郊の地形や暮らしまで見る。',
                  'icon': 'map'
              }
              scale[2] = {
                  'duration': '8日以上',
                  'title': '西部か島を含む周遊へ',
                  'text': '国内線や長距離移動を使い、西部まで一本つなぐ。例：パナマシティ → ボケテ／チリキ高地 → ボカス・デル・トロ → パナマシティ。さらにコイバまで加えるなら10日以上を目安にする。',
                  'icon': 'compass'
              }

          # Source note for Japan comparison and Darien scale.
          sources = data.setdefault('sources', {})
          sources['japanArea'] = 'Statistics Bureau of Japan, Statistical Handbook of Japan 2023: surface area 377,974 km² (source: Geospatial Information Authority of Japan). https://www.stat.go.jp/english/data/handbook/'
          sources['darienArea'] = 'UNESCO World Heritage Centre, Darien National Park: property 579,000 ha; the park is Panama’s largest protected area. https://whc.unesco.org/en/list/159/'

          p.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/panama-review-fixes-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/countries/panama.json .github/workflows/panama-review-fixes-temp.yml
          git commit -m "Apply Panama review corrections"
          git push origin HEAD:country/panama
