name: Cuba targeted Content and Map QA (temporary)
on:
  push:
    branches:
      - country/cuba
    paths:
      - .github/workflows/cuba-target-qa.yml
permissions:
  contents: read
jobs:
  validate-cuba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Cuba editorial selection, geographic map, and area ratio
        run: |
          python3 scripts/validate_country_editorial_v2.py data/countries/cuba.json
          python3 scripts/validate_country_quality_v5.py data/countries/cuba.json
          python3 scripts/validate_country_map_v6.py data/countries/cuba.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/countries/cuba.json').read_text(encoding='utf-8'))
          assert data['facts'][3]['label'] == '面積'
          assert '109,884' in data['facts'][3]['value']
          assert '約0.29倍' in data['facts'][3]['value']
          assert all(item.get('imageFraming') == 'SOURCE_ASPECT' for item in data['taste']['items'])
          assert data['map']['svg'] == 'assets/images/cuba/map-atlas-v1.svg'
          print('Cuba area ratio, Taste SOURCE_ASPECT, and Map path: PASS')
          PY
