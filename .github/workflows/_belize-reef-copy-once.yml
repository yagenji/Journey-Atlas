name: One-time Belize reef copy differentiation
on:
  push:
    branches: [fix/belize-review-feedback-20260918]
    paths: [.github/workflows/_belize-reef-copy-once.yml]
permissions:
  contents: write
jobs:
  correct-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Differentiate UNESCO reef figure from protected-area explanation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/countries/belize.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['slug']=='belize'
          assert d['signatureFacts'][0]['topicKey']=='belize-reef-world-scale'
          a=d['atlasExtras'][0]
          assert a['topicKey']=='protected-reef-network'
          a['title']='7つの保護区域がつなぐ海と沿岸の生態系'
          a['text']='世界遺産「ベリーズ・バリア・リーフ保護区」は、沿岸と沖合の7つの保護区域から成る。礁湖、海草藻場、マングローブなど、海から沿岸へ続く異なる生息環境を守る。登録区域は珊瑚礁複合体全体の約12%であり、珊瑚礁すべてが世界遺産に含まれるわけではない。'
          a['points']=['ライトハウス・リーフのブルー・ホールも7つの構成区域の一つ','礁とマングローブ、浅い海草藻場は、海洋生物の生息場所としてつながる']
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert '世界で2番目' not in a['title']+a['text']+' '.join(a['points'])
          assert '世界で2番目' in d['signatureFacts'][0]['value']
          PY
          python3 scripts/validate_country_editorial_v2.py
      - name: Commit only differentiated copy; remove temporary helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/_belize-reef-copy-once.yml
          git add -- data/countries/belize.json
          git diff --cached --check
          git commit -m 'Separate Belize reef scale from protected-area explanation'
          git push origin HEAD:refs/heads/fix/belize-review-feedback-20260918
