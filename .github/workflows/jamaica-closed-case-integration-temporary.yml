name: Temporary Jamaica exact-raster integration
on:
  push:
    branches: [qa/jamaica-closed-case-integration-20260919]
    paths: ['.github/workflows/jamaica-closed-case-integration-temporary.yml']
permissions:
  contents: write
jobs:
  integrate-jamaica:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b2994638b3f4bb8ef68f46c472c3e7c766b20ce9
          fetch-depth: 0
          path: site
      - uses: actions/checkout@v4
        with:
          ref: 60409ef3a2621ac10f3ea7dd85a09eea5eb7c710
          path: original-jamaica
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Jamaica-only overlay on newest main, preserve concurrent St Kitts data
        run: |
          (cd original-jamaica && python scripts/country_overlay_v2.py capture jamaica /tmp/jamaica-authorized-overlay)
          (cd site && python scripts/country_overlay_v2.py apply jamaica /tmp/jamaica-authorized-overlay)
          python -m pip install --disable-pip-version-check --quiet 'pillow>=10,<13'
      - name: Verify exact asset identity, preserved provenance and unpublished state
        working-directory: site
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from jamaica_closed_provenance_exception import CASE_ID,CASE_PATH,CASE_GIT_BLOB,blob_sha
          case_file=Path(CASE_PATH)
          assert blob_sha(case_file.read_bytes())==CASE_GIT_BLOB
          case=json.loads(case_file.read_text())
          for item in case['assets'].values():
              image=Path('assets/images/jamaica/approved')/item['filename']
              assert image.is_file() and blob_sha(image.read_bytes())==item['gitBlobSha'],image
          state=json.loads(Path('ops/country-production/jamaica.json').read_text())
          assert state['stateRevision']==7 and state['phase']=='QA'
          assert state['closedProvenanceException']['id']==CASE_ID
          assert state['closedProvenanceException']['status']=='APPLIED'
          assert state['assetHandoff']['state']=='PASS' and state['assetHandoff']['verifiedRasterCount']==13
          assert state['hero']['state']=='APPROVED'
          assert all(i['state']=='NOT_STARTED' for i in state['scenes']+state['taste'])
          assert state['sceneBatchReview']=={'approval':'PENDING','rounds':[]}
          assert state['tasteBatchReview']=={'approval':'PENDING','rounds':[]}
          assert state['finalApproval']['state']=='PENDING'
          assert state['publication']['atlasPublished'] is False
          print('PASS original raster hashes and unchanged explicit unknown generation histories; still unpublished')
          PY
      - name: Validate exact exception, images, geography, editorial and v2 publication readiness
        working-directory: site
        run: |
          python scripts/jamaica_closed_provenance_exception.py
          python scripts/validate_images.py --mode hard --slug jamaica
          python scripts/validate_images.py --duplicates-only --slug jamaica
          python scripts/validate_country.py --strict data/countries/jamaica.json
          python scripts/validate_country_quality_v5.py data/countries/jamaica.json
          python scripts/validate_country_map_v6.py data/countries/jamaica.json
          python scripts/country_production_state_v7.py validate
          python scripts/country_production_protocol_v2.py validate
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from publication_pipeline_v2 import review_ready_errors,publish_ready_errors,state_for_slug
          s=state_for_slug('jamaica')
          assert not review_ready_errors('jamaica',s),review_ready_errors('jamaica',s)
          assert 'finalApproval must be APPROVED' in publish_ready_errors('jamaica',s)
          print('PASS unpublished review ready; formal publish blocked without user final approval')
          PY
      - name: Commit Jamaica-only reviewed tree with both parent histories, fast-forward Country branch
        working-directory: site
        run: |
          test "$(git rev-parse HEAD)" = 'b2994638b3f4bb8ef68f46c472c3e7c766b20ce9'
          git fetch origin country/jamaica
          test "$(git rev-parse FETCH_HEAD)" = '60409ef3a2621ac10f3ea7dd85a09eea5eb7c710'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 'b2994638b3f4bb8ef68f46c472c3e7c766b20ce9'
          git add data/countries/jamaica.json data/theme-taxonomy.json data/atlas-destinations.json assets/images/jamaica/ ops/country-production/jamaica.json
          git diff --cached --name-only | tee /tmp/jamaica-rebase-paths.txt
          python - <<'PY'
          from pathlib import Path
          paths=Path('/tmp/jamaica-rebase-paths.txt').read_text().splitlines()
          allowed={'data/countries/jamaica.json','ops/country-production/jamaica.json','data/theme-taxonomy.json','data/atlas-destinations.json'}
          assert paths and all(p in allowed or p.startswith('assets/images/jamaica/') for p in paths),paths
          print('PASS Jamaica-only overlay; concurrent St Kitts and all other destinations untouched')
          PY
          tree=$(git write-tree)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          merge_commit=$(printf '%s\n' 'Restage exact Jamaica review on newest main while preserving St Kitts' | git commit-tree "$tree" -p b2994638b3f4bb8ef68f46c472c3e7c766b20ce9 -p 60409ef3a2621ac10f3ea7dd85a09eea5eb7c710)
          test "$(git rev-list --parents -n 1 "$merge_commit" | wc -w)" -eq 3
          git push origin "$merge_commit":refs/heads/country/jamaica
          echo "JAMAICA_REBASED_COMMIT=$merge_commit"
