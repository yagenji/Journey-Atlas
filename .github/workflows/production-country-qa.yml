name: Production country QA

on:
  push:
    branches:
      - map-quality-v2
    paths:
      - '.github/workflows/production-country-qa.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check production pages
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out = Path("production-country-qa")
          out.mkdir(exist_ok=True)
          base = "https://atlas.yagenji.com"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for country in ("finland", "sweden"):
                  for name, viewport in (
                      ("desktop", {"width": 1440, "height": 1000}),
                      ("mobile", {"width": 390, "height": 844}),
                  ):
                      page = browser.new_page(viewport=viewport)
                      errors, failed = [], []
                      page.on("console", lambda m: errors.append(m.text) if m.type == "error" else None)
                      page.on("requestfailed", lambda r: failed.append(r.url))
                      response = page.goto(f"{base}/countries/{country}/?qa=production", wait_until="networkidle", timeout=60000)
                      assert response and response.status == 200
                      page.wait_for_selector("#country-map-art img.map-base")
                      page.wait_for_function("""() => {
                        const img = document.querySelector('#country-map-art img.map-base');
                        return img && img.complete && img.naturalWidth > 0;
                      }""")
                      assert page.locator("#map-markers .map-marker").count() == 8
                      assert page.locator("#map-markers .map-capital-marker").count() == 1
                      assert page.locator("#map-markers .map-hero-marker").count() == 1
                      assert page.evaluate("() => document.documentElement.scrollWidth - window.innerWidth") <= 1
                      assert not errors, errors
                      assert not failed, failed
                      art = page.locator("#country-map-art")
                      art.scroll_into_view_if_needed()
                      art.screenshot(path=str(out / f"{country}-{name}.png"))
                      page.close()

              # Confirm the deployed Finland JSON contains corrected offsets and provenance metadata.
              page = browser.new_page()
              data = page.evaluate("""async () => {
                const r = await fetch('https://atlas.yagenji.com/data/countries/finland.json?qa=production-json', {cache:'no-store'});
                return await r.json();
              }""")
              assert data["capital"]["mapOffset"] == {"x": -1.8, "y": -1.2}
              scene = next(x for x in data["scenes"] if x["id"] == "suomenlinna")
              assert scene["mapOffset"] == {"x": 1.2, "y": 1.2}
              assert data["signatureFacts"][0]["value"] == "約16.8万"
              assert "500㎡以上" in data["signatureFacts"][0]["note"]
              assert data["sourcesVerifiedAt"] == "2026-08-28"
              assert data["sourceDates"]["population"] == "2026-07-31"
              browser.close()

          print("Production country QA passed.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: production-country-qa
          path: production-country-qa/
