name: One-shot retire editorial destination registry

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'cleanup/retire-editorial-destination-registry'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical registry migration
        shell: bash
        run: |
          set -euo pipefail
          # Actions has already loaded this workflow. Remove only its checked-out
          # copy so the zero-reference assertion does not count the temporary helper.
          rm .github/workflows/one-shot-retire-editorial-registry.yml
          python3 .github/migrations/retire_editorial_registry.py
      - name: Validate migrated source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_destination_scope.py
          python3 scripts/classify_country_impact.py --self-test
          python3 -m compileall -q scripts
          node --check assets/js/top.js
          node --check assets/js/map-regions.js
          if grep -R --exclude-dir=.git --exclude=retire_editorial_registry.py -n 'atlas-destinations-editorial.json' .; then
            echo 'Compatibility registry reference remains after migration.' >&2
            exit 1
          fi
          test ! -e data/atlas-destinations-editorial.json
      - name: Commit non-workflow migration and stage workflow payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration-output/workflows
          for path in \
            .github/workflows/validate-destination-scope.yml \
            .github/workflows/validate-production-state.yml \
            .github/workflows/publish-country-queue.yml \
            .github/workflows/validate-country-data.yml \
            .github/workflows/browser-country-qa.yml \
            .github/workflows/verify-production.yml \
            .github/workflows/sync-conflicted-country-publication.yml \
            .github/workflows/deploy-country-preview.yml \
            .github/workflows/publication-pipeline-v2-finalize.yml
          do
            cp "$path" "migration-output/workflows/$(basename "$path")"
          done
          # GITHUB_TOKEN cannot push workflow-file edits. Restore all workflows in
          # the commit, then apply the already-validated payloads via GitHub API.
          git checkout HEAD -- .github/workflows
          rm .github/migrations/retire_editorial_registry.py
          rmdir .github/migrations 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Retire editorial destination compatibility registry'
          git push origin HEAD:${{ github.head_ref }}
