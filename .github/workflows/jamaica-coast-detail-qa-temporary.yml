name: Temporary Jamaica detailed coastline QA

on:
  push:
    paths:
      - '.github/workflows/jamaica-coast-detail-qa-temporary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coast-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing common generator dependencies
        run: python -m pip install --disable-pip-version-check --quiet 'basemap==2.0.0' 'shapely>=2,<3' 'geopandas>=1,<2' 'cairosvg>=2.7,<3' 'pillow>=10,<13'
      - name: Retrieve official gbOpen JAM ADM0 source and check coastline at exact WGS84 markers
        run: |
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 60 --silent --show-error \
            'https://www.geoboundaries.org/api/current/gbOpen/JAM/ADM0/' -o /tmp/jam-adm0-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/jam-adm0-metadata.json').read_text())
          assert m['boundaryISO']=='JAM' and m['boundaryType']=='ADM0'
          url=m['gjDownloadURL']
          assert url.startswith('https://')
          Path('/tmp/jam-geojson-url.txt').write_text(url)
          print('Official source',url,'boundaryID',m.get('boundaryID'),'license',m.get('boundaryLicense'))
          PY
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 --silent --show-error \
            "$(cat /tmp/jam-geojson-url.txt)" -o /tmp/jam-detailed.geojson
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from shapely.geometry import Point,shape
          from shapely.ops import unary_union
          p=Path('/tmp/jam-detailed.geojson')
          data=json.loads(p.read_text())
          features=data['features'] if data['type']=='FeatureCollection' else [data]
          geom=unary_union([shape(feature['geometry']) for feature in features])
          assert geom.is_valid and not geom.is_empty and geom.area>0.5
          points={'S05_Dunns_River':(-77.13992,18.41676),'S07_Fort_Charles':(-76.84254,17.93504)}
          flags={key:{'on_land':geom.covers(Point(*loc)),'distance_degrees':round(geom.boundary.distance(Point(*loc)),7)} for key,loc in points.items()}
          report={'source':'geoBoundaries gbOpen JAM ADM0','sourceURL':Path('/tmp/jam-geojson-url.txt').read_text(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'metadata':json.loads(Path('/tmp/jam-adm0-metadata.json').read_text()),'coastalFlags':flags,'geometryValid':geom.is_valid}
          Path('/tmp/jamaica-coast-detail-evidence.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print('SOURCE QA PASS; flags:',flags,'size:',p.stat().st_size)
          PY
      - name: Generate a separate high-resolution map candidate with unchanged shared wrapper
        run: |
          python scripts/generate_country_map_with_context.py \
            --country-json data/countries/jamaica.json \
            --source geoboundaries --iso JAM --simplify 0.0002 \
            --output /tmp/jamaica-geoboundaries-review.svg
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from PIL import Image
          import cairosvg
          svg=Path('/tmp/jamaica-geoboundaries-review.svg').read_bytes()
          root=ET.fromstring(svg)
          assert root.get('viewBox')=='0 0 1200 760'
          assert root.get('data-map-projection')=='local-equirectangular-fit-v1'
          png=cairosvg.svg2png(bytestring=svg,output_width=1200,output_height=760)
          image=Image.open(BytesIO(png));image.load();assert image.size==(1200,760)
          Path('/tmp/jamaica-geoboundaries-review.png').write_bytes(png)
          print('PASS standalone detailed map and full 1200x760 render, NOT page/browser approval')
          PY
      - name: Upload inspection data only, not Country production assets
        uses: actions/upload-artifact@v4
        with:
          name: jamaica-geoBoundaries-detail-candidate
          path: |
            /tmp/jam-adm0-metadata.json
            /tmp/jamaica-coast-detail-evidence.json
            /tmp/jamaica-geoboundaries-review.svg
            /tmp/jamaica-geoboundaries-review.png
          if-no-files-found: error
          retention-days: 3
