name: Cleanup stale branches

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cleanup-stale-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed work branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "audit/published-quality-matrix"
            "content/taste-intro-country-specific"
            "country/belgium-quality-fix"
            "country/cyprus-quality-fix"
            "country/iceland-quality-fix"
            "country/monaco-quality-fix"
            "country/netherlands-quality-fix"
            "country/unitedkingdom-quality-fix"
            "country/unitedkingdom-travel-scale-wording"
            "docs/close-renewal-records"
            "ops/cleanup-stale-branches"
          )
          for branch in "${branches[@]}"; do
            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            status="$(curl -sS -o /tmp/delete.json -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/git/refs/heads/$encoded")"
            if [ "$status" = "204" ]; then
              echo "Deleted $branch"
            elif [ "$status" = "422" ] || [ "$status" = "404" ]; then
              echo "Already absent or not deletable: $branch (HTTP $status)"
              cat /tmp/delete.json || true
            else
              echo "Failed deleting $branch (HTTP $status)"
              cat /tmp/delete.json || true
              exit 1
            fi
          done
