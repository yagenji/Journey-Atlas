name: Finalize repository cleanup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cleanup-stale-branches.yml"

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove cleanup workflow through protected-main PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_BRANCH: ops/finalize-cleanup
          REMOVE_BRANCH: ops/remove-cleanup-workflow-auto
        shell: bash
        run: |
          set -euo pipefail

          # The PR that installed this finalizer is already merged; delete its source branch.
          git push origin --delete "$SOURCE_BRANCH" 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$REMOVE_BRANCH"
          git rm .github/workflows/cleanup-stale-branches.yml
          git commit -m "Remove one-shot cleanup workflow"
          git push origin "$REMOVE_BRANCH"

          HEAD_SHA="$(git rev-parse HEAD)"
          PR_URL="$(gh pr create --repo "$REPO" --base main --head "$REMOVE_BRANCH" \
            --title "Remove one-shot cleanup workflow" \
            --body "Final self-cleanup after completed branch hygiene. Removes the temporary cleanup workflow only.")"
          PR_NUMBER="$(printf '%s' "$PR_URL" | sed -E 's#.*/([0-9]+)$#\1#')"

          # GITHUB_TOKEN-created PRs do not emit ordinary pull_request workflow runs.
          # Explicit workflow_dispatch runs create the real required checks on this head SHA.
          gh workflow run validate-country-data.yml --repo "$REPO" --ref "$REMOVE_BRANCH"
          gh workflow run browser-country-qa.yml --repo "$REPO" --ref "$REMOVE_BRANCH"

          passed=false
          for attempt in $(seq 1 150); do
            checks="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100")"
            validate="$(printf '%s' "$checks" | jq -r '[.check_runs[] | select(.name=="validate")][-1].conclusion // ""')"
            browser="$(printf '%s' "$checks" | jq -r '[.check_runs[] | select(.name=="browser-qa")][-1].conclusion // ""')"
            echo "attempt=$attempt validate=$validate browser-qa=$browser"

            if [ "$validate" = "success" ] && [ "$browser" = "success" ]; then
              passed=true
              break
            fi
            case "$validate $browser" in
              *failure*|*cancelled*|*timed_out*|*action_required*)
                echo "Required cleanup PR check failed."
                exit 1
                ;;
            esac
            sleep 10
          done

          if [ "$passed" != "true" ]; then
            echo "Required cleanup PR checks did not complete in time."
            exit 1
          fi

          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch

          # Confirm the repository now has only main.
          branches="$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name')"
          echo "Remaining branches:"
          printf '%s\n' "$branches"
          test "$branches" = "main"
