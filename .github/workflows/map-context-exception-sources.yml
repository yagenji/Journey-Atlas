name: Review legacy map source SVGs

on:
  pull_request:
    paths:
      - '.github/workflows/map-context-exception-sources.yml'

permissions:
  contents: read

jobs:
  review-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect legacy map SVGs and Country JSON for offline QA
        run: |
          mkdir -p /tmp/map-context-source-review/shared
          cp scripts/add_country_map_context.py /tmp/map-context-source-review/shared/add_country_map_context.py
          cp tests/audit_map_context_inventory.py /tmp/map-context-source-review/shared/audit_map_context_inventory.py
          python3 - <<'PY'
          import json, pathlib, shutil
          root=pathlib.Path('.')
          output=pathlib.Path('/tmp/map-context-source-review')
          for slug in ('brunei','hong-kong','maldives','antiguabarbuda','bahrain','qatar','russia','belize','honduras','monaco','singapore','macau','portugal'):
              p=root/'data'/'countries'/f'{slug}.json'
              if not p.is_file():
                  continue
              config=json.loads(p.read_text())
              target=output/slug
              target.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,target/'country.json')
              source=root/config['map']['svg']
              if source.is_file():
                  shutil.copy2(source,target/'source.svg')
          PY
      - name: Capture historical Monaco coastline source for original-date boundary reconciliation (diagnostic only)
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, pathlib, urllib.parse, urllib.request
          out=pathlib.Path('/tmp/map-context-source-review/monaco-historical-osm')
          out.mkdir(parents=True,exist_ok=True)
          for key,date in [('historical','2026-09-01T12:00:00Z'),('current',None)]:
              prefix=f'[out:json][timeout:100][date:"{date}"];' if date else '[out:json][timeout:100];'
              query=prefix+'(way["natural"="coastline"](43.69,7.36,43.79,7.49);relation(36990););out geom;'
              url='https://overpass-api.de/api/interpreter?'+urllib.parse.urlencode({'data':query})
              request=urllib.request.Request(url,headers={'User-Agent':'JourneyAtlas-GeographicSourceReview/1.0'})
              try:
                  with urllib.request.urlopen(request,timeout=140) as response: data=response.read()
                  decoded=json.loads(data)
                  if not decoded.get('elements'):raise ValueError('Empty OSM source response')
                  (out/f'{key}.json').write_bytes(data)
                  print(key,'elements',len(decoded['elements']),'sha256',hashlib.sha256(data).hexdigest(),flush=True)
              except Exception as exc:
                  (out/f'{key}-error.txt').write_text(repr(exc)+'\n')
                  print(key,'SOURCE_ERROR',repr(exc),flush=True)
          (out/'provenance.json').write_text(json.dumps({'retrievedUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':'OpenStreetMap / Overpass ODbL; comparison only','historicalDate':'2026-09-01T12:00:00Z','bbox':[43.69,7.36,43.79,7.49],'relation':36990},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-map-qa-source-bundle
          path: /tmp/map-context-source-review/
          retention-days: 1
