name: Review legacy map source SVGs

on:
  pull_request:
    paths:
      - '.github/workflows/map-context-exception-sources.yml'

permissions:
  contents: write

jobs:
  review-source:
    if: github.event.pull_request.head.repo.full_name == 'yagenji/Journey-Atlas' && github.event.pull_request.head.ref == 'system/map-context-shared-preparation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG decode dependencies
        run: python -m pip install --quiet 'cairosvg>=2.7,<3' 'pillow>=10,<13'
      - name: Correct documented same-country Green Island context only
        run: |
          python - <<'PY'
          import hashlib
          from io import BytesIO
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import cairosvg
          from PIL import Image
          p=Path('assets/images/antiguabarbuda/map-atlas-v1.svg')
          before=p.read_text(encoding='utf-8')
          assert hashlib.sha256(before.encode()).hexdigest()=='6501d8cbe95eb151ba05eee867cf81c69baa032031f4057b51148a7e56ba8939'
          assert 'id="geographic-context"' not in before
          after=before
          for old,new in (('#eef2ef','#eaf2f4'),('#e4eceb','#dcebf0'),('#dce7e7','#d0e3eb')):
              assert after.count('stop-color="'+old+'"')==1
              after=after.replace('stop-color="'+old+'"','stop-color="'+new+'"',1)
          marker='<rect width="1200" height="760" fill="url(#sea)"/>'
          assert after.count(marker)==1
          note='<g id="geographic-context"><desc>GSHHG 2.3.6 Antigua-region land fragment at 17.07046 N, 61.66977 W corresponds to Green Island, which belongs to Antigua and Barbuda, not neighboring foreign land. No independently verified foreign land falls within the three Antigua, Barbuda and Redonda region frames; no pale foreign context is drawn. Green Island reference: OpenStreetMap way 20858141 / GeoNames 3576208. Approved country paths unchanged.</desc></g>'
          after=after.replace(marker,marker+'\n'+note,1)
          ns='{http://www.w3.org/2000/svg}'
          def paths(svg):
              return {x.get('id'):x.get('d') for x in ET.fromstring(svg).iter(ns+'path') if x.get('id') in ('antigua-land','barbuda-land','redonda-land')}
          assert len(paths(before))==3 and paths(before)==paths(after)
          assert hashlib.sha256(after.encode()).hexdigest()=='667a90553f50a5468902e2a936eb412f72ef59f7dc1d48db958fdc2b8d32025d'
          raster=Image.open(BytesIO(cairosvg.svg2png(bytestring=after.encode(),output_width=1200,output_height=760)))
          raster.load()
          assert raster.size==(1200,760)
          p.write_text(after,encoding='utf-8')
          print('Verified exact national-path parity, Green Island classification and 1200x760 decode')
          PY
      - name: Commit only verified SVG to draft review branch
        run: |
          git diff --check
          git add assets/images/antiguabarbuda/map-atlas-v1.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove own-country Green Island from Antigua foreign context'
          git push origin HEAD:refs/heads/system/map-context-shared-preparation
