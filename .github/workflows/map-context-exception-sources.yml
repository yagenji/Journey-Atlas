name: Review legacy map source SVGs

on:
  pull_request:
    paths:
      - '.github/workflows/map-context-exception-sources.yml'

permissions:
  contents: read

jobs:
  review-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect legacy map SVGs and Country JSON for offline QA
        run: |
          mkdir -p /tmp/map-context-source-review/shared
          cp scripts/add_country_map_context.py /tmp/map-context-source-review/shared/add_country_map_context.py
          cp tests/audit_map_context_inventory.py /tmp/map-context-source-review/shared/audit_map_context_inventory.py
          python3 - <<'PY'
          import json, pathlib, shutil
          root=pathlib.Path('.')
          output=pathlib.Path('/tmp/map-context-source-review')
          for slug in ('brunei','hong-kong','maldives','antiguabarbuda','bahrain','qatar','russia','belize','honduras','monaco','singapore','macau','portugal'):
              p=root/'data'/'countries'/f'{slug}.json'
              if not p.is_file():
                  continue
              config=json.loads(p.read_text())
              target=output/slug
              target.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,target/'country.json')
              source=root/config['map']['svg']
              if source.is_file():
                  shutil.copy2(source,target/'source.svg')
          PY
      - name: Capture OSM French commune land boundaries adjoining Monaco (diagnostic only)
        run: |
          python3 - <<'PY'
          import datetime,hashlib,json,pathlib,urllib.parse,urllib.request
          out=pathlib.Path('/tmp/map-context-source-review/monaco-neighbor-osm')
          out.mkdir(parents=True,exist_ok=True)
          ids=(174562,174956,174558,174958,36990)
          query='[out:json][timeout:120];('+''.join(f'relation({rid});' for rid in ids)+');out geom;'
          request=urllib.request.Request('https://overpass-api.de/api/interpreter?'+urllib.parse.urlencode({'data':query}),headers={'User-Agent':'JourneyAtlas-GeographicSourceReview/1.0'})
          try:
              with urllib.request.urlopen(request,timeout=145) as response:raw=response.read()
              data=json.loads(raw)
              if len(data.get('elements',[]))!=len(ids):raise ValueError(f'Expected {len(ids)} relations, received {len(data.get("elements",[]))}')
              (out/'relations.json').write_bytes(raw)
              print('source elements',len(data['elements']),'bytes',len(raw),'sha256',hashlib.sha256(raw).hexdigest(),flush=True)
          except Exception as exc:
              (out/'error.txt').write_text(repr(exc)+'\n')
              print('SOURCE_ERROR',repr(exc),flush=True)
          (out/'provenance.json').write_text(json.dumps({'retrievedUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':'OpenStreetMap ODbL; original-country border alignment diagnostic, not production data','relationIds':ids},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-map-qa-source-bundle
          path: /tmp/map-context-source-review/
          retention-days: 1
