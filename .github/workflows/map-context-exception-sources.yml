name: Review legacy map source SVGs

on:
  pull_request:
    paths:
      - '.github/workflows/map-context-exception-sources.yml'

permissions:
  contents: write

jobs:
  review-source:
    if: github.event.pull_request.number == 935
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: system/map-context-shared-preparation
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source map and full-decode dependencies
        run: python -m pip install --disable-pip-version-check --quiet 'basemap==2.0.0' 'shapely>=2,<3' 'cairosvg>=2.7,<3' 'pillow>=10,<13'
      - name: Correct Kuwait City inset self-land without moving approved coastline
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import hashlib, json, re, subprocess, io
          import cairosvg
          from PIL import Image
          source = Path('assets/images/kuwait/map-atlas-v1.svg')
          original = source.read_bytes()
          assert hashlib.sha256(original).hexdigest() == 'f3be605dd774b37a74d26722886ea48b00f267eb760057b0913c7e96127a4587', 'Original Kuwait source changed; stop'
          config = json.loads(Path('data/countries/kuwait.json').read_text())
          assert config['map']['regions'][1]['id'] == 'city'
          assert config['map']['regions'][1]['bounds'] == {'north':29.398,'south':29.35,'west':47.95,'east':48.03}, 'City bounds changed; stop'
          output = Path('/tmp/kuwait-stage2-source-preview.svg')
          subprocess.run(['python','scripts/add_country_map_context_existing.py','--country-json','data/countries/kuwait.json','--input',str(source),'--output',str(output)], check=True)
          candidate = output.read_text()
          assert hashlib.sha256(candidate.encode()).hexdigest() == '171f796236848320e9aa620e0e1b4daa93ee0a04dbacd844542ebb61c47b372d', 'Source context generation changed; stop'
          pattern = r'<path\b(?=[^>]*\bdata-map-context-region="city")[^>]*/>'
          assert len(re.findall(pattern,candidate)) == 1
          result = re.sub(pattern,'',candidate,count=1)
          ns='{http://www.w3.org/2000/svg}'
          def target(blob):
              return [p.get('d','') for p in ET.fromstring(blob).iter(ns+'path') if p.get('fill')=='url(#land)']
          approved = target(original)
          assert len(approved)==2 and target(result.encode()) == approved, 'Approved national/inset paths changed'
          assert hashlib.sha256('\n'.join(approved).encode()).hexdigest() == '564b9be86b6c43bfe4698e3e1db74ab5014087486f21578f41a141d55b71db38'
          root = ET.fromstring(result)
          assert [p.get('data-map-context-region') for p in root.iter(ns+'path') if p.get('data-map-context-region')] == ['country']
          assert 'id="geographic-context"' in result and all(x in result for x in ('#eaf2f4','#dcebf0','#d0e3eb'))
          image_bytes = cairosvg.svg2png(bytestring=result.encode(),output_width=1200,output_height=760)
          with Image.open(io.BytesIO(image_bytes)) as image:
              image.load()
              assert image.size == (1200,760)
          source.write_text(result)
          test=Path('tests/test_map_context_reviewed_assets.py')
          code=test.read_text()
          anchor='    def test_landlocked_context_covers_full_canvas_without_a_fake_coast(self):\n'
          assert code.count(anchor)==1
          check='''    def test_kuwait_city_inset_has_no_duplicate_national_context(self):\n        root = ET.parse(ROOT / "assets/images/kuwait/map-atlas-v1.svg").getroot()\n        country = [p.get("d", "") for p in root.iter(SVG + "path") if p.get("fill") == "url(#land)"]\n        self.assertEqual(len(country), 2)\n        self.assertEqual(hashlib.sha256("\\n".join(country).encode()).hexdigest(), "564b9be86b6c43bfe4698e3e1db74ab5014087486f21578f41a141d55b71db38")\n        context = [p.get("data-map-context-region") for p in root.iter(SVG + "path") if p.get("data-map-context-region")]\n        self.assertEqual(context, ["country"])\n\n'''
          test.write_text(code.replace(anchor,check+anchor,1))
          print('Kuwait PASS: source SHA, 2 approved land paths, city inset no false land, full 1200x760 decode')
          PY
          python -m unittest discover -s tests -p 'test_*map_context*.py' -q
          git config user.name 'Journey Atlas map review'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/images/kuwait/map-atlas-v1.svg tests/test_map_context_reviewed_assets.py
          git commit -m 'Remove Kuwait self-land from the reviewed Kuwait City inset'
          git push origin HEAD:system/map-context-shared-preparation
