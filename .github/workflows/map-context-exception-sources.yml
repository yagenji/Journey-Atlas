name: Review legacy map source SVGs

on:
  pull_request:
    paths:
      - '.github/workflows/map-context-exception-sources.yml'

permissions:
  contents: read

jobs:
  review-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect legacy map SVGs and Country JSON for offline QA
        run: |
          mkdir -p /tmp/map-context-source-review/shared
          cp scripts/add_country_map_context.py /tmp/map-context-source-review/shared/add_country_map_context.py
          cp tests/audit_map_context_inventory.py /tmp/map-context-source-review/shared/audit_map_context_inventory.py
          python3 - <<'PY'
          import json, pathlib, shutil
          root=pathlib.Path('.')
          output=pathlib.Path('/tmp/map-context-source-review')
          for slug in ('brunei','hong-kong','maldives','antiguabarbuda','bahrain','qatar','russia','belize','honduras','monaco','singapore','macau','portugal'):
              p=root/'data'/'countries'/f'{slug}.json'
              if not p.is_file():
                  continue
              config=json.loads(p.read_text())
              target=output/slug
              target.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,target/'country.json')
              source=root/config['map']['svg']
              if source.is_file():
                  shutil.copy2(source,target/'source.svg')
          PY
      - name: Capture primary OSM API commune relation geometry adjoining Monaco (diagnostic only)
        run: |
          python3 - <<'PY'
          import datetime,hashlib,json,pathlib,urllib.request,xml.etree.ElementTree as ET
          out=pathlib.Path('/tmp/map-context-source-review/monaco-neighbor-osm')
          out.mkdir(parents=True,exist_ok=True)
          ids=(174562,174956,174558,174958)
          for rid in ids:
              req=urllib.request.Request(f'https://api.openstreetmap.org/api/0.6/relation/{rid}/full',headers={'User-Agent':'JourneyAtlas-GeographicSourceReview/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=75) as response:raw=response.read()
                  root=ET.fromstring(raw)
                  nodes={int(el.get('id')):(float(el.get('lon')),float(el.get('lat'))) for el in root.findall('node')}
                  ways={int(el.get('id')):[int(n.get('ref')) for n in el.findall('nd')] for el in root.findall('way')}
                  relation=next(el for el in root.findall('relation') if int(el.get('id'))==rid)
                  members=[]
                  for m in relation.findall('member'):
                      if m.get('type')!='way':continue
                      refs=ways[int(m.get('ref'))]
                      members.append({'ref':int(m.get('ref')),'role':m.get('role'),'geometry':[{'lon':nodes[n][0],'lat':nodes[n][1]} for n in refs]})
                  result={'id':rid,'tags':{t.get('k'):t.get('v') for t in relation.findall('tag')},'members':members}
                  (out/f'{rid}.json').write_text(json.dumps(result,separators=(',',':')))
                  print(rid,'member_ways',len(members),'source_sha256',hashlib.sha256(raw).hexdigest(),flush=True)
              except Exception as exc:
                  (out/f'{rid}-error.txt').write_text(repr(exc)+'\n')
                  print(rid,'SOURCE_ERROR',repr(exc),flush=True)
          (out/'provenance.json').write_text(json.dumps({'retrievedUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':'OpenStreetMap ODbL primary OSM API relation full; geographic QA only','relationIds':ids},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-map-qa-source-bundle
          path: /tmp/map-context-source-review/
          retention-days: 1
