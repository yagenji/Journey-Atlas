name: Review legacy map source SVGs

on:
  pull_request:
    paths:
      - '.github/workflows/map-context-exception-sources.yml'

permissions:
  contents: write

jobs:
  review-source:
    if: github.event.pull_request.number == 935 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: system/map-context-shared-preparation
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download previously verified, SHA-pinned geographic source snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 35515580822 --repo "$GITHUB_REPOSITORY" --name legacy-map-qa-source-bundle --dir /tmp/journey-atlas-coast-snapshot
          gh run download 35588002840 --repo "$GITHUB_REPOSITORY" --name legacy-map-qa-source-bundle --dir /tmp/journey-atlas-xiangzhou-snapshot
          gh run download 35597759286 --repo "$GITHUB_REPOSITORY" --name legacy-map-qa-source-bundle --dir /tmp/journey-atlas-sla-snapshot
          test -f /tmp/journey-atlas-coast-snapshot/osm-coastline-diagnostic/singapore/ways.json
          test -f /tmp/journey-atlas-coast-snapshot/osm-coastline-diagnostic/macau/ways.json
          test -f /tmp/journey-atlas-xiangzhou-snapshot/macau-neighbor-osm/5405551.json
          test -f /tmp/journey-atlas-sla-snapshot/singapore-boundary-diagnostic/sla-national-map-polygon-2025.geojson
      - name: Generate validated draft-only Singapore and Macau SVGs
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet 'shapely>=2,<3' 'cairosvg>=2.7,<3' 'pillow>=10,<13'
          python -m py_compile scripts/reconcile_exception_map_context.py
          python scripts/reconcile_exception_map_context.py \
            --repo . \
            --coast /tmp/journey-atlas-coast-snapshot/osm-coastline-diagnostic \
            --sla /tmp/journey-atlas-sla-snapshot/singapore-boundary-diagnostic/sla-national-map-polygon-2025.geojson \
            --xiangzhou /tmp/journey-atlas-xiangzhou-snapshot/macau-neighbor-osm/5405551.json
          python -m unittest discover -s tests -p test_map_context_reviewed_assets.py -v
          git diff --check
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          allowed={'assets/images/singapore/map-atlas-v1.svg','assets/images/macau/map-atlas-v1.svg'}
          assert set(changed)==allowed, changed
          print('Only the two approved-country-preserving context SVGs changed:',changed)
          PY
      - name: Commit validated maps to the draft PR branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/singapore/map-atlas-v1.svg assets/images/macau/map-atlas-v1.svg
          git commit -m 'Add source-reconciled Singapore and Macau surrounding land previews'
          git push origin HEAD:system/map-context-shared-preparation
