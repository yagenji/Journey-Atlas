name: Review legacy map source SVGs

on:
  pull_request:
    paths:
      - '.github/workflows/map-context-exception-sources.yml'

permissions:
  contents: write

jobs:
  review-source:
    if: github.event.pull_request.number == 935 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'system/map-context-shared-preparation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact SVG raster QA dependencies
        run: python -m pip install --quiet 'cairosvg>=2.7,<3' 'pillow>=10,<13'
      - name: Exclude approved national silhouettes from source-backed foreign land
        run: |
          git fetch origin main:refs/remotes/origin/main
          python scripts/clip_reviewed_country_context.py --repo .
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/macau/map-atlas-v1.svg assets/images/singapore/map-atlas-v1.svg
          git commit -m 'Clip neighboring land against exact approved Singapore and Macau paths'
          git push origin HEAD:system/map-context-shared-preparation
