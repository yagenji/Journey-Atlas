name: Review legacy map source SVGs

on:
  pull_request:
    paths:
      - '.github/workflows/map-context-exception-sources.yml'

permissions:
  contents: read

jobs:
  review-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect legacy map SVGs and Country JSON for offline QA
        run: |
          mkdir -p /tmp/map-context-source-review/shared
          cp scripts/add_country_map_context.py /tmp/map-context-source-review/shared/add_country_map_context.py
          cp tests/audit_map_context_inventory.py /tmp/map-context-source-review/shared/audit_map_context_inventory.py
          python3 - <<'PY'
          import json, pathlib, shutil
          root=pathlib.Path('.')
          output=pathlib.Path('/tmp/map-context-source-review')
          for slug in ('brunei','hong-kong','maldives','antiguabarbuda','bahrain','qatar','russia','belize','honduras','monaco','singapore','macau','portugal'):
              p=root/'data'/'countries'/f'{slug}.json'
              if not p.is_file():
                  continue
              config=json.loads(p.read_text())
              target=output/slug
              target.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,target/'country.json')
              source=root/config['map']['svg']
              if source.is_file():
                  shutil.copy2(source,target/'source.svg')
          PY
      - name: Capture source OSM administrative boundary relations for independent geography review only
        run: |
          python3 - <<'PY'
          import datetime,hashlib,json,pathlib,time,urllib.parse,urllib.request
          output=pathlib.Path('/tmp/map-context-source-review/osm-administrative-diagnostic')
          output.mkdir(parents=True,exist_ok=True)
          for name,rid in [('macau',1867188),('singapore',536780),('monaco',36990)]:
              query=f'[out:json][timeout:120];relation({rid});out geom;'
              url='https://overpass-api.de/api/interpreter?'+urllib.parse.urlencode({'data':query})
              req=urllib.request.Request(url,headers={'User-Agent':'JourneyAtlas-Geography-QA/1.0 (read-only source comparison)'})
              try:
                  with urllib.request.urlopen(req,timeout=150) as response: raw=response.read()
                  data=json.loads(raw)
                  if not data.get('elements') or data['elements'][0].get('id')!=rid:
                      raise ValueError('Expected OSM boundary relation missing')
                  (output/f'{name}-relation.json').write_bytes(raw)
                  print(name,rid,'bytes',len(raw),'sha256',hashlib.sha256(raw).hexdigest(),'members',len(data['elements'][0].get('members',[])))
              except Exception as exc:
                  (output/f'{name}-error.txt').write_text(repr(exc)+'\n')
                  print('SOURCE_NOT_CAPTURED',name,repr(exc))
              time.sleep(3)
          (output/'provenance.json').write_text(json.dumps({'retrievedUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':'OpenStreetMap ODbL, Overpass API, relation out geom; diagnostic only','relations':{'macau':1867188,'singapore':536780,'monaco':36990}},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-map-qa-source-bundle
          path: /tmp/map-context-source-review/
          retention-days: 1
