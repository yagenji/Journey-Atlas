name: Build Estonia map v1

on:
  push:
    branches:
      - estonia-v1-build
    paths:
      - '.github/workflows/estonia-map-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: estonia-v1-build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install map QA dependencies
        run: python -m pip install shapely cairosvg pillow
      - name: Generate Estonia map and benchmark sheet
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import cairosvg
          from PIL import Image, ImageDraw
          from shapely.ops import unary_union

          from scripts.generate_country_map import load_geoboundaries, render_svg

          WIDTH, HEIGHT = 1200, 760
          land, lakes, source_note = load_geoboundaries("EST", "ADM1")
          merged = unary_union(land)
          minx, miny, maxx, maxy = merged.bounds
          dx, dy = maxx - minx, maxy - miny

          # Standard Map System: geometry bbox + 5% margin.
          west = minx - dx * 0.05
          east = maxx + dx * 0.05
          south = miny - dy * 0.05
          north = maxy + dy * 0.05
          bounds = (west, south, east, north)

          svg = render_svg(
              land=land,
              lakes=lakes,
              bounds=bounds,
              simplify=0.0015,
              include_lakes=False,
              map_name="Estonia",
              source_note=source_note,
          )

          out = Path("assets/images/estonia/map-atlas-v2.svg")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(svg, encoding="utf-8")

          qa = Path("estonia-map-qa")
          qa.mkdir(exist_ok=True)
          est_png = qa / "estonia.png"
          cairosvg.svg2png(
              bytestring=svg.encode("utf-8"),
              write_to=str(est_png),
              output_width=WIDTH,
              output_height=HEIGHT,
          )

          benchmarks = [
              ("ICELAND", Path("assets/images/iceland/map-atlas-v2.svg")),
              ("NORWAY", Path("assets/images/norway/map-atlas-v2.svg")),
              ("DENMARK", Path("assets/images/denmark/map-atlas-v2.svg")),
              ("ESTONIA", out),
          ]
          sheet = Image.new("RGB", (1200, 4 * 800), "white")
          draw = ImageDraw.Draw(sheet)
          y = 0
          for name, svg_path in benchmarks:
              png_path = qa / f"{name.lower()}.png"
              cairosvg.svg2png(
                  url=str(svg_path),
                  write_to=str(png_path),
                  output_width=WIDTH,
                  output_height=HEIGHT,
              )
              draw.text((12, y + 8), name, fill="black")
              sheet.paste(Image.open(png_path).convert("RGB"), (0, y + 40))
              y += 800
          sheet.save(qa / "benchmark-sheet.png")

          metadata = {
              "source": source_note,
              "geometryBounds": {
                  "west": minx, "south": miny, "east": maxx, "north": maxy
              },
              "mapBounds": {
                  "west": west, "south": south, "east": east, "north": north
              },
              "pieces": len(land),
              "svgBytes": len(svg.encode("utf-8")),
              "simplify": 0.0015,
          }
          (qa / "metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(metadata, ensure_ascii=False, indent=2))
          PY
      - name: Commit Estonia SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/estonia/map-atlas-v2.svg
          git commit -m "build: add Estonia high-detail map"
          git push origin HEAD:estonia-v1-build
      - uses: actions/upload-artifact@v4
        with:
          name: estonia-map-qa
          path: estonia-map-qa/
