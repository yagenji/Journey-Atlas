name: Publication Pipeline v2 review

on:
  push:
    branches: ["country/**"]
  workflow_dispatch:
    inputs:
      slug:
        description: Country slug; leave empty to derive from country/<slug>
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: publication-v2-review-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ready: ${{ steps.target.outputs.ready }}
      slug: ${{ steps.target.outputs.slug }}
      head_ref: ${{ steps.target.outputs.head_ref }}
      source_sha: ${{ steps.target.outputs.source_sha }}
      main_sha: ${{ steps.target.outputs.main_sha }}
      review_root: ${{ steps.target.outputs.review_root }}
      review_url: ${{ steps.target.outputs.review_url }}
      image_origin: ${{ steps.target.outputs.image_origin }}
    steps:
      - name: Checkout Country branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve v2 review target
        id: target
        env:
          INPUT_SLUG: ${{ inputs.slug }}
        shell: bash
        run: |
          set -euo pipefail
          head_ref="$GITHUB_REF_NAME"; slug="${INPUT_SLUG:-}"
          [ -n "$slug" ] || slug="${head_ref#country/}"; slug="${slug%-renewal}"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"; echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"; echo "ready=false" >> "$GITHUB_OUTPUT"
          [ -f "data/countries/$slug.json" ] && [ -f "ops/country-production/$slug.json" ] || exit 0
          active="$(python3 scripts/publication_pipeline_v2.py status "$slug" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("active",False)).lower())')"
          [ "$active" = true ] || exit 0
          python3 scripts/publication_pipeline_v2.py assert-review-ready "$slug" || exit 0
          source_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse origin/main)"
          python3 scripts/country_overlay_v2.py assert-scope "$slug" origin/main "$source_sha"
          repo_name="${GITHUB_REPOSITORY#*/}"; pages_base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}/"
          review_root="${pages_base%/}/reviews/$slug/"; review_url="${review_root}countries/$slug/"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"; echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"; echo "review_root=$review_root" >> "$GITHUB_OUTPUT"; echo "review_url=$review_url" >> "$GITHUB_OUTPUT"
          echo "image_origin=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${source_sha}/" >> "$GITHUB_OUTPUT"; echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Ensure one reusable review PR exists
        if: steps.target.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.target.outputs.head_ref }}
          SLUG: ${{ steps.target.outputs.slug }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_REF" --base main --state open --json number --jq '.[0].number // empty')"
          [ -n "$pr" ] || gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$HEAD_REF" --title "Add ${SLUG^} Country Page" --body "Publication Pipeline v2 reusable review/publication PR. Review is validated against latest main plus Country-only overlay. Do not merge before explicit final page approval."
      - name: Dispatch one authoritative targeted QA run
        if: steps.target.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.target.outputs.head_ref }}
          SLUG: ${{ steps.target.outputs.slug }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publication-pipeline-v2-checks.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF" -f slug="$SLUG" -f mode=review
          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publication-pipeline-v2-checks.yml --branch "$HEAD_REF" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SOURCE_SHA\") | .databaseId" | head -n1)"
            [ -n "$run_id" ] && break; sleep 2
          done
          [ -n "$run_id" ] || exit 1
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
      - name: Build deployable review from latest main plus Country overlay
        if: steps.target.outputs.ready == 'true'
        env:
          SLUG: ${{ steps.target.outputs.slug }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          MAIN_SHA: ${{ steps.target.outputs.main_sha }}
          JOURNEY_ATLAS_SITE_URL: ${{ steps.target.outputs.review_root }}
          IMAGE_ORIGIN: ${{ steps.target.outputs.image_origin }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/country_overlay_v2.py capture "$SLUG" /tmp/country-overlay
          git reset --hard "$MAIN_SHA"
          python3 scripts/country_overlay_v2.py apply "$SLUG" /tmp/country-overlay
          TARGET_SLUGS="$SLUG" JOURNEY_ATLAS_BUILD_VERSION="$SOURCE_SHA" python3 scripts/build_country_preview_targeted.py
          python3 scripts/externalize_review_preview_images.py --dist dist --site-url "$JOURNEY_ATLAS_SITE_URL" --image-origin "$IMAGE_ORIGIN"
          test -f "dist/countries/$SLUG/index.html"; test -f "dist/data/countries/$SLUG.json"
      - name: Upload compact review package
        if: steps.target.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: publication-v2-review-${{ steps.target.outputs.slug }}-${{ steps.target.outputs.source_sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: country-review-pages
      cancel-in-progress: false
    environment:
      name: country-review-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Country branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download validated review package
        uses: actions/download-artifact@v4
        with:
          name: publication-v2-review-${{ needs.prepare.outputs.slug }}-${{ needs.prepare.outputs.source_sha }}
          path: dist
      - name: Checkout persistent review snapshot
        uses: actions/checkout@v4
        with:
          ref: review-previews
          path: review-cache
          fetch-depth: 1
      - name: Stage Country into persistent review snapshot
        run: python3 scripts/manage_review_preview_site.py stage --root review-cache --source dist --slug "${{ needs.prepare.outputs.slug }}" --review-url "${{ needs.prepare.outputs.review_url }}" --source-sha "${{ needs.prepare.outputs.source_sha }}" --max-previews 8
      - name: Persist compact review snapshot
        shell: bash
        run: |
          set -euo pipefail
          git -C review-cache config user.name "github-actions[bot]"; git -C review-cache config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C review-cache add -A; tree="$(git -C review-cache write-tree)"; commit="$(printf 'Update persistent Country review: %s\n' '${{ needs.prepare.outputs.slug }}' | git -C review-cache commit-tree "$tree")"; git -C review-cache push --force origin "$commit:refs/heads/review-previews"
      - name: Prepare Pages artifact
        run: rm -rf pages-site && mkdir -p pages-site && rsync -a --exclude='.git/' review-cache/ pages-site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site
      - name: Deploy persistent Country review site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Reconcile Preview result into authoritative Country State
        env:
          SLUG: ${{ needs.prepare.outputs.slug }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          MAIN_SHA: ${{ needs.prepare.outputs.main_sha }}
          REVIEW_URL: ${{ needs.prepare.outputs.review_url }}
          HEAD_REF: ${{ needs.prepare.outputs.head_ref }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "+refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"; git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          python3 scripts/publication_pipeline_v2.py reconcile-review "$SLUG" --source-commit "$SOURCE_SHA" --review-url "$REVIEW_URL" --run-id "$RUN_ID"
          python3 - "$SLUG" "$MAIN_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path('ops/country-production')/f'{sys.argv[1]}.json'; s=json.loads(p.read_text())
          s.setdefault('reviewPreview',{})['mainBaseCommit']=sys.argv[2]
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n')
          PY
          git add "ops/country-production/$SLUG.json"
          if ! git diff --cached --quiet; then git commit -m "Reconcile $SLUG review preview"; git push origin "HEAD:refs/heads/$HEAD_REF"; fi
          echo "Review URL: $REVIEW_URL" >> "$GITHUB_STEP_SUMMARY"; echo "Next user gate: final canonical page approval" >> "$GITHUB_STEP_SUMMARY"
