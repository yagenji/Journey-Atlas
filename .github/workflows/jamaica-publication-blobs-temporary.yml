name: Temporary Jamaica post-publication verification
on:
  push:
    branches: [qa/jamaica-publish-blob-preparation-20260919]
    paths: ['.github/workflows/jamaica-publication-blobs-temporary.yml']
permissions:
  contents: read
jobs:
  jamaica-live-publishing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a51a4a0e10c914bc6622b6cbc8371f14ab5915da
      - name: Verify Jamaica release ancestry, public canonical, sitemap, and registry
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          from html.parser import HTMLParser
          from xml.etree import ElementTree as ET
          from urllib.parse import urlsplit
          base='https://atlas.yagenji.com';url=base+'/countries/jamaica/'
          approved='a51a4a0e10c914bc6622b6cbc8371f14ab5915da'
          def fetch(path):
              req=urllib.request.Request(base+path+('?' if '?' not in path else '&')+'qa='+str(time.time_ns()),headers={'Cache-Control':'no-cache','User-Agent':'Journey-Atlas-Jamaica-Post-Publish-QA'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  assert r.status==200,(path,r.status)
                  return r.read().decode('utf-8')
          live=json.loads(fetch('/build-meta.json'))['commit']
          if live!=approved:
              compare='https://api.github.com/repos/yagenji/Journey-Atlas/compare/'+approved+'...'+live
              with urllib.request.urlopen(urllib.request.Request(compare,headers={'User-Agent':'Journey-Atlas-QA'}),timeout=30) as r:result=json.load(r)
              assert result['status']=='ahead' and result['ahead_by']>0,(live,result['status'])
          print('PASS deployed SHA is Jamaica publication or its descendant:',live,flush=True)
          class Head(HTMLParser):
              def __init__(self): super().__init__();self.robots=[];self.canonical=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='meta' and a.get('name','').lower()=='robots':self.robots.append(a.get('content',''))
                  if tag=='link' and a.get('rel')=='canonical':self.canonical.append(a.get('href',''))
          head=Head();head.feed(fetch('/countries/jamaica/'))
          assert url in head.canonical,head.canonical
          assert head.robots and all('noindex' not in v.lower() for v in head.robots),head.robots
          print('PASS live Jamaica canonical and robots:',head.robots,flush=True)
          xml=ET.fromstring(fetch('/sitemap.xml'))
          assert url in [(e.text or '').strip() for e in xml.iter() if e.tag.endswith('loc')]
          print('PASS Jamaica in sitemap',flush=True)
          registry=json.loads(fetch('/data/atlas-destinations.json'))
          jam=[x for x in registry['destinations'] if x.get('slug')=='jamaica']
          assert len(registry['destinations'])==201 and len(jam)==1,jam
          row=jam[0]
          assert row['atlasPublished'] is True and row['href']=='countries/jamaica/',row
          assert urlsplit(row['image']).path=='assets/images/jamaica/approved/hero-ward-theatre.webp',row
          print('PASS canonical 201 registry, public Jamaica href, approved cache-busted Hero',flush=True)
          PY
      - name: Verify visible Jamaica navigation from live homepage
        run: |
          python3 -m pip install --disable-pip-version-check --quiet selenium
          python3 - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from shutil import which
          options=Options()
          for arg in ('--headless=new','--no-sandbox','--disable-dev-shm-usage'): options.add_argument(arg)
          driver=webdriver.Chrome(service=Service(which('chromedriver')) if which('chromedriver') else Service(),options=options)
          try:
              driver.get('https://atlas.yagenji.com/?qa='+str(time.time_ns()))
              for _ in range(35):
                  links=driver.find_elements(By.CSS_SELECTOR,'a[href*="countries/jamaica/"]')
                  shown=[a for a in links if a.is_displayed()]
                  if shown:break
                  time.sleep(.4)
              if not shown:
                  toggle=driver.find_element(By.ID,'all-countries-toggle')
                  driver.execute_script('arguments[0].click()',toggle)
                  for _ in range(20):
                      shown=[a for a in driver.find_elements(By.CSS_SELECTOR,'a[href*="countries/jamaica/"]') if a.is_displayed()]
                      if shown:break
                      time.sleep(.3)
              assert shown,'Jamaica not visible in homepage Country navigation even after opening all countries'
              assert any(a.get_attribute('href').split('?')[0].rstrip('/')=='https://atlas.yagenji.com/countries/jamaica' for a in shown)
              print('PASS visible ordinary homepage Country navigation:',shown[0].get_attribute('href'),flush=True)
          finally:driver.quit()
          PY
