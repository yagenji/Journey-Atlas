name: One-time Antigua preview refresh
on:
  push:
    branches: ['ops/antigua-preview-refresh-20260917']
    paths: ['.github/workflows/one-time-antigua-preview-refresh.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: country/antiguabarbuda-renewal
          persist-credentials: true
          fetch-depth: 0
      - name: Mark Country content revision for fresh review preview
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/countries/antiguabarbuda.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['slug']=='antiguabarbuda' and d.get('publicationPipelineVersion')==2
          d['updatedAt']='2026-09-17'
          p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/countries/antiguabarbuda.json
          git diff --cached --check
          git commit -m 'Refresh Antigua review after copy and Taste corrections'
          git push origin HEAD:refs/heads/country/antiguabarbuda-renewal
