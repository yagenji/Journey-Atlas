name: Temporary bounded Jamaica publication case patch
on:
  push:
    paths: ['.github/workflows/jamaica-closed-case-patch-temporary.yml']
permissions:
  contents: write
jobs:
  guarded-closed-case:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jamaica-closed-provenance-exception-20260919
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact-marker patch only to existing State and publication functions
        run: python scripts/_apply_jamaica_exception_patch_temp.py
      - name: Test policy fail-closed behavior and compile both changed validators
        run: |
          python -m unittest discover -s scripts -p 'test_jamaica_closed_provenance_exception.py' -v
          python -m py_compile scripts/country_production_state.py scripts/publication_pipeline_v2.py scripts/jamaica_closed_provenance_exception.py
          python scripts/country_production_state.py validate
      - name: Commit reviewed code only and remove temporary patch machinery
        run: |
          rm scripts/_apply_jamaica_exception_patch_temp.py .github/workflows/jamaica-closed-case-patch-temporary.yml
          git add scripts/country_production_state.py scripts/publication_pipeline_v2.py scripts/jamaica_closed_provenance_exception.py scripts/test_jamaica_closed_provenance_exception.py ops/closed-country-publication-exceptions/jamaica.json
          git add -u scripts/_apply_jamaica_exception_patch_temp.py .github/workflows/jamaica-closed-case-patch-temporary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Gate Jamaica legacy publication on exact 13 raster bytes and explicit one-off authorization'
          git push origin HEAD:fix/jamaica-closed-provenance-exception-20260919
