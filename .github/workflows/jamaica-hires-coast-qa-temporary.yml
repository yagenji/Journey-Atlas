name: Temporary Jamaica full-coast map QA
on:
  push:
    paths:
      - '.github/workflows/jamaica-hires-coast-qa-temporary.yml'
permissions:
  contents: read
jobs:
  coastline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shared generator and full NOAA coastline dependencies
        run: python -m pip install --disable-pip-version-check --quiet 'basemap==2.0.0' basemap-data-hires 'shapely>=2,<3' 'geopandas>=1,<2' 'cairosvg>=2.7,<3' 'pillow>=10,<13'
      - name: Use byte-verified shared generator already merged in main
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/yagenji/Journey-Atlas/a3c7efc6ffec33bf4f12b554f013ad1b9ccf3426/scripts/generate_country_map_with_context.py \
            -o /tmp/jamaica-main-map-wrapper.py
          test "$(git hash-object /tmp/jamaica-main-map-wrapper.py)" = 'b1d3c623211e8e9c5b21da1ab2ae6fc3c0ce8208'
          cp /tmp/jamaica-main-map-wrapper.py scripts/generate_country_map_with_context.py
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/AshKyd/geojson-regions/main/public/countries/10m/JAM.geojson \
            -o /tmp/JAM-10m.geojson
          test "$(git hash-object /tmp/JAM-10m.geojson)" = 'c12c1433a0a8a5684d051ebd0f015b723eea8461'
      - name: Select one real NOAA Jamaica island only after strict pinned ADM0 identity comparison
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from mpl_toolkits.basemap import Basemap
          from shapely.geometry import Point,Polygon,shape,mapping
          adm_source=json.loads(Path('/tmp/JAM-10m.geojson').read_text())
          assert adm_source['properties']['adm0_a3']=='JAM' and adm_source['properties']['admin']=='Jamaica'
          adm=shape(adm_source['geometry'])
          m=Basemap(projection='cyl',llcrnrlon=-79,llcrnrlat=17.15,urcrnrlon=-74,urcrnrlat=20.2,resolution='f',area_thresh=0.01)
          candidates=[]
          for (xs,ys),kind in zip(m.coastpolygons,m.coastpolygontypes):
              if kind!=1:continue
              p=Polygon(zip(xs,ys))
              if not p.is_valid:p=p.buffer(0)
              if p.area>0.3 and p.intersection(adm).area/p.area>0.9:candidates.append(p)
          assert len(candidates)==1, 'Target-country identity ambiguous'
          island=candidates[0]
          assert island.is_valid and island.intersection(adm).area/adm.area>0.98
          data=json.loads(Path('data/countries/jamaica.json').read_text())
          targets=[('capital',data['capital']['coordinates']),('hero',data['hero']['coordinates'])]+[(f'S{i:02d}',s['coordinates']) for i,s in enumerate(data['scenes'],1)]
          assert len(targets)==10
          assert all(island.contains(Point(c['longitude'],c['latitude'])) for _,c in targets)
          geo={'type':'FeatureCollection','features':[{'type':'Feature','properties':{'ADMIN':'Jamaica','source':'NOAA GSHHS full coast; ADM0 identity checked'},'geometry':mapping(island)}]}
          Path('/tmp/jamaica-full-coast.geojson').write_text(json.dumps(geo,separators=(',',':')))
          Path('/tmp/jamaica-full-coast-evidence.json').write_text(json.dumps({'adm0GitBlob':'c12c1433a0a8a5684d051ebd0f015b723eea8461','selectedCoastline':'NOAA GSHHS full','vertices':len(island.exterior.coords),'adm0Overlap':island.intersection(adm).area/adm.area,'geometrySHA256':hashlib.sha256(Path('/tmp/jamaica-full-coast.geojson').read_bytes()).hexdigest(),'allTenRealCoordinatesStrictlyOnLand':True},indent=2))
          print('PASS verified national identity and all ten exact WGS84 points on unmodified full-resolution island coastline')
          PY
      - name: Generate self-contained new SVG with existing main wrapper
        run: |
          python scripts/generate_country_map_with_context.py \
            --country-json data/countries/jamaica.json \
            --source natural-earth --dataset /tmp/jamaica-full-coast.geojson --country-name Jamaica \
            --simplify 0 --output /tmp/jamaica-full-coast-review.svg
          python - <<'PY'
          import re
          from pathlib import Path
          path=Path('/tmp/jamaica-full-coast-review.svg');svg=path.read_text()
          old=re.search(r'<metadata>.*?</metadata>',svg,re.S)
          assert old and 'Natural Earth 1:10m' in old.group(0)
          correct='<metadata>Jamaica main island: NOAA GSHHS full-resolution shoreline via Basemap 2.0.0, selected and verified against Natural Earth 1:10m JAM ADM0 (source Git blob c12c1433a0a8a5684d051ebd0f015b723eea8461). Surrounding land: GSHHS intermediate. WGS84. No invented boundaries or altered marker coordinates.</metadata>'
          path.write_text(svg[:old.start()]+correct+svg[old.end():])
          PY
      - name: Check strict rendered land, map v6 validator, single context silhouette and full decode
        run: |
          python - <<'PY'
          from io import BytesIO
          import importlib.util,json,sys,tempfile
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import cairosvg
          from PIL import Image
          root=Path.cwd();svg=Path('/tmp/jamaica-full-coast-review.svg').read_text()
          el=ET.fromstring(svg);ns='{http://www.w3.org/2000/svg}'
          assert el.get('viewBox')=='0 0 1200 760' and el.get('data-map-projection')=='local-equirectangular-fit-v1'
          context=[e for e in el.iter(ns+'g') if e.get('id')=='geographic-context']
          target=[e for e in el.iter(ns+'path') if e.get('fill')=='url(#land)']
          assert len(context)==1 and len(target)==1 and context[0][0].get('d')
          sys.path.insert(0,str(root/'scripts'))
          from generate_country_map_with_context import strip_redundant_island_context
          assert strip_redundant_island_context(svg)==(svg,0), 'Duplicated target silhouette still present'
          spec=importlib.util.spec_from_file_location('v6',root/'scripts/validate_country_map_v6.py')
          v6=importlib.util.module_from_spec(spec);spec.loader.exec_module(v6)
          data=json.loads((root/'data/countries/jamaica.json').read_text())
          polygons=v6.parse_polygons(target[0].get('d'))
          assert polygons
          for name,coordinate in [('capital',data['capital']['coordinates']),('hero',data['hero']['coordinates'])]+[(f'S{i:02d}',s['coordinates']) for i,s in enumerate(data['scenes'],1)]:
              pt=v6.project(coordinate,data['map']['bounds'])
              assert sum(v6.contains(poly,pt) for poly in polygons)%2==1, f'{name} outside filled SVG country land'
          with tempfile.TemporaryDirectory() as tmp:
              v6.ROOT=Path(tmp)
              path=Path(tmp)/data['map']['svg'];path.parent.mkdir(parents=True);path.write_text(svg)
              country=Path(tmp)/'data/countries/jamaica.json';country.parent.mkdir(parents=True);country.write_text(json.dumps(data))
              assert not v6.validate(country),'Map v6 validator failed'
          png=cairosvg.svg2png(bytestring=svg.encode(),output_width=1200,output_height=760)
          img=Image.open(BytesIO(png));img.load();assert img.size==(1200,760)
          Path('/tmp/jamaica-full-coast-review.png').write_bytes(png)
          print('PASS strict SVG land test all 10 coordinates, Map v6, no duplicate silhouette, full 1200x760 decode')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jamaica-full-coast-verified-preview
          path: |
            /tmp/jamaica-full-coast-review.svg
            /tmp/jamaica-full-coast-review.png
            /tmp/jamaica-full-coast-evidence.json
          if-no-files-found: error
          retention-days: 3
