name: Temporary Jamaica high-resolution GSHHS coast QA

on:
  push:
    paths:
      - '.github/workflows/jamaica-hires-coast-qa-temporary.yml'

permissions:
  contents: read

jobs:
  coastline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install high-resolution NOAA GSHHS dataset and geometry tools
        run: python -m pip install --disable-pip-version-check --quiet 'basemap==2.0.0' basemap-data-hires 'shapely>=2,<3'
      - name: Pin target country identity to independently verified Natural Earth ADM0
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/AshKyd/geojson-regions/main/public/countries/10m/JAM.geojson \
            --output /tmp/JAM-10m.geojson
          test "$(git hash-object /tmp/JAM-10m.geojson)" = 'c12c1433a0a8a5684d051ebd0f015b723eea8461'
      - name: Measure exact scene coordinates against high and full GSHHS coastlines
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from mpl_toolkits.basemap import Basemap
          from shapely.geometry import Point,Polygon,shape
          from shapely.ops import unary_union
          adm=shape(json.loads(Path('/tmp/JAM-10m.geojson').read_text())['geometry'])
          points={'capital':(-76.79358,17.99702),'hero':(-76.7936,17.9719),'S01':(-78.3632,18.25398),'S02':(-77.759889,17.876778),'S03':(-77.8463,18.023),'S04':(-77.64747,18.35136),'S05':(-77.13992,18.41676),'S06':(-76.72788,18.08755),'S07':(-76.84254,17.93504),'S08':(-76.50788,18.20141)}
          reports=[]
          for resolution in ('h','f'):
              m=Basemap(projection='cyl',llcrnrlon=-79,llcrnrlat=17.15,urcrnrlon=-74,urcrnrlat=20.2,resolution=resolution,area_thresh=0.01)
              parts=[]
              for (xs,ys),kind in zip(m.coastpolygons,m.coastpolygontypes):
                  if kind!=1:continue
                  p=Polygon(zip(xs,ys))
                  if not p.is_valid:p=p.buffer(0)
                  if p.area > 0.3 and p.intersection(adm).area/p.area > 0.9:parts.append(p)
              assert len(parts)==1, f'Cannot identify Jamaica island unambiguously: {resolution}: {len(parts)}'
              jam=parts[0]
              flags={k:{'on_land':jam.covers(Point(xy)),'coast_distance_m_approx':round(jam.boundary.distance(Point(xy))*111000,1)} for k,xy in points.items()}
              reports.append({'resolution':resolution,'area_deg2':jam.area,'vertices':len(jam.exterior.coords),'overlapADM0':jam.intersection(adm).area/adm.area,'markers':flags})
              print('NOAA GSHHS',resolution,'all markers inside?',all(x['on_land'] for x in flags.values()),'flags',flags)
          Path('/tmp/jamaica-hires-coast-evidence.json').write_text(json.dumps({'NaturalEarth10mSourceGitBlob':'c12c1433a0a8a5684d051ebd0f015b723eea8461','source':'GSHHS via basemap-data-hires','reports':reports},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jamaica-highres-coast-coordinate-check
          path: /tmp/jamaica-hires-coast-evidence.json
          if-no-files-found: error
          retention-days: 3
