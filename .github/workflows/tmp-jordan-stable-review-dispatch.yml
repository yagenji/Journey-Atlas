name: Temporary stable Jordan review dispatch

on:
  push:
    branches:
      - country/jordan
    paths:
      - .github/workflows/tmp-jordan-stable-review-dispatch.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Jordan branch
        uses: actions/checkout@v4
        with:
          ref: country/jordan
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove temporary workflow and stabilize branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/tmp-jordan-stable-review-dispatch.yml
          git add .github/workflows/tmp-jordan-stable-review-dispatch.yml
          git commit -m "Stabilize Jordan branch before review dispatch"
          git push origin HEAD:country/jordan
      - name: Dispatch review from stable branch head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publication-pipeline-v2-review.yml --ref country/jordan -f slug=jordan
