name: Audit Country region labels

on:
  pull_request:
    paths:
      - "data/countries/**"
      - "data/atlas-destinations.json"
      - "data/atlas-destinations-editorial.json"
      - "data/region-taxonomy.json"
      - "scripts/audit_country_region_labels.py"
      - "scripts/normalize_country_region_labels.py"
      - ".github/workflows/audit-country-region-labels.yml"
  push:
    branches: ["main"]
    paths:
      - "data/countries/**"
      - "data/atlas-destinations.json"
      - "data/atlas-destinations-editorial.json"
      - "data/region-taxonomy.json"
      - "scripts/audit_country_region_labels.py"
      - "scripts/normalize_country_region_labels.py"
      - ".github/workflows/audit-country-region-labels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-region-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Country region labels
        run: python scripts/audit_country_region_labels.py
