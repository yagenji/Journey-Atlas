name: Grenada content-map gate (temporary)
on:
  push:
    branches: [country/grenada]
    paths: [.github/workflows/grenada-content-map-gate.yml]
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check committed map and Country content; prepare honest State
        run: |
          python3 - <<'PY'
          import hashlib,json
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from scripts.country_production_protocol_v2 import PREVISUAL_CHECKS,protocol_next
          country_path=Path('data/countries/grenada.json');country=json.loads(country_path.read_text('utf-8'))
          state_path=Path('ops/country-production/grenada.json');state=json.loads(state_path.read_text('utf-8'))
          assert country['slug']==state['slug']=='grenada'
          assert state['phase']=='CONTENT' and state['map']['state']=='REVIEW_CANDIDATE'
          assert state['finalApproval']['state']=='PENDING' and state['publication']['atlasPublished'] is False
          assert country['contentQaVersion']==6 and len(country['scenes'])==8 and len(country['taste']['items'])==4
          assert [i['duration'] for i in country['travelScale']['items']]==['3〜4日','5〜7日','8日以上']
          assert len(country['signatureFacts'])==3 and len(country['encounters'])==8 and len(country['relatedCountries'])==3
          assert len(country['nextRoutes'])==2 and all(x['travelerRoute'] is True and x['status'] in {'OPEN','TEMPORARILY_RESTRICTED','SEASONAL','CHECK_CURRENT_CONDITIONS'} for x in country['nextRoutes'])
          assert all(x['coordinates']['latitude'] and x['coordinates']['longitude'] for x in country['scenes'])
          assert country['hero']['image'] and all(x['image'] for x in country['scenes']) and all(x['image'] for x in country['taste']['items'])
          taxonomy=json.loads(Path('data/theme-taxonomy.json').read_text('utf-8'))
          selected={t['id'] for t in taxonomy['themes'] if 'grenada' in t.get('examples',[])}
          assert selected=={'earth','life','sea'},selected
          svg_path=Path(country['map']['svg']);data=svg_path.read_bytes();svg=ET.fromstring(data)
          assert svg.get('viewBox')=='0 0 1200 760'
          assert hashlib.sha256(data).hexdigest()=='c5af58af78d9ad5e975a1600b7b33e8fcd9f5fb0dbf593a36af65bcd6643f4e2'
          assert 'geoBoundaries gbOpen ADM0' in country['map']['source'] and 'Open Database License 1.0' in country['map']['source']
          target=[e for e in svg if e.tag.endswith('path') and e.get('fill')=='url(#land)']
          assert len(target)==1 and target[0].get('d','').count('M')>=4
          assert any(e.get('id')=='geographic-context' and list(e) for e in svg)
          assert country['sourceDates']['geometry']=='2017' and country['sourceDates']['population']=='2021'
          assert country['sourceDates']['countryArea']=='2026-09-18'
          assert 'source measurement year not stated' in country['sources']['countryArea']
          country['sourceDates']['countryArea']='undated (source omits measurement year)'
          country_path.write_text(json.dumps(country,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          state['phase']='HERO'
          state['stateRevision']=state['stateRevision']+1
          state['updatedAt']=datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          state['map']={'state':'APPROVED','asset':country['map']['svg']}
          assert set(state['preVisualBuild']['checks'])==set(PREVISUAL_CHECKS)
          state['preVisualBuild']={'state':'PASS','checks':{key:'PASS' for key in PREVISUAL_CHECKS}}
          state['next']=protocol_next(state)['next']
          assert state['next']=={'action':'GENERATE_HERO','asset':'HERO'},state['next']
          assert state['hero']['state']=='NOT_STARTED' and state['publication']['atlasPublished'] is False
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('GRENADA_PREVISUAL_STATE_READY',state['phase'],state['next'],state['stateRevision'])
          PY
      - name: Verify exact Country editorial and production protocol gates
        run: |
          python3 scripts/validate_country_editorial_v2.py data/countries/grenada.json
          python3 scripts/validate_country_quality_v5.py data/countries/grenada.json
          python3 scripts/country_production_protocol_v2.py validate
          python3 scripts/country_production_protocol_v2.py next grenada
          python3 -m json.tool data/countries/grenada.json > /dev/null
          python3 -m json.tool ops/country-production/grenada.json > /dev/null
      - name: Commit only Grenada Country and State on its own branch
        run: |
          test "${GITHUB_REF_NAME}" = country/grenada
          git config user.name 'JOURNEY ATLAS previsual QA'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/countries/grenada.json ops/country-production/grenada.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Record Grenada content-map gate PASS and advance to Hero'
          git push origin HEAD:country/grenada
