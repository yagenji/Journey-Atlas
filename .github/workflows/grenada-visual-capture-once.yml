name: Grenada final-asset visual capture (temporary)
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/grenada-visual-capture-once.yml
permissions:
  contents: read
jobs:
  capture:
    if: github.head_ref == 'country/grenada'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact Grenada review source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build approved-asset Grenada page over current main
        env:
          TARGET_SLUGS: grenada
          JOURNEY_ATLAS_SITE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/country_overlay_v2.py capture grenada /tmp/grenada-visual-overlay
          git reset --hard origin/main
          python3 scripts/country_overlay_v2.py apply grenada /tmp/grenada-visual-overlay
          python3 scripts/build_country_preview_targeted.py
      - name: Install browser driver support
        run: python3 -m pip install --disable-pip-version-check --quiet selenium
      - name: Capture three complete responsive pages
        env:
          GRENADA_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist >/tmp/grenada-visual-http.log 2>&1 &
          echo $! >/tmp/grenada-visual-http.pid
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          from scripts.qa_published_browser import make_driver, set_viewport, wait_for_country, scroll_entire_page, full_page_screenshot, VIEWPORTS
          out = pathlib.Path('grenada-visual-final'); out.mkdir(exist_ok=True)
          data = json.loads(pathlib.Path('data/countries/grenada.json').read_text())
          source = os.environ['GRENADA_SOURCE_SHA']
          images = sorted(pathlib.Path('assets/images/grenada/approved').glob('*.webp'))
          assert len(images) == 13, f'expected 13 final rasters: {len(images)}'
          manifest = {'sourceCommit':source, 'mainBaseCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), 'imageSHA256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in images}, 'screenshots':[]}
          for name, cfg in VIEWPORTS.items():
            driver = make_driver()
            try:
              set_viewport(driver,cfg)
              driver.get('http://127.0.0.1:4173/countries/grenada/')
              wait_for_country(driver)
              scroll_entire_page(driver)
              assert len(driver.find_elements('css selector','.scene-card')) == 8
              assert len(driver.find_elements('css selector','.taste-card')) == 4
              robots = driver.execute_script('return document.querySelector("meta[name=robots]")?.content')
              assert robots == 'noindex,follow', robots
              path = out / f'{name}-full.jpg'
              full_page_screenshot(driver,path)
              assert path.is_file() and path.stat().st_size > 20000, f'no screenshot: {path}'
              manifest['screenshots'].append({'viewport':name,'file':path.name,'bytes':path.stat().st_size,'robots':robots})
              print(f'CAPTURED {name}: {path.stat().st_size} bytes',flush=True)
            finally:
              driver.quit()
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print('Source:',source,'main:',manifest['mainBaseCommit'],flush=True)
          PY
      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/grenada-visual-http.pid ]; then kill "$(cat /tmp/grenada-visual-http.pid)" 2>/dev/null || true; fi
      - name: Upload one-time visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grenada-final-asset-visual-evidence
          path: grenada-visual-final/
          if-no-files-found: error
          retention-days: 3
