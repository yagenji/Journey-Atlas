name: Register Tajikistan published status

on:
  push:
    branches: ["country/tajikistan"]
    paths:
      - ".github/workflows/tajikistan-register-published-status.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Country branch
        uses: actions/checkout@v4
        with:
          ref: country/tajikistan

      - name: Add Tajikistan to published Country status SSOT
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/country-renewal-status.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          countries = data.setdefault('countries', [])
          row = next((x for x in countries if x.get('slug') == 'tajikistan'), None)
          target = {
              'slug': 'tajikistan',
              'nameJa': 'タジキスタン',
              'wave': 9,
              'published': True,
              'auditState': 'AUDITED',
              'renewalClass': 'UNCLASSIFIED',
              'content': 'DONE',
              'visual': 'DONE',
              'map': 'DONE',
              'sources': 'DONE',
              'qa': 'PASS',
              'production': 'CI_GATED',
              'hardImageGate': True,
              'notes': [
                  'New Tajikistan Country production completed to current Protocol 2 standard on 2026-09-14.',
                  'User instructed publication after final QA passed. Persistent review deployment, strict Country validation, approved Hero / eight Scenes / four Taste assets / Map, 13-raster integrity checks, Image Policy validation, and Desktop / Tablet / Mobile review Browser QA passed before terminal publication.',
                  'Protocol 2 policyPatch 4 terminal publication uses CI_GATED production verification; post-merge Cloudflare production verification is authoritative.'
              ],
              'automatedAudit': 'DONE'
          }
          if row is None:
              countries.append(target)
          else:
              row.clear(); row.update(target)
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tajikistan-register-published-status.yml
          git add data/country-renewal-status.json
          git commit -m "Register Tajikistan as published for browser QA"
          git push origin HEAD:country/tajikistan
