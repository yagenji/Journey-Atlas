name: Record Hong Kong canonical slug exception

on:
  push:
    branches: ["fix/canonical-201-destinations"]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-201-destinations
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exception
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/atlas-destinations.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          policy = data.setdefault('slugPolicy', {})
          policy['exceptions'] = [
              {
                  'slug': 'hong-kong',
                  'reason': 'Existing published JOURNEY ATLAS route retained for URL stability. This is the only canonical hyphenated destination slug; new slugs remain lowercase letters only.'
              }
          ]
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/atlas-destinations.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Hong Kong canonical slug exception"
          git push origin HEAD:fix/canonical-201-destinations
