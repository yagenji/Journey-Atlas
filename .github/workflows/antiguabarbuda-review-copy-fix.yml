name: One-time Antigua review copy correction
on:
  push:
    branches: ["country/antiguabarbuda-renewal"]
    paths: [".github/workflows/antiguabarbuda-review-copy-fix.yml"]
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: country/antiguabarbuda-renewal
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update only approved Country text and area ratio
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          path=Path('data/countries/antiguabarbuda.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          assert data['slug']=='antiguabarbuda' and data['publicationPipelineVersion']==2
          assert data.get('atlasPublished') is False
          area=[x for x in data['facts'] if x['label']=='面積']
          assert len(area)==1 and area[0]['value']=='442.6 km²'
          area[0]['value']='442.6 km²（日本の約0.12％）'
          population=[x for x in data['facts'] if x['label']=='人口']
          assert len(population)==1
          population[0]['value']=population[0]['value'].replace('World Bank','世界銀行')
          assert 'https://www.paho.org/en/antigua-and-barbuda' in data['sources']['area']
          data['sources']['area'] += ' 日本との面積比の分母：国土地理院「令和8年全国都道府県市区町村別面積調」（2026年4月1日時点の日本の国土面積377,974.87 km²）。https://web1.gsi.go.jp/KOKUJYOHO/MENCHO-title.htm ; 442.6/377974.87×100 ≈ 0.12%。'
          replacements=[
            ('Redonda Ecosystem Reserve','レドンダ生態系保護区'),
            ('Frigate Bird Sanctuary','グンカンドリ保護区'),
            ('Antigua Black pineapple','アンティグア・ブラック・パイナップル'),
            ('Antigua Sailing Week','アンティグア・セーリング・ウィーク'),
            ('Falmouth Harbour','ファルマス・ハーバー'),
            ('English Harbour','イングリッシュ・ハーバー'),
            ('Codrington Lagoon','コドリントン潟湖'),
            ('Two Foot Bay','トゥー・フット・ベイ'),
            ('Betty’s Hope','ベティーズ・ホープ'),
            ('Indian Cave','インディアン洞窟'),
            ('Cades Bay','ケイズ・ベイ'),
            ('Low Bay','ロウ・ベイ'),
            ('St. John’s','セントジョンズ'),
            ('Codrington','コドリントン'),
            ('barrier land','砂州'),
            ('World Bank','世界銀行'),
            ('UNESCO','ユネスコ'),
            ('Barbuda','バーブーダ'),
            ('Antigua','アンティグア'),
            ('Redonda','レドンダ'),
          ]
          changed=[]
          def japanese_prose(text,path_label):
            if not isinstance(text,str): return text
            old=text
            for en,ja in replacements: text=text.replace(en,ja)
            if old!=text: changed.append(path_label)
            return text
          for idx,item in enumerate(data['scenes']):
            item['description']=japanese_prose(item['description'],f'scenes[{idx}].description')
          for idx,item in enumerate(data['atlasExtras']):
            for key in ('title','text'):
              item[key]=japanese_prose(item[key],f'atlasExtras[{idx}].{key}')
            item['points']=[japanese_prose(s,f'atlasExtras[{idx}].points') for s in item.get('points',[])]
          for idx,item in enumerate(data['travelTrivia']):
            for key in ('title','text'):
              item[key]=japanese_prose(item[key],f'travelTrivia[{idx}].{key}')
          for key in ('title','intro'):
            data['taste'][key]=japanese_prose(data['taste'][key],f'taste.{key}')
          for idx,item in enumerate(data['taste']['items']):
            item['text']=japanese_prose(item['text'],f'taste.items[{idx}].text')
          data['travelScale']['intro']=japanese_prose(data['travelScale']['intro'],'travelScale.intro')
          for idx,item in enumerate(data['travelScale']['items']):
            for key in ('title','text'):
              item[key]=japanese_prose(item[key],f'travelScale.items[{idx}].{key}')
          for idx,item in enumerate(data['seasons']):
            item['text']=japanese_prose(item['text'],f'seasons[{idx}].text')
          for key in ('title','text'):
            data['transport'][key]=japanese_prose(data['transport'][key],f'transport.{key}')
          for idx,item in enumerate(data['personas']):
            for key in ('title','text'):
              item[key]=japanese_prose(item[key],f'personas[{idx}].{key}')
          for idx,item in enumerate(data['signatureFacts']):
            for key in ('note','interestReason'):
              item[key]=japanese_prose(item[key],f'signatureFacts[{idx}].{key}')
            if item['value']=='11 miles':
              item['value']='約18 km'
          for idx,item in enumerate(data['tips']):
            for key in ('title','text'):
              item[key]=japanese_prose(item[key],f'tips[{idx}].{key}')
          for idx,item in enumerate(data['relatedCountries']):
            item['reason']=japanese_prose(item['reason'],f'relatedCountries[{idx}].reason')
          assert len(changed)>=20,('Unexpectedly few Japanese prose edits',changed)
          assert data['facts'][3]['label']=='面積' and '日本の約0.12％' in data['facts'][3]['value']
          assert data['taste']['items'][0]['image'].endswith('food-fungee.webp')
          assert len(data['scenes'])==8 and len(data['taste']['items'])==4
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print('Updated Japanese prose fields:',len(set(changed)))
          print('Area fact:',area[0]['value'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/countries/antiguabarbuda.json
          git diff --cached --check
          git commit -m 'Add Japan area ratio and localize Antigua Japanese prose'
          git push origin HEAD:refs/heads/country/antiguabarbuda-renewal
