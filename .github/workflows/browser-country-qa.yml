name: Browser QA published Country pages

on:
  pull_request:
    paths:
      - "country.html"
      - "assets/css/country*.css"
      - "assets/js/app.js"
      - "assets/images/**"
      - "data/countries/**"
      - "data/atlas-destinations.json"
      - "data/atlas-destinations-editorial.json"
      - "data/country-renewal-status.json"
      - "scripts/build_site.py"
      - "scripts/package_site.py"
      - "scripts/build_cloudflare.py"
      - "scripts/qa_published_browser.py"
      - ".github/workflows/browser-country-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser QA dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet pillow selenium

      - name: Build production package
        env:
          JOURNEY_ATLAS_SITE_URL: http://127.0.0.1:4173/
        run: python3 scripts/build_cloudflare.py

      - name: Start local production package
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/journey-atlas-browser-qa-http.log 2>&1 &
          echo $! > /tmp/journey-atlas-browser-qa-http.pid
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/journey-atlas-browser-qa-http.log || true
          exit 1

      - name: Run all-published Desktop / Tablet / Mobile QA
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-browser-output
        run: python3 scripts/qa_published_browser.py

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/journey-atlas-browser-qa-http.pid ]; then
            kill "$(cat /tmp/journey-atlas-browser-qa-http.pid)" 2>/dev/null || true
          fi

      - name: Upload browser QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-country-browser-qa
          path: qa-browser-output/
          if-no-files-found: warn
          retention-days: 3
