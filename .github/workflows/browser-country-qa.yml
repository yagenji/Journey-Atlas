name: Browser QA Country pages

on:
  pull_request:
  workflow_dispatch:
    inputs:
      slug:
        description: "Optional Country slug; blank runs all published Country pages"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: browser-country-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Browser QA scope
        id: target
        shell: bash
        env:
          REQUESTED_SLUG: ${{ inputs.slug }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${REQUESTED_SLUG:-}" ]; then
              echo "slugs=$REQUESTED_SLUG" >> "$GITHUB_OUTPUT"
              echo "full=false" >> "$GITHUB_OUTPUT"
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "slugs=" >> "$GITHUB_OUTPUT"
              echo "full=true" >> "$GITHUB_OUTPUT"
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          base="$PR_BASE_SHA"
          git diff --name-only "$base"...HEAD > /tmp/browser-changed-files.txt
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          output = sys.argv[1]
          files = Path("/tmp/browser-changed-files.txt").read_text().splitlines()
          slugs = set()
          asset_folders = set()

          for path in files:
              match = re.fullmatch(r"data/countries/([^/]+)\.json", path)
              if match:
                  slugs.add(match.group(1))
              match = re.match(r"assets/images/([^/]+)/", path)
              if match:
                  asset_folders.add(match.group(1))

          # Asset folders are not always canonical Country slugs
          # (e.g. assets/images/united-kingdom vs data/countries/unitedkingdom.json).
          # Resolve them from actual Country JSON image/map references instead of
          # treating the directory name as a slug.
          country_dir = Path("data/countries")
          for folder in sorted(asset_folders):
              prefix = f"assets/images/{folder}/"
              matched = set()
              direct = country_dir / f"{folder}.json"
              if direct.exists():
                  matched.add(folder)
              for country_path in country_dir.glob("*.json"):
                  try:
                      payload = country_path.read_text(encoding="utf-8")
                  except OSError:
                      continue
                  if prefix in payload:
                      matched.add(country_path.stem)
              if not matched:
                  raise SystemExit(f"Changed asset folder has no owning Country JSON: {folder}")
              slugs.update(matched)

          shared = any(
              path == "country.html"
              or path.startswith("assets/css/")
              or path.startswith("assets/js/")
              or path in {
                  "scripts/build_site.py",
                  "scripts/build_country_preview_targeted.py",
                  "scripts/build_cloudflare.py",
                  "scripts/qa_published_browser.py",
              }
              for path in files
          )
          run = bool(slugs or shared)
          with open(output, "a", encoding="utf-8") as handle:
              handle.write("slugs=" + ",".join(sorted(slugs)) + "\n")
              handle.write("full=" + ("true" if shared and not slugs else "false") + "\n")
              handle.write("run=" + ("true" if run else "false") + "\n")
          PY

      - name: Browser QA not required
        if: steps.target.outputs.run != 'true'
        run: echo "No Country rendering change detected."

      - name: Set up Python
        if: steps.target.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Browser QA dependency
        if: steps.target.outputs.run == 'true'
        run: python3 -m pip install --disable-pip-version-check --quiet selenium

      - name: Build targeted Country preview
        if: steps.target.outputs.run == 'true' && steps.target.outputs.slugs != ''
        env:
          TARGET_SLUGS: ${{ steps.target.outputs.slugs }}
          JOURNEY_ATLAS_SITE_URL: http://127.0.0.1:4173/
        run: python3 scripts/build_country_preview_targeted.py

      - name: Build full production package
        if: steps.target.outputs.run == 'true' && steps.target.outputs.full == 'true'
        env:
          JOURNEY_ATLAS_SITE_URL: http://127.0.0.1:4173/
        run: python3 scripts/build_cloudflare.py

      - name: Start local site
        if: steps.target.outputs.run == 'true'
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/journey-atlas-browser.log 2>&1 &
          echo $! > /tmp/journey-atlas-browser.pid
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/journey-atlas-browser.log || true
          exit 1

      - name: Run target Desktop / Tablet / Mobile QA
        if: steps.target.outputs.run == 'true' && steps.target.outputs.slugs != ''
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-browser-output
          QA_SCOPE: reviewable
          QA_SLUGS: ${{ steps.target.outputs.slugs }}
        run: python3 scripts/qa_published_browser.py

      - name: Run full published Desktop / Tablet / Mobile QA
        if: steps.target.outputs.run == 'true' && steps.target.outputs.full == 'true'
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-browser-output
          QA_SCOPE: published
        run: python3 scripts/qa_published_browser.py

      - name: Stop local site
        if: always() && steps.target.outputs.run == 'true'
        run: |
          if [ -f /tmp/journey-atlas-browser.pid ]; then
            kill "$(cat /tmp/journey-atlas-browser.pid)" 2>/dev/null || true
          fi

      - name: Upload Browser QA report
        if: always() && steps.target.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: country-browser-qa
          path: qa-browser-output/
          if-no-files-found: warn
          retention-days: 3
