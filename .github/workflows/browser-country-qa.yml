name: Browser QA published Country pages

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: browser-country-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Classify Country-page impact
        id: impact
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "production_changed=true" >> "$GITHUB_OUTPUT"
            echo "publication_metadata_only=false" >> "$GITHUB_OUTPUT"
            echo "browser_scope=all" >> "$GITHUB_OUTPUT"
            echo "target_slugs=" >> "$GITHUB_OUTPUT"
            echo "published_slugs=" >> "$GITHUB_OUTPUT"
            echo "reviewable_slugs=" >> "$GITHUB_OUTPUT"
            echo "Manual run: full Country browser QA requested."
            exit 0
          fi

          base_sha="$(git rev-parse HEAD^1)"
          python3 scripts/classify_country_impact.py \
            --base "$base_sha" \
            --head HEAD \
            --github-output "$GITHUB_OUTPUT"

      - name: Install browser QA dependencies
        if: steps.impact.outputs.browser_scope != 'none' && steps.impact.outputs.publication_metadata_only != 'true'
        run: python3 -m pip install --disable-pip-version-check --quiet selenium

      - name: Build targeted Country preview package
        if: steps.impact.outputs.browser_scope == 'targeted' && steps.impact.outputs.publication_metadata_only != 'true'
        env:
          JOURNEY_ATLAS_SITE_URL: http://127.0.0.1:4173/
          TARGET_SLUGS: ${{ steps.impact.outputs.published_slugs }},${{ steps.impact.outputs.reviewable_slugs }}
        run: python3 scripts/build_country_preview_targeted.py

      - name: Build full production package
        if: steps.impact.outputs.browser_scope == 'all' && steps.impact.outputs.publication_metadata_only != 'true'
        env:
          JOURNEY_ATLAS_SITE_URL: http://127.0.0.1:4173/
        run: python3 scripts/build_cloudflare.py

      - name: Start local production package
        if: steps.impact.outputs.browser_scope != 'none' && steps.impact.outputs.publication_metadata_only != 'true'
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/journey-atlas-browser-qa-http.log 2>&1 &
          echo $! > /tmp/journey-atlas-browser-qa-http.pid
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/journey-atlas-browser-qa-http.log || true
          exit 1

      - name: Validate targeted published package metadata
        if: steps.impact.outputs.publication_metadata_only != 'true' && steps.impact.outputs.browser_scope == 'targeted' && steps.impact.outputs.published_slugs != ''
        env:
          PUBLISHED_SLUGS: ${{ steps.impact.outputs.published_slugs }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from html.parser import HTMLParser
          from pathlib import Path

          class RobotsParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.robots = None

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "meta":
                      return
                  values = {str(key).lower(): value for key, value in attrs}
                  if str(values.get("name") or "").lower() == "robots":
                      self.robots = str(values.get("content") or "")

          root = Path("dist")
          rows = {}
          for name in ("atlas-destinations.json",):
              path = root / "data" / name
              if not path.exists():
                  continue
              payload = json.loads(path.read_text(encoding="utf-8"))
              for item in payload.get("destinations", []):
                  if isinstance(item, dict) and item.get("slug"):
                      rows[item["slug"]] = item

          sitemap = (root / "sitemap.xml").read_text(encoding="utf-8")
          slugs = [value.strip() for value in os.environ["PUBLISHED_SLUGS"].split(",") if value.strip()]
          if not slugs:
              raise SystemExit("No targeted published Country slugs were supplied")

          for slug in slugs:
              row = rows.get(slug)
              if not row:
                  raise SystemExit(f"{slug}: missing from runtime destination registry")
              if row.get("atlasPublished") is not True:
                  raise SystemExit(f"{slug}: runtime registry must have atlasPublished=true")
              expected_href = f"countries/{slug}/"
              if row.get("href") != expected_href:
                  raise SystemExit(f"{slug}: expected href={expected_href!r}, got {row.get('href')!r}")

              page = root / "countries" / slug / "index.html"
              if not page.exists():
                  raise SystemExit(f"{slug}: published Country page missing from targeted package")
              parser = RobotsParser()
              parser.feed(page.read_text(encoding="utf-8"))
              robots = (parser.robots or "").replace(" ", "").lower()
              if robots != "index,follow":
                  raise SystemExit(f"{slug}: published robots must be index,follow; got {parser.robots!r}")
              if f"/countries/{slug}/" not in sitemap:
                  raise SystemExit(f"{slug}: published Country URL missing from sitemap")

          print("Targeted published package metadata PASS: " + ", ".join(slugs))
          PY

      - name: Run targeted unpublished reviewable Country QA
        if: steps.impact.outputs.publication_metadata_only != 'true' && steps.impact.outputs.browser_scope == 'targeted' && steps.impact.outputs.reviewable_slugs != ''
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-browser-reviewable-output
          QA_SCOPE: unpublished-reviewable
          QA_SLUGS: ${{ steps.impact.outputs.reviewable_slugs }}
        run: python3 scripts/qa_published_browser.py

      - name: Run targeted published Country QA
        if: steps.impact.outputs.publication_metadata_only != 'true' && steps.impact.outputs.browser_scope == 'targeted' && steps.impact.outputs.published_slugs != ''
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-browser-output
          QA_SCOPE: reviewable
          QA_SLUGS: ${{ steps.impact.outputs.published_slugs }}
        run: python3 scripts/qa_published_browser.py

      - name: Run all unpublished reviewable Country QA
        if: steps.impact.outputs.publication_metadata_only != 'true' && steps.impact.outputs.browser_scope == 'all'
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-browser-reviewable-output
          QA_SCOPE: unpublished-reviewable
        run: python3 scripts/qa_published_browser.py

      - name: Run all published Country QA
        if: steps.impact.outputs.publication_metadata_only != 'true' && steps.impact.outputs.browser_scope == 'all'
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-browser-output
          QA_SCOPE: published
        run: python3 scripts/qa_published_browser.py

      - name: Browser QA not required
        if: steps.impact.outputs.browser_scope == 'none' || steps.impact.outputs.publication_metadata_only == 'true'
        run: |
          echo "No local Country-rendering QA required."
          echo "Publication metadata-only changes are verified after merge by production QA."

      - name: Stop local server
        if: always() && steps.impact.outputs.browser_scope != 'none' && steps.impact.outputs.publication_metadata_only != 'true'
        run: |
          if [ -f /tmp/journey-atlas-browser-qa-http.pid ]; then
            kill "$(cat /tmp/journey-atlas-browser-qa-http.pid)" 2>/dev/null || true
          fi

      - name: Upload browser QA report
        if: always() && steps.impact.outputs.browser_scope != 'none' && steps.impact.outputs.publication_metadata_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: country-browser-qa
          path: |
            qa-browser-output/
            qa-browser-reviewable-output/
          if-no-files-found: warn
          retention-days: 3
