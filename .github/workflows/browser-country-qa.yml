name: Browser QA published Country pages

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: browser-country-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Classify Country-page impact
        id: impact
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "production_changed=true" >> "$GITHUB_OUTPUT"
            echo "browser_scope=all" >> "$GITHUB_OUTPUT"
            echo "target_slugs=" >> "$GITHUB_OUTPUT"
            echo "published_slugs=" >> "$GITHUB_OUTPUT"
            echo "reviewable_slugs=" >> "$GITHUB_OUTPUT"
            echo "Manual run: full Country browser QA requested."
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          python3 scripts/classify_country_impact.py \
            --base "$base_sha" \
            --head HEAD \
            --github-output "$GITHUB_OUTPUT"

      - name: Install browser QA dependencies
        if: steps.impact.outputs.browser_scope != 'none'
        run: python3 -m pip install --disable-pip-version-check --quiet pillow selenium

      - name: Build production package
        if: steps.impact.outputs.browser_scope != 'none'
        env:
          JOURNEY_ATLAS_SITE_URL: http://127.0.0.1:4173/
        run: python3 scripts/build_cloudflare.py

      - name: Start local production package
        if: steps.impact.outputs.browser_scope != 'none'
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/journey-atlas-browser-qa-http.log 2>&1 &
          echo $! > /tmp/journey-atlas-browser-qa-http.pid
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/journey-atlas-browser-qa-http.log || true
          exit 1

      - name: Run targeted unpublished reviewable Country QA
        if: steps.impact.outputs.browser_scope == 'targeted' && steps.impact.outputs.reviewable_slugs != ''
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-browser-reviewable-output
          QA_SCOPE: unpublished-reviewable
          QA_SLUGS: ${{ steps.impact.outputs.reviewable_slugs }}
        run: python3 scripts/qa_published_browser.py

      - name: Run targeted published Country QA
        if: steps.impact.outputs.browser_scope == 'targeted' && steps.impact.outputs.published_slugs != ''
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-browser-output
          QA_SCOPE: published
          QA_SLUGS: ${{ steps.impact.outputs.published_slugs }}
        run: python3 scripts/qa_published_browser.py

      - name: Run all unpublished reviewable Country QA
        if: steps.impact.outputs.browser_scope == 'all'
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-browser-reviewable-output
          QA_SCOPE: unpublished-reviewable
        run: python3 scripts/qa_published_browser.py

      - name: Run all published Country QA
        if: steps.impact.outputs.browser_scope == 'all'
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-browser-output
          QA_SCOPE: published
        run: python3 scripts/qa_published_browser.py

      - name: Browser QA not required
        if: steps.impact.outputs.browser_scope == 'none'
        run: |
          echo "No Country-rendering impact detected."
          echo "Browser QA skipped by risk-based classifier."

      - name: Stop local server
        if: always() && steps.impact.outputs.browser_scope != 'none'
        run: |
          if [ -f /tmp/journey-atlas-browser-qa-http.pid ]; then
            kill "$(cat /tmp/journey-atlas-browser-qa-http.pid)" 2>/dev/null || true
          fi

      - name: Upload browser QA report
        if: always() && steps.impact.outputs.browser_scope != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: country-browser-qa
          path: |
            qa-browser-output/
            qa-browser-reviewable-output/
          if-no-files-found: warn
          retention-days: 3
