name: Dispatch Uzbekistan continuous-scale preview

on:
  push:
    branches: ["country/uzbekistan"]
    paths: [".github/workflows/dispatch-uzbekistan-continuous-scale-preview.yml"]

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Uzbekistan branch
        uses: actions/checkout@v4
        with:
          ref: country/uzbekistan
          fetch-depth: 0
      - name: Remove one-time dispatcher
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-uzbekistan-continuous-scale-preview.yml
          git commit -m "Remove Uzbekistan continuous-scale preview dispatcher"
          git push origin HEAD:country/uzbekistan
      - name: Dispatch current Country preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/deploy-country-preview.yml/dispatches \
            -f ref='country/uzbekistan' \
            -f inputs[slug]='uzbekistan'
