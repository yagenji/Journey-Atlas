name: Temporary Pending Country Responsive QA

on:
  push:
    branches:
      - "qa/pending-responsive-20260905"
    paths:
      - "scripts/qa_pending_responsive.py"
      - ".github/workflows/qa-pending-responsive.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out QA branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Set up ChromeDriver
        uses: browser-actions/setup-chromedriver@v1

      - name: Install Selenium
        run: python3 -m pip install --disable-pip-version-check --quiet selenium

      - name: Run production responsive and accessibility QA
        env:
          QA_BASE_URL: https://atlas.yagenji.com
          QA_OUT_DIR: qa-browser-output
        run: python3 scripts/qa_pending_responsive.py

      - name: Upload QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-country-responsive-qa
          path: qa-browser-output/
          if-no-files-found: error
          retention-days: 2
