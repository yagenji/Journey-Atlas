name: Deploy JOURNEY ATLAS to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source
        run: |
          python -m py_compile scripts/build_site.py scripts/validate_country.py scripts/new_country.py
          node --check assets/js/app.js
          node --check assets/js/top.js
          python scripts/validate_country.py --published

      - name: Build production site
        run: python scripts/build_site.py

      - name: Validate production build
        run: |
          python scripts/validate_country.py --published
          node --check assets/js/app.js
          node --check assets/js/top.js
          test -f assets/css/country.css
          test -f assets/css/top.css
          test -f assets/images/iceland/v3/hero.webp
          test -f assets/images/top/hero-set-1.webp
          test -f assets/images/top/hero-set-5.webp
          test -f assets/images/top/theme-approved-sprite.webp
          test -f assets/images/top/explore-entry-sprite.webp
          test -f countries/iceland/index.html
          test -f sitemap.xml
          test -f robots.txt
          grep -q 'data-country="iceland"' countries/iceland/index.html
          grep -q 'assets/images/iceland/v3/hero.webp' data/countries/iceland.json
          grep -q 'countries/iceland/' data/atlas-destinations.json
          if grep -q '\.b64' assets/js/top.js; then echo 'top.js still contains runtime base64 media'; exit 1; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
