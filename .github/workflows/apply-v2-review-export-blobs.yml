name: Export validated Pipeline v2 source blobs
on:
  push:
    branches: [fix/publication-v2-review-idempotency-20260916]
    paths: [.github/workflows/apply-v2-review-export-blobs.yml]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/publication-v2-review-idempotency-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact shared changes and export unattached blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/apply-v2-review-patch-once.yml').read_text(encoding='utf-8')
          fragment = textwrap.dedent(source.split("          python3 - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0])
          begin = fragment.index("test = Path('scripts/test_publication_v2_review_gate.py')")
          end = fragment.index("Path('.github/workflows/apply-v2-review-patch-once.yml').unlink()", begin)
          fragment = fragment[:begin] + fragment[end:]
          test_raw = source.split("          test.write_text('''", 1)[1].split("'''.replace(", 1)[0]
          exec(compile(fragment, 'pipeline_patch', 'exec'), {})
          Path('scripts/test_publication_v2_review_gate.py').write_text(test_raw.replace('\n          ', '\n'), encoding='utf-8')
          print('Changed source ready; temporary workflow files will not be included in output.')
          PY
          python3 -m py_compile scripts/publication_pipeline_v2.py scripts/test_publication_v2_review_gate.py
          python3 scripts/test_publication_v2_review_gate.py
          python3 scripts/publication_pipeline_v2.py self-test
          for path in scripts/publication_pipeline_v2.py scripts/test_publication_v2_review_gate.py .github/workflows/publication-pipeline-v2-review.yml .github/workflows/publication-pipeline-v2-checks.yml .github/workflows/deploy-country-preview.yml; do
            blob_sha="$(python3 - "$path" <<'PY' | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha
          import json,sys
          from pathlib import Path
          print(json.dumps({'content':Path(sys.argv[1]).read_text(encoding='utf-8'),'encoding':'utf-8'}))
          PY
            )"
            printf 'VALIDATED_BLOB %s %s\n' "$path" "$blob_sha"
          done
