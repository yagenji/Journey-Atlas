name: Patch Nepal area Japan ratio

on:
  push:
    branches: ["fix/nepal-area-japan-ratio"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nepal-area-japan-ratio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Nepal area comparison
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/countries/nepal.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          fact = next((item for item in data.get('facts', []) if item.get('label') == '面積'), None)
          if fact is None:
              raise SystemExit('Nepal area fact not found')
          if fact.get('value') not in {'147,516km²', '147,516 km²'}:
              raise SystemExit(f"Unexpected current area value: {fact.get('value')}")
          fact['value'] = '147,516 km²（日本の約39%）'
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/patch-nepal-area-ratio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/countries/nepal.json
          git diff --cached --check
          git commit -m "Add Japan area comparison for Nepal"
          git push origin HEAD:fix/nepal-area-japan-ratio
