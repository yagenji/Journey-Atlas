name: Materialize Sweden v5 Hero and scenes

on:
  push:
    branches: ["sweden-v3-build"]
    paths:
      - 'assets/images/sweden/v5-bin/**'
      - 'assets/images/sweden/v5-input/**'
      - 'scripts/materialize_sweden_v5_hero.py'
      - 'scripts/build_sweden_v5_scenes.py'
      - 'scripts/qa_sweden_production.py'
      - '.github/workflows/materialize-sweden-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sweden build branch
        uses: actions/checkout@v4
        with:
          ref: sweden-v3-build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Materialize approved Hero
        run: python3 scripts/materialize_sweden_v5_hero.py
      - name: Build v5 illustrated scenes
        run: python3 scripts/build_sweden_v5_scenes.py
      - name: Verify Sweden production candidate
        run: python3 scripts/qa_sweden_production.py
      - name: Commit Sweden v5 production assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/images/sweden/v5 assets/images/sweden/v5-bin assets/images/sweden/v5-input data/countries/sweden.json data/sweden-v5-image-credits.json
          if git diff --cached --quiet; then
            echo "No Sweden v5 changes"
            exit 0
          fi
          git commit -m "build: materialize Sweden v5 production artwork"
          git push origin HEAD:sweden-v3-build
