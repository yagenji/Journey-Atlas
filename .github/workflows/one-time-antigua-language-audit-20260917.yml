name: One-time Antigua Japanese copy correction
on:
  push:
    branches: ['country/antiguabarbuda-renewal']
    paths: ['.github/workflows/one-time-antigua-language-audit-20260917.yml']
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: country/antiguabarbuda-renewal
          persist-credentials: true
      - name: Correct audited visible prose and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('data/countries/antiguabarbuda.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['slug']=='antiguabarbuda' and d.get('atlasPublished',False) is False
          assert len(d['scenes'])==8 and len(d['taste']['items'])==4
          assert d['hero']['location']=='Shirley Heights Lookout / English Harbour'
          d['hero']['location']='シャーリー・ハイツ展望台／イングリッシュ・ハーバー'
          assert 'Devil’s Bridge' in d['travelScale']['items'][0]['text']
          d['travelScale']['items'][0]['text']=d['travelScale']['items'][0]['text'].replace('Devil’s Bridge','デビルズ・ブリッジ')
          assert 'Wallings' in d['travelScale']['items'][1]['text']
          d['travelScale']['items'][1]['text']=d['travelScale']['items'][1]['text'].replace('Wallings','ウォーリングス自然保護区')
          # Metadata, English section kickers, source codes, original-place captions and map labels follow the shared Country format.
          for root in ('hero','scenes','atlasExtras','travelTrivia','taste','travelScale','seasons','transport','personas','signatureFacts','tips','relatedCountries'):
            def check(v,path=''):
              if isinstance(v,dict):
                for k,item in v.items():
                  if k in {'nameLocal','mapLabel','nameEn','themeEn','categoryEn','topicKey','sourceKey','image','imageState','mapRegion','id','icon','color','slug','flag','affinityType','coordinates','mapOffset','source','sources'}:continue
                  if k in {'lead','description','text','intro','reason','note','interestReason','location'} and isinstance(item,str):
                    if re.search('[A-Za-z]{2,}',item):raise AssertionError((root,path+'.'+k,item))
                  elif isinstance(item,(list,dict)):check(item,path+'.'+k)
              elif isinstance(v,list):
                for i,item in enumerate(v):check(item,path+f'[{i}]')
            check(d[root])
          p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print('Verified Japanese prose in all target sections; Hero location and two travel examples localized.')
          print('Area:',next(x['value'] for x in d['facts'] if x['label']=='面積'))
          PY
          git rm .github/workflows/one-time-antigua-language-audit-20260917.yml
          git add data/countries/antiguabarbuda.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Localize remaining Antigua Hero and itinerary prose'
          git push origin HEAD:refs/heads/country/antiguabarbuda-renewal