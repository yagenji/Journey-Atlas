name: One-time normalize Saint Lucia food delivery size

on:
  push:
    branches:
      - fix/stlucia-food-aspect
    paths:
      - '.github/workflows/fix-stlucia-food-delivery.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stlucia-food-aspect
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet 'pillow>=10,<13'
      - name: Resize four approved taste images to canonical 1200x800 delivery
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for n in range(1, 5):
              path = Path(f'assets/images/stlucia/approved/food-{n}.webp')
              with Image.open(path) as image:
                  image.load()
                  if image.size != (1446, 964):
                      raise RuntimeError(f'unexpected intermediate size {path}: {image.size}')
                  out = image.resize((1200, 800), Image.Resampling.LANCZOS)
                  out.save(path, 'WEBP', quality=90, method=6)
          PY
      - name: Commit delivery normalization and remove this one-time workflow
        run: |
          rm .github/workflows/fix-stlucia-food-delivery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/stlucia/approved/food-{1,2,3,4}.webp .github/workflows/fix-stlucia-food-delivery.yml
          git commit -m "Normalize Saint Lucia taste delivery size"
          git push origin HEAD:fix/stlucia-food-aspect
