name: Apply isolated Country pipeline repair once

on:
  push:
    branches:
      - ops/fix-country-pipeline-reconciliation-20260918
    paths:
      - .github/workflows/_one-time-pipeline-repair-20260918.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'yagenji/Journey-Atlas' && github.ref == 'refs/heads/ops/fix-country-pipeline-reconciliation-20260918' && github.actor == 'yagenji'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/fix-country-pipeline-reconciliation-20260918
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply strictly anchored source patches
        run: python3 scripts/_one_time_pipeline_repair_20260918.py
      - name: Verify only intended files changed and commit with no bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/_one_time_pipeline_repair_20260918.py
          test ! -e .github/workflows/_one-time-pipeline-repair-20260918.yml
          git add -A
          git diff --cached --check
          git diff --cached --name-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair Country review identity, publication PRs and source-aspect Taste framing'
          git push origin HEAD:refs/heads/ops/fix-country-pipeline-reconciliation-20260918
