name: One-off St Kitts Nevis image delivery normalization
on:
  push:
    branches: [country/stkittsnevis]
    paths: [.github/workflows/stkittsnevis-once-normalize-delivery.yml]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize only this Country using the canonical delivery function
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import normalize_country_image_delivery as d
          plans=d.build_plan(['stkittsnevis'])
          d.print_plan(plans)
          assert len(plans)==12,[(x.source,x.reason) for x in plans]
          assert all(x.source==x.target and x.new_size==(1200,800) and x.old_size==(1536,1024) for x in plans)
          assert all(x.source.startswith('assets/images/stkittsnevis/approved/') for x in plans)
          assert len([x for x in plans if ':scene:' in x.roles[0]])==8
          assert len([x for x in plans if ':taste:' in x.roles[0]])==4
          for x in plans:
            d.webp_save(Path(x.source),Path(x.target),x.new_size)
          errors=d.audit_delivery(['stkittsnevis'])
          print('TARGET_DELIVERY_ISSUES',errors)
          assert not errors
          PY
          python scripts/validate_images.py --mode audit --slug stkittsnevis
          python scripts/validate_images.py --duplicates-only --slug stkittsnevis
          python scripts/validate_country_editorial_v2.py data/countries/stkittsnevis.json
          python scripts/validate_country.py --strict data/countries/stkittsnevis.json
          python scripts/country_production_state_v7.py validate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/stkittsnevis/approved
          git rm .github/workflows/stkittsnevis-once-normalize-delivery.yml
          git diff --cached --stat
          git commit -m 'Normalize St Kitts Nevis scenes and Taste to 1200x800'
          git push
