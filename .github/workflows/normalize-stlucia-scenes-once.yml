name: Normalize Saint Lucia scenes once

on:
  push:
    branches:
      - country/saintlucia-recovery-clean-v3
    paths:
      - .github/workflows/normalize-stlucia-scenes-once.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: country/saintlucia-recovery-clean-v3
          fetch-depth: 1

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Normalize eight approved Scene WebPs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          paths = [Path(f"assets/images/saintlucia/approved/scene-{i}.webp") for i in range(1, 9)]
          resampling = getattr(Image, "Resampling", Image)
          for path in paths:
              with Image.open(path) as image:
                  image.load()
                  if image.size != (1536, 1024):
                      raise SystemExit(f"unexpected source size for {path}: {image.size}")
                  icc = image.info.get("icc_profile")
                  if image.mode not in {"RGB", "RGBA"}:
                      image = image.convert("RGBA" if "transparency" in image.info else "RGB")
                  image = image.resize((1200, 800), resampling.LANCZOS)
                  kwargs = {"format": "WEBP", "quality": 92, "method": 6}
                  if icc:
                      kwargs["icc_profile"] = icc
                  tmp = path.with_name(path.name + ".tmp")
                  image.save(tmp, **kwargs)
              with Image.open(tmp) as check:
                  check.load()
                  if check.size != (1200, 800) or (check.format or "").upper() != "WEBP":
                      raise SystemExit(f"verification failed for {path}")
              tmp.replace(path)
              print(path, "1200x800")
          PY

      - name: Commit normalized delivery and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/normalize-stlucia-scenes-once.yml
          git add assets/images/saintlucia/approved/scene-1.webp \
                  assets/images/saintlucia/approved/scene-2.webp \
                  assets/images/saintlucia/approved/scene-3.webp \
                  assets/images/saintlucia/approved/scene-4.webp \
                  assets/images/saintlucia/approved/scene-5.webp \
                  assets/images/saintlucia/approved/scene-6.webp \
                  assets/images/saintlucia/approved/scene-7.webp \
                  assets/images/saintlucia/approved/scene-8.webp
          git commit -m "Normalize Saint Lucia Scene delivery to 1200x800"
          git push origin HEAD:country/saintlucia-recovery-clean-v3
