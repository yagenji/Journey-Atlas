name: QA Estonia cache-safe visuals

on:
  push:
    branches:
      - estonia-v3-cachefix
    paths:
      - .github/workflows/qa-estonia-cachefix.yml

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: estonia-v3-cachefix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: Verify final Estonia images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          base=Path("assets/images/estonia/approved")
          names=[
            "hero-tallinn-old-town-atlas.webp","viru-bog-atlas.webp","soomaa-atlas.webp",
            "panga-cliff-atlas.webp","kaali-crater-atlas.webp","narva-castle-atlas.webp",
            "suur-taevaskoda-atlas.webp","kopu-lighthouse-atlas.webp","suur-munamagi-atlas.webp"
          ]
          for name in names:
              p=base/name
              assert p.exists(), name
              with Image.open(p) as im:
                  im.load()
                  assert im.format=="WEBP", (name,im.format)
                  assert im.size==(1200,800), (name,im.size)
          old=[p for p in base.glob("*.webp") if not p.name.endswith("-atlas.webp")]
          assert not old, old
          assert not (base/"PHOTO_SOURCES.json").exists()
          print("Estonia cache-safe image QA passed")
          PY
      - name: Validate Estonia JSON
        run: python scripts/validate_country.py data/countries/estonia.json
      - name: Build Cloudflare review package
        env:
          JOURNEY_ATLAS_SITE_URL: https://atlas.yagenji.com/
        run: python scripts/build_cloudflare.py
      - name: Verify packaged review page
        run: |
          test -f dist/countries/estonia/index.html
          test -f dist/data/countries/estonia.json
          grep -q 'hero-tallinn-old-town-atlas.webp' dist/data/countries/estonia.json
          grep -q 'viru-bog-atlas.webp' dist/data/countries/estonia.json
          if grep -q 'hero-tallinn-old-town.webp' dist/data/countries/estonia.json; then echo "old Estonia hero path remains"; exit 1; fi
          grep -A1 '/assets/images/\*' dist/_headers | grep -q 'max-age=0, must-revalidate'
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/qa-estonia-cachefix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/qa-estonia-cachefix.yml
          git commit -m "chore(estonia): remove temporary cache-fix QA workflow"
          git push origin HEAD:estonia-v3-cachefix
