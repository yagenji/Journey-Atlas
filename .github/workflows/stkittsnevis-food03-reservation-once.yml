name: Reserve St Kitts Nevis FOOD03 generation once
on:
  push:
    branches: [country/stkittsnevis]
    paths: [.github/workflows/stkittsnevis-food03-reservation-once.yml]
permissions:
  contents: write
jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve FOOD03 on the authoritative Country state without changing other assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, uuid
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          p=Path('ops/country-production/stkittsnevis.json')
          s=json.loads(p.read_text(encoding='utf-8'))
          assert s['phase']=='TASTE_REGEN' and s['stateRevision']==29
          assert s['next']=={'action':'GENERATE_FOOD','asset':'FOOD03'}
          assert s['generationContext']['state']=='CLEAN'
          assert s['publication']['atlasPublished'] is False and s['finalApproval']['state']=='PENDING'
          assert [x['id'] for x in s['taste']]==['FOOD01','FOOD02','FOOD03','FOOD04']
          assert s['taste'][0]['state']=='REVIEW_CANDIDATE'
          assert s['taste'][1]['state']==s['taste'][3]['state']=='APPROVED'
          item=s['taste'][2]
          assert item['state']=='REGENERATE' and item['contentId']=='food-3'
          assert item['userApprovalEvidence']['visualApprovalReceived'] is True
          assert not any(x['state']=='GENERATING' for x in s['taste'])
          now=datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          item['state']='GENERATING'
          item['generationReservation']={
            'reservationId':'stkittsnevis-food03-'+str(uuid.uuid4()),
            'contentId':item['contentId'],
            'promptSeries':item['promptSeries'],
            'reservedAt':now,
            'asset':'FOOD03',
            'generationContextEpoch':s['generationContext']['epoch'],
          }
          s['stateRevision']+=1
          s['updatedAt']=now
          s['next']={'action':'RECONCILE_GENERATION','asset':'FOOD03'}
          p.write_text(json.dumps(s,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print('FOOD03_RESERVED',item['generationReservation']['reservationId'],'EPOCH',s['generationContext']['epoch'])
          PY
          python3 scripts/country_production_state_v7.py validate
          python3 scripts/country_production_protocol_v2.py validate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/country-production/stkittsnevis.json
          git rm .github/workflows/stkittsnevis-food03-reservation-once.yml
          git commit -m 'Reserve FOOD03 regeneration and remove temporary reservation runner'
          git push origin HEAD:refs/heads/country/stkittsnevis
