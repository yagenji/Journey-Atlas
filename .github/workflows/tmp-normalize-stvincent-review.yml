name: Temporary normalize St Vincent review rasters
on:
  push:
    branches: ["country/stvincentgrenadines"]
permissions:
  contents: write
jobs:
  normalize:
    if: github.event.head_commit.message == 'Temporary normalize St Vincent review rasters'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: country/stvincentgrenadines
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet pillow
      - name: Normalize exact six oversized approved rasters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = [
              Path("assets/images/stvincentgrenadines/food-1.webp"),
              Path("assets/images/stvincentgrenadines/food-2.webp"),
              Path("assets/images/stvincentgrenadines/food-3.webp"),
              Path("assets/images/stvincentgrenadines/food-4.webp"),
              Path("assets/images/stvincentgrenadines/scene-2.webp"),
              Path("assets/images/stvincentgrenadines/scene-8.webp"),
          ]
          resampling = getattr(Image, "Resampling", Image)
          for path in files:
              with Image.open(path) as image:
                  image.load()
                  icc = image.info.get("icc_profile")
                  if image.mode not in {"RGB","RGBA"}:
                      image = image.convert("RGBA" if "transparency" in image.info else "RGB")
                  image = image.resize((1200,800), resampling.LANCZOS)
                  kw={"format":"WEBP","quality":92,"method":6}
                  if icc: kw["icc_profile"]=icc
                  tmp=path.with_name(path.name+".tmp")
                  image.save(tmp, **kw)
              with Image.open(tmp) as check:
                  check.load()
                  assert check.size == (1200,800)
                  assert (check.format or "").upper() == "WEBP"
              tmp.replace(path)
              print(path)
          PY
          python3 scripts/audit_country_image_delivery_targeted.py --slug stvincentgrenadines
      - name: Commit normalized rasters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/stvincentgrenadines/food-{1,2,3,4}.webp assets/images/stvincentgrenadines/scene-{2,8}.webp
          git diff --cached --quiet && exit 0
          git commit -m "Normalize St Vincent review image delivery"
          git push origin HEAD:country/stvincentgrenadines
