name: One-time US Taste safe-scale live QA
on:
  push:
    branches: [fix/unitedstates-taste-safe-scale-20260917]
    paths: ['.github/workflows/us-taste-safe-final-qa-once.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install browser dependency
        run: python3 -m pip install --disable-pip-version-check --quiet selenium
      - name: Verify live CSS and food cards at three viewports
        shell: bash
        run: |
          python3 - <<'PY'
          import json, shutil, time, urllib.request, urllib.error
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          base='https://atlas.yagenji.com'
          out=Path('us-taste-safe-live');out.mkdir(exist_ok=True)
          css_url=base+'/assets/css/taste-image-framing.css?qa=safe-4x3-20260917-v2'
          ua='JourneyAtlas-TasteFinalQA/1.0'
          css_ok=False
          for attempt in range(8):
            try:
              req=urllib.request.Request(css_url,headers={'Cache-Control':'no-cache','User-Agent':ua})
              with urllib.request.urlopen(req,timeout=22) as response:css=response.read().decode('utf-8');code=response.status
              part=css.split('/* Approved US food artwork has an integral 4:3 paper ground.',1)[-1]
              if code==200 and 'aspect-ratio: 4 / 3;' in part and 'transform: scale(1.04);' in part:
                css_ok=True;print('US_TASTE_DEPLOYED_CSS_CONFIRMED',flush=True);break
              print('CSS_STALE',attempt+1,flush=True)
            except Exception as exc:print('CSS_ACCESS_ERROR',attempt+1,repr(exc),flush=True)
            time.sleep(10)
          if not css_ok:raise SystemExit('LIVE_CSS_UNVERIFIED: check Cloudflare accessibility/deploy before claiming success')
          failures=[];results=[]
          for name,w,h,mobile in [('desktop',1440,1000,False),('tablet',834,1112,False),('mobile',390,844,True)]:
            d=None
            try:
              opts=Options()
              for flag in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--hide-scrollbars'):opts.add_argument(flag)
              opts.page_load_strategy='eager'
              opts.add_argument('--user-agent='+ua)
              executable=shutil.which('chromedriver')
              d=webdriver.Chrome(service=Service(executable) if executable else Service(),options=opts)
              d.set_page_load_timeout(50)
              d.set_window_size(w,h)
              d.execute_cdp_cmd('Emulation.setDeviceMetricsOverride',{'width':w,'height':h,'deviceScaleFactor':1,'mobile':mobile,'screenWidth':w,'screenHeight':h})
              d.get(base+'/countries/unitedstates/?qa=us-taste-safe-v2-'+name)
              WebDriverWait(d,45).until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'.taste-card'))==4)
              for card in d.find_elements(By.CSS_SELECTOR,'.taste-card'):
                d.execute_script('arguments[0].scrollIntoView({block:"center"})',card)
                time.sleep(.4)
              deadline=time.monotonic()+30
              while time.monotonic()<deadline:
                if d.execute_script('return [...document.querySelectorAll(".taste-card img")].length===4 && [...document.querySelectorAll(".taste-card img")].every(i=>i.complete&&i.naturalWidth>0)'):break
                time.sleep(.5)
              grid=d.find_element(By.CSS_SELECTOR,'#taste-grid')
              d.execute_script('arguments[0].scrollIntoView({block:"center"})',grid)
              time.sleep(.7)
              audit=d.execute_script('return [...document.querySelectorAll(".taste-card")].map(c=>{let i=c.querySelector("img"),f=c.querySelector(".taste-card__image"),a=i.getBoundingClientRect(),b=f.getBoundingClientRect(),s=getComputedStyle(i);return {name:i.alt,loaded:i.complete&&i.naturalWidth>0,nw:i.naturalWidth,nh:i.naturalHeight,fit:s.objectFit,transform:s.transform,ratio:b.width/b.height,scaleWidth:a.width/b.width,scaleHeight:a.height/b.height,error:c.classList.contains("taste-card--image-error")}})')
              robots=d.execute_script('return document.querySelector("meta[name=robots]")?.content||""')
              grid.screenshot(str(out/(name+'-taste-grid.png')))
              results.append({'viewport':name,'robots':robots,'cards':audit})
              if 'noindex' not in robots:failures.append(name+': noindex missing')
              if len(audit)!=4:failures.append(name+': expected four cards')
              for c in audit:
                if not(c['loaded'] and c['nw']==1448 and c['nh']==1086 and c['fit']=='contain' and abs(c['ratio']-4/3)<.025 and 1.03<c['scaleWidth']<1.055 and 1.03<c['scaleHeight']<1.055 and not c['error']):failures.append(name+': bad image '+repr(c))
              print('US_TASTE_LIVE',name,'PASS' if not any(x.startswith(name+':') for x in failures) else 'FAIL',flush=True)
            except Exception as exc:
              failures.append(name+': '+repr(exc));print('US_TASTE_ERROR',name,repr(exc),flush=True)
              if d:
                try:d.save_screenshot(str(out/(name+'-error.png')))
                except Exception:pass
            finally:
              if d:d.quit()
          (out/'report.json').write_text(json.dumps({'results':results,'failures':failures},ensure_ascii=False,indent=2))
          print('US_TASTE_LIVE_SUMMARY',json.dumps({'pass':not failures,'failures':failures},ensure_ascii=False),flush=True)
          if failures:raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-taste-safe-final-live-qa-v2
          path: us-taste-safe-live/
          retention-days: 3
