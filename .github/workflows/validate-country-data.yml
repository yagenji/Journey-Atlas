name: Validate country data

on:
  push:
    branches: ["main"]
    paths:
      - 'ops/country-production-policy.json'
      - 'scripts/country_production_state.py'
      - 'scripts/country_production_protocol_v2.py'
      - 'scripts/classify_country_impact.py'
      - 'scripts/validate_country_editorial_v2.py'
      - 'scripts/test_country_editorial_v2.py'
      - 'data/theme-taxonomy.json'
      - 'data/region-taxonomy.json'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'index.html'
      - 'country.html'
      - 'faq/**'
      - 'privacy/**'
      - '404.html'
      - '_redirects'
      - 'scripts/build_site.py'
      - 'scripts/generate_country_map.py'
      - 'scripts/new_country.py'
      - 'assets/images/**'
      - 'scripts/package_site.py'
      - 'scripts/build_cloudflare.py'
      - 'scripts/build_cloudflare_validated.py'
      - 'data/countries/**'
      - 'data/atlas-destinations.json'
      - 'data/atlas-destinations-editorial.json'
      - 'data/country-renewal-status.json'
      - 'scripts/validate_country.py'
      - 'scripts/audit_country_region_labels.py'
      - 'scripts/normalize_country_region_labels.py'
      - 'scripts/audit_published_countries.py'
      - 'scripts/validate_images.py'
      - 'scripts/normalize_country_image_delivery.py'
      - 'scripts/qa_published_browser.py'
      - 'scripts/http_fetch_retry.sh'
      - 'scripts/validate_lens_slugs.py'
      - 'docs/COUNTRY_PRODUCTION_PROTOCOL_2.md'
      - 'docs/CONTENT_QUALITY_RULES_V2.md'
      - 'docs/NEW_COUNTRY_START.md'
      - '.github/workflows/validate-country-data.yml'
  pull_request:
    paths:
      - 'ops/country-production-policy.json'
      - 'scripts/country_production_state.py'
      - 'scripts/country_production_protocol_v2.py'
      - 'scripts/classify_country_impact.py'
      - 'scripts/validate_country_editorial_v2.py'
      - 'scripts/test_country_editorial_v2.py'
      - 'data/theme-taxonomy.json'
      - 'data/region-taxonomy.json'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'index.html'
      - 'country.html'
      - 'faq/**'
      - 'privacy/**'
      - '404.html'
      - '_redirects'
      - 'scripts/build_site.py'
      - 'scripts/generate_country_map.py'
      - 'scripts/new_country.py'
      - 'assets/images/**'
      - 'scripts/package_site.py'
      - 'scripts/build_cloudflare.py'
      - 'scripts/build_cloudflare_validated.py'
      - 'data/countries/**'
      - 'data/atlas-destinations.json'
      - 'data/atlas-destinations-editorial.json'
      - 'data/country-renewal-status.json'
      - 'scripts/validate_country.py'
      - 'scripts/audit_country_region_labels.py'
      - 'scripts/normalize_country_region_labels.py'
      - 'scripts/audit_published_countries.py'
      - 'scripts/validate_images.py'
      - 'scripts/normalize_country_image_delivery.py'
      - 'scripts/qa_published_browser.py'
      - 'scripts/http_fetch_retry.sh'
      - 'scripts/validate_lens_slugs.py'
      - 'docs/COUNTRY_PRODUCTION_PROTOCOL_2.md'
      - 'docs/CONTENT_QUALITY_RULES_V2.md'
      - 'docs/NEW_COUNTRY_START.md'
      - '.github/workflows/validate-country-data.yml'
  workflow_dispatch:

concurrency:
  group: validate-country-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Classify validation scope
        id: impact
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "production_changed=true" >> "$GITHUB_OUTPUT"
            echo "publication_metadata_only=false" >> "$GITHUB_OUTPUT"
            echo "browser_scope=all" >> "$GITHUB_OUTPUT"
            echo "target_slugs=" >> "$GITHUB_OUTPUT"
            echo "published_slugs=" >> "$GITHUB_OUTPUT"
            echo "reviewable_slugs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # PR checkout is GitHub's synthetic merge commit. Compare that merge
            # result to its base parent so concurrent main-only changes are not
            # misclassified as changes introduced by this PR.
            base="$(git rev-parse HEAD^1)"
            head="$(git rev-parse HEAD)"
          else
            base="$(git rev-parse HEAD^)"
            head="$(git rev-parse HEAD)"
          fi

          python3 scripts/classify_country_impact.py \
            --base "$base" \
            --head "$head" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install image QA dependency
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Validate source syntax
        run: |
          python3 -m py_compile scripts/build_site.py scripts/validate_country.py scripts/validate_country_editorial_v2.py scripts/test_country_editorial_v2.py scripts/country_production_protocol_v2.py scripts/audit_country_region_labels.py scripts/normalize_country_region_labels.py scripts/audit_published_countries.py scripts/validate_images.py scripts/normalize_country_image_delivery.py scripts/qa_published_browser.py scripts/validate_lens_slugs.py scripts/package_site.py scripts/build_cloudflare.py scripts/build_cloudflare_validated.py scripts/classify_country_impact.py
          node --check assets/js/app.js
          node --check assets/js/top.js
          bash -n scripts/http_fetch_retry.sh

      - name: Validate Country production protocol 2
        run: |
          python3 scripts/country_production_protocol_v2.py self-test
          python3 scripts/country_production_protocol_v2.py validate

      - name: Run Content QA v2 regression tests
        run: |
          python3 scripts/test_country_editorial_v2.py
          python3 scripts/validate_country_editorial_v2.py

      - name: Enforce Country image delivery budget
        run: python3 scripts/normalize_country_image_delivery.py --audit

      - name: Validate published renewal registry
        run: python3 scripts/audit_published_countries.py

      - name: Validate Country region contract
        run: python3 scripts/audit_country_region_labels.py

      - name: Audit all published Country images
        if: steps.impact.outputs.production_changed == 'true' && (steps.impact.outputs.target_slugs == '' || steps.impact.outputs.browser_scope == 'all')
        run: python3 scripts/validate_images.py --mode audit

      - name: Enforce renewed Country image hard gate
        if: steps.impact.outputs.production_changed == 'true' && (steps.impact.outputs.target_slugs == '' || steps.impact.outputs.browser_scope == 'all')
        run: python3 scripts/validate_images.py --mode hard

      - name: Validate targeted Country image sets
        if: steps.impact.outputs.production_changed == 'true' && steps.impact.outputs.target_slugs != '' && steps.impact.outputs.browser_scope != 'all' && steps.impact.outputs.publication_metadata_only != 'true'
        env:
          TARGET_SLUGS: ${{ steps.impact.outputs.target_slugs }}
        shell: bash
        run: |
          set -euo pipefail
          for slug in $(printf '%s' "$TARGET_SLUGS" | tr ',' ' '); do
            [ -n "$slug" ] || continue
            [ -f "data/countries/$slug.json" ] || continue
            python3 scripts/validate_images.py --mode audit --slug "$slug"
            python3 scripts/validate_images.py --duplicates-only --slug "$slug"
          done

      - name: Validate targeted Country JSON
        if: steps.impact.outputs.production_changed == 'true' && steps.impact.outputs.target_slugs != '' && steps.impact.outputs.browser_scope != 'all'
        env:
          TARGET_SLUGS: ${{ steps.impact.outputs.target_slugs }}
        shell: bash
        run: |
          set -euo pipefail
          for slug in $(printf '%s' "$TARGET_SLUGS" | tr ',' ' '); do
            [ -n "$slug" ] || continue
            if [ -f "data/countries/$slug.json" ]; then
              python3 scripts/validate_country.py --strict "data/countries/$slug.json"
            fi
          done

      - name: Validate all reviewable and published Country JSON
        if: steps.impact.outputs.production_changed == 'true' && (steps.impact.outputs.target_slugs == '' || steps.impact.outputs.browser_scope == 'all')
        run: |
          python3 scripts/validate_country.py --reviewable
          python3 scripts/validate_country.py --published

      - name: Validate JOURNEY LENS slug drift
        run: python3 scripts/validate_lens_slugs.py

      - name: Build and validate Cloudflare package
        env:
          JOURNEY_ATLAS_SITE_URL: https://atlas.yagenji.com/
        run: python3 scripts/build_cloudflare_validated.py
