name: Validate country data

on:
  push:
    paths:
      - 'data/theme-taxonomy.json'
      - 'assets/js/top.js'
      - 'assets/css/top-layout-v4.css'
      - 'index.html'
      - 'country.html'
      - 'faq/**'
      - 'privacy/**'
      - 'assets/css/site-info.css'
      - 'assets/css/site-footer.css'
      - 'assets/css/country*.css'
      - '404.html'
      - '_redirects'
      - 'scripts/build_site.py'
      - 'scripts/generate_country_map.py'
      - 'scripts/new_country.py'
      - 'assets/images/**'
      - 'scripts/package_site.py'
      - 'scripts/build_cloudflare.py'
      - 'data/countries/**'
      - 'data/atlas-destinations.json'
      - 'data/atlas-destinations-editorial.json'
      - 'scripts/validate_country.py'
      - 'scripts/validate_images.py'
      - 'scripts/validate_lens_slugs.py'
      - '.github/workflows/validate-country-data.yml'
  pull_request:
    paths:
      - 'data/theme-taxonomy.json'
      - 'assets/js/top.js'
      - 'assets/css/top-layout-v4.css'
      - 'index.html'
      - 'country.html'
      - 'faq/**'
      - 'privacy/**'
      - 'assets/css/site-info.css'
      - 'assets/css/site-footer.css'
      - 'assets/css/country*.css'
      - '404.html'
      - '_redirects'
      - 'scripts/build_site.py'
      - 'scripts/generate_country_map.py'
      - 'scripts/new_country.py'
      - 'assets/images/**'
      - 'scripts/package_site.py'
      - 'scripts/build_cloudflare.py'
      - 'data/countries/**'
      - 'data/atlas-destinations.json'
      - 'data/atlas-destinations-editorial.json'
      - 'scripts/validate_country.py'
      - 'scripts/validate_images.py'
      - 'scripts/validate_lens_slugs.py'
      - '.github/workflows/validate-country-data.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image QA dependency
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Validate source syntax
        run: |
          python3 -m py_compile scripts/build_site.py scripts/validate_country.py scripts/validate_images.py scripts/validate_lens_slugs.py scripts/package_site.py scripts/build_cloudflare.py
          node --check assets/js/app.js
          node --check assets/js/top.js

      - name: Fully decode published Country images
        run: python3 scripts/validate_images.py --scope published
      - name: Validate shared Country CSS architecture
        run: |
          profile_sources="$(grep -l 'country-facts-strip' assets/css/*.css | sort | tr '\n' ' ' | sed 's/ $//')"
          test "$profile_sources" = "assets/css/country-icon-system.css"
          transport_sources="$(grep -l 'travel-planning__block--transport .transport' assets/css/*.css | sort | tr '\n' ' ' | sed 's/ $//')"
          test "$transport_sources" = "assets/css/country-discovery-v3.css"
          grep -q 'grid-template-columns:repeat(6,minmax(0,1fr))' assets/css/country-icon-system.css
          grep -q '@media(min-width:761px) and (max-width:1180px)' assets/css/country-icon-system.css
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))' assets/css/country-icon-system.css
          grep -q 'grid-template-columns:repeat(2,minmax(0,1fr))' assets/css/country-icon-system.css

      - name: Validate reviewable and published country JSON
        run: |
          python3 scripts/validate_country.py --reviewable
          python3 scripts/validate_country.py --published
      - name: Validate JOURNEY LENS slug drift
        run: python3 scripts/validate_lens_slugs.py
      - name: Build and validate Cloudflare package
        env:
          JOURNEY_ATLAS_SITE_URL: https://atlas.yagenji.com/
        run: python3 scripts/build_cloudflare.py
