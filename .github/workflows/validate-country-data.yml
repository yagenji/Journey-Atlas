name: Validate country data

on:
  pull_request:
    paths:
      - "data/countries/**"
      - "data/atlas-destinations.json"
      - "data/theme-taxonomy.json"
      - "data/region-taxonomy.json"
      - "assets/images/**"
      - "country.html"
      - "assets/css/**"
      - "assets/js/**"
      - "scripts/validate_country.py"
      - "scripts/validate_country_editorial_v2.py"
      - "scripts/validate_country_quality_v5.py"
      - "scripts/validate_country_map_v6.py"
      - "scripts/validate_images.py"
      - "scripts/audit_country_image_delivery_targeted.py"
      - "scripts/audit_country_region_labels.py"
      - "scripts/audit_published_countries.py"
      - "scripts/new_country.py"
      - ".github/workflows/validate-country-data.yml"
  push:
    branches: ["main"]
    paths:
      - "data/countries/**"
      - "data/atlas-destinations.json"
      - "data/theme-taxonomy.json"
      - "data/region-taxonomy.json"
      - "assets/images/**"
      - "country.html"
      - "assets/css/**"
      - "assets/js/**"
      - "scripts/validate_country.py"
      - "scripts/validate_country_editorial_v2.py"
      - "scripts/validate_country_quality_v5.py"
      - "scripts/validate_country_map_v6.py"
      - "scripts/validate_images.py"
      - "scripts/audit_country_image_delivery_targeted.py"
      - "scripts/audit_country_region_labels.py"
      - "scripts/audit_published_countries.py"
      - "scripts/new_country.py"
      - ".github/workflows/validate-country-data.yml"
  workflow_dispatch:
    inputs:
      slug:
        description: "Optional Country slug; blank runs full validation"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: validate-country-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image QA dependency
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Detect target Countries
        id: target
        shell: bash
        env:
          REQUESTED_SLUG: ${{ inputs.slug }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${REQUESTED_SLUG:-}" ]; then
              echo "slugs=$REQUESTED_SLUG" >> "$GITHUB_OUTPUT"
              echo "full=false" >> "$GITHUB_OUTPUT"
            else
              echo "slugs=" >> "$GITHUB_OUTPUT"
              echo "full=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$(git rev-parse HEAD^)"
          fi
          git diff --name-only "$base"...HEAD > /tmp/country-changed-files.txt
          python3 - "$base" "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          base, output = sys.argv[1:]
          files = Path("/tmp/country-changed-files.txt").read_text().splitlines()
          slugs = set()
          for path in files:
              match = re.fullmatch(r"data/countries/([^/]+)\.json", path)
              if match:
                  slugs.add(match.group(1))
              match = re.match(r"assets/images/([^/]+)/", path)
              if match:
                  slugs.add(match.group(1))

          if "data/atlas-destinations.json" in files:
              try:
                  old = json.loads(subprocess.check_output(
                      ["git", "show", f"{base}:data/atlas-destinations.json"], text=True
                  ))
                  new = json.loads(Path("data/atlas-destinations.json").read_text(encoding="utf-8"))
                  old_rows = {row.get("slug"): row for row in old.get("destinations", []) if row.get("slug")}
                  new_rows = {row.get("slug"): row for row in new.get("destinations", []) if row.get("slug")}
                  for slug in set(old_rows) | set(new_rows):
                      if old_rows.get(slug) != new_rows.get(slug):
                          slugs.add(slug)
              except Exception:
                  pass

          shared_validator_paths = {
              "scripts/validate_country.py",
              "scripts/validate_country_editorial_v2.py",
              "scripts/validate_country_quality_v5.py",
              "scripts/validate_country_map_v6.py",
              "scripts/validate_images.py",
          }
          shared = any(
              path == "country.html"
              or path.startswith("assets/css/")
              or path.startswith("assets/js/")
              or path == "data/theme-taxonomy.json"
              or path == "data/region-taxonomy.json"
              or path in shared_validator_paths
              for path in files
          )
          with open(output, "a", encoding="utf-8") as handle:
              handle.write("slugs=" + ",".join(sorted(slugs)) + "\n")
              handle.write("full=" + ("true" if shared and not slugs else "false") + "\n")
          PY

      - name: Validate tool syntax and regression contracts
        run: |
          python3 -m py_compile             scripts/new_country.py             scripts/validate_country.py             scripts/validate_country_editorial_v2.py             scripts/validate_country_quality_v5.py             scripts/validate_country_map_v6.py             scripts/validate_images.py             scripts/audit_country_image_delivery_targeted.py             scripts/audit_country_region_labels.py             scripts/audit_published_countries.py
          python3 scripts/test_country_editorial_v2.py
          python3 scripts/test_country_quality_v5.py

      - name: Run targeted finish-line QA
        if: steps.target.outputs.slugs != ''
        env:
          TARGET_SLUGS: ${{ steps.target.outputs.slugs }}
        shell: bash
        run: |
          set -euo pipefail
          for slug in $(printf '%s' "$TARGET_SLUGS" | tr ',' ' '); do
            path="data/countries/$slug.json"
            [ -f "$path" ] || continue
            echo "=== QA: $slug ==="
            python3 scripts/validate_country_editorial_v2.py --force "$path"
            python3 scripts/validate_country_quality_v5.py "$path"
            python3 scripts/validate_country_map_v6.py "$path"
            python3 scripts/validate_country.py --strict "$path"
            python3 scripts/audit_country_image_delivery_targeted.py --slug "$slug"
            python3 scripts/validate_images.py --mode hard --slug "$slug"
            python3 scripts/validate_images.py --duplicates-only --slug "$slug"
          done

      - name: Run full Country QA
        if: steps.target.outputs.full == 'true'
        run: |
          python3 scripts/validate_country_editorial_v2.py
          python3 scripts/validate_country_quality_v5.py
          python3 scripts/validate_country_map_v6.py
          python3 scripts/validate_country.py --reviewable
          python3 scripts/validate_country.py --published
          python3 scripts/validate_images.py --mode audit
          python3 scripts/validate_images.py --mode hard

      - name: Validate shared registries
        run: |
          python3 scripts/audit_country_region_labels.py
          python3 scripts/audit_published_countries.py
