name: Validate country data

on:
  push:
    paths:
      - 'data/countries/**'
      - 'data/atlas-destinations.json'
      - 'data/atlas-destinations-editorial.json'
      - 'assets/images/**/map-atlas*.svg'
      - 'scripts/validate_country.py'
      - 'scripts/qa_map_markers.py'
      - '.github/workflows/validate-country-data.yml'
  pull_request:
    paths:
      - 'data/countries/**'
      - 'data/atlas-destinations.json'
      - 'data/atlas-destinations-editorial.json'
      - 'assets/images/**/map-atlas*.svg'
      - 'scripts/validate_country.py'
      - 'scripts/qa_map_markers.py'
      - '.github/workflows/validate-country-data.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate published country JSON and 201-destination scope
        run: python3 scripts/validate_country.py --published
      - name: Validate atlas-v2 map marker spacing
        run: python3 scripts/qa_map_markers.py --published
