name: Apply v2 review fix from literal source once
on:
  push:
    branches: [fix/publication-v2-review-idempotency-20260916]
    paths: [.github/workflows/apply-v2-review-patch-retry.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/publication-v2-review-idempotency-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply literal edits and test before committing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          original = Path('.github/workflows/apply-v2-review-patch-once.yml')
          source = original.read_text(encoding='utf-8')
          fragment = source.split("          python3 - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(fragment), str(original), 'exec'), {})
          Path('.github/workflows/apply-v2-review-patch-retry.yml').unlink()
          PY
          python3 -m py_compile scripts/publication_pipeline_v2.py scripts/test_publication_v2_review_gate.py
          python3 scripts/test_publication_v2_review_gate.py
          python3 scripts/publication_pipeline_v2.py self-test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/apply-v2-review-patch-once.yml .github/workflows/apply-v2-review-patch-retry.yml .github/workflows/deploy-country-preview.yml .github/workflows/publication-pipeline-v2-checks.yml .github/workflows/publication-pipeline-v2-review.yml scripts/publication_pipeline_v2.py scripts/test_publication_v2_review_gate.py
          git diff --cached --check
          git commit -m 'Make v2 review idempotent; prevent duplicate preview and browser QA'
          git push origin HEAD:refs/heads/fix/publication-v2-review-idempotency-20260916
