name: Dispatch Uzbekistan production verification

on:
  push:
    branches: ["country/uzbekistan"]
    paths:
      - '.github/workflows/dispatch-uzbekistan-production-verification.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: country/uzbekistan
      - name: Dispatch main production verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/actions/workflows/verify-production.yml/dispatches -f ref=main
      - name: Remove one-time dispatcher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/dispatch-uzbekistan-production-verification.yml
          git commit -m 'Remove Uzbekistan production verification dispatcher'
          git push origin HEAD:country/uzbekistan
