name: One-time final branch cleanup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/one-time-final-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive and delete remaining stale branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          branches=(
          map-quality-v2
          production-hard-gates-v2
          lens-all-stories
          lens-fullwidth-rail-fix
          lens-slug-integration
          lens-static-rail
          )
          for branch in "${branches[@]}"; do
            remote_ref="refs/remotes/origin/${branch}"
            if ! git show-ref --verify --quiet "${remote_ref}"; then
              echo "Already absent: ${branch}"
              continue
            fi
            tag="archive/2026-09-02/${branch//\//-}"
            if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              git tag "${tag}" "${remote_ref}"
              git push origin "refs/tags/${tag}"
            fi
            git push origin --delete "${branch}"
          done
