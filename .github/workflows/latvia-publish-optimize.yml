name: Latvia publication image optimization

on:
  push:
    branches: ["latvia-publish-final"]

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: latvia-publish-final

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Normalize and optimize approved Latvia images
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image

          root = Path(".")
          image_dir = root / "assets/images/latvia/approved"
          names = [
              "hero-riga",
              "great-kemeri-bog",
              "gauja-valley",
              "cape-kolka",
              "kuldiga-venta-rapid",
              "rundale-palace",
              "cesis-medieval-castle",
              "lake-razna",
              "daugavpils-fortress",
          ]

          def crop_three_two(image):
              width, height = image.size
              target_ratio = 3 / 2
              ratio = width / height
              if abs(ratio - target_ratio) < 1e-9:
                  return image
              if ratio > target_ratio:
                  new_width = round(height * target_ratio)
                  left = (width - new_width) // 2
                  return image.crop((left, 0, left + new_width, height))
              new_height = round(width / target_ratio)
              top = (height - new_height) // 2
              return image.crop((0, top, width, top + new_height))

          for name in names:
              source = image_dir / f"{name}.png"
              output = image_dir / f"{name}.webp"
              if not source.exists():
                  raise FileNotFoundError(source)
              with Image.open(source) as image:
                  image.load()
                  image = image.convert("RGB")
                  image = crop_three_two(image)
                  image = image.resize((1200, 800), Image.Resampling.LANCZOS)
                  image.save(output, "WEBP", quality=84, method=6)
              with Image.open(output) as check:
                  check.load()
                  if check.size != (1200, 800) or check.format != "WEBP":
                      raise RuntimeError(f"invalid optimized image: {output}")
              source.unlink()

          country_path = root / "data/countries/latvia.json"
          country = json.loads(country_path.read_text(encoding="utf-8"))
          country["hero"]["image"] = country["hero"]["image"].replace(".png", ".webp")
          for scene in country["scenes"]:
              scene["image"] = scene["image"].replace(".png", ".webp")
          country["updatedAt"] = "2026-08-29"
          country_path.write_text(json.dumps(country, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit optimized publication assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/latvia/approved data/countries/latvia.json
          git diff --cached --check
          git commit -m "perf(latvia): optimize publication images"
          git push origin HEAD:latvia-publish-final
