name: One-time canonical review State invariant
on:
  push:
    branches: [fix/canonical-reviewed-v2-publish-gate]
    paths: ['.github/workflows/verify-canonical-review-once.yml']
permissions:
  contents: write
jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-reviewed-v2-publish-gate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify canonical live-review State and stage required protocol guard
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_canonical_review_state_once.py
          python3 -m py_compile scripts/country_production_protocol_v2.py scripts/publication_pipeline_v2.py
          python3 scripts/validate_production_state_routed.py
          python3 scripts/test_canonical_review_publication_gate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/country_production_protocol_v2.py
          git diff --cached --name-only
          git commit -m 'Validate canonical live-review evidence before v2 publication'
          git push origin HEAD:fix/canonical-reviewed-v2-publish-gate
