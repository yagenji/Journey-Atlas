name: One-time US Taste artwork rendering inspection
on:
  push:
    branches: [fix/unitedstates-taste-render-20260917]
    paths: ['.github/workflows/us-taste-render-inspect-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install inspection tools
        run: python3 -m pip install --disable-pip-version-check --quiet pillow selenium
      - name: Inspect four source images and real browser cards
        env:
          QA_BASE_URL: https://atlas.yagenji.com
        run: |
          python3 - <<'PY'
          import io, json, time, urllib.request, os
          from pathlib import Path
          from PIL import Image, ImageStat
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.support.ui import WebDriverWait
          import shutil
          out=Path('us-taste-diagnostic');out.mkdir(exist_ok=True)
          country=json.loads(Path('data/countries/unitedstates.json').read_text())
          rows=[]
          for index, item in enumerate(country['taste']['items']):
            path=Path(item['image']); im=Image.open(path);im.load();im.thumbnail((480,320))
            stat=ImageStat.Stat(im.convert('RGB'))
            im.save(out/f'{index+1}-source.png')
            rows.append({'name':item['name'],'reference':str(path),'local_size':path.stat().st_size,'source_dimensions':list(Image.open(path).size),'source_rgb_stddev':stat.stddev})
          opts=Options()
          for flag in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--hide-scrollbars'):
            opts.add_argument(flag)
          opts.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          path=shutil.which('chromedriver')
          driver=webdriver.Chrome(service=Service(path) if path else Service(),options=opts)
          driver.set_window_size(1440,1000)
          try:
            driver.get('https://atlas.yagenji.com/countries/unitedstates/?qa=us-taste-inspect-20260917')
            WebDriverWait(driver,35).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.taste-card'))==4)
            for index, card in enumerate(driver.find_elements(By.CSS_SELECTOR,'.taste-card')):
              driver.execute_script('arguments[0].scrollIntoView({block:"center"})',card)
              time.sleep(1.0)
              img=card.find_element(By.CSS_SELECTOR,'img')
              rows[index]['browser']=driver.execute_script('const i=arguments[0];const c=getComputedStyle(i);return {src:i.currentSrc,complete:i.complete,naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight,width:i.getBoundingClientRect().width,height:i.getBoundingClientRect().height,opacity:c.opacity,visibility:c.visibility,display:c.display,objectFit:c.objectFit,cardClass:i.closest(".taste-card").className,background:getComputedStyle(i.parentElement).backgroundColor}',img)
              card.screenshot(str(out/f'{index+1}-live-card.png'))
              im=Image.open(out/f'{index+1}-live-card.png').convert('RGB')
              rows[index]['screenshot_rgb_stddev']=ImageStat.Stat(im).stddev
              u=rows[index]['browser']['src'];request=urllib.request.Request(u,headers={'Cache-Control':'no-cache','User-Agent':'JourneyAtlas-Taste-Inspect/1.0'})
              with urllib.request.urlopen(request,timeout=30) as response: raw=response.read(); rows[index]['http_status']=response.status;rows[index]['http_content_type']=response.headers.get('Content-Type');rows[index]['live_bytes']=len(raw)
              live_im=Image.open(io.BytesIO(raw));live_im.load();rows[index]['live_dimensions']=list(live_im.size)
              rows[index]['live_rgb_stddev']=ImageStat.Stat(live_im.convert('RGB').resize((480,320))).stddev
            rows.append({'browser_errors':[x['message'] for x in driver.get_log('browser') if x['level']=='SEVERE']})
          finally:driver.quit()
          (out/'report.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          print('US_TASTE_IMAGE_DIAGNOSTICS',json.dumps(rows,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-taste-diagnostic
          path: us-taste-diagnostic/
          retention-days: 3
