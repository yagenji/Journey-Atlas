name: Sync Country image registry references

on:
  push:
    branches: ["perf/country-image-normalize"]
    paths:
      - 'scripts/normalize_country_image_delivery.py'
      - '.github/workflows/sync-country-image-registry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Synchronize published Hero references
        run: python3 scripts/normalize_country_image_delivery.py --apply

      - name: Verify delivery and published data
        run: |
          python3 scripts/normalize_country_image_delivery.py --audit
          python3 scripts/validate_country.py --published

      - name: Commit synchronized registry references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/atlas-destinations.json data/atlas-destinations-editorial.json
          if git diff --cached --quiet; then
            echo "No registry reference changes to commit."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Sync published registry Hero references"
          git push origin HEAD:${GITHUB_REF_NAME}
