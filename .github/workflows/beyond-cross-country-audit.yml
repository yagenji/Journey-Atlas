name: Beyond cross-country audit

on:
  pull_request:
    paths:
      - "scripts/audit_beyond_cross_country.py"
      - ".github/workflows/beyond-cross-country-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Beyond the Scenery across all destinations
        run: python3 scripts/audit_beyond_cross_country.py
