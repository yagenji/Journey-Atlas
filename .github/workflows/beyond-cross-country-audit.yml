name: Beyond cross-country audit

on:
  pull_request:
    paths:
      - "scripts/audit_beyond_cross_country.py"
      - ".github/workflows/beyond-cross-country-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit inputs only
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            data/countries
            data/atlas-destinations.json
            scripts/audit_beyond_cross_country.py
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Beyond the Scenery across all destinations
        run: python3 scripts/audit_beyond_cross_country.py | tee beyond-audit-output.txt
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: beyond-audit-evidence
          path: |
            beyond-audit-output.txt
            data/atlas-destinations.json
            data/countries/*.json
          if-no-files-found: error
          retention-days: 1
