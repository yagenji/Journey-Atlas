name: Build Sweden v4 artwork

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_sweden_v4_assets.py'
      - '.github/workflows/build-sweden-v4-assets.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: sweden-v3-build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Build Sweden v4 artwork from Wikimedia Commons
        run: python3 scripts/fetch_sweden_v4_assets.py
      - name: Verify generated assets
        run: python3 scripts/qa_sweden_production.py
      - name: Commit Sweden v4 artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/sweden/v4 data/countries/sweden.json data/sweden-image-credits.json
          if git diff --cached --quiet; then
            echo "No Sweden v4 changes"
            exit 0
          fi
          git commit -m "build: add Sweden v4 production artwork"
          git push origin HEAD:sweden-v3-build
