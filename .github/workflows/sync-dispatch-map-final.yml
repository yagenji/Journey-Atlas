name: Sync latest main and dispatch final map checks

on:
  push:
    branches:
      - system/map-context-shared-preparation
    paths:
      - '.github/workflows/sync-dispatch-map-final.yml'

permissions:
  contents: write
  actions: write

jobs:
  sync-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: system/map-context-shared-preparation
          fetch-depth: 0
      - name: Sync latest main with reviewed conflict resolution
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != ".github/workflows/validate-country-data.yml" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --theirs .github/workflows/validate-country-data.yml
            git add .github/workflows/validate-country-data.yml
          fi
          rm .github/workflows/sync-dispatch-map-final.yml
          git add -A
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          else
            git commit -m "Sync final map rollout with latest main"
          fi
          git push origin HEAD:system/map-context-shared-preparation
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Dispatch official final checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='system/map-context-shared-preparation'
          gh workflow run validate-country-data.yml --ref "$branch"
          gh workflow run browser-country-qa.yml --ref "$branch"
          gh workflow run map-context-preflight.yml --ref "$branch"
          echo "Final synchronized SHA: $FINAL_SHA"
