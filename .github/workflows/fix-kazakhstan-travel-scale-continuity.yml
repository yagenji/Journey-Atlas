name: Fix Kazakhstan travel-scale continuity

on:
  push:
    branches:
      - fix/kazakhstan-travel-scale-continuity
    paths:
      - '.github/workflows/fix-kazakhstan-travel-scale-continuity.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/kazakhstan-travel-scale-continuity
      - name: Update Kazakhstan travel scale
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/countries/kazakhstan.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          items = data['travelScale']['items']
          before = [item['duration'] for item in items]
          expected = ['4〜5日', '7〜9日', '12日以上']
          if before != expected:
              raise SystemExit(f'unexpected Kazakhstan travelScale durations: {before!r}')
          items[0]['duration'] = '4〜5日'
          items[1]['duration'] = '6〜9日'
          items[2]['duration'] = '10日以上'
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          print('Kazakhstan travelScale:', before, '->', [item['duration'] for item in items])
          PY
      - name: Validate Kazakhstan
        run: |
          python3 scripts/test_country_editorial_v2.py
          python3 scripts/validate_country_editorial_v2.py data/countries/kazakhstan.json
          python3 scripts/validate_country.py --strict data/countries/kazakhstan.json
          python3 scripts/build_country_preview_targeted.py --slugs kazakhstan
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/countries/kazakhstan.json
          git diff --cached --quiet && exit 0
          git commit -m 'Make Kazakhstan travel durations continuous'
          git push origin HEAD:fix/kazakhstan-travel-scale-continuity
