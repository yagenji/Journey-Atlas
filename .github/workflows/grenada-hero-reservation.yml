name: Grenada Hero target reservation (temporary)
on:
  push:
    branches: [country/grenada]
    paths: [.github/workflows/grenada-hero-reservation.yml]
permissions:
  contents: write
jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reserve one exact Hero asset with a complete render packet
        run: |
          python3 - <<'PY'
          import json,uuid
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          from scripts.country_production_protocol_v2 import protocol_next
          path=Path('ops/country-production/grenada.json');s=json.loads(path.read_text('utf-8'))
          c=json.loads(Path('data/countries/grenada.json').read_text('utf-8'))
          assert s['slug']==c['slug']=='grenada' and s['phase']=='HERO'
          assert s['preVisualBuild']['state']=='PASS' and s['map']['state']=='APPROVED'
          assert s['next']=={'action':'GENERATE_HERO','asset':'HERO'} and s['hero']['state']=='NOT_STARTED'
          assert s['publication']['atlasPublished'] is False and s['finalApproval']['state']=='PENDING'
          content_id='st-georges-carenage-fort-george'
          identity=('GRENADA HERO ONLY: true view from Fort George across the sheltered horseshoe-shaped Carenage inner harbour in St. George\'s, Grenada. '
            'An elevated but natural viewpoint: low red terra-cotta tiled roofs and aged stone or pastel plaster buildings in the foreground, '
            'a real curved waterfront with modest moored sailboats and small working craft, a hillside of tightly scattered low houses '
            'among tropical greenery rising beyond the inlet, and a calm partly clouded Caribbean sky. '
            'Respect the actual relative position of harbour, foreground roofs and green hill, realistic Caribbean architecture and scale; '
            'no invented landmarks, impossible cliffs, dense skyscrapers, oversized cruise ship, fantasy water channels or altered terrain. '
            'Wide horizontal single scene with the recognizable curved harbor clearly legible on desktop and center-cropped mobile; '
            'leave quiet sky and water in the upper/left for separate website text. Gentle early-morning natural diffused daylight. '
            'About 60% photographic place realism and 40% fine quiet watercolor softness, restrained color and subtle paper texture, '
            'not a photo or painterly fantasy. No text within image, no readable signs, names, letters, titles, logos, maps, UI, '
            'captions, frames, grids, collage, panels or decorative elements. One standalone natural landscape image only.')
          now=datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          packet={'kind':'HERO','contentId':content_id,'identity':identity,'independentGeneration':True,'forbidPreviousAssetReuse':True,
            'noAddedText':True,'singleFrameOnly':True,'forbidCollage':True,'forbidPanels':True,'forbidGrid':True,
            'forbidContactSheet':True,'forbidMontage':True,'forbidInsetImages':True,'singleSceneOnly':True}
          s['hero'].update({'state':'GENERATING','asset':None,'contentId':content_id,'promptSeries':1,
            'promptSeriesRejectCount':0,'rejectedGenerationIds':[],'renderPacket':packet,
            'generationReservation':{'reservationId':str(uuid.uuid4()),'asset':'HERO','contentId':content_id,
              'promptSeries':1,'generationContextEpoch':s['generationContext']['epoch'],'reservedAt':now}})
          s['stateRevision']+=1;s['updatedAt']=now
          s['next']=protocol_next(s)['next']
          assert s['next']=={'action':'RECONCILE_GENERATION','asset':'HERO'},s['next']
          path.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('GRENADA_HERO_RESERVATION_PERSIST_READY',s['stateRevision'],s['next'])
          PY
      - name: Check current production and reservation contract
        run: |
          python3 scripts/country_production_protocol_v2.py validate
          python3 scripts/country_production_protocol_v2.py next grenada
          python3 -m json.tool ops/country-production/grenada.json > /dev/null
      - name: Commit only the reserved Country State
        run: |
          test "${GITHUB_REF_NAME}" = country/grenada
          git config user.name 'JOURNEY ATLAS image reservation'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ops/country-production/grenada.json
          git diff --cached --check
          git commit -m 'Reserve Grenada St Georges Hero before image generation'
          git push origin HEAD:country/grenada
