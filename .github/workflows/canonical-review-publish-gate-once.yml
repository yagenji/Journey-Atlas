name: One-time canonical-reviewed v2 publication gate patch
on:
  push:
    branches: [fix/canonical-reviewed-v2-publish-gate]
    paths: ['.github/workflows/canonical-review-publish-gate-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-reviewed-v2-publish-gate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact-source patch and run focused tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_canonical_gate_patch_once.py
          python3 -m py_compile scripts/publication_pipeline_v2.py scripts/test_canonical_review_publication_gate.py
          python3 scripts/test_canonical_review_publication_gate.py
          python3 scripts/publication_pipeline_v2.py self-test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/canonical-review-publish-gate-once.yml scripts/_canonical_gate_patch_once.py
          git add scripts/publication_pipeline_v2.py scripts/test_canonical_review_publication_gate.py .github/workflows/canonical-review-publish-gate-once.yml scripts/_canonical_gate_patch_once.py
          git diff --cached --name-only
          git commit -m 'Accept verified canonical noindex review as v2 publication gate'
          git push origin HEAD:fix/canonical-reviewed-v2-publish-gate
