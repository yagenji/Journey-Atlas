name: One-time United States Taste 4x3 live visual QA
on:
  push:
    branches: [fix/unitedstates-taste-4x3-zoom-20260917]
    paths: ['.github/workflows/us-taste-4x3-live-once.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser QA dependency
        run: python3 -m pip install --disable-pip-version-check --quiet selenium
      - name: Inspect actual live food cards on desktop tablet and mobile
        shell: bash
        run: |
          python3 - <<'PY'
          import json, shutil, time, urllib.request
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          base='https://atlas.yagenji.com'
          out=Path('us-taste-zoom-live-qa');out.mkdir(exist_ok=True)
          css_url=base+'/assets/css/taste-image-framing.css?qa=us-taste-4x3-zoom-20260917'
          for attempt in range(24):
            try:
              req=urllib.request.Request(css_url,headers={'Cache-Control':'no-cache','User-Agent':'JourneyAtlas-US-Taste-VisualQA/1.0'})
              with urllib.request.urlopen(req,timeout=25) as response:css=response.read().decode('utf-8')
              us_css=css.split('/* The four approved US Taste illustrations',1)[-1]
              if 'aspect-ratio: 4 / 3;' in us_css and 'transform: scale(1.08);' in us_css:
                print('Deployed US Taste CSS confirmed',flush=True)
                break
              print('Waiting for deployment',attempt+1,flush=True)
            except Exception as exc:print('CSS pending',repr(exc),flush=True)
            if attempt==23:raise RuntimeError('Expected US Taste CSS not deployed')
            time.sleep(15)
          opts=Options()
          for flag in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--hide-scrollbars'):opts.add_argument(flag)
          opts.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          executable=shutil.which('chromedriver')
          driver=webdriver.Chrome(service=Service(executable) if executable else Service(),options=opts)
          failures=[];results=[]
          for name,width,height,mobile in [('desktop',1440,1000,False),('tablet',834,1112,False),('mobile',390,844,True)]:
            try:
              driver.set_window_size(width,height)
              driver.execute_cdp_cmd('Emulation.setDeviceMetricsOverride',{'width':width,'height':height,'deviceScaleFactor':1,'mobile':mobile,'screenWidth':width,'screenHeight':height})
              driver.get(base+'/countries/unitedstates/?qa=us-taste-4x3-'+name)
              WebDriverWait(driver,40).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.taste-card'))==4)
              for card in driver.find_elements(By.CSS_SELECTOR,'.taste-card'):
                driver.execute_script('arguments[0].scrollIntoView({block:"center"})',card)
                WebDriverWait(driver,20).until(lambda d,el=card:d.execute_script('const i=arguments[0].querySelector("img");return i.complete&&i.naturalWidth>0',el))
              grid=driver.find_element(By.CSS_SELECTOR,'#taste-grid')
              driver.execute_script('arguments[0].scrollIntoView({block:"center"})',grid)
              time.sleep(.7)
              cards=driver.execute_script('return [...document.querySelectorAll(".taste-card")].map(card=>{const img=card.querySelector("img");const frame=card.querySelector(".taste-card__image");const r=img.getBoundingClientRect();const b=frame.getBoundingClientRect();const s=getComputedStyle(img);return {name:img.alt,loaded:img.complete&&img.naturalWidth>0&&img.naturalHeight>0,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,fit:s.objectFit,transform:s.transform,frameRatio:b.width/b.height,widthRatio:r.width/b.width,heightRatio:r.height/b.height,error:card.classList.contains("taste-card--image-error")}})')
              robots=driver.execute_script('return document.querySelector("meta[name=robots]")?.content||""')
              grid.screenshot(str(out/(name+'-taste-grid.png')))
              results.append({'viewport':name,'cards':cards,'robots':robots})
              if 'noindex' not in robots:failures.append(name+': missing noindex')
              if len(cards)!=4:failures.append(name+': missing food cards')
              for c in cards:
                if not(c['loaded'] and c['naturalWidth']==1448 and c['naturalHeight']==1086 and c['fit']=='contain' and abs(c['frameRatio']-4/3)<.02 and c['widthRatio']>=1.07 and c['heightRatio']>=1.07 and c['transform'].startswith('matrix(1.08,') and not c['error']):failures.append(name+': invalid card '+c['name']+' '+repr(c))
              print('US_TASTE_QA',name,'PASS' if not any(x.startswith(name+':') for x in failures) else 'FAIL',flush=True)
            except Exception as exc:failures.append(name+': '+repr(exc))
          driver.quit()
          (out/'report.json').write_text(json.dumps({'results':results,'failures':failures},ensure_ascii=False,indent=2))
          print('US_TASTE_SUMMARY',json.dumps({'pass':not failures,'failures':failures},ensure_ascii=False),flush=True)
          if failures:raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-taste-4x3-final-live-qa
          path: us-taste-zoom-live-qa/
          retention-days: 3
