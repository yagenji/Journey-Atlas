name: Materialize Sweden v3 artwork

on:
  push:
    paths:
      - 'scripts/materialize_sweden_v3.py'
      - '.github/workflows/materialize-sweden-v3.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize Sweden v3 WebP assets
        run: python3 scripts/materialize_sweden_v3.py
      - name: Commit production artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/sweden/v3/hero.webp assets/images/sweden/v3/gamla-stan.webp assets/images/sweden/v3/lapporten.webp assets/images/sweden/v3/high-coast.webp data/countries/sweden.json
          if git diff --cached --quiet; then
            echo "No Sweden materialization changes"
            exit 0
          fi
          git commit -m "build: materialize Sweden v3 production artwork"
          git push origin HEAD:sweden-v3-build
