name: One-off St Kitts Nevis review merge staging
on:
  push:
    branches: [country/stkittsnevis]
    paths: ['.github/workflows/stkittsnevis-review-merge-stage-once.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage only an exact two-parent merge with latest main and retained target theme IDs
        shell: bash
        run: |
          set -euo pipefail
          original="$(git rev-parse HEAD)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          base="$(git rev-parse origin/main)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('ops/country-production/stkittsnevis.json').read_text())
          assert s['assetHandoff']['state']=='PASS' and s['assetHandoff']['verifiedRasterCount']==13
          assert s['tasteBatchReview']['approval']=='APPROVED'
          assert s['publication']['atlasPublished'] is False and s['finalApproval']['state']=='PENDING'
          data=json.loads(Path('data/theme-taxonomy.json').read_text())
          ids=[x['id'] for x in data['themes'] if 'stkittsnevis' in x['examples']]
          assert ids==['earth','history','sea'],ids
          Path('/tmp/stkittsnevis-themes.json').write_text(json.dumps(ids))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "MERGE_CONFLICTS=$conflicts"
            test "$conflicts" = 'data/theme-taxonomy.json' || { echo 'Unexpected merge conflict, refusing to alter Country material'; exit 1; }
          fi
          git show origin/main:data/theme-taxonomy.json > data/theme-taxonomy.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/theme-taxonomy.json');d=json.loads(p.read_text())
          wanted=json.loads(Path('/tmp/stkittsnevis-themes.json').read_text())
          for theme in d['themes']:
              examples=[x for x in theme['examples'] if x!='stkittsnevis']
              if theme['id'] in wanted: examples.append('stkittsnevis')
              theme['examples']=examples
          actual=[x['id'] for x in d['themes'] if 'stkittsnevis' in x['examples']]
          assert actual==wanted,(actual,wanted)
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          print('PRESERVED_MAIN_THEME_PLUS_STKITTSNEVIS',actual)
          PY
          git add data/theme-taxonomy.json
          git rm .github/workflows/stkittsnevis-review-merge-stage-once.yml
          git commit -m 'Merge latest main into unpublished St Kitts Nevis review, preserving current theme taxonomy'
          test "$(git rev-parse HEAD^1)" = "$original"
          test "$(git rev-parse HEAD^2)" = "$base"
          python3 scripts/country_production_state_v7.py validate
          python3 scripts/country_production_protocol_v2.py validate
          python3 scripts/publication_pipeline_v2.py assert-review-ready stkittsnevis
          python3 scripts/country_overlay_v2.py assert-scope stkittsnevis origin/main HEAD
          git push origin HEAD:refs/heads/ops/stkittsnevis-review-merge-stage-970
          echo "MERGE_TREE=$(git rev-parse HEAD^{tree})"
          echo "ORIGINAL_PARENT=$original"
          echo "MAIN_PARENT=$base"
          echo "STAGE_COMMIT=$(git rev-parse HEAD)"
