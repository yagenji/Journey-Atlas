name: Materialize Denmark approved assets

on:
  push:
    branches: ["denmark-v1-build"]
    paths:
      - 'transfer/denmark-approved/denmark-approved-assets.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: denmark-v1-build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Materialize approved Denmark assets
        run: python3 scripts/materialize_denmark_approved.py
      - name: Validate Denmark production state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root = Path('.')
          data = json.loads((root/'data/countries/denmark.json').read_text(encoding='utf-8'))
          paths = [data['hero']['image'], *[s['image'] for s in data['scenes']]]
          assert len(paths) == 9 and len(set(paths)) == 9
          for rel in paths:
              p = root/rel
              assert p.exists(), rel
              raw = p.read_bytes()
              assert raw[:4] == b'RIFF' and raw[8:12] == b'WEBP', rel
              assert int.from_bytes(raw[4:8], 'little') + 8 == len(raw), rel
              with Image.open(p) as im:
                  im.load()
                  assert im.format == 'WEBP'
                  assert im.size == (1200, 800)
          registry = json.loads((root/'data/atlas-destinations.json').read_text(encoding='utf-8'))
          denmark = next(x for x in registry['destinations'] if x['slug'] == 'denmark')
          assert denmark['atlasPublished'] is False
          assert denmark['href'] == ''
          assert not (root/'transfer/denmark-approved').exists()
          print('Denmark approved asset QA passed')
          PY
      - name: Commit approved production assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "review: connect approved Denmark Hero and 8 scenes"
          git push origin HEAD:denmark-v1-build
