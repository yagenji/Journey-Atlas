name: One-off St Kitts Nevis map correction and browser diagnosis
on:
  push:
    branches: [country/stkittsnevis]
    paths: [.github/workflows/stkittsnevis-once-fix-map-and-browser.yml]
permissions:
  contents: write
jobs:
  country-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply smallest validated Country-only map display and fact-format corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path('data/countries/stkittsnevis.json'); before=p.read_text(encoding='utf-8'); t=before
          changes=[
          ('"labelPosition":"left","labelOffset":{"x":-1.8,"y":-0.6}', '"labelPosition":"right","labelOffset":{"x":0.0,"y":0.0},"mapOffset":{"x":0.97,"y":0.0}'),
          ('"longitude":-62.83722},"image"','"longitude":-62.83722},"mapOffset":{"x":-1.84,"y":-1.19},"image"'),
          ('"longitude":-62.80322},"image"','"longitude":-62.80322},"mapOffset":{"x":0.03,"y":1.5},"image"'),
          ('"longitude":-62.78032},"image"','"longitude":-62.78032},"mapOffset":{"x":0.21,"y":-0.5},"image"'),
          ('"mapOffset":{"x":2.0,"y":2.0}','"mapOffset":{"x":-3.78,"y":0.04}'),
          ('"longitude":-62.80106},"image"','"longitude":-62.80106},"mapOffset":{"x":0.09,"y":2.43},"image"'),
          ('"longitude":-62.5832},"image"','"longitude":-62.5832},"mapOffset":{"x":0.3,"y":-0.1},"image"'),
          ('"longitude":-62.62162},"image"','"longitude":-62.62162},"mapOffset":{"x":-0.47,"y":2.11},"image"'),
          ('"longitude":-62.62422},"image"','"longitude":-62.62422},"mapOffset":{"x":0.17,"y":-2.02},"image"'),
          ('約4.7万人（2025年、国連推計）','約47,000人（2025年、国連推計）'),
          ('"area":"UNdata country profile, accessed 2026-09-18"','"area":"2026-09-18"'),
          ]
          for old,new in changes:
              assert t.count(old)==1,(old,t.count(old));t=t.replace(old,new,1)
          a,b=json.loads(before),json.loads(t)
          assert a['capital']['coordinates']==b['capital']['coordinates'] and a['hero']['coordinates']==b['hero']['coordinates']
          assert [s['coordinates'] for s in a['scenes']]==[s['coordinates'] for s in b['scenes']]
          assert all(math.hypot(s['mapOffset']['x'],s['mapOffset']['y'])<=5 for s in b['scenes'])
          assert b['facts'][3]['value']=='261 km²（日本の約0.069%）'
          p.write_text(t,encoding='utf-8')
          print('PASS: original WGS84 positions and Japan-relative surface area unchanged')
          PY
          python scripts/validate_country_editorial_v2.py data/countries/stkittsnevis.json
          python scripts/validate_country.py --strict data/countries/stkittsnevis.json
          python scripts/validate_country_quality_v5.py data/countries/stkittsnevis.json
          python scripts/validate_country_map_v6.py data/countries/stkittsnevis.json
          python scripts/country_production_state_v7.py validate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/countries/stkittsnevis.json
          git rm .github/workflows/stkittsnevis-once-fix-map-and-browser.yml
          git commit -m 'Correct St Kitts Nevis marker offsets and source-date display'
          git push
      - name: Diagnostic target Country rendering with user-uploaded visual content
        shell: bash
        env:
          TARGET_SLUGS: stkittsnevis
          JOURNEY_ATLAS_SITE_URL: http://127.0.0.1:4173/
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-stkittsnevis-map-diagnostic
          QA_SCOPE: unpublished-reviewable
          QA_SLUGS: stkittsnevis
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet selenium pillow
          python scripts/build_country_preview_targeted.py
          test -f dist/countries/stkittsnevis/index.html
          python -m http.server 4173 --directory dist >/tmp/stkittsnevis-browser-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 25); do
            curl -fsS http://127.0.0.1:4173/countries/stkittsnevis/ >/dev/null && break
            sleep 1
          done
          python scripts/qa_published_browser.py
      - name: Retain browser screenshots for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stkittsnevis-map-diagnostic-browser
          path: qa-stkittsnevis-map-diagnostic/
          if-no-files-found: warn
          retention-days: 7
      - name: Ensure temporary workflow removed after early validation failures
        if: failure()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore data/countries/stkittsnevis.json 2>/dev/null || true
          git rm -f --ignore-unmatch .github/workflows/stkittsnevis-once-fix-map-and-browser.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-off map QA workflow after failure'
            git push
          fi
