name: One-shot Panama review content correction
on:
  push:
    branches: [country/panama]
    paths: ['.github/workflows/panama-review-correction-once.yml']
permissions:
  contents: write
jobs:
  correct:
    if: github.repository == 'yagenji/Journey-Atlas' && github.ref == 'refs/heads/country/panama'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: country/panama
          fetch-depth: 0
      - name: Apply verified editorial and marker changes, remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/countries/panama.json')
          x=json.loads(path.read_text(encoding='utf-8'))
          assert x['slug']=='panama' and x['publicationPipelineVersion']==2
          for f in x['facts']:
              if f['label']=='面積':
                  assert f['value']=='75,517 km²'
                  f['value']='75,517 km²（日本の約0.20倍）'
                  break
          else: raise AssertionError('Missing area fact')
          sf=x['signatureFacts'][1]
          assert sf['topicKey']=='baru-summit-elevation-3474m'
          sf.update(topicKey='darien-national-park-area-5790km2',label='ダリエン国立公園の面積',value='約5,790 km²',note='太平洋沿岸から低地林・山地林まで連なる保護区。パナマ最大の国立公園の広さを示す。',icon='wildlife',interestReason='地峡の東端にまとまって残る森林の規模を、具体的な面積で伝えるため。')
          scene=x['scenes'][5]
          assert scene['id']=='san-lorenzo-chagres' and scene.get('mapOffset')=={'x':-2.4,'y':-4.3}
          scene['coordinates']={'latitude':9.3231722222,'longitude':-79.999775}
          scene.pop('mapOffset')
          x['hero']['mapOffset']={'x':0.7,'y':2.6}
          travel=x['travelScale']['items']; assert [v['duration'] for v in travel]==['3〜4日','5〜7日','8日以上']
          travel[0].update(title='首都と運河を無理なく歩く',text='パナマシティに連泊し、旧市街と運河の展望地点を日を分けて訪ねる。例：1日目は首都到着、2日目はカスコ・アンティグオ、3日目はアグア・クララ、4日目は余裕を持って出発。エル・バジェはこの日程に詰め込まない。')
          travel[1].update(title='高地かカリブ海を一地域追加',text='首都と運河に加え、西部高地またはボカス・デル・トロのどちらかに滞在する。例：パナマシティ → ボケテ → パナマシティ。移動日を確保し、ボケテとボカス両方を5〜7日で巡る前提にしない。')
          travel[2].update(title='高地と海を組み合わせる',text='8日以上なら、首都・運河に加えて高地とカリブ海の港町をつなげられる。例：パナマシティ → ボケテ → ボカス・デル・トロ → パナマシティ。コイバまで含める場合は、さらに数日追加して天候と船の予備日を取る。')
          for route in x['nextRoutes']:
              if route['countryEn']=='COLOMBIA':
                  route['path']='Panama City ✈ Cartagena'
                  route['description']='パナマとコロンビアの間には道路がつながっていない。ダリエン・ギャップの陸路通過を旅程に入れず、パナマシティからカルタヘナへ空路でつなぐ。植民都市とカリブ海の暮らしを比較できる。'
                  route['statusNote']='ダリエン・ギャップに道路接続なし。空路の運航日・入国条件は別途確認。'
                  break
          else: raise AssertionError('Missing Colombia route')
          x['transport']['text']+=' コロンビアとの国境はダリエン・ギャップで道路が途切れるため、同国への周遊は航空便を利用する。'
          x['tips'][1]['text']='ダリエン国立公園は広く遠隔地を含み、アクセスには事前計画が必要。パナマとコロンビアを結ぶ道路は存在せず、一般旅行者の陸路国境越えとして扱わない。訪問時は現地の安全情報とガイド体制を確認する。'
          x['sources']['japanArea']='国土地理院、2026年4月1日時点 377,974.87 km²。https://web2.gsi.go.jp/KOKUJYOHO/MENCHO-title.htm'
          x['sources']['darienArea']='UNESCO World Heritage Centre, Darién National Park, Property 579,000 ha. https://whc.unesco.org/en/list/159/'
          x['sources']['darienRoadGap']='UK FCDO: no road crossing between Panama and Colombia. https://www.gov.uk/foreign-travel-advice/colombia/regional-risks'
          x['sources']['sanLorenzoCoordinates']='UNESCO 2022 nomination, San Lorenzo central point: 9°19′23.42″N, 79°59′59.19″W.'
          x['sourceDates']['japanArea']='2026-04-01'
          assert x['publicationPipelineVersion']==2 and x['slug']=='panama'
          assert all(v['image'].startswith('assets/images/panama/') for v in [x['hero'],*x['scenes'],*x['taste']['items']])
          path.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Panama editorial and Map-offset corrections applied.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/panama-review-correction-once.yml
          git add data/countries/panama.json
          git commit -m 'Correct Panama area, signature fact, route, schedule and map marker'
          git push origin HEAD:refs/heads/country/panama
