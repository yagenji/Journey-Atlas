name: Panama travel scale fix temp
on:
  push:
    branches: [country/panama]
    paths: [.github/workflows/panama-travel-scale-fix-temp.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: country/panama
      - name: Patch travel scale
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/countries/panama.json')
          d=json.loads(p.read_text())
          t=d['travelScale']['items'][2]['text']
          d['travelScale']['items'][2]['text']=t.replace('さらにコイバまで加えるなら10日以上を目安にする。','コイバまで加える場合は、さらに移動日を確保する。')
          p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n')
          PY
          rm .github/workflows/panama-travel-scale-fix-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/countries/panama.json .github/workflows/panama-travel-scale-fix-temp.yml
          git commit -m 'Align Panama travel scale with QA contract'
          git push origin HEAD:country/panama
