name: Finalize Syria publication once

on:
  push:
    branches:
      - country/syria
    paths:
      - .github/workflows/syria-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Syria branch
        uses: actions/checkout@v4
        with:
          ref: country/syria
          fetch-depth: 0

      - name: Finalize Syria publication metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          slug = "syria"
          now = datetime.now(timezone(timedelta(hours=9))).replace(microsecond=0).isoformat()
          approved_at = now
          source_sha = "6c46cbc91c9123d450f043d67a5ce15e809e2312"
          review_url = "https://yagenji.github.io/Journey-Atlas/reviews/syria/countries/syria/"
          published_url = "https://atlas.yagenji.com/countries/syria/"

          state_path = Path("ops/country-production/syria.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          if (state.get("qa") or {}).get("state") != "PASS":
              raise SystemExit("Syria QA must be PASS before final publication")
          if int((state.get("assetHandoff") or {}).get("verifiedRasterCount", 0)) != 13:
              raise SystemExit("Syria 13-raster handoff verification is required")

          state["contentRef"] = "main"
          state["stateRef"] = "main"
          state["phase"] = "COMPLETE"
          state["stateRevision"] = int(state.get("stateRevision", 0)) + 1
          state["updatedAt"] = now
          state.setdefault("qa", {})["state"] = "PASS"
          state["qa"]["productionState"] = "CI_GATED"
          state["qa"]["sourceCommit"] = source_sha
          state["qa"]["browserQaRunId"] = 34828996268
          state["qa"]["note"] = (
              "Final Syria review package passed Country validation, Image Policy 7.2 validation, "
              "Production State routing, targeted review deployment, and Desktop / Tablet / Mobile Browser QA "
              "on source commit 6c46cbc91c9123d450f043d67a5ce15e809e2312. The approved 13 raster assets remain unchanged."
          )
          state["reviewPreview"] = {
              "mode": "TARGETED_COUNTRY_BRANCH_PREVIEW",
              "state": "DONE",
              "url": review_url,
              "browserQa": "PASS",
              "deployedAt": "2026-09-14T18:38:50+09:00",
              "runId": 34828996268,
              "sourceCommit": source_sha,
          }
          state["reviewDeployment"] = {"state": "DONE", "url": published_url}
          state["finalApproval"] = {
              "state": "APPROVED",
              "approvedAt": approved_at,
              "basis": (
                  "User instruction: シリアの公開を進めて完成させて。 "
                  "Final Syria review package passed validation and Browser QA after the requested Theme spacing, "
                  "Transport wording, Signature Facts, and onward-route revisions."
              ),
          }
          state["publication"] = {
              "state": "PUBLISHED",
              "atlasPublished": True,
              "productionVerification": "CI_GATED",
              "requestedAt": approved_at,
              "publishedUrl": published_url,
              "robots": "index,follow",
              "sitemapListed": True,
              "linkedFromRegistry": True,
              "note": (
                  "Registry publication and terminal Production State are committed on the reusable publication PR. "
                  "Publication CI must synchronize latest main, validate the published build, discovery link, "
                  "indexability, sitemap inclusion and production route; post-merge production verification is authoritative."
              ),
          }
          metrics = state.setdefault("productionMetrics", {})
          metrics["reviewPreviewDeployments"] = max(int(metrics.get("reviewPreviewDeployments", 0)), 4)
          metrics["browserQaCycles"] = max(int(metrics.get("browserQaCycles", 0)), 4)
          metrics["canonicalReviewReadyAt"] = "2026-09-14T18:59:48+09:00"
          state["next"] = {"action": "NONE", "asset": None}
          state_path.write_text(json.dumps(state, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")

          hero = (state.get("hero") or {}).get("asset")
          if not hero:
              raise SystemExit("Syria Hero asset missing from State")

          for filename in ("atlas-destinations.json", "atlas-destinations-editorial.json"):
              path = Path("data") / filename
              payload = json.loads(path.read_text(encoding="utf-8"))
              rows = payload.get("destinations", [])
              row = next((r for r in rows if r.get("slug") == slug), None)
              if row is None:
                  raise SystemExit(f"Syria registry row missing in {filename}")
              row["atlasPublished"] = True
              row["href"] = "countries/syria/"
              row["image"] = hero
              if "updatedAt" in payload:
                  payload["updatedAt"] = now[:10]
              path.write_text(json.dumps(payload, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

          rm -f .github/workflows/syria-finalize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Syria publication metadata"
          git push origin HEAD:country/syria
