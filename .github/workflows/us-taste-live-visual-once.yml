name: One-time United States Taste live visual QA
on:
  push:
    branches: [fix/unitedstates-taste-background-20260917]
    paths: ['.github/workflows/us-taste-live-visual-once.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unitedstates-taste-background-20260917
          persist-credentials: true
      - name: Install browser QA dependency
        run: python3 -m pip install --disable-pip-version-check --quiet selenium
      - name: Verify live CSS and four food cards at desktop tablet mobile
        env:
          QA_BASE_URL: https://atlas.yagenji.com
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          import shutil
          out=Path('us-taste-live-qa');out.mkdir(exist_ok=True)
          root=os.environ['QA_BASE_URL']
          path='/assets/css/taste-image-framing.css?qa=us-taste-final-20260917'
          for attempt in range(18):
            try:
              req=urllib.request.Request(root+path,headers={'User-Agent':'JourneyAtlas-TasteFinalQA/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as res:css=res.read().decode('utf-8');status=res.status
              if status==200 and '"/unitedstates/approved/food-"' in css and 'object-fit: cover' in css.split('"/unitedstates/approved/food-"')[-1]:break
              print('Waiting for corrected CSS deployment',attempt+1,flush=True)
            except Exception as e:print('CSS not available yet',repr(e),flush=True)
            if attempt==17:raise RuntimeError('Corrected CSS not deployed at live URL')
            time.sleep(15)
          options=Options()
          for flag in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--hide-scrollbars'):options.add_argument(flag)
          options.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          chromedriver=shutil.which('chromedriver')
          driver=webdriver.Chrome(service=Service(chromedriver) if chromedriver else Service(),options=options)
          failures=[];results=[]
          for name,w,h,mobile in [('desktop',1440,1000,False),('tablet',834,1112,False),('mobile',390,844,True)]:
            try:
              driver.set_window_size(w,h)
              driver.execute_cdp_cmd('Emulation.setDeviceMetricsOverride',{'width':w,'height':h,'deviceScaleFactor':1,'mobile':mobile,'screenWidth':w,'screenHeight':h})
              driver.get(root+'/countries/unitedstates/?qa=us-taste-final-'+name)
              WebDriverWait(driver,35).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.taste-card'))==4)
              cards=driver.find_elements(By.CSS_SELECTOR,'.taste-card')
              for card in cards:
                driver.execute_script('arguments[0].scrollIntoView({block:"center"})',card)
                time.sleep(.35)
              driver.execute_script('arguments[0].scrollIntoView({block:"center"})',driver.find_element(By.CSS_SELECTOR,'#taste-grid'))
              time.sleep(.65)
              audit=driver.execute_script('return [...document.querySelectorAll(".taste-card")].map(card=>{const img=card.querySelector("img");const frame=card.querySelector(".taste-card__image").getBoundingClientRect();const rect=img.getBoundingClientRect();const style=getComputedStyle(img);return {src:img.currentSrc,complete:img.complete,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,fit:style.objectFit,opacity:style.opacity,widthRatio:rect.width/frame.width,heightRatio:rect.height/frame.height,cardError:card.classList.contains("taste-card--image-error")}})')
              grid=driver.find_element(By.CSS_SELECTOR,'#taste-grid');grid.screenshot(str(out/(name+'-taste-grid.png')))
              robots=driver.execute_script('return document.querySelector("meta[name=robots]")?.content || ""')
              result={'viewport':name,'cards':audit,'robots':robots}
              results.append(result)
              if 'noindex' not in robots:failures.append(name+': missing noindex')
              if any(not v['complete'] or v['naturalWidth']<1 or v['naturalHeight']<1 or v['fit']!='cover' or v['opacity']!='1' or v['widthRatio']<.99 or v['heightRatio']<.99 or v['cardError'] for v in audit):failures.append(name+': card image not fully displayed')
              print('US_TASTE_LIVE_QA',name,'PASS' if not failures else 'FAIL',flush=True)
            except Exception as e:failures.append(name+': '+repr(e))
          driver.quit()
          (out/'report.json').write_text(json.dumps({'results':results,'failures':failures},ensure_ascii=False,indent=2))
          print('US_TASTE_LIVE_SUMMARY',json.dumps({'pass':not failures,'failures':failures},ensure_ascii=False),flush=True)
          if failures:raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-taste-final-live-qa
          path: us-taste-live-qa/
          retention-days: 3
      - name: Remove this one-time workflow from the working branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/us-taste-live-visual-once.yml
          git commit -m 'Remove completed temporary US Taste live QA workflow'
          git push origin HEAD:fix/unitedstates-taste-background-20260917
