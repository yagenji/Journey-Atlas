name: Final sync and verify map rollout

on:
  push:
    branches:
      - system/map-context-shared-preparation
    paths:
      - '.github/workflows/final-sync-map-rollout.yml'

permissions:
  contents: write
  actions: write

jobs:
  sync-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: system/map-context-shared-preparation
          fetch-depth: 0
      - name: Merge latest main and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/final-sync-map-rollout.yml
          git add -A
          git commit -m "Finalize map rollout sync with main"
          git push origin HEAD:system/map-context-shared-preparation
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Dispatch final official checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='system/map-context-shared-preparation'
          gh workflow run validate-country-data.yml --ref "$branch"
          gh workflow run browser-country-qa.yml --ref "$branch"
          gh workflow run map-context-preflight.yml --ref "$branch"
          echo "Dispatched final checks for $FINAL_SHA"
