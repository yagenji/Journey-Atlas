<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">
  <meta name="robots" content="noindex,follow">
  <title>ページが見つかりません — JOURNEY ATLAS</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:light;--paper:#f7f3e9;--ink:#173b5d;--muted:#667787;--line:#d8d0c0}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:"Hanken Grotesk","Zen Kaku Gothic New",sans-serif}
    main{width:min(92vw,680px);padding:48px 28px;text-align:center}
    .brand{font-size:13px;font-weight:700;letter-spacing:.24em}
    h1{margin:32px 0 14px;font-size:clamp(28px,5vw,46px);line-height:1.2}
    p{margin:0 auto;max-width:34em;color:var(--muted);font-size:14px;line-height:1.8}
    a{display:inline-block;margin-top:28px;padding:10px 16px;border:1px solid var(--ink);border-radius:5px;color:var(--ink);text-decoration:none;font-size:12px;font-weight:700}
    a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="brand">JOURNEY ATLAS</div>
    <h1>ページが見つかりません。</h1>
    <p>URLが変更されたか、まだ公開されていないページです。JOURNEY ATLASのトップから、次の旅先を探してみてください。</p>
    <a href="/">JOURNEY ATLASへ戻る</a>
  </main>
</body>
</html>
